<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interview prep, fall 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky top bar with four views; the assignment view splits problem | editor on wide screens. */
:root{
  --paper:#F2F5F1; --raise:#E7ECE6; --ink:#17202E; --muted:#56616F; --rule:#D2D9D1; --sel:#CFE0FF;
  --t-leetcode:#2a78d6; --t-ml:#eb6834; --t-transformer:#1baf7a; --t-design:#6250d6;
  --ok:#1A7F37; --danger:#B42318; --warn:#9A5B00; --focus:#2446C6; --accent:#2446C6;
  --c-kw:#7C2D8E; --c-str:#0B6B3A; --c-com:#6B7280; --c-num:#B45309; --c-def:#1D4ED8; --c-bi:#0E7490;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E141D; --raise:#162030; --ink:#E4E9F0; --muted:#9AA5B4; --rule:#27323F; --sel:#2B3F66;
    --t-leetcode:#3987e5; --t-ml:#d95926; --t-transformer:#199e70; --t-design:#9085e9;
    --ok:#3FB950; --danger:#FF8A80; --warn:#E3B341; --focus:#8EA7FF; --accent:#8EA7FF;
    --c-kw:#D8A7F0; --c-str:#8CE0B0; --c-com:#8B95A5; --c-num:#F5B86B; --c-def:#93B4FF; --c-bi:#7FD3E6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E141D; --raise:#162030; --ink:#E4E9F0; --muted:#9AA5B4; --rule:#27323F; --sel:#2B3F66;
  --t-leetcode:#3987e5; --t-ml:#d95926; --t-transformer:#199e70; --t-design:#9085e9;
  --ok:#3FB950; --danger:#FF8A80; --warn:#E3B341; --focus:#8EA7FF; --accent:#8EA7FF;
  --c-kw:#D8A7F0; --c-str:#8CE0B0; --c-com:#8B95A5; --c-num:#F5B86B; --c-def:#93B4FF; --c-bi:#7FD3E6;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:4.5rem}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 var(--sans);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.18em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
button{font:inherit;color:inherit}
code,pre,kbd,textarea.code{font-family:var(--mono)}
.wrap{max-width:76rem;margin:0 auto;padding-left:max(clamp(1rem,3vw,2rem),env(safe-area-inset-left,0px));padding-right:max(clamp(1rem,3vw,2rem),env(safe-area-inset-right,0px))}
h1{font:600 clamp(1.8rem,4vw,2.5rem)/1.08 var(--cond);letter-spacing:-.01em;margin:0 0 .5rem;text-wrap:balance}
h2{font:600 1.4rem/1.15 var(--cond);margin:0 0 .5rem}
h3{font:600 1.05rem/1.25 var(--cond);margin:0 0 .35rem}
p{margin:0 0 .75rem}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font:500 .75rem/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 .4rem}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:.6rem 1.25rem;flex-wrap:wrap;padding-block:.55rem}
.brand{font:600 1.05rem/1 var(--cond);text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:2px;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--raise);overflow-x:auto;scrollbar-width:none}
.nav a{font-size:.875rem;text-decoration:none;color:var(--muted);padding:.3rem .8rem;border-radius:999px;white-space:nowrap}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.top .spacer{flex:1}
.top .ext{font-size:.875rem;color:var(--muted)}
.modeline{font-size:.75rem;color:var(--muted);white-space:nowrap}

/* Views */
main{padding-block:1.6rem 4rem}
.view{display:block}
.hero{padding:.4rem 0 1.2rem;border-bottom:1px solid var(--rule);margin-bottom:1.4rem}
.hero .lede{font-size:1.1rem;max-width:40em;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:.3rem 1.6rem;margin:.6rem 0 0;padding:0;list-style:none;color:var(--muted);font-size:.9375rem}
.stats b{font:600 1.35rem/1 var(--cond);color:var(--ink);margin-right:.3rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem}
.card{border:1px solid var(--rule);border-radius:10px;padding:1.1rem 1.2rem;background:var(--paper);min-width:0}
.card.raise{background:var(--raise)}
.card h2{margin-bottom:.25rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.1rem 0 .6rem}
.chip{font:500 .72rem/1 var(--sans);padding:.25rem .5rem;border-radius:999px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.chip.track{border-color:var(--tc);color:var(--tc)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.bad{border-color:var(--danger);color:var(--danger)}
.t-leetcode{--tc:var(--t-leetcode)} .t-ml{--tc:var(--t-ml)} .t-transformer{--tc:var(--t-transformer)} .t-design{--tc:var(--t-design)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .75rem;margin-top:.6rem}
.btn{background:none;border:1px solid var(--rule);border-radius:7px;padding:.42rem .85rem;cursor:pointer;text-decoration:none;font-size:.9375rem;display:inline-flex;align-items:center;gap:.4rem;color:var(--ink);background:var(--paper)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn[disabled]{opacity:.5;cursor:default}
.btn.small{font-size:.8125rem;padding:.3rem .6rem}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:.18em;cursor:pointer;font-size:.875rem}
.msg{font-size:.875rem;color:var(--muted)}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--danger)}

/* Week strip and lists */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.4rem;margin:1.2rem 0 0}
.week .d{border:1px solid var(--rule);border-radius:8px;padding:.5rem .55rem;font-size:.8125rem;min-width:0}
.week .d.today{border-color:var(--ink)}
.week .d .wd{font:600 .75rem/1 var(--cond);color:var(--muted);margin-bottom:.3rem}
.week .d .tr{font-weight:500;color:var(--tc,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week .d .st{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week .d.done .st{color:var(--ok)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;border-top:1px solid var(--rule);min-width:0}
.rows li:first-child{border-top:0}
.rows .glyph{width:1.15rem;height:1.15rem;flex:none;border-radius:50%;border:1.5px solid var(--rule);display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--paper)}
.rows .glyph.done{background:var(--ok);border-color:var(--ok)}
.rows .glyph.in_progress{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.rows .glyph.skipped{border-color:var(--muted);background:var(--muted)}
.rows .title{flex:1;min-width:0;text-decoration:none}
.rows .title:hover{text-decoration:underline}
.rows .meta{font-size:.8125rem;color:var(--muted);white-space:nowrap}
.bar{height:.5rem;border-radius:3px;background:var(--rule);overflow:hidden;margin:.35rem 0 .5rem}
.bar i{display:block;height:100%;background:var(--tc,var(--accent));border-radius:3px}
.track-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.track-head .n{font:600 1rem/1 var(--cond);color:var(--muted)}
.module{margin:.9rem 0 0}
.module h3{color:var(--muted);font-weight:500;font-size:.9375rem}
.tracks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem}

/* Assignment view */
.back{display:inline-block;font-size:.875rem;color:var(--muted);margin-bottom:.6rem}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.5rem;align-items:start}
.problem{min-width:0}
.problem h2{font-size:1.2rem;margin-top:1.1rem}
.problem h3{margin-top:.9rem}
.problem pre{background:var(--raise);border:1px solid var(--rule);border-radius:8px;padding:.7rem .85rem;overflow-x:auto;font-size:.85rem;line-height:1.5}
.problem code{font-size:.9em;background:var(--raise);padding:.05em .3em;border-radius:4px}
.problem pre code{background:none;padding:0}
.problem table{border-collapse:collapse;font-size:.9rem;margin:.5rem 0 1rem;display:block;overflow-x:auto}
.problem th,.problem td{border:1px solid var(--rule);padding:.3rem .6rem;text-align:left}
.problem ul,.problem ol{padding-left:1.3rem}
.problem li{margin:.2rem 0}
.problem blockquote{margin:.6rem 0;padding:.2rem .9rem;border-left:3px solid var(--rule);color:var(--muted)}
.hints{margin:1rem 0}
.hint{border-left:3px solid var(--warn);padding:.3rem .8rem;margin:.4rem 0;background:var(--raise);border-radius:0 6px 6px 0;font-size:.9375rem}
details.sol{margin:1rem 0}
details.sol summary{cursor:pointer;font-weight:500}
.work{min-width:0;position:sticky;top:4.2rem}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:.5rem}
.toolbar .grow{flex:1}
.timer{font:600 1.05rem/1 var(--cond);font-variant-numeric:tabular-nums;color:var(--muted);min-width:4.2rem}
.timer.live{color:var(--ink)} .timer.over{color:var(--danger)}
.editor{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--raise)}
.editor .CodeMirror{height:auto;min-height:22rem;max-height:70vh;font-size:.85rem;line-height:1.5;background:var(--raise);color:var(--ink)}
.editor textarea.code{width:100%;min-height:22rem;border:0;background:var(--raise);color:var(--ink);padding:.7rem .85rem;font-size:.85rem;line-height:1.5;resize:vertical;tab-size:4;display:block}
.CodeMirror-gutters{background:var(--raise);border-right:1px solid var(--rule)}
.CodeMirror-linenumber{color:var(--muted)}
.CodeMirror-cursor{border-left:1.5px solid var(--ink)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected,.CodeMirror-line::selection,.CodeMirror-line>span::selection{background:var(--sel)}
.cm-s-default .cm-keyword{color:var(--c-kw)} .cm-s-default .cm-string,.cm-s-default .cm-string-2{color:var(--c-str)} .cm-s-default .cm-comment{color:var(--c-com)}
.cm-s-default .cm-number{color:var(--c-num)} .cm-s-default .cm-def{color:var(--c-def)} .cm-s-default .cm-builtin{color:var(--c-bi)} .cm-s-default .cm-variable,.cm-s-default .cm-operator,.cm-s-default .cm-property{color:var(--ink)}
.cm-s-default .cm-meta{color:var(--c-bi)} .cm-s-default .cm-atom{color:var(--c-num)}
.out{margin-top:.6rem;border:1px solid var(--rule);border-radius:8px;background:var(--raise);padding:.6rem .85rem;font-family:var(--mono);font-size:.8rem;line-height:1.5;max-height:22rem;overflow:auto;white-space:pre-wrap;word-break:break-word}
.out .pass{color:var(--ok)} .out .fail{color:var(--danger)} .out .dim{color:var(--muted)}
.out .sum{font-family:var(--sans);font-weight:500;margin-top:.4rem}
.note{font-size:.875rem;color:var(--muted);margin:.5rem 0 0}
.record{margin-top:.8rem;border-top:1px solid var(--rule);padding-top:.7rem}
.record code{font-size:.8rem;background:var(--raise);padding:.15em .4em;border-radius:4px;word-break:break-all}
.claude{margin-top:.8rem;border-top:1px solid var(--rule);padding-top:.7rem}
.claude .reply{margin-top:.5rem;font-size:.9375rem}
.claude .reply pre{background:var(--raise);border-radius:6px;padding:.5rem .7rem;overflow-x:auto;font-size:.8rem}
.claude .reply code{font-size:.9em}
.rubric{list-style:none;padding:0;margin:.4rem 0}
.rubric li{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem 0;font-size:.9375rem}
.rubric input{margin-top:.3rem}
textarea.answer{width:100%;min-height:16rem;font:inherit;font-size:.9375rem;color:var(--ink);background:var(--raise);border:1px solid var(--rule);border-radius:8px;padding:.7rem .85rem;resize:vertical}

/* Quiz */
.qcard{border:1px solid var(--rule);border-radius:12px;padding:1.4rem 1.5rem;background:var(--raise);max-width:46rem}
.qcard .q{font-size:1.15rem;line-height:1.45;margin:.2rem 0 1rem}
.qcard .a{border-top:1px solid var(--rule);padding-top:.9rem;margin-top:.3rem;font-size:.9875rem;line-height:1.6}
.grades{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.grades .btn{min-width:5.2rem;justify-content:center}
.grades .btn b{font-size:.7rem;color:var(--muted);font-weight:500}
.dots{display:flex;gap:.3rem;margin:.6rem 0}
.dots i{width:.6rem;height:.6rem;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--ink)} .dots i.good{background:var(--ok)} .dots i.again{background:var(--danger)}
.qlist{list-style:none;padding:0;margin:0}
.qlist li{padding:.45rem 0;border-top:1px solid var(--rule);display:flex;gap:.6rem;align-items:baseline;font-size:.9375rem}
.qlist .box{font:600 .72rem/1 var(--cond);color:var(--muted);min-width:3.4rem}
.qlist .box.b3{color:var(--ok)}

/* Progress */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem;margin:0 0 1.4rem}
.tile{border:1px solid var(--rule);border-radius:10px;padding:.9rem 1rem}
.tile b{display:block;font:600 1.9rem/1.05 var(--cond)}
.tile span{font-size:.8125rem;color:var(--muted)}
.heat{overflow-x:auto}
.heat svg{display:block;max-width:100%;height:auto}
.heat .lbl{font:500 .7rem var(--sans);fill:var(--muted)}
.heat .c0{fill:var(--rule)} .heat .c1{fill:color-mix(in srgb,var(--accent) 35%,var(--paper))} .heat .c2{fill:color-mix(in srgb,var(--accent) 65%,var(--paper))} .heat .c3{fill:var(--accent)}
table.log{width:100%;border-collapse:collapse;font-size:.9rem}
table.log th,table.log td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--rule);vertical-align:top}
table.log th{font-weight:500;color:var(--muted);font-size:.8125rem}
.logwrap{overflow-x:auto}
.form{display:grid;gap:.6rem;max-width:34rem}
.form label{display:grid;gap:.25rem;font-size:.875rem;font-weight:500}
.form input,.form select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:.4rem .5rem}
.rot{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3rem}
.rot label{font-size:.75rem}
.panel{margin-top:2rem;padding-top:1.4rem;border-top:1px solid var(--rule)}
.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 1rem calc(env(safe-area-inset-bottom,0px) + .9rem);pointer-events:none;z-index:40}
.toast span{background:var(--ink);color:var(--paper);font-size:.875rem;padding:.55rem .9rem;border-radius:6px}
.empty{color:var(--muted);padding:1rem 0}

@media (max-width:960px){
  .split{grid-template-columns:minmax(0,1fr)}
  .work{position:static}
  .tracks,.grid2{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .week{grid-template-columns:repeat(4,minmax(0,1fr))}
  .rot{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
