name: Update offer board

on:
  schedule:
    # Twice a day: 12:17 and 00:17 UTC (about 8 AM and 8 PM Eastern).
    - cron: "17 12 * * *"
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      no_ai:
        description: "Skip Claude discovery and screening"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: offer-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.no_ai }}" = "true" ]; then
            python -m scripts.update --no-ai
          else
            python -m scripts.update
          fi

      - name: Commit board
        run: |
          git config user.name "offer-board-bot"
          git config user.email "offer-board-bot@users.noreply.github.com"
          git add data docs README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Board update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
