PU, what model size and batch does that allow, and what has to be precomputed?", "The training data is produced by the current system. Where does that bias the labels (position, exposure, popularity), and what does each of your two stages need as negatives?"], "rubric": ["Defines the objective and constraints in numbers: the engagement target, freshness and diversity requirements, QPS, and the p99 latency budget split across retrieval, ranking and re-ranking.", "Designs candidate generation with a two-tower model: in-batch negatives with a sampling-bias correction, an approximate nearest-neighbour index over precomputed item embeddings, and extra candidate sources for fresh and cold-start items.", "Designs the ranker as a multi-task model over explicit labels (click, completion, watch time, skip, share), names the features including the user history sequence, and explains how the heads are combined, calibrated and re-ranked for diversity.", "Specifies the training data pipeline: impression logs with delayed labels, negative sampling per stage, position-bias handling, deduplication, continuous or daily retraining, and the scale of the embedding tables.", "Covers serving and evaluation: feature store and precomputation, caching, offline metrics per stage (recall@k, AUC or NDCG), online A/B tests with retention and policy guardrails, and the cold-start plan for new users and new uploads."], "timeout": 60, "readme": "<h2>Design retrieval and ranking for a short-video feed<\/h2>\n<p>A short-video app has 50 million daily active users and a catalog of 500 million videos with 5 million new uploads a day. Each feed request returns 8 videos; users make about 40 requests a day, so the service handles about 2 billion requests a day, roughly 25,000 requests per second on average and 3 times that at peak. The recommendation service has a 150 ms p99 latency budget end to end. The product goal is long-term engagement, measured by 30-day retention and daily watch time, with new uploads needing exposure within an hour and policy-violating content never shown. Design the two-stage system: candidate generation, ranking, features, training data, serving, and metrics.<\/p>\n<p>Spend 30 minutes. Write your answer as if you were talking through it with an interviewer, in this order:<\/p>\n<ol><li><strong>Requirements and objective.<\/strong> What the feed optimizes and what proxies you can train on, the constraints (freshness, diversity, policy filters), the scale numbers, and the latency budget per stage. Ask what you'd want to clarify.<\/li><li><strong>Candidate generation.<\/strong> The two-tower model (user tower, item tower, similarity), how it is trained with in-batch negatives and why that needs a correction, the approximate nearest-neighbour index, and the other candidate sources (co-visitation, followed creators, a fresh-upload pool). How many candidates leave this stage.<\/li><li><strong>Ranking.<\/strong> A multi-task ranker: the labels it predicts, the features (user history sequence, item, context, crosses), the architecture, how heads are combined into one score, calibration, and re-ranking for diversity and business rules.<\/li><li><strong>Training data and pipeline.<\/strong> Impression logs and delayed labels, negatives for each stage, position bias, feedback loops, how often each model retrains, and the size of the embedding tables.<\/li><li><strong>Serving and metrics.<\/strong> Feature store, precomputed item embeddings, request-time user embedding, caching, offline metrics per stage, the online A/B design with guardrails, and cold start for new users and new videos.<\/li><\/ol>\n<p>Then score yourself with the rubric, one point per item, or paste your answer into a Claude session and ask for a rubric-based score with specific feedback.<\/p>\n<h3>What the interviewer listens for<\/h3>\n<p>Whether you split the latency budget and size the models to it. Whether you know how a two-tower model is trained and why in-batch negatives need a correction. Whether you can name where the logged training data is biased by the system that produced it and what you do about it, and whether your offline metrics would predict the online ones.<\/p>", "starter": "", "tests": "", "solution": ""}, {"id": "ds-research-talk", "title": "Plan a 30-minute research talk on an ML-accelerated crystal structure prediction engine", "track": "design", "module": "ds-core", "difficulty": "medium", "minutes": 30, "runtime": "python", "kind": "written", "tags": ["research talk", "communication", "materials"], "hints": ["Write the one-sentence claim first, then cut every slide that does not support it. The 2-minute motivation is the claim plus why each half of the room should care, not the history of the field.", "List the five questions you least want to be asked. For each, write the honest answer in two sentences and decide which one belongs on a limitations slide before anyone asks it."], "rubric": ["The motivation takes at most 2 minutes and states the one question the talk answers in words both audiences can repeat, with the headline result given up front rather than saved for the end.", "The talk is built around one key figure that shows the main claim against a baseline at equal compute with uncertainty, and the plan says what is said while it is on screen and how it is made legible for both audiences.", "Every number in the plan is sourced (benchmark, baseline, DFT verification status) and a limitations slide names where the engine fails before the questions do.", "The plan names one concrete thing each half of the audience can reuse (a method, a benchmark, a tool, a validation protocol) and what was deliberately cut to fit 30 minutes.", "The plan prepares at least five hostile questions with two-sentence answers that concede what is true and point to data, and states a rule for handling a question the speaker cannot answer."], "timeout": 60, "readme": "<h2>Plan a 30-minute research talk on an ML-accelerated crystal structure prediction engine<\/h2>\n<p>You have a 30-minute slot plus 15 minutes of questions at a research seminar with about 40 people: half ML researchers who have never relaxed a crystal structure, half chemists and materials scientists who are skeptical of ML. The work is an evolutionary crystal structure prediction engine that relaxes and ranks candidates with a fine-tuned ML interatomic potential and verifies the shortlist with DFT. Your numbers: relaxations are 20,000 times cheaper than DFT; the engine recovers the known ground state in 46 of 50 benchmark systems versus 36 of 50 for a DFT-only search at the same compute; and it found 14 new structures within 25 meV/atom of the hull across 6 chemical systems, 9 of them confirmed by DFT so far. Plan the talk.<\/p>\n<p>Spend 30 minutes. Write the plan as if you were walking a mentor through it the day before the talk, in this order:<\/p>\n<ol><li><strong>The claim and the first 2 minutes.<\/strong> The one sentence the talk defends, the headline number, and why each half of the room should care. No history of the field.<\/li><li><strong>Structure and time budget.<\/strong> A slide-by-slide outline with minutes per section: problem, method, key result, ablations and limitations, what to reuse. Say what you cut to fit.<\/li><li><strong>The one key figure.<\/strong> What it plots, the baseline and error bars on it, how both audiences read it without help, and what you say in the 90 seconds it is on screen.<\/li><li><strong>What the audience can reuse.<\/strong> One concrete thing for ML researchers (a search or evaluation idea) and one for chemists (how to run or validate it), plus the limitations slide that names where the engine fails.<\/li><li><strong>Hostile questions.<\/strong> The five questions you least want (for example MLIP errors near the hull, benchmark leakage from the potential's training data, the choice of functional, cherry-picked systems, how this differs from existing CSP tools), a two-sentence honest answer for each, and your rule for a question you cannot answer.<\/li><\/ol>\n<p>Then score yourself with the rubric, one point per item, or paste your answer into a Claude session and ask for a rubric-based score with specific feedback.<\/p>\n<h3>What the interviewer listens for<\/h3>\n<p>Whether the talk has one claim and every slide serves it. Whether the key figure carries a baseline and uncertainty, and whether you would state the limitations before the audience does. Whether your answers to attacks concede what is true and point to data instead of defending.<\/p>", "starter": "", "tests": "", "solution": ""}], "quiz": [{"id": "q-bias-variance", "topic": "Generalization", "q": "Explain the bias-variance decomposition of expected squared error, and give one concrete lever that trades one for the other.", "a": "For a target y = f(x) + noise, the expected squared error of a learner at x decomposes into bias^2 (how far the average prediction over training sets is from f(x)), variance (how much the prediction moves across training sets), and irreducible noise. Model capacity is the classic lever: a deeper tree or higher-degree polynomial lowers bias and raises variance; regularization, bagging and more data lower variance. Modern deep nets complicate the picture (double descent), but the decomposition still frames the diagnosis: high train error means bias, a large train-test gap means variance."}, {"id": "q-l1-vs-l2", "topic": "Generalization", "q": "Why does L1 regularization produce sparse weights while L2 does not?", "a": "The L1 penalty |w| has a constant gradient magnitude lambda that does not shrink as w approaches zero, so the optimizer can drive weights exactly to zero and keep them there (the subgradient at zero covers an interval). The L2 penalty's gradient 2*lambda*w vanishes as w goes to zero, so weights shrink proportionally but never reach zero. Geometrically, the L1 ball has corners on the axes where the loss contours tend to touch it; the L2 ball is round. L2 is also equivalent to a Gaussian prior and L1 to a Laplace prior under MAP estimation."}, {"id": "q-adam", "topic": "Optimization", "q": "Write down Adam's update and explain what the bias correction does and why it matters early in training.", "a": "m_t = b1*m_{t-1} + (1-b1)*g_t; v_t = b2*v_{t-1} + (1-b2)*g_t^2; m_hat = m_t/(1-b1^t); v_hat = v_t/(1-b2^t); w -= lr * m_hat / (sqrt(v_hat) + eps). Because m and v start at zero, early estimates are biased toward zero (m_1 is only (1-b1)*g_1). Dividing by 1-b^t rescales them to unbiased estimates; without it, the first steps would be far too small for m and the denominator far too small for v, giving huge, unstable early updates. Defaults: b1=0.9, b2=0.999, eps=1e-8. AdamW decouples weight decay from the adaptive step."}, {"id": "q-batchnorm-layernorm", "topic": "Neural nets", "q": "Batch norm versus layer norm: what does each normalize over, and why do transformers use layer norm?", "a": "Batch norm normalizes each feature over the batch (and spatial positions for conv nets), so its statistics depend on the batch composition and it needs running averages at inference. Layer norm normalizes each example over its feature dimension, independent of other examples, so it behaves the same at train and test time, works with batch size 1, and does not couple tokens or sequences of different lengths. That independence is why transformers and RNN-style models use it. Pre-norm (norm before attention and MLP, inside the residual branch) trains more stably than the original post-norm placement; RMSNorm drops the mean subtraction for speed."}, {"id": "q-attention-scaling", "topic": "Transformers and LLMs", "q": "Why is attention scaled by 1/sqrt(d_k)?", "a": "If the components of q and k are roughly independent with unit variance, the dot product q.k has variance d_k, so its magnitude grows with sqrt(d_k). Large scores push the softmax into a near one-hot regime where gradients through the softmax are tiny, which stalls training. Dividing by sqrt(d_k) keeps the scores at unit variance regardless of head size, so the softmax stays in a well-conditioned range."}, {"id": "q-kv-cache", "topic": "Transformers and LLMs", "q": "What is a KV cache, and how does it change the cost of generating a sequence of length T?", "a": "During autoregressive decoding, each new token attends to all previous tokens. Without a cache, every step recomputes keys and values for the whole prefix, costing O(T^2) per step and O(T^3) overall. The KV cache stores each layer's keys and values for past tokens, so a step only computes the new token's q, k, v and attends over the cached ones: O(T) per step, O(T^2) total. The price is memory: layers x 2 x T x d_model per sequence, which is why long-context serving is memory bound and why grouped-query attention, multi-query attention and paged attention exist."}, {"id": "q-auc", "topic": "Evaluation", "q": "What does ROC AUC measure, and when is precision-recall AUC the better choice?", "a": "ROC AUC is the probability that a random positive is ranked above a random negative; it is threshold-free and invariant to class balance. On heavily imbalanced data, ROC AUC can look excellent while the classifier still produces mostly false positives at any usable threshold, because the false-positive rate's denominator is huge. The precision-recall curve focuses on the positive class and exposes that; use PR AUC (or average precision) when positives are rare and false positives are costly, such as fraud or policy-violation detection."}, {"id": "q-calibration", "topic": "Evaluation", "q": "What does it mean for a classifier to be calibrated, how do you measure it, and how does temperature scaling fix it?", "a": "A calibrated model's confidence matches its accuracy: among predictions made with confidence 0.8, about 80% are correct. Measure with a reliability diagram and expected calibration error (bin by confidence, average |accuracy - confidence| weighted by bin size). Modern neural nets are usually overconfident. Temperature scaling divides the logits by a single scalar T fitted on a held-out set by minimizing NLL; T > 1 softens the distribution. It does not change the argmax, so accuracy and ranking stay the same, which makes it the standard post-hoc fix and a prerequisite for using confidence thresholds, for example in a cost-aware model router."}, {"id": "q-mle-vs-map", "topic": "Probability and statistics", "q": "How do maximum likelihood, MAP, and regularized loss minimization relate?", "a": "Maximum likelihood picks parameters that maximize p(data | theta); for Gaussian noise that is least squares, for Bernoulli labels it is cross-entropy. MAP adds a prior and maximizes p(theta | data) proportional to p(data | theta) p(theta); the negative log prior becomes a regularizer, so a Gaussian prior gives L2 weight decay and a Laplace prior gives L1. Full Bayesian inference integrates over theta instead of picking a point, which is what ensembles and dropout-as-approximate-inference try to approximate."}, {"id": "q-kmeans", "topic": "Classic ML", "q": "Describe Lloyd's algorithm for k-means, its objective, why it converges, and its main weaknesses.", "a": "Alternate two steps: assign each point to its nearest centroid, then move each centroid to the mean of its assigned points. Each step cannot increase the within-cluster sum of squares, and there are finitely many partitions, so it converges to a local minimum. Weaknesses: sensitive to initialization (k-means++ seeds centroids far apart to fix this), assumes roughly spherical equal-variance clusters, needs k chosen in advance (elbow or silhouette), and is pulled by outliers because it uses means. Complexity is O(n k d) per iteration."}, {"id": "q-data-parallel", "topic": "Systems and scaling", "q": "Compare data, tensor, and pipeline parallelism, and say what ZeRO adds.", "a": "Data parallelism replicates the model on every device, splits the batch, and all-reduces gradients; it is simplest but each device holds the full model and optimizer state. Tensor parallelism splits individual matrices across devices and needs communication inside every layer, so it is used within a node over fast links. Pipeline parallelism assigns layers to stages and streams micro-batches through, trading bubble time for memory. ZeRO shards optimizer state, gradients and finally parameters across data-parallel workers so that memory scales down with the number of devices while keeping the data-parallel programming model; FSDP is PyTorch's implementation."}, {"id": "q-mlip", "topic": "ML for science", "q": "What makes a machine-learned interatomic potential like MACE or UMA work, and what are the failure modes to check before trusting it in a search?", "a": "They learn energy as a sum of atomic contributions from local environments, with E(3)-equivariant features (or invariant descriptors) so predictions respect rotation and permutation symmetry, and forces come from the gradient of the energy so they are conservative. Trained on DFT data, they get near-DFT accuracy at a tiny fraction of the cost. Failure modes: extrapolation outside the training distribution (unusual coordination, high pressure, new chemistries), unphysical soft modes or holes in the potential energy surface that an optimizer or evolutionary search will exploit, and inconsistent ranking of polymorphs within a few meV per atom. Check with uncertainty estimates (ensembles), DFT re-ranking of the top candidates, and sanity checks on structure relaxations."}, {"id": "q-double-descent", "topic": "Generalization", "q": "What is double descent, and how do you tell whether a model is overfitting or underfitting in practice?", "a": "Classical theory says test error is U-shaped in capacity, but over-parameterized models show a second descent: test error peaks near the interpolation threshold, where the model has just enough parameters to fit the training set including its noise and is forced into a high-norm solution, then falls again as capacity grows and the optimizer can pick a smoother interpolant among the many that fit. The same shape appears in epochs and in dataset size, so adding a little data can temporarily hurt near the threshold, and label noise makes the peak sharper while regularization and early stopping flatten it. In practice I diagnose with learning curves: train loss far above target means underfitting (raise capacity, train longer, check the pipeline); a large and widening train-validation gap means overfitting (regularize, augment, add data, or move well past the interpolation peak); both flat and bad means the labels or features are the problem. The follow-up to be ready for is why interpolation is not just memorization, and the answer is the implicit bias of SGD toward minimum-norm, low-complexity solutions."}, {"id": "q-overparameterized-generalization", "topic": "Generalization", "q": "A network with far more parameters than training points can fit random labels, yet generalizes on real labels. How do you explain that?", "a": "Capacity-based bounds such as VC dimension or Rademacher complexity of the whole hypothesis class are vacuous here, because the class really can fit anything; what matters is the subset of functions the optimizer actually reaches. Gradient descent from a small initialization has an implicit bias: for linear regression it converges to the minimum-norm interpolant, for logistic loss to the max-margin direction, and in deep nets to low-complexity functions that fit the signal before the noise. Real labels have structure that is learned early and fast, while random labels require memorization that takes far longer and ends at sharper, higher-norm minima, so training time and sharpness are themselves predictors of generalization. Margin and PAC-Bayes bounds that depend on the norm or flatness of the found solution relative to its initialization, rather than on parameter count, are the ones that come out non-vacuous. The practical reading: regularize the optimization path (learning rate, batch noise, weight decay, early stopping) rather than counting parameters, and always measure generalization directly on held-out data."}, {"id": "q-early-stopping", "topic": "Generalization", "q": "How does early stopping act as a regularizer, and how do you implement it correctly?", "a": "Gradient descent fits directions of the data in order of curvature: high-variance, signal-dominated directions first and low-variance, noise-dominated directions last, so stopping at step t acts like shrinkage on the slow directions. For linear least squares, early stopping with learning rate eta after t steps is approximately equivalent to ridge regression with lambda about 1/(eta t). Correct use: hold out a validation set disjoint from training and from the final test set, evaluate every k steps, keep the checkpoint with the best validation metric, and stop after a patience window with no improvement; the stopping step is a hyperparameter chosen on validation, so the test set is touched once. Pitfalls: noisy validation metrics on small sets trigger premature stops (smooth them or use longer patience), the monitored metric must be the one you actually care about, and under a cosine schedule the best checkpoint is usually at the end anyway, so early stopping matters most for small data and fine-tuning. In LLM fine-tuning, validation loss often rises while task accuracy still improves, which signals growing overconfidence rather than a worse argmax, so I would monitor both."}, {"id": "q-dropout-ensemble", "topic": "Generalization", "q": "Why is dropout described as training an ensemble, and what does the inference-time rescaling do?", "a": "Dropout zeros each unit with probability p during training, so each minibatch trains a different sub-network drawn from 2^n thinned networks that share weights; the objective is the expected loss over that distribution, so you fit an exponentially large ensemble with tied parameters for the price of one model. At test time you want the ensemble average, which is intractable, so you use the full network with activations scaled by (1-p), or in inverted dropout scale by 1/(1-p) during training and do nothing at test, so expected pre-activations match training; the weight-scaling rule is exact for one linear layer and a good approximation in deep nets. Dropout also prevents co-adaptation, since a unit cannot rely on a specific partner being present, and for linear models it is equivalent to an adaptive L2 penalty scaled by feature variance. The trade-offs: slower convergence, variance shift when combined with batch norm, and large transformers often set it to zero because they are undertrained rather than overfit. Keeping dropout active at inference and sampling several passes is MC dropout, a cheap but under-dispersed uncertainty estimate."}, {"id": "q-data-augmentation", "topic": "Generalization", "q": "When does data augmentation help, and how can it hurt?", "a": "Augmentation encodes invariances you believe the target has: if the label is unchanged by a flip, crop, color jitter, or for a crystal by a rotation, translation or supercell, applying those transforms enlarges the effective training set and regularizes toward functions that respect the invariance, which lowers variance without adding bias when the invariance is real. It acts as a prior, so it matters most in low-data regimes, and it is the cheap alternative to building symmetry into the architecture: an equivariant network hard-codes what augmentation only encourages. It hurts when the transform changes the label or the distribution: a vertical flip turns a 6 into a 9, a crop removes the object, a paraphrase flips sentiment, and synthetic examples can make the training distribution unlike the test distribution so the model learns artifacts of the augmentation. Strong augmentation also lengthens training and can underfit a small model. I would validate every transform by checking that un-augmented validation performance improves, ablate transform by transform, and in the LLM setting check that paraphrased or synthesized instruction data does not leak evaluation items."}, {"id": "q-weight-decay-vs-l2-adam", "topic": "Generalization", "q": "Why is adding an L2 penalty to the loss not the same as weight decay under Adam, and which should you use?", "a": "With plain SGD they coincide: the gradient of (lambda/2)||w||^2 is lambda*w, so stepping on g + lambda*w equals decaying w by lr*lambda and then stepping on g. Under Adam the penalty gradient lambda*w is added to g before the division by sqrt(v_hat), so parameters with large historical gradients have their regularization divided down and parameters with small gradients have it amplified; the effective shrinkage is no longer proportional to w and depends on gradient history. AdamW applies w -= lr*lambda*w directly after the adaptive step, which restores the intended shrinkage and makes lambda tunable independently of the learning rate; it generalizes measurably better and is the default for transformers, with lambda around 0.1 times the lr multiplier. Two details interviewers probe: decay is normally not applied to biases, norm gains or sometimes embeddings, and in networks with normalization layers weight decay mostly controls the effective learning rate by keeping weight norms small rather than limiting capacity directly."}, {"id": "q-label-smoothing", "topic": "Generalization", "q": "What does label smoothing do, and when does it help or hurt?", "a": "Label smoothing replaces the one-hot target with 1-eps on the true class and eps/(K-1) on the rest, so the loss becomes (1-eps)*CE(y, p) + eps*CE(uniform, p). The optimum is no longer an unbounded logit gap: the model is penalized for driving the true-class probability to one, so logits and weights stay smaller, penultimate features cluster more tightly per class, and the outputs are less overconfident, which improves calibration and gives small accuracy gains in image classification and translation at eps about 0.1. The costs: it erases information in the logits about which wrong classes are similar, so it hurts distillation from a smoothed teacher, it over-regularizes when classes are genuinely ambiguous, and it is a global fix that does not learn which inputs deserve less confidence. It is rarely used in LLM pretraining because next-token targets are inherently multi-modal and the models are undertrained. For a classifier whose confidence feeds a threshold or a router, I would compare it against temperature scaling, which fixes calibration post hoc without changing the training objective."}, {"id": "q-distribution-shift", "topic": "Generalization", "q": "Distinguish covariate shift, label shift and concept drift, and say how you would detect and handle each.", "a": "Factor the joint as p(x, y) = p(y|x) p(x) = p(x|y) p(y). Covariate shift changes p(x) with p(y|x) fixed: inputs look different (new product categories, a new instrument) but the labeling rule is unchanged, so you can importance-weight training points by p_test(x)/p_train(x) from a domain classifier, or label a sample from the new distribution. Label shift changes p(y) with p(x|y) fixed, such as a fraud rate doubling; estimate the new prior from the confusion matrix (black-box shift estimation) and reweight. Concept drift changes p(y|x) itself, for instance a policy update that makes previously allowed listings violations; no reweighting fixes that, so it needs fresh labels and retraining and is the case to monitor hardest. Detection: input and embedding statistics (population stability index, MMD, a two-sample classifier), prediction and confidence histograms, and most reliably a continuously labeled audit sample that measures live accuracy, because a model's own confidence does not reveal p(y|x) drift. The design point to make: the validation set must be drawn like production traffic, and the monitoring plan should name which shift type each alarm catches."}, {"id": "q-batch-size-lr-noise", "topic": "Optimization", "q": "How do batch size and learning rate interact, and why can small batches generalize better?", "a": "A minibatch gradient is the full gradient plus noise with covariance proportional to 1/B, so SGD behaves like gradient descent plus noise whose scale is set by lr/B. Keeping lr/B fixed when scaling the batch (the linear scaling rule) keeps the dynamics roughly unchanged, which is how ImageNet training reached batch 8K with lr scaled by 8K/256 plus warmup; beyond a critical batch size the noise is already negligible, extra samples per step stop buying progress, and you pay more compute per unit of improvement, so the efficient batch is near the gradient noise scale. Small batches with proportionally large learning rates inject noise that cannot settle into sharp minima, and sharp minima generalize worse, so very large batches without retuning show a generalization gap. Adam-style optimizers follow closer to a square-root scaling rule in practice. The engineering trade-off: large batches improve accelerator utilization and amortize communication, so you pick the largest batch at which lr can still be scaled without hurting validation loss, and use gradient accumulation only when memory rather than optimization is the limit."}, {"id": "q-lr-warmup-cosine", "topic": "Optimization", "q": "Why warm up the learning rate, and why is cosine decay the common schedule?", "a": "At initialization the loss surface is poorly conditioned and Adam's second-moment estimate is built from a handful of samples, so an early full-size step can blow up activations or throw the model into a bad basin; with post-norm transformers it can diverge outright. Ramping lr linearly from near zero over a few hundred to a few thousand steps lets the statistics and layer scales settle and permits a higher peak lr afterwards. After the peak, decaying lr trades exploration for convergence: a high lr acts like high temperature that cannot settle into a narrow minimum, and the final low lr lowers the noise floor of the iterate. Cosine to about 10% of peak is smooth, has no step-timing hyperparameters and matches or beats step decay; the loss drop at the end of a cosine run is noise collapsing rather than new learning, which is why the total length must be known in advance. Warmup-stable-decay (constant lr, then a short linear decay) is now popular because the decay can be branched from any checkpoint, giving a usable model at any budget. If asked what happens without warmup in Adam: m_hat/sqrt(v_hat) is roughly plus or minus one per parameter at the first step regardless of gradient scale, so every parameter moves by the full lr at once."}, {"id": "q-gradient-clipping", "topic": "Optimization", "q": "What does gradient clipping do, when do you need it, and what is the difference between clipping by norm and by value?", "a": "Clipping by global norm rescales the whole gradient to norm c when ||g|| > c, which preserves the direction and caps the step; clipping by value clamps each component, which changes the direction and survives mostly in older RNN code. The purpose is to survive rare huge gradients from a bad batch, a long sequence with exploding Jacobian products, or an attention-logit blow-up, without one step wrecking the weights; it makes the optimizer behave like a trust region where the loss is locally sharp. Standard transformer practice is clip norm 1.0 with the fraction of clipped steps logged: if most steps clip, the lr is too high or the model is unstable; if none do, clipping is inert. It does not help vanishing gradients, and Adam's per-parameter normalization already absorbs much of the scale, so clipping mainly matters during warmup and during spikes. Loss spikes in LLM training are handled alongside clipping by lowering lr, lengthening warmup, qk-layernorm or z-loss to tame logits, and skipping batches whose gradient norm is far above the running average."}, {"id": "q-vanishing-exploding-gradients", "topic": "Optimization", "q": "Why do gradients vanish or explode in deep networks, and what fixes each?", "a": "Backprop multiplies Jacobians layer by layer, dL/dh_0 = product over layers of W_l^T diag(sigma'(z_l)), so if the typical singular value of each factor is below one the product shrinks exponentially with depth and early layers stop learning, and if above one it explodes. Sigmoid and tanh saturate (derivative at most 0.25 and 1), so deep sigmoid nets vanish; an RNN multiplies the same matrix T times, so the gradient scales like lambda_max^T and long-range credit assignment fails. Fixes: initialize to preserve variance per layer (Xavier for tanh, Kaiming for ReLU), use activations with non-saturating gradients (ReLU, GELU), normalize so pre-activations stay in range, and above all add residual connections, which make each layer's Jacobian I plus a small term so the product stays near the identity and gradients get a short path. For sequences, gating (LSTM, GRU) and norm clipping handle the two sides, and attention removes the long product entirely. A quick diagnostic is a histogram of per-layer gradient norms at initialization, which should be the same order of magnitude across depth."}, {"id": "q-momentum-nesterov", "topic": "Optimization", "q": "Explain momentum, and what Nesterov momentum changes.", "a": "Heavy-ball momentum keeps a velocity v = mu*v + g and steps w -= lr*v, so the update is an exponentially weighted sum of past gradients with effective step lr/(1-mu) along consistent directions and cancellation along oscillating ones. In a ravine, plain gradient descent zigzags across the steep direction while crawling along the shallow one; momentum damps the zigzag and accelerates the shallow direction, and on a quadratic the iteration count improves from scaling with the condition number kappa to sqrt(kappa). Nesterov evaluates the gradient at the look-ahead point w - lr*mu*v instead of at w, which adds a correction that reacts one step earlier when the velocity is about to overshoot; in the convex setting it reaches the optimal O(1/t^2) rate versus O(1/t) for gradient descent and it is a bit more stable at high mu. Typical mu is 0.9, raised toward 0.99 for small batches or tiny learning rates. In Adam, m_t plays the role of momentum and NAdam adds the look-ahead; the usual follow-up is that momentum also raises the effective learning rate, so lr must be retuned when mu changes."}, {"id": "q-second-order-methods", "topic": "Optimization", "q": "Why not train neural networks with Newton's method, and what do approximate second-order optimizers like K-FAC or Shampoo buy you?", "a": "Newton's step -H^{-1} g rescales every eigendirection by its curvature, so an ill-conditioned quadratic converges in one step. For n parameters the Hessian is n x n, so forming and inverting it costs O(n^2) memory and O(n^3) time, impossible beyond a few million parameters; it is indefinite at non-convex points, so a raw Newton step is attracted to saddles, and minibatch noise makes the curvature estimate unreliable. Practical methods exploit structure: Adam's sqrt(v) is a crude diagonal preconditioner, Hessian-free methods run conjugate gradient on Hessian-vector products from double backprop, K-FAC approximates each layer's Fisher as a Kronecker product of input and output-gradient covariances so inversion is cheap, and Shampoo keeps left and right preconditioner matrices per weight matrix, with Muon as a related orthogonalized update. They cut the number of steps, especially at large batch size, at the cost of extra memory, periodic matrix inversions and more communication in distributed training. The trade-off to state: a 1.5 to 2x reduction in steps pays off only when the preconditioner update and communication are not the bottleneck, which is why they have only recently won LLM-scale optimizer benchmarks."}, {"id": "q-loss-landscape-flatness", "topic": "Optimization", "q": "What do we know about neural network loss landscapes, and how does flatness relate to generalization?", "a": "Empirically, large nets have many global minima connected by low-loss paths (mode connectivity), saddles are far more common than bad local minima in high dimension, and most of the Hessian spectrum is near zero with a few large outlier eigenvalues. Flat minima, where the loss is insensitive to weight perturbation, tend to generalize better: a PAC-Bayes or description-length argument says a flat basin can be specified with fewer bits, and a flat solution is robust to the shift between the train and test loss surfaces. The caveat is that flatness is not reparameterization invariant, since rescaling layers can sharpen any minimum without changing the function, so sharpness measures must be normalized. Practical consequences: small batches and large learning rates bias SGD toward flat regions, SAM minimizes the worst-case loss in a neighborhood by taking the gradient at w + rho*g/||g||, and stochastic weight averaging averages points along the trajectory to land in the middle of a basin. During training the lr sits at the edge of stability, where the top Hessian eigenvalue is about 2/lr, which is why decaying lr lets the model descend into sharper parts of the valley."}, {"id": "q-sgd-vs-adam", "topic": "Optimization", "q": "When would you choose SGD with momentum over Adam, and vice versa?", "a": "Adam normalizes each parameter's step by its running RMS gradient, so it is robust to gradients that differ by orders of magnitude across layers, which is the situation in transformers (embeddings versus attention versus norm gains) and in sparse-gradient problems; it converges fast with little tuning and is the default for NLP and new architectures. SGD with momentum has one scale, so it starts slower, but on convolutional vision models with batch norm it often reaches slightly better test accuracy at the same budget, partly because Adam's changing per-coordinate metric can hurt generalization and because L2 regularization interacts badly with it until you switch to AdamW. Memory: Adam stores two extra fp32 buffers per parameter, so the optimizer state alone for a 7B model is 56 GB before sharding, while SGD stores one. My rule: SGD with momentum when the architecture is well conditioned and you can afford to tune lr, AdamW when gradients are heterogeneous, training is short, or tuning budget is small, and for either, the learning rate and schedule matter more than the optimizer choice."}, {"id": "q-training-divergence-debug", "topic": "Optimization", "q": "Your training loss spikes and then becomes NaN around step 3000. Walk me through how you debug it.", "a": "First separate data from dynamics: resume from the last good checkpoint and replay the exact batches; if the same batch reproduces the spike, inspect it for extreme lengths, corrupted tokens or huge targets and add filtering. If it is not batch-specific, it is optimization: plot gradient norm, attention-logit and activation maxima over the steps before the spike, since transformer spikes usually follow growing attention logits (fix with qk-layernorm or z-loss) or a peak lr that is too high after warmup (lower peak, lengthen warmup, raise Adam's epsilon, drop beta2 to 0.95 so the second moment tracks faster). NaN specifically suggests fp16 overflow or a log of zero or division by a zero variance; switch to bf16 or enable loss scaling, add eps in norms, and use anomaly detection to find the first NaN op. Rule out boring causes too: an optimizer state restored inconsistently across shards, a data loader that wraps around and changes the mixture, or a batch where every label is padding so the loss normalizes by zero. The order matters: reproduce deterministically, bisect data versus model, then fix the specific mechanism instead of just clipping harder."}, {"id": "q-gd-convergence-rate", "topic": "Optimization", "q": "For gradient descent on a smooth convex function, what step size is safe and how fast does it converge? What changes with strong convexity or stochastic gradients?", "a": "If the gradient is L-Lipschitz, the descent lemma gives f(w - eta*g) <= f(w) - eta*(1 - L*eta/2)*||g||^2, so any eta < 2/L decreases the loss and eta = 1/L is the standard choice. For convex f you get f(w_t) - f* <= L*||w_0 - w*||^2 / (2t), a sublinear O(1/t) rate, and Nesterov acceleration improves it to the optimal O(1/t^2). With mu-strong convexity the rate becomes linear, contracting the error by about 1 - mu/L per step, so reaching accuracy eps takes about kappa*log(1/eps) steps with kappa = L/mu, and momentum cuts that to sqrt(kappa)*log(1/eps). For least squares L and mu are the largest and smallest eigenvalues of X^T X / n, which is why standardizing features and preconditioning help so much. With stochastic gradients the noise adds a floor proportional to eta*sigma^2/mu, so you must decay the step or average iterates, giving O(1/t) for strongly convex SGD. Deep nets are non-convex, but the same bound holds locally: the stable lr is about 2 over the top Hessian eigenvalue, which is the edge-of-stability observation."}, {"id": "q-init-xavier-kaiming", "topic": "Neural nets", "q": "Derive the idea behind Xavier and Kaiming initialization. Why do they differ by a factor of two?", "a": "For a linear layer y = W x with fan_in inputs, independent zero-mean weights of variance sigma^2 and unit-variance inputs, Var(y_i) = fan_in * sigma^2, so to keep activation variance constant through depth you need sigma^2 = 1/fan_in; the symmetric argument for the backward pass gives 1/fan_out, and Xavier (Glorot) compromises with 2/(fan_in + fan_out), which is right for tanh or linear units near their identity regime. ReLU zeroes half of its inputs, so the second moment of the output is halved: E[relu(z)^2] = Var(z)/2, which is why Kaiming (He) uses sigma^2 = 2/fan_in to compensate, and in a 50-layer ReLU net the difference between 1/fan_in and 2/fan_in is a factor 2^50 in activation scale. Biases start at zero; attention and residual nets often scale the output projection of each residual branch by 1/sqrt(2 * n_layers) (GPT-2) so the residual stream variance does not grow with depth. Normalization layers make nets more forgiving of initialization but do not remove the issue at the first step, and transformers are still sensitive to embedding scale and to the init of the final logit layer. The follow-up to expect is what happens if all weights start at zero: every unit in a layer computes the same thing and receives the same gradient, so symmetry is never broken."}, {"id": "q-residual-connections", "topic": "Neural nets", "q": "Why do residual connections make very deep networks trainable, and what do they change about what a layer learns?", "a": "A residual block computes h_{l+1} = h_l + f(h_l), so the Jacobian is I + df/dh and the backward product across L blocks is a sum over paths of different lengths rather than a product of L factors; the identity path carries gradient directly to early layers, which removes the vanishing-gradient problem and the degradation effect where deeper plain nets had higher training error than shallower ones. Each block learns a perturbation of the identity, which is easy to represent as zero at initialization (and often is, by zero-initializing the last layer of the branch), so adding blocks cannot make things worse at the start, and the ensemble view shows a residual net behaves like an average over many shallow paths. A side effect is that the residual stream becomes a shared workspace that every layer reads from and writes into, which is the mental model for interpreting transformers, and that the stream's variance grows with depth, which is why pre-norm placement and branch scaling matter. The trade-off: residual nets need the dimension of h to stay fixed across blocks (or a projection at changes), and very deep pre-norm transformers can suffer from later layers contributing little because the stream is already large. Highway networks are the gated predecessor, and DenseNet concatenates rather than adds."}, {"id": "q-activation-functions", "topic": "Neural nets", "q": "Compare ReLU, GELU and SiLU/Swish, and explain the dead-ReLU problem.", "a": "ReLU is max(0, z): cheap, non-saturating for positive inputs so gradients do not vanish, and sparse; its downside is that a unit whose pre-activation is negative on every input has zero gradient and never recovers, the dead-ReLU problem, which is caused by a large negative bias after a big update or a too-high learning rate, and which leaky ReLU and ELU address with a small negative slope. GELU is z * Phi(z), the expected value of a stochastic gate that keeps z with probability Phi(z); it is smooth, slightly negative for small negative z, and is the default in BERT and GPT because it trains a little better than ReLU in transformers. SiLU or Swish is z * sigmoid(z), nearly the same shape as GELU and cheaper, and in SwiGLU the gating form silu(x W_1) * (x W_2) gives the MLP a multiplicative interaction that most modern LLMs (Llama, PaLM) use with a 2/3 scaled hidden size to keep parameter count fixed. Sigmoid and tanh belong in output layers or gates, not hidden layers, because they saturate. The interview angle is usually why not linear: without nonlinearity a stack of layers collapses to one linear map, and the nonlinearity must have well-behaved gradients over the range the pre-activations actually occupy."}, {"id": "q-cnn-receptive-field", "topic": "Neural nets", "q": "How does the receptive field of a CNN grow with depth, and how do stride and dilation change it?", "a": "For a stack of layers with kernel size k_l and stride s_l, the receptive field grows as r_l = r_{l-1} + (k_l - 1) * prod_{i<l} s_i, so with stride 1 it grows linearly in depth (three 3x3 convs cover 7x7, with fewer parameters and more nonlinearity than one 7x7) and every stride-2 layer doubles the growth rate of all layers after it. Dilation d inflates a kernel to effective size d(k-1)+1 without extra parameters, so a chain with dilations 1, 2, 4, 8 grows the field exponentially, which is how WaveNet and DeepLab get long context cheaply. The theoretical receptive field overstates what the network uses: the effective receptive field is roughly Gaussian and concentrated at the center, and it grows during training. Global pooling or attention gives every output access to the whole input in one step, which is the main reason vision transformers trade the convolutional inductive bias (locality, translation equivariance, weight sharing) for data-hungry global mixing. The design question that follows is how to size the receptive field to the object scale, which is what feature pyramids and multi-scale heads address."}, {"id": "q-lstm-gating", "topic": "Neural nets", "q": "How does LSTM gating solve the vanishing-gradient problem of plain RNNs?", "a": "A plain RNN updates h_t = tanh(W h_{t-1} + U x_t), so the gradient through T steps contains the product of T Jacobians W^T diag(tanh'), which vanishes or explodes exponentially. An LSTM keeps a separate cell state c_t = f_t * c_{t-1} + i_t * g_t, where the forget gate f_t = sigmoid(.), input gate i_t and candidate g_t = tanh(.) are functions of h_{t-1} and x_t, and the output is h_t = o_t * tanh(c_t). The gradient along the cell state is a product of the forget gates, dc_t/dc_{t-1} = f_t, which is elementwise and near one when the gate is open, so information and gradient can pass through many steps without a matrix multiplication or a saturating nonlinearity in the path; that is the same idea as a residual connection, with a learned gate instead of a fixed identity. Initializing the forget bias to 1 or 2 keeps the path open early in training. GRUs merge the cell and hidden state with two gates and work about as well with fewer parameters. The limits that motivated attention: computation is sequential in time so it cannot be parallelized across the sequence, and the fixed-size state must compress everything, so very long dependencies still degrade."}, {"id": "q-gnn-message-passing", "topic": "Neural nets", "q": "Write down one layer of a message-passing GNN and say what makes it permutation equivariant.", "a": "For node i with neighbors N(i), one layer computes messages m_ij = phi(h_i, h_j, e_ij), aggregates them with a permutation-invariant function such as sum, mean or max, and updates h_i' = psi(h_i, aggregate_j m_ij); phi and psi are shared MLPs, so the layer has the same parameters for every node and edge. Because the aggregation is invariant to the order of neighbors and the same update is applied to every node, relabeling the nodes just permutes the outputs, which is permutation equivariance, and a final invariant readout (sum over nodes) makes graph-level predictions permutation invariant. GCN is the special case with normalized sum aggregation and no edge features, GAT learns attention weights over neighbors, and MPNN with edge networks is the form used for molecules. Sum aggregation is the most expressive choice because it can count neighbors, while mean and max cannot distinguish some multisets; the whole family is bounded by the 1-WL graph isomorphism test, so two non-isomorphic regular graphs can get identical embeddings. For materials, the edges come from a radius cutoff on interatomic distances, so the graph is really a geometric graph, and that is where equivariant layers take over from plain message passing."}, {"id": "q-gnn-oversmoothing", "topic": "Neural nets", "q": "Why does stacking many GNN layers hurt, and what are the remedies?", "a": "Each message-passing layer averages a node with its neighbors, so repeated application is like running a diffusion or random walk on the graph; the node features converge toward the dominant eigenvector of the normalized adjacency, which depends only on degree, and nodes become indistinguishable. That is oversmoothing, and in practice GCN accuracy peaks at 2 to 4 layers. A second problem is oversquashing: the information from an exponentially growing receptive field has to pass through fixed-size vectors at bottleneck edges, so long-range signals are crushed regardless of depth. Remedies for oversmoothing include residual or jumping-knowledge connections that let the readout see early layers, normalization of node features (PairNorm), dropping edges during training (DropEdge), and decoupling propagation from transformation as in APPNP, which uses personalized PageRank to keep a share of each node's own features. For oversquashing you rewire the graph, add virtual nodes that connect to everything, or use a graph transformer with global attention plus positional encodings. In atomistic models the problem is mild because the interaction range is physically local, and MACE sidesteps depth entirely by building many-body features within one or two layers."}, {"id": "q-equivariance-invariance", "topic": "Neural nets", "q": "Define equivariance versus invariance, and explain why building symmetry into the architecture beats learning it from data.", "a": "A function f is invariant to a group action if f(g x) = f(x), and equivariant if f(g x) = g' f(x), meaning the output transforms in a corresponding way; a CNN is translation equivariant (shift the image, the feature map shifts) and translation invariant after global pooling, and an interatomic force model must be rotation equivariant while the energy is invariant. Building the symmetry into the layers restricts the hypothesis space to functions that satisfy it exactly, which is a strong prior: it removes the need to learn the symmetry from augmented examples, gives exact invariance rather than approximate, improves sample efficiency dramatically in low-data regimes, and guarantees physically consistent outputs such as forces that rotate with the structure. The costs are design effort and compute: equivariant features like spherical harmonics and tensor products are more expensive than scalar features, and if the symmetry is only approximately true in the data (a canonical orientation of photos, gravity in images) a strictly equivariant model throws away useful information. The practical hierarchy for 3D: invariant scalar descriptors (distances, angles) are cheap but need many-body terms for expressiveness, E(3)-equivariant networks with vector and tensor features are more expressive per layer, and augmentation plus a plain model is the fallback when data is plentiful. Weight sharing in a CNN is the example to give if asked how equivariance also reduces parameters."}, {"id": "q-backprop-autodiff", "topic": "Neural nets", "q": "Explain backpropagation as reverse-mode automatic differentiation. Why reverse mode, and what does it cost relative to the forward pass?", "a": "Autodiff builds a computation graph of primitive operations with known local derivatives and applies the chain rule along it. Forward mode propagates a tangent alongside the values and gives one directional derivative per pass, so it costs one pass per input dimension; reverse mode runs the forward pass, stores intermediates, then sweeps backward accumulating vector-Jacobian products, giving the gradient of one scalar with respect to every parameter in a single backward pass. Training losses are scalars over millions of parameters, so reverse mode wins by the parameter count. The cost is roughly two forward passes: for each matmul y = W x you need dL/dx = W^T dL/dy and dL/dW = dL/dy x^T, so the backward FLOPs are about twice the forward FLOPs and the total is about three times forward, which is where the 6 * N * D FLOPs estimate for training a transformer comes from. The memory cost is storing every activation needed by the backward pass, which scales with batch, sequence length and depth and is the reason for gradient checkpointing. Hessian-vector products come from forward-over-reverse at about the cost of one more backward pass, and PyTorch records the graph dynamically while JAX traces and compiles it."}, {"id": "q-vae-reparameterization", "topic": "Neural nets", "q": "How does a VAE differ from an autoencoder, and why do you need the reparameterization trick?", "a": "A plain autoencoder minimizes reconstruction error through a bottleneck and gives you a code, but no distribution over codes, so sampling from it produces garbage and the latent space has holes. A VAE defines a generative model p(z) p(x|z) with p(z) standard normal and trains an encoder q(z|x) to maximize the evidence lower bound, log p(x) >= E_q[log p(x|z)] - KL(q(z|x) || p(z)); the first term is reconstruction, the second regularizes the posterior toward the prior so the latent space is filled and smooth. The expectation is over z drawn from q, and you cannot backpropagate through a sampling operation; the reparameterization trick writes z = mu(x) + sigma(x) * epsilon with epsilon from N(0, I), so the randomness is an input and the gradient flows through mu and sigma with low variance, unlike the REINFORCE estimator. The KL term for diagonal Gaussians has the closed form 0.5 * sum(mu^2 + sigma^2 - log sigma^2 - 1). Known problems: blurry samples because the Gaussian likelihood averages modes, posterior collapse when a strong decoder ignores z (fixed with KL annealing or beta-VAE weighting), and the lower bound is loose; diffusion models can be read as deep hierarchical VAEs with a fixed encoder, which is why they replaced VAEs for high-fidelity generation."}, {"id": "q-attention-complexity", "topic": "Transformers and LLMs", "q": "What are the time and memory costs of self-attention versus the MLP in a transformer layer, and at what sequence length does attention dominate?", "a": "For sequence length T and model width d, the projections cost O(T d^2) and the score matrix QK^T plus its product with V cost O(T^2 d); naive attention also materializes the T x T scores per head, so memory is O(h T^2). The MLP with hidden size 4d costs about 8 T d^2 FLOPs, versus 4 T d^2 for the four attention projections, so the per-layer total is about 12 T d^2 + 2 T^2 d (times 2 for multiply-add). Attention's quadratic term overtakes the linear-in-T terms when T is about 6d, so for d = 4096 that is roughly 24K tokens; below that the model is dominated by matmuls over d and the sequence length is almost free in FLOPs. The memory side bites earlier: the T x T score matrix per head is what FlashAttention avoids by never writing it to HBM. Alternatives trade exactness for scaling: sparse or sliding-window attention is O(T w), linear attention and state-space models are O(T) by replacing softmax with a kernel feature map or a recurrence, at some cost in recall over long contexts. At inference with a KV cache, each decoded token costs O(T d) per layer for attention, which is memory-bandwidth bound, which is why long-context serving is limited by cache size rather than FLOPs."}, {"id": "q-multi-head-vs-single", "topic": "Transformers and LLMs", "q": "Why use multiple attention heads rather than one big head of the same total width?", "a": "A single softmax over the sequence produces one weighting per query, so one head can only mix one pattern of positions per token; splitting the width d into h heads of size d/h gives h independent softmaxes that can attend to different things at once, for example the previous token, a matching bracket, and a subject noun, and the concatenated outputs are mixed by W_O. The parameter count and FLOPs are the same as one head of width d, since the projections are just reshaped, so the cost is only in the score computation, which is h times as many smaller dot products. Small per-head dimension also makes each head's dot products lower rank, which is a regularizer, and the known attention circuits (induction heads, previous-token heads) show heads specializing. Empirically many heads are redundant and can be pruned after training with little loss, and too many tiny heads hurt because d/h gets too small to encode a useful key. Multi-query and grouped-query attention keep multiple query heads but share keys and values across them to shrink the KV cache, which is the follow-up most interviewers go to."}, {"id": "q-positional-encodings", "topic": "Transformers and LLMs", "q": "Compare sinusoidal, learned, rotary (RoPE) and ALiBi positional encodings. Which extrapolate to longer contexts?", "a": "Attention is permutation equivariant, so position must be injected. Sinusoidal encodings add fixed sin/cos features at geometrically spaced frequencies to the input embeddings; any offset is a linear function of the base, so relative position is in principle recoverable, and they are parameter-free but degrade beyond trained lengths. Learned absolute embeddings (BERT, GPT-2) are a lookup table per position: flexible, but undefined beyond the maximum trained position. RoPE rotates each pair of query and key dimensions by an angle proportional to position times a frequency, so the dot product q_m . k_n depends only on m - n; it encodes relative position inside attention without extra parameters, works well with the KV cache, and is the default in Llama and most modern LLMs, with context extension done by rescaling the frequencies (position interpolation, NTK-aware, YaRN) and a short fine-tune. ALiBi adds a linear penalty -m * |i - j| to attention scores with a per-head slope m and no embeddings at all, which gives a locality bias and the best zero-shot extrapolation to longer sequences but weaker long-range retrieval. The trade-off: RoPE with frequency scaling is the strongest for quality, ALiBi for cheap length generalization, and in all cases extrapolation is limited because the model has never seen attention distributions at that length."}, {"id": "q-pre-norm-vs-post-norm", "topic": "Transformers and LLMs", "q": "Pre-norm versus post-norm transformers: what is the difference, and why did the field move to pre-norm?", "a": "Post-norm, the original placement, computes h = LayerNorm(h + f(h)), so the normalization sits on the residual path and the gradient to lower layers passes through every LayerNorm; at initialization the expected gradient norm grows with depth, which is why post-norm needs careful warmup and small learning rates and diverges for deep stacks. Pre-norm computes h = h + f(LayerNorm(h)), keeping a clean identity path through the residual stream, so gradients are well behaved from the first step, warmup can be short, and depth scales easily; GPT-2 onward and nearly all LLMs use it. The cost is that the residual stream's norm grows with depth, so later layers see inputs that are already large and contribute relatively less, which can leave pre-norm models slightly worse than a well-trained post-norm model of the same size; remedies include a final LayerNorm before the logits, scaled residual branches, and the hybrid placements in DeepNet or the Gemma-style norm on both sides of each block. RMSNorm drops the mean subtraction and the bias, which is cheaper and works as well. The interviewer's follow-up is usually what instability looks like in practice: attention-logit growth, which qk-layernorm addresses directly."}, {"id": "q-gqa-mqa", "topic": "Transformers and LLMs", "q": "What do multi-query and grouped-query attention change, and why are they worth a small quality loss?", "a": "In standard multi-head attention every head has its own K and V projections, so the KV cache per token holds 2 * n_layers * n_heads * d_head values. Multi-query attention keeps all query heads but a single shared key and value head, shrinking the cache and the K/V projection weights by a factor of n_heads; grouped-query attention is the middle ground, sharing one K/V pair among a group of query heads, for instance 64 query heads in 8 groups in Llama-2-70B, which cuts the cache 8x. The reason is that decoding is memory-bandwidth bound: each generated token must read the entire KV cache from HBM, so cache size sets the achievable batch size and tokens per second, and the K/V reads per token drop in proportion. The quality loss is small because keys and values are less diverse across heads than queries, and GQA recovers nearly all of MHA's quality while MQA loses a bit more; existing MHA checkpoints can be converted by mean-pooling the K/V heads and fine-tuning briefly. Multi-head latent attention (DeepSeek) goes further by caching a low-rank compressed KV and up-projecting at use. The worked number: Llama-2-70B at 8K context with MHA would need about 2 * 80 * 8192 * 8192 * 2 bytes = 21 GB per sequence in bf16, and GQA with 8 KV heads brings it to about 2.7 GB."}, {"id": "q-flash-attention", "topic": "Transformers and LLMs", "q": "What does FlashAttention actually do, and why is it faster if it performs the same or more FLOPs?", "a": "Standard attention writes the T x T score matrix and the softmax probabilities to GPU high-bandwidth memory and reads them back, and those reads and writes, not the matmuls, dominate at moderate sequence lengths because HBM bandwidth is far slower than on-chip SRAM and tensor-core throughput. FlashAttention tiles Q, K and V into blocks that fit in SRAM, computes the attention output block by block, and uses the online softmax trick: it keeps a running maximum and running sum of exponentials per row, rescaling the partial output whenever a new block raises the maximum, so the exact softmax is produced without ever materializing the full matrix. Memory drops from O(T^2) to O(T), and the kernel is IO-aware, which gives 2 to 4x wall-clock speedups and makes 32K to 128K contexts trainable. The backward pass recomputes the attention probabilities from the saved row statistics instead of storing them, so it does slightly more FLOPs for a large saving in memory traffic. It is exact, unlike sparse or linear attention, and FlashAttention-2 and -3 improve parallelism across the sequence dimension and exploit asynchronous tensor cores and FP8 on Hopper. The general lesson to state is roofline thinking: arithmetic intensity decides whether a kernel is compute or memory bound, and attention at small head dimension is memory bound."}, {"id": "q-mixture-of-experts", "topic": "Transformers and LLMs", "q": "How does a mixture-of-experts transformer work, and what are the training and serving problems it introduces?", "a": "An MoE layer replaces the dense MLP with E expert MLPs and a router that computes softmax(x W_g), keeps the top-k experts per token (k = 1 or 2, sometimes 8 of 256 with fine-grained experts), and combines their outputs weighted by the router scores, so each token activates only a fraction of the parameters. That decouples parameter count from per-token FLOPs: Mixtral 8x7B has 47B parameters but about 13B active, and for a fixed compute budget MoE models reach a given loss faster than dense ones. Training problems: the top-k selection is not differentiable so the gradient only flows through the chosen experts' scores, routing can collapse so a few experts take all tokens, which is countered with a load-balancing auxiliary loss, router z-loss, or capacity factors that drop overflow tokens, and training is noisier and sensitive to router precision. Serving problems: all experts must be in memory, so the memory footprint is that of the full model while the FLOPs are small; experts are spread across devices with expert parallelism, which turns routing into an all-to-all communication, and batch efficiency depends on tokens being spread evenly. The trade-off I would state: MoE wins when you are compute-limited and memory-rich (large batch inference, big training clusters) and loses for latency-critical, single-stream serving on small devices; fine-tuning MoE models is also more fragile."}, {"id": "q-tokenization-bpe", "topic": "Transformers and LLMs", "q": "How does byte-pair encoding work, why do modern LLMs use byte-level BPE, and what are the consequences of tokenization for model behavior?", "a": "BPE starts with a base vocabulary (characters, or the 256 byte values), counts the most frequent adjacent pair in the training corpus, merges it into a new symbol, and repeats until the vocabulary reaches the target size, say 32K to 128K; encoding applies the learned merges in order. Byte-level BPE (GPT-2 onward) uses bytes as the base so any Unicode string is representable with no unknown token, at the price that rare scripts cost several tokens per character; a pre-tokenization regex keeps merges from crossing spaces and punctuation categories. The vocabulary size trades sequence length (a larger vocabulary compresses text into fewer tokens, so more content per context window and faster inference) against embedding and softmax cost and sparsely trained rare tokens. Consequences: numbers split into arbitrary chunks, which hurts arithmetic and motivates digit-level tokenization; the model cannot see characters, so spelling and counting letters are hard; multilingual fairness depends on the tokenizer's training mix; and glitch tokens that appear in the vocabulary but rarely in training give erratic behavior. SentencePiece unigram models choose tokens by likelihood rather than greedy merges and allow sampling of segmentations as regularization. If the follow-up is why not words or characters: words give unbounded vocabularies and OOV, characters give sequences 4 to 5 times longer and weaker per-token semantics."}, {"id": "q-pretraining-objectives", "topic": "Transformers and LLMs", "q": "Compare causal language modeling with masked language modeling. Why has the decoder-only causal objective won for large models?", "a": "Masked LM (BERT) corrupts about 15% of tokens and predicts them from bidirectional context, giving rich representations for classification and extraction but no natural way to generate text, and only 15% of positions produce a learning signal per pass. Causal LM predicts every next token from its left context with a triangular attention mask, so every position contributes a loss term, teacher forcing makes training fully parallel, and the same model generates by sampling, which makes it a universal interface for any task phrased as text. Scaling studies found decoder-only models match or beat encoder-decoder and masked models on downstream tasks when trained on enough data, in-context learning emerges from the causal objective, and the KV cache makes causal inference efficient, so the simplicity and generality won. Prefix-LM and encoder-decoder (T5) sit in between with bidirectional attention over the input and causal decoding; span corruption (T5, UL2) and fill-in-the-middle are hybrids that keep infilling ability. The remaining cases for masked encoders are embeddings, retrieval, and classification at small scale where bidirectional context and cheap inference matter more than generation. If asked about exposure bias: teacher forcing never shows the model its own errors, which is one motivation for RL fine-tuning."}, {"id": "q-scaling-laws-chinchilla", "topic": "Transformers and LLMs", "q": "State the Chinchilla result and explain how you would use scaling laws to plan a training run.", "a": "Loss follows a power law in parameters N and training tokens D, L(N, D) = E + A/N^alpha + B/D^beta with alpha and beta near 0.3, and training compute is about C = 6 N D FLOPs. Kaplan's 2020 fit suggested growing N faster than D, which led to GPT-3-era models like Gopher (280B parameters, 300B tokens) being undertrained; Hoffmann's 2022 Chinchilla experiments held compute fixed and varied the split, finding the compute-optimal recipe scales N and D equally, about 20 tokens per parameter, so a 70B model trained on 1.4T tokens beat the 280B model at the same compute. To plan a run: fix the FLOP budget from your GPU-hours and MFU, fit the frontier on a ladder of small runs (vary N and D at several budgets, fit the parametric loss), extrapolate the optimal N and D, and validate with one medium run before the big one. The important caveat is that compute-optimal is not deployment-optimal: inference cost scales with N, not D, so models meant to serve a lot of traffic are deliberately overtrained (Llama 3 8B saw about 15T tokens, nearly 2000 per parameter) because a smaller model with the same quality is cheaper forever. Scaling laws also hold for data mixture and context length only within the regime they were fit on, and downstream task metrics can be non-smooth in loss."}, {"id": "q-sft-instruction-tuning", "topic": "Transformers and LLMs", "q": "What does supervised fine-tuning do to a pretrained LLM, and what are the main data and training choices?", "a": "SFT continues next-token training on prompt-response pairs with the loss masked to the response tokens, so the model learns the format and behavior of an assistant: following instructions, stopping, refusing, and using a chat template, which the pretraining distribution does not teach. It mostly reshapes the output distribution rather than adding knowledge, which is why a few thousand high-quality, diverse examples (LIMA) go a long way and why quality and diversity of the data matter far more than volume, while low-quality or templated data makes the model dull and teaches hallucination when the examples assert facts the model does not know. Training choices: small learning rate (1e-5 to 2e-5) for one to three epochs, packing sequences with correct attention masking, loss only on assistant turns, and a data mixture that covers the tasks you care about plus a slice of general data to limit forgetting. Evaluate with held-out instruction sets and a judge or human preference, not training loss, since loss on responses is weakly related to helpfulness. SFT is the starting policy for preference optimization; its limitation is that imitating demonstrations cannot express what not to do or trade off between acceptable responses, which is what RLHF and DPO add. For parameter-efficient variants, LoRA adapters on attention and MLP weights recover most of full fine-tuning at a fraction of memory."}, {"id": "q-rlhf-ppo", "topic": "Transformers and LLMs", "q": "Walk through RLHF with PPO: the reward model, the objective, and why the KL penalty is there.", "a": "Stage one trains a reward model r(x, y) on human comparisons using the Bradley-Terry loss, -log sigmoid(r(x, y_w) - r(x, y_l)), so it scores a response relative to alternatives. Stage two treats the SFT model as a policy and optimizes the expected reward minus a KL penalty against the reference policy, maximize E[r(x, y)] - beta * KL(pi || pi_ref), using PPO: sample responses, compute per-token advantages with a value head and GAE, and update with the clipped surrogate objective min(ratio * A, clip(ratio, 1-eps, 1+eps) * A) so each step stays near the sampling policy. The KL term keeps the policy from drifting into regions where the reward model is extrapolating and wrong, preserves the language quality of the reference, and acts as a trust region on the whole distribution; without it the policy overoptimizes the proxy reward and produces degenerate text. The practical cost is four models in memory (policy, reference, reward, value), on-policy sampling that dominates wall-clock time, and sensitivity to reward normalization and beta. Alternatives: DPO removes the reward model and sampling, GRPO drops the value network and uses group-relative advantages, and verifiable rewards (unit tests, math answers) replace the learned reward for reasoning tasks. The interviewer will want to hear reward hacking and the evaluation of the final policy by fresh human preference, not by reward score."}, {"id": "q-dpo", "topic": "Transformers and LLMs", "q": "Derive the DPO objective from the RLHF objective and say what you give up relative to PPO.", "a": "The KL-regularized RLHF objective has a closed-form optimum, pi*(y|x) proportional to pi_ref(y|x) exp(r(x, y)/beta), so the reward can be written in terms of the policy: r(x, y) = beta * log(pi(y|x)/pi_ref(y|x)) + beta * log Z(x). Substituting into the Bradley-Terry preference likelihood cancels the partition function because it is the same for both responses, giving the DPO loss -log sigmoid(beta * (log pi(y_w|x)/pi_ref(y_w|x) - log pi(y_l|x)/pi_ref(y_l|x))). You train the policy directly on preference pairs with a classification-style loss: no reward model, no sampling, no value network, only the policy and a frozen reference for log-probabilities, so it is stable and cheap. What you give up: it is offline, so it learns from the responses in the dataset rather than from its own samples, and it can over-optimize by pushing down the probability of both responses while keeping the margin, which hurts generation quality; beta tunes how far from the reference it may drift. Variants address this: IPO regularizes the margin, KTO uses unpaired thumbs-up/down labels, and iterative or online DPO regenerates pairs from the current policy with a judge. In practice DPO is the default for preference tuning at small to medium scale, and PPO or GRPO wins when the reward is verifiable or when exploration matters, such as reasoning."}, {"id": "q-reward-hacking", "topic": "Transformers and LLMs", "q": "What is reward hacking in RLHF, what does it look like, and how do you contain it?", "a": "Reward hacking is the policy finding outputs the reward model scores highly that humans would not: a learned reward is a proxy fit on a finite preference set, and optimization pressure finds its errors (Goodhart's law). Typical symptoms are longer and longer responses because the reward model prefers length, excessive hedging or sycophancy, confident-sounding but wrong answers, list formatting and markdown everywhere, and in verifiable settings exploiting bugs in the grader or the test harness. You detect it by tracking reward-model score against fresh human preference as training proceeds, which rises then diverges, and by plotting KL from the reference against win rate, since the hacked regime is at large KL. Mitigations: the KL penalty and early stopping on held-out human evaluation, reward-model ensembles or uncertainty penalties so the policy cannot exploit one model's quirks, length normalization or explicit length penalties, retraining the reward model on fresh on-policy comparisons (iterated RLHF), and constitutional or rule-based rewards that are harder to game. The deeper point for an interviewer: the reward model's accuracy on its own test set is not the metric; its accuracy on the distribution the policy will drift toward is, and you cannot measure that until you train."}, {"id": "q-lora-peft", "topic": "Transformers and LLMs", "q": "How does LoRA work, why does it save memory, and when is full fine-tuning still worth it?", "a": "LoRA freezes the pretrained weight W and learns a low-rank update W + (alpha/r) * B A, with A of shape r x d_in initialized Gaussian and B of shape d_out x r initialized to zero, so training starts at the pretrained model; the update has r(d_in + d_out) parameters instead of d_in d_out, and for r = 16 on a 7B model that is under 1% of the weights. Memory savings come mainly from optimizer state and gradients, which exist only for the adapter, so a 7B model fine-tunes on one 24 GB GPU, and with QLoRA the frozen base is 4-bit quantized while the adapters stay in bf16. At inference the update can be merged into W so there is no extra latency, or kept separate to serve many adapters on one base model. The motivation is that fine-tuning updates have low intrinsic rank, and empirically LoRA matches full fine-tuning on most instruction and domain tasks when applied to all linear layers (attention and MLP, not just q and v) with the learning rate raised about 10x. Full fine-tuning still wins when the task needs a lot of new knowledge or a large distribution shift (new language, new modality, continued pretraining), where LoRA learns less and forgets less, and for the largest reasoning gains from RL. If asked about rank: start at 8 to 64, scale alpha with r, and check that the chosen rank is not the bottleneck by trying one step up."}, {"id": "q-quantization", "topic": "Transformers and LLMs", "q": "Explain post-training quantization of an LLM to int8 or 4-bit: what gets quantized, what breaks, and how GPTQ or AWQ fix it.", "a": "Quantization maps weights (and optionally activations) to low-bit integers with a scale per tensor, per channel, or per group of 64 to 128 values, w_q = round(w / s) with s = max|w| / 127 for symmetric int8; the memory and bandwidth drop 2x for int8 and 4x for 4-bit, which directly speeds up memory-bound decoding and lets a 70B model fit on one or two GPUs. Weight-only quantization is the common choice because activations in LLMs have outlier channels with values 100x larger than typical, which blow up the activation scale and destroy precision; LLM.int8 keeps those outlier channels in fp16, and SmoothQuant migrates the difficulty by scaling activations down and weights up per channel. GPTQ quantizes a layer column by column, using second-order information (the inverse Hessian of the layer input) to adjust remaining weights to compensate for each rounding error, so 4-bit loses little perplexity; AWQ instead finds the 1% of salient weight channels by activation magnitude and scales them before rounding to protect them. What breaks: small models and reasoning or long-context tasks degrade more than perplexity suggests, so evaluate on downstream tasks, not just loss; fp8 or int8 with per-token activation scaling is the compute-saving option on recent hardware, while 4-bit weight-only mostly saves memory and bandwidth. Quantization-aware training and QLoRA recover accuracy when PTQ is not good enough, and the KV cache can be quantized separately to extend context."}, {"id": "q-kv-cache-memory-math", "topic": "Transformers and LLMs", "q": "Compute the KV cache size for a 70B-class model serving 32 concurrent requests at 8K context, and say what that implies for batching.", "a": "Per token the cache holds 2 (K and V) x n_layers x n_kv_heads x d_head values. Llama-2-70B has 80 layers,
