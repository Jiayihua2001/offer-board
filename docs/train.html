ode>None<\/code> when <code>temperature == 0<\/code> (greedy decoding never draws).<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why the cache works at all: with a causal mask the key and value of a past token never change when later tokens arrive, so <code>K<\/code> and <code>V<\/code> are append-only; the queries of past tokens are never needed again.<\/li><li>The cost: the cache holds <code>2 * n_layers * T * d_model<\/code> values per sequence (<code>2 * L * T * H_kv * d_head<\/code> with grouped-query attention), which is what limits batch size on a serving GPU; decoding is then memory-bound, which is why speculative decoding and paged caches exist.<\/li><li>The failure mode: forgetting the position offset for the new token (it gets position 0 again) or applying top-p before the temperature, which quietly changes the nucleus.<\/li><li>Follow-up: how top-p differs from top-k when the distribution is flat versus peaked, and what min-p and repetition penalties do to the logits.<\/li><\/ul>", "starter": "\"\"\"Sampling and KV-cached decoding for a NumPy GPT. The model is provided; write the three functions at the end.\"\"\"\nimport numpy as np\n\n\ndef causal_mask(T: int) -> np.ndarray:\n    return np.tril(np.ones((T, T), dtype=bool))\n\n\ndef attention(q, k, v, mask=None):\n    \"\"\"q: (..., T_q, d), k, v: (..., T_k, d); mask broadcastable to (..., T_q, T_k), True = may attend.\"\"\"\n    d_k = q.shape[-1]\n    scores = q @ np.swapaxes(k, -1, -2) / np.sqrt(d_k)\n    if mask is not None:\n        scores = np.where(mask, scores, -1e9)\n    scores = scores - scores.max(axis=-1, keepdims=True)\n    w = np.exp(scores)\n    w = w / w.sum(axis=-1, keepdims=True)\n    return w @ v, w\n\n\ndef split_heads(x, n_heads):\n    B, T, d = x.shape\n    return x.reshape(B, T, n_heads, d // n_heads).transpose(0, 2, 1, 3)\n\n\ndef merge_heads(x):\n    B, H, T, dh = x.shape\n    return x.transpose(0, 2, 1, 3).reshape(B, T, H * dh)\n\n\ndef mha(x, Wq, Wk, Wv, Wo, n_heads, mask=None):\n    q, k, v = (split_heads(x @ W, n_heads) for W in (Wq, Wk, Wv))\n    out, _ = attention(q, k, v, mask)\n    return merge_heads(out) @ Wo\n\n\ndef layer_norm(x, g, b, eps=1e-5):\n    mean = x.mean(axis=-1, keepdims=True)\n    var = x.var(axis=-1, keepdims=True)\n    return (x - mean) / np.sqrt(var + eps) * g + b\n\n\ndef gelu(x):\n    return 0.5 * x * (1.0 + np.tanh(np.sqrt(2.0 / np.pi) * (x + 0.044715 * x ** 3)))\n\n\ndef ffn(x, W1, b1, W2, b2):\n    return gelu(x @ W1 + b1) @ W2 + b2\n\n\ndef block(x, p, n_heads, mask=None):\n    h = x + mha(layer_norm(x, p[\"ln1_g\"], p[\"ln1_b\"]), p[\"Wq\"], p[\"Wk\"], p[\"Wv\"], p[\"Wo\"], n_heads, mask)\n    return h + ffn(layer_norm(h, p[\"ln2_g\"], p[\"ln2_b\"]), p[\"W1\"], p[\"b1\"], p[\"W2\"], p[\"b2\"])\n\n\ndef init_params(vocab, d_model, n_heads, n_layers, T, rng, scale=0.02):\n    d_ff = 4 * d_model\n\n    def blk():\n        return {\"ln1_g\": np.ones(d_model), \"ln1_b\": np.zeros(d_model),\n                \"Wq\": rng.normal(scale=scale, size=(d_model, d_model)), \"Wk\": rng.normal(scale=scale, size=(d_model, d_model)),\n                \"Wv\": rng.normal(scale=scale, size=(d_model, d_model)), \"Wo\": rng.normal(scale=scale, size=(d_model, d_model)),\n                \"ln2_g\": np.ones(d_model), \"ln2_b\": np.zeros(d_model),\n                \"W1\": rng.normal(scale=scale, size=(d_model, d_ff)), \"b1\": np.zeros(d_ff),\n                \"W2\": rng.normal(scale=scale, size=(d_ff, d_model)), \"b2\": np.zeros(d_model)}\n\n    return {\"wte\": rng.normal(scale=scale, size=(vocab, d_model)), \"wpe\": rng.normal(scale=scale, size=(T, d_model)),\n            \"blocks\": [blk() for _ in range(n_layers)], \"lnf_g\": np.ones(d_model), \"lnf_b\": np.zeros(d_model),\n            \"n_heads\": n_heads}\n\n\ndef gpt_forward(tokens, params):\n    \"\"\"Full forward pass without a cache: logits (B, T, vocab) for tokens (B, T).\"\"\"\n    T = tokens.shape[-1]\n    x = params[\"wte\"][tokens] + params[\"wpe\"][:T]\n    mask = causal_mask(T)\n    for p in params[\"blocks\"]:\n        x = block(x, p, params[\"n_heads\"], mask)\n    x = layer_norm(x, params[\"lnf_g\"], params[\"lnf_b\"])\n    return x @ params[\"wte\"].T\n\n\ndef sample_next(logits: np.ndarray, rng: np.random.Generator | None, temperature: float = 1.0,\n                top_k: int | None = None, top_p: float | None = None) -> int:\n    \"\"\"One token id from logits (vocab,). temperature 0 = argmax; else temperature, then top-k, then top-p, then draw.\"\"\"\n    raise NotImplementedError\n\n\ndef forward_with_cache(tokens: np.ndarray, params: dict, cache=None):\n    \"\"\"Logits (len(tokens), vocab) for the NEW tokens only, plus the updated cache (None = empty cache).\"\"\"\n    raise NotImplementedError\n\n\ndef generate(tokens, params: dict, n_new: int, rng: np.random.Generator | None = None, use_cache: bool = True,\n             temperature: float = 0.0, top_k: int | None = None, top_p: float | None = None) -> list[int]:\n    \"\"\"The prompt followed by n_new sampled tokens. The cached and uncached paths must agree.\"\"\"\n    raise NotImplementedError\n", "tests": "import numpy as np\n\nfrom solution import forward_with_cache, generate, gpt_forward, init_params, sample_next\n\nLOGITS = np.log([0.5, 0.3, 0.15, 0.05])\n\n\ndef freq(draws, V=4):\n    return np.bincount(np.asarray(draws), minlength=V) / len(draws)\n\n\ndef model(seed=0):\n    rng = np.random.default_rng(seed)\n    return init_params(vocab=16, d_model=16, n_heads=2, n_layers=2, T=32, rng=rng, scale=0.1)\n\n\ndef test_temperature_zero_is_argmax():\n    rng = np.random.default_rng(0)\n    logits = np.array([0.1, 2.0, -1.0, 1.9])\n    draws = [sample_next(logits, rng, temperature=0.0) for _ in range(20)]\n    assert draws == [1] * 20\n    assert isinstance(draws[0], int)\n    assert sample_next(logits, rng, temperature=0.0, top_k=2, top_p=0.5) == 1\n    assert sample_next(LOGITS, None, temperature=0.0) == 0\n\n\ndef test_plain_sampling_follows_the_softmax():\n    rng = np.random.default_rng(1)\n    draws = [sample_next(LOGITS, rng) for _ in range(4000)]\n    assert np.allclose(freq(draws), [0.5, 0.3, 0.15, 0.05], atol=0.04), freq(draws)\n    # logits are shift-invariant\n    draws2 = [sample_next(LOGITS + 100.0, rng) for _ in range(4000)]\n    assert np.allclose(freq(draws2), [0.5, 0.3, 0.15, 0.05], atol=0.04)\n\n\ndef test_temperature_sharpens_and_flattens():\n    rng = np.random.default_rng(2)\n    cold = [sample_next(LOGITS, rng, temperature=0.1) for _ in range(500)]\n    assert freq(cold)[0] > 0.98, freq(cold)\n    hot = [sample_next(LOGITS, rng, temperature=100.0) for _ in range(4000)]\n    assert np.all(np.abs(freq(hot) - 0.25) < 0.05), freq(hot)\n\n\ndef test_top_k_keeps_only_the_k_largest():\n    rng = np.random.default_rng(3)\n    draws = [sample_next(LOGITS, rng, top_k=2) for _ in range(3000)]\n    assert set(draws) == {0, 1}, set(draws)\n    assert np.allclose(freq(draws)[:2], [0.625, 0.375], atol=0.04), freq(draws)\n    assert all(sample_next(LOGITS, rng, top_k=1) == 0 for _ in range(20))\n    draws = [sample_next(LOGITS, rng, top_k=10) for _ in range(3000)]  # larger than the vocabulary: no effect\n    assert set(draws) == {0, 1, 2, 3}\n    shuffled = LOGITS[[2, 0, 3, 1]]  # the k largest, wherever they sit\n    assert set(sample_next(shuffled, rng, top_k=2) for _ in range(500)) == {1, 3}\n\n\ndef test_top_p_keeps_the_smallest_nucleus():\n    rng = np.random.default_rng(4)\n    for p, support in [(0.45, {0}), (0.75, {0, 1}), (0.9, {0, 1, 2}), (0.99, {0, 1, 2, 3})]:\n        draws = [sample_next(LOGITS, rng, top_p=p) for _ in range(2000)]\n        assert set(draws) == support, (p, set(draws))\n    draws = [sample_next(LOGITS, rng, top_p=0.75) for _ in range(3000)]\n    assert np.allclose(freq(draws)[:2], [0.625, 0.375], atol=0.04), freq(draws)\n    shuffled = np.log([0.05, 0.5, 0.15, 0.3])\n    assert set(sample_next(shuffled, rng, top_p=0.75) for _ in range(500)) == {1, 3}\n    # temperature is applied before the nucleus is chosen: a cold distribution has a smaller nucleus\n    assert set(sample_next(LOGITS, rng, temperature=0.3, top_p=0.9) for _ in range(500)) == {0, 1}\n\n\ndef test_prefill_matches_the_full_forward():\n    params = model()\n    prompt = np.array([3, 1, 4, 1, 5])\n    logits, cache = forward_with_cache(prompt, params)\n    assert logits.shape == (5, 16)\n    assert np.allclose(logits, gpt_forward(prompt[None], params)[0], atol=1e-8)\n\n\ndef test_incremental_decoding_matches_the_full_forward():\n    params = model(seed=1)\n    seq = np.array([3, 1, 4, 1, 5, 9, 2, 6, 5, 3])\n    full = gpt_forward(seq[None], params)[0]\n    cache, rows = None, []\n    for t in seq:  # one token at a time\n        logits, cache = forward_with_cache(np.array([t]), params, cache)\n        assert logits.shape == (1, 16)\n        rows.append(logits[0])\n    assert np.allclose(np.stack(rows), full, atol=1e-8), \"token-by-token logits differ from the full forward\"\n    cache, rows = None, []\n    for a, b in [(0, 3), (3, 4), (4, 6), (6, 10)]:  # chunked prefill\n        logits, cache = forward_with_cache(seq[a:b], params, cache)\n        rows.append(logits)\n    assert np.allclose(np.concatenate(rows), full, atol=1e-8), \"chunked prefill differs from the full forward\"\n\n\ndef test_greedy_generation_with_and_without_cache():\n    params = model(seed=2)\n    prompt = [3, 1, 4, 1, 5]\n    a = generate(prompt, params, 8, use_cache=False)\n    b = generate(prompt, params, 8, use_cache=True)\n    assert a == b, (a, b)\n    assert len(a) == 13 and a[:5] == prompt and all(isinstance(t, int) and 0 <= t < 16 for t in a)\n    for i in range(5, 13):  # greedy means each token is the argmax of the full-forward logits at that step\n        assert a[i] == int(np.argmax(gpt_forward(np.array([a[:i]]), params)[0, -1]))\n\n\ndef test_sampled_generation_matches_with_the_same_rng():\n    params = model(seed=3)\n    prompt = [7, 7, 2]\n    a = generate(prompt, params, 10, rng=np.random.default_rng(5), use_cache=False, temperature=1.0, top_k=5)\n    b = generate(prompt, params, 10, rng=np.random.default_rng(5), use_cache=True, temperature=1.0, top_k=5)\n    assert a == b and len(a) == 13, (a, b)\n    c = generate(prompt, params, 10, rng=np.random.default_rng(6), use_cache=True, temperature=1.0, top_k=5)\n    assert c != a, \"a different rng seed should give a different sample\"\n    d = generate(prompt, params, 10, rng=np.random.default_rng(7), use_cache=True, temperature=1.0, top_p=0.5)\n    assert len(d) == 13 and d[:3] == prompt\n", "solution": "import numpy as np\n\n\ndef causal_mask(T: int) -> np.ndarray:\n    return np.tril(np.ones((T, T), dtype=bool))\n\n\ndef attention(q, k, v, mask=None):\n    d_k = q.shape[-1]\n    scores = q @ np.swapaxes(k, -1, -2) / np.sqrt(d_k)\n    if mask is not None:\n        scores = np.where(mask, scores, -1e9)\n    scores = scores - scores.max(axis=-1, keepdims=True)\n    w = np.exp(scores)\n    w = w / w.sum(axis=-1, keepdims=True)\n    return w @ v, w\n\n\ndef split_heads(x, n_heads):\n    B, T, d = x.shape\n    return x.reshape(B, T, n_heads, d // n_heads).transpose(0, 2, 1, 3)\n\n\ndef merge_heads(x):\n    B, H, T, dh = x.shape\n    return x.transpose(0, 2, 1, 3).reshape(B, T, H * dh)\n\n\ndef mha(x, Wq, Wk, Wv, Wo, n_heads, mask=None):\n    q, k, v = (split_heads(x @ W, n_heads) for W in (Wq, Wk, Wv))\n    out, _ = attention(q, k, v, mask)\n    return merge_heads(out) @ Wo\n\n\ndef layer_norm(x, g, b, eps=1e-5):\n    mean = x.mean(axis=-1, keepdims=True)\n    var = x.var(axis=-1, keepdims=True)\n    return (x - mean) / np.sqrt(var + eps) * g + b\n\n\ndef gelu(x):\n    return 0.5 * x * (1.0 + np.tanh(np.sqrt(2.0 / np.pi) * (x + 0.044715 * x ** 3)))\n\n\ndef ffn(x, W1, b1, W2, b2):\n    return gelu(x @ W1 + b1) @ W2 + b2\n\n\ndef block(x, p, n_heads, mask=None):\n    h = x + mha(layer_norm(x, p[\"ln1_g\"], p[\"ln1_b\"]), p[\"Wq\"], p[\"Wk\"], p[\"Wv\"], p[\"Wo\"], n_heads, mask)\n    return h + ffn(layer_norm(h, p[\"ln2_g\"], p[\"ln2_b\"]), p[\"W1\"], p[\"b1\"], p[\"W2\"], p[\"b2\"])\n\n\ndef init_params(vocab, d_model, n_heads, n_layers, T, rng, scale=0.02):\n    d_ff = 4 * d_model\n\n    def blk():\n        return {\"ln1_g\": np.ones(d_model), \"ln1_b\": np.zeros(d_model),\n                \"Wq\": rng.normal(scale=scale, size=(d_model, d_model)), \"Wk\": rng.normal(scale=scale, size=(d_model, d_model)),\n                \"Wv\": rng.normal(scale=scale, size=(d_model, d_model)), \"Wo\": rng.normal(scale=scale, size=(d_model, d_model)),\n                \"ln2_g\": np.ones(d_model), \"ln2_b\": np.zeros(d_model),\n                \"W1\": rng.normal(scale=scale, size=(d_model, d_ff)), \"b1\": np.zeros(d_ff),\n                \"W2\": rng.normal(scale=scale, size=(d_ff, d_model)), \"b2\": np.zeros(d_model)}\n\n    return {\"wte\": rng.normal(scale=scale, size=(vocab, d_model)), \"wpe\": rng.normal(scale=scale, size=(T, d_model)),\n            \"blocks\": [blk() for _ in range(n_layers)], \"lnf_g\": np.ones(d_model), \"lnf_b\": np.zeros(d_model),\n            \"n_heads\": n_heads}\n\n\ndef gpt_forward(tokens, params):\n    T = tokens.shape[-1]\n    x = params[\"wte\"][tokens] + params[\"wpe\"][:T]\n    mask = causal_mask(T)\n    for p in params[\"blocks\"]:\n        x = block(x, p, params[\"n_heads\"], mask)\n    x = layer_norm(x, params[\"lnf_g\"], params[\"lnf_b\"])\n    return x @ params[\"wte\"].T\n\n\ndef sample_next(logits, rng, temperature=1.0, top_k=None, top_p=None) -> int:\n    logits = np.asarray(logits, dtype=float)\n    if temperature <= 0:\n        return int(np.argmax(logits))\n    z = logits / temperature\n    if top_k is not None and top_k < z.size:\n        kth = np.sort(z)[-top_k]\n        z = np.where(z >= kth, z, -np.inf)\n    p = np.exp(z - z.max())\n    p /= p.sum()\n    if top_p is not None:\n        order = np.argsort(-p)\n        cum = np.cumsum(p[order])\n        cutoff = np.searchsorted(cum, top_p) + 1  # smallest prefix with cumulative mass >= top_p\n        keep = np.zeros(p.size, dtype=bool)\n        keep[order[:cutoff]] = True\n        p = np.where(keep, p, 0.0)\n        p /= p.sum()\n    return int(rng.choice(p.size, p=p))\n\n\ndef block_cached(x, p, n_heads, kv):\n    \"\"\"x: (t_new, d) for the new tokens; kv: None or (K, V) each (H, T_past, d_head). Returns (out, (K, V)).\"\"\"\n    a = layer_norm(x, p[\"ln1_g\"], p[\"ln1_b\"])\n    q, k, v = (split_heads((a @ W)[None], n_heads)[0] for W in (p[\"Wq\"], p[\"Wk\"], p[\"Wv\"]))  # (H, t_new, d_head)\n    if kv is not None:\n        k = np.concatenate([kv[0], k], axis=1)\n        v = np.concatenate([kv[1], v], axis=1)\n    t_new, T = q.shape[1], k.shape[1]\n    mask = np.arange(T)[None, :] <= (T - t_new + np.arange(t_new))[:, None]  # key j visible to new query i iff j <= T_past + i\n    out, _ = attention(q, k, v, mask)\n    h = x + merge_heads(out[None])[0] @ p[\"Wo\"]\n    return h + ffn(layer_norm(h, p[\"ln2_g\"], p[\"ln2_b\"]), p[\"W1\"], p[\"b1\"], p[\"W2\"], p[\"b2\"]), (k, v)\n\n\ndef forward_with_cache(tokens, params, cache=None):\n    tokens = np.asarray(tokens)\n    T_past = 0 if cache is None else cache[0][0].shape[1]\n    positions = T_past + np.arange(tokens.shape[0])\n    x = params[\"wte\"][tokens] + params[\"wpe\"][positions]\n    new_cache = []\n    for i, p in enumerate(params[\"blocks\"]):\n        x, kv = block_cached(x, p, params[\"n_heads\"], None if cache is None else cache[i])\n        new_cache.append(kv)\n    x = layer_norm(x, params[\"lnf_g\"], params[\"lnf_b\"])\n    return x @ params[\"wte\"].T, new_cache\n\n\ndef generate(tokens, params, n_new, rng=None, use_cache=True, temperature=0.0, top_k=None, top_p=None):\n    out = [int(t) for t in tokens]\n    if use_cache:\n        logits, cache = forward_with_cache(np.array(out), params)\n        for i in range(n_new):\n            out.append(sample_next(logits[-1], rng, temperature, top_k, top_p))\n            if i < n_new - 1:\n                logits, cache = forward_with_cache(np.array(out[-1:]), params, cache)\n    else:\n        for _ in range(n_new):\n            logits = gpt_forward(np.array([out]), params)[0]\n            out.append(sample_next(logits[-1], rng, temperature, top_k, top_p))\n    return out\n"}, {"id": "tf-beam-search", "title": "Beam search with length normalization", "track": "transformer", "module": "tf-training", "difficulty": "medium", "minutes": 40, "runtime": "python", "kind": "code", "tags": ["decoding", "beam search", "length penalty"], "hints": ["Keep `live` as a list of (tokens, total log-prob). Each round expands every live hypothesis with every next token, sorts all candidates by total log-prob and keeps the best beam_width.", "A kept candidate whose last token is eos moves to `finished` and is never expanded again. Stop when nothing is live or after max_len rounds; whatever is still live then counts as finished too.", "Rank candidates inside a round by the raw total (they all have the same length); compare finished hypotheses by logp / n ** alpha with n the number of generated tokens."], "rubric": [], "timeout": 30, "readme": "<h2>Beam search with length normalization<\/h2>\n<p>Greedy decoding commits to the best next token and can walk into a dead end: a likely first word followed by an unlikely continuation. Beam search keeps the <code>k<\/code> best partial sequences instead and only commits at the end. It is the standard decoder for translation and summarization, and the thing you reach for when a sampling-based decoder is too noisy. Write it against an abstract model so the search logic is all that matters.<\/p>\n<pre><code class=\"lang-text\">beam_search(step_fn, start, beam_width, max_len, eos, alpha=0.0) -&gt; (tokens, score)<\/code><\/pre>\n<ul><li><code>step_fn(prefix: list[int]) -&gt; list[float]<\/code>: log-probabilities of the next token given the prefix (a deterministic toy model in the tests).<\/li><li><code>start<\/code>: the initial tokens (for instance <code>[BOS]<\/code>). The returned <code>tokens<\/code> begin with <code>start<\/code>.<\/li><li>The algorithm, exactly: keep a list of live hypotheses, initially <code>[(start, 0.0)]<\/code>. Up to <code>max_len<\/code> rounds: extend every live hypothesis with every possible next token, rank all candidates by their total log-probability, keep the best <code>beam_width<\/code>. A kept candidate that ends in <code>eos<\/code> is finished and never extended again; the rest stay live. Stop when nothing is live. After the last round, anything still live counts as finished.<\/li><li>Return the finished hypothesis with the highest length-normalized score <code>logp / n ** alpha<\/code>, where <code>n<\/code> is the number of generated tokens (<code>len(tokens) - len(start)<\/code>), and that score. <code>alpha = 0<\/code> is the raw log-probability; <code>alpha = 1<\/code> is the per-token average.<\/li><\/ul>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">EOS = 0, A = 1, B = 2, BOS = 3, with a model where\n   after BOS:  p(EOS) = 0.02, p(A) = 0.55, p(B) = 0.43\n   after A:    p(EOS) = 0.9\n   after B:    p(B) = 0.9 until three B's have been produced, then p(EOS) = 0.9\nbeam_search(step_fn, [BOS], 1, 8, EOS)            -&gt; ([3, 1, 0], log(0.55 * 0.9) = -0.703)   (greedy)\nbeam_search(step_fn, [BOS], 2, 8, EOS, alpha=0)   -&gt; ([3, 1, 0], -0.703)\nbeam_search(step_fn, [BOS], 2, 8, EOS, alpha=1)   -&gt; ([3, 2, 2, 2, 0], log(0.43 * 0.9^3) / 4 = -0.290)<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>Pure Python, no NumPy: a few hundred <code>step_fn<\/code> calls per search at most.<\/li><li>Never call <code>step_fn<\/code> on a prefix that already ends in <code>eos<\/code>.<\/li><li>With <code>beam_width = 1<\/code> the result must equal greedy decoding, token for token.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why beam search is not exact: it is a pruned breadth-first search, so a wider beam usually but not always finds a better sequence, and the model's probability is not the same thing as the quality you want anyway.<\/li><li>The cost: <code>beam_width * max_len<\/code> model calls, which with a KV cache means keeping <code>beam_width<\/code> caches and re-indexing them when beams are reordered; batching the beams into one forward pass is the standard implementation.<\/li><li>The failure mode: without length normalization every extra token multiplies by a probability below one, so the search prefers short outputs; <code>alpha<\/code> (or the GNMT <code>((5 + n) / 6) ** alpha<\/code> penalty) corrects that, and beams that are too wide produce bland, repetitive text, which is why chat models sample instead.<\/li><li>Follow-up: how to add an n-gram repetition block or a coverage term, and what diverse beam search changes.<\/li><\/ul>", "starter": "\"\"\"Beam search over an abstract model. Pure Python.\"\"\"\n\n\ndef beam_search(step_fn, start: list[int], beam_width: int, max_len: int, eos: int, alpha: float = 0.0):\n    \"\"\"Return (tokens, score) for the best hypothesis.\n\n    step_fn(prefix) -> list of next-token log-probabilities. `tokens` starts with `start`.\n    Each round expands every live hypothesis with every token, keeps the `beam_width` best by total log-prob,\n    and retires the ones ending in `eos`. Stops when nothing is live or after `max_len` rounds (leftovers count\n    as finished). The winner maximizes logp / n ** alpha, with n the number of generated tokens; return that score.\n    \"\"\"\n    raise NotImplementedError\n", "tests": "import math\nimport random\n\nfrom solution import beam_search\n\nEOS, A, B, BOS = 0, 1, 2, 3\nTINY = 1e-12\n\n\ndef bigram_model(V, seed):\n    \"\"\"A deterministic toy LM: the next-token distribution depends only on the last token.\"\"\"\n    rng = random.Random(seed)\n    table = []\n    for _ in range(V):\n        w = [rng.random() for _ in range(V)]\n        w[EOS] = 0.05 + 0.3 * rng.random()\n        z = sum(w)\n        table.append([math.log(x / z) for x in w])\n    return lambda prefix: table[prefix[-1]]\n\n\ndef garden_path(prefix):\n    \"\"\"A is the greedy choice but ends at once; B B B EOS is longer and better per token.\"\"\"\n    last = prefix[-1]\n    if last == BOS:\n        p = [0.02, 0.55, 0.43, TINY]\n    elif last == A:\n        p = [0.9, 0.05, 0.05, TINY]\n    elif prefix.count(B) < 3:\n        p = [0.05, 0.05, 0.9, TINY]\n    else:\n        p = [0.9, 0.05, 0.05, TINY]\n    return [math.log(x) for x in p]\n\n\ndef greedy(step_fn, start, max_len, eos):\n    seq, logp = list(start), 0.0\n    for _ in range(max_len):\n        lp = step_fn(seq)\n        t = max(range(len(lp)), key=lambda i: lp[i])\n        seq.append(t)\n        logp += lp[t]\n        if t == eos:\n            break\n    return seq, logp\n\n\ndef path_logp(step_fn, start, tokens):\n    total = 0.0\n    for i in range(len(start), len(tokens)):\n        total += step_fn(tokens[:i])[tokens[i]]\n    return total\n\n\ndef test_beam_width_one_is_greedy():\n    for seed in range(6):\n        step_fn = bigram_model(6, seed)\n        for start in ([1], [5], [2, 3]):\n            tokens, score = beam_search(step_fn, start, 1, 10, EOS)\n            g_tokens, g_logp = greedy(step_fn, start, 10, EOS)\n            assert tokens == g_tokens, (seed, start, tokens, g_tokens)\n            assert math.isclose(score, g_logp, abs_tol=1e-9)\n\n\ndef test_worked_example():\n    tokens, score = beam_search(garden_path, [BOS], 1, 8, EOS)\n    assert tokens == [BOS, A, EOS] and math.isclose(score, math.log(0.55 * 0.9), abs_tol=1e-9)\n    tokens, score = beam_search(garden_path, [BOS], 2, 8, EOS, alpha=0.0)\n    assert tokens == [BOS, A, EOS] and math.isclose(score, math.log(0.55 * 0.9), abs_tol=1e-9)\n    tokens, score = beam_search(garden_path, [BOS], 2, 8, EOS, alpha=1.0)\n    assert tokens == [BOS, B, B, B, EOS], tokens\n    assert math.isclose(score, math.log(0.43 * 0.9 ** 3) / 4, abs_tol=1e-9)\n\n\ndef test_length_penalty_changes_the_winner_monotonically():\n    lengths = []\n    for alpha in (0.0, 0.5, 1.0, 2.0):\n        tokens, _ = beam_search(garden_path, [BOS], 3, 8, EOS, alpha=alpha)\n        lengths.append(len(tokens))\n    assert lengths == sorted(lengths), lengths\n    assert lengths[0] < lengths[-1]\n\n\ndef test_finished_hypotheses_are_not_extended_and_eos_ends_the_sequence():\n    seen = []\n\n    def spy(prefix):\n        seen.append(list(prefix))\n        return garden_path(prefix)\n\n    tokens, _ = beam_search(spy, [BOS], 3, 8, EOS)\n    assert tokens[-1] == EOS and EOS not in tokens[:-1]\n    assert all(p[-1] != EOS for p in seen), \"step_fn was called on a finished hypothesis\"\n    assert all(p[0] == BOS for p in seen)\n\n\ndef test_max_len_bounds_the_output():\n    def never_ends(prefix):\n        return [-40.0, math.log(0.6), math.log(0.4), -40.0]\n\n    tokens, score = beam_search(never_ends, [BOS], 2, 5, EOS)\n    assert len(tokens) == 1 + 5 and EOS not in tokens\n    assert tokens == [BOS, A, A, A, A, A]\n    assert math.isclose(score, 5 * math.log(0.6), abs_tol=1e-9)\n    # a longer budget allows a longer output; the per-token score is the same with alpha = 1\n    tokens7, score7 = beam_search(never_ends, [BOS], 2, 7, EOS, alpha=1.0)\n    assert len(tokens7) == 8 and math.isclose(score7, math.log(0.6), abs_tol=1e-9)\n\n\ndef test_score_matches_the_path_under_the_model():\n    for seed in range(4):\n        step_fn = bigram_model(7, seed)\n        for width, alpha in ((2, 0.0), (3, 0.7), (5, 1.0)):\n            tokens, score = beam_search(step_fn, [4], width, 9, EOS, alpha=alpha)\n            n = len(tokens) - 1\n            assert tokens[0] == 4 and 1 <= n <= 9\n            assert math.isclose(score, path_logp(step_fn, [4], tokens) / n ** alpha, abs_tol=1e-9), (seed, width, alpha)\n\n\ndef test_wider_beams_never_score_worse_here_and_sometimes_beat_greedy():\n    improved = 0\n    for seed in range(8):\n        step_fn = bigram_model(6, seed)\n        scores = [beam_search(step_fn, [3], w, 10, EOS)[1] for w in (1, 2, 4, 8)]\n        for narrow, wide in zip(scores, scores[1:]):\n            assert wide >= narrow - 1e-9, (seed, scores)\n        improved += scores[-1] > scores[0] + 1e-9\n    assert improved >= 1, \"a beam of 8 should beat greedy on at least one of these models\"\n", "solution": "def normalized(logp: float, n: int, alpha: float) -> float:\n    return logp / max(n, 1) ** alpha\n\n\ndef beam_search(step_fn, start: list[int], beam_width: int, max_len: int, eos: int, alpha: float = 0.0):\n    start = list(start)\n    live = [(start, 0.0)]\n    finished = []\n    for _ in range(max_len):\n        candidates = []\n        for prefix, logp in live:\n            for token, lp in enumerate(step_fn(prefix)):\n                candidates.append((logp + lp, prefix + [token]))\n        candidates.sort(key=lambda c: (-c[0], c[1]))\n        live = []\n        for logp, seq in candidates[:beam_width]:\n            (finished if seq[-1] == eos else live).append((seq, logp))\n        if not live:\n            break\n    finished.extend(live)\n    seq, logp = min(finished, key=lambda f: (-normalized(f[1], len(f[0]) - len(start), alpha), f[0]))\n    return seq, normalized(logp, len(seq) - len(start), alpha)\n"}, {"id": "tf-rope", "title": "Rotary position embeddings", "track": "transformer", "module": "tf-modern", "difficulty": "medium", "minutes": 40, "runtime": "numpy", "kind": "code", "tags": ["rope", "positional encoding", "rotation"], "hints": ["Frequencies: inv_freq = base ** (-np.arange(0, d, 2) / d), shape (d/2,). The angle table is positions[:, None] * inv_freq[None, :], shape (T, d/2).", "Take the even and odd columns x[..., 0::2] and x[..., 1::2] as the two coordinates of each pair and rotate: (x1 * cos - x2 * sin, x1 * sin + x2 * cos).", "Interleave the two halves back with np.stack((r1, r2), axis=-1).reshape(x.shape)."], "rubric": [], "timeout": 30, "readme": "<h2>Rotary position embeddings<\/h2>\n<p>Llama, Mistral, Qwen and most models since 2022 do not add a position vector to the input. Instead they rotate each query and key inside the attention layer by an angle proportional to its position, so the dot product between a query at position <code>m<\/code> and a key at position <code>n<\/code> depends on <code>m - n<\/code> only. That is RoPE: relative position encoding obtained with an absolute operation, no extra parameters, and it composes with a KV cache because each key is rotated once and never touched again.<\/p>\n<pre><code class=\"lang-text\">rope(x, positions, base=10000.0) -&gt; np.ndarray, same shape as x<\/code><\/pre>\n<ul><li><code>x<\/code> has shape <code>(..., T, d)<\/code> with <code>d<\/code> even; <code>positions<\/code> is an integer array of shape <code>(T,)<\/code>.<\/li><li>Dimension pairs <code>(2i, 2i+1)<\/code> for <code>i = 0 .. d/2 - 1<\/code> are rotated by the angle <code>positions[t] * theta_i<\/code> with <code>theta_i = base^(-2i/d)<\/code>: <code>x'[2i] = x[2i] cos - x[2i+1] sin<\/code> and <code>x'[2i+1] = x[2i] sin + x[2i+1] cos<\/code>.<\/li><li>Leading dims (batch, heads) broadcast; <code>positions<\/code> applies along the <code>T<\/code> axis.<\/li><\/ul>\n<p>The relative-position property: for rotated <code>q_m = rope(q, m)<\/code> and <code>k_n = rope(k, n)<\/code>, <code>q_m . k_n<\/code> depends only on <code>m - n<\/code> (and on <code>q<\/code>, <code>k<\/code>), and rotations preserve norms.<\/p>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">x = [[1, 0, 1, 0]], positions = [2], d = 4      (pairs (0, 1) and (2, 3); theta = [1, 0.01])\nrope(x, [2]) -&gt; [[cos 2, sin 2, cos 0.02, sin 0.02]] = [[-0.4161, 0.9093, 0.9998, 0.0200]]\nrope(x, [0]) -&gt; x<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>No loops over positions or pairs; one <code>cos<\/code>/<code>sin<\/code> table of shape <code>(T, d/2)<\/code> and broadcasting.<\/li><li><code>rope<\/code> must not modify <code>x<\/code> in place.<\/li><li>Interleaved pairs <code>(2i, 2i+1)<\/code> as above (the original formulation), not the \"rotate-half\" layout Hugging Face uses; the tests check the exact values.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why a rotation: <code>R(m)^T R(n) = R(n - m)<\/code>, so the score <code>(R(m) q) . (R(n) k) = q . R(n - m) k<\/code> is a function of the offset, with no learned parameters and no change to <code>V<\/code>.<\/li><li>Where it is applied and the cost: to <code>q<\/code> and <code>k<\/code> after the projections and before the scores, <code>O(T d)<\/code> per layer, negligible next to attention; the <code>cos<\/code>/<code>sin<\/code> tables are precomputed once per sequence length.<\/li><li>The failure mode: positions past the training length put the low-frequency pairs at angles never seen, which is why context extension methods (position interpolation, NTK-aware scaling, YaRN) rescale <code>base<\/code> or the positions rather than retrain.<\/li><li>Follow-up: the role of <code>base<\/code> (larger means slower rotation of the low-frequency pairs and longer usable context) and how the \"rotate-half\" layout is just a permutation of the same pairs.<\/li><\/ul>", "starter": "\"\"\"Rotary position embeddings in NumPy.\"\"\"\nimport numpy as np\n\n\ndef rope(x: np.ndarray, positions: np.ndarray, base: float = 10000.0) -> np.ndarray:\n    \"\"\"Rotate each pair (x[..., 2i], x[..., 2i+1]) of x (..., T, d) by positions[t] * base ** (-2i / d).\n\n    x'[2i] = x[2i] cos - x[2i+1] sin,  x'[2i+1] = x[2i] sin + x[2i+1] cos.  Returns a new array, same shape as x.\n    \"\"\"\n    raise NotImplementedError\n", "tests": "import numpy as np\n\nfrom solution import rope\n\n\ndef ref_rope(x, positions, base=10000.0):\n    \"\"\"Independent reference with explicit loops over positions and pairs.\"\"\"\n    out = np.array(x, dtype=float, copy=True)\n    d = x.shape[-1]\n    for t, pos in enumerate(positions):\n        for i in range(d // 2):\n            theta = pos * base ** (-2 * i / d)\n            a, b = x[..., t, 2 * i], x[..., t, 2 * i + 1]\n            out[..., t, 2 * i] = a * np.cos(theta) - b * np.sin(theta)\n            out[..., t, 2 * i + 1] = a * np.sin(theta) + b * np.cos(theta)\n    return out\n\n\ndef test_worked_example():\n    x = np.array([[1.0, 0.0, 1.0, 0.0]])\n    y = rope(x, np.array([2]))\n    assert np.allclose(y, [[np.cos(2), np.sin(2), np.cos(0.02), np.sin(0.02)]], atol=1e-12)\n    assert np.allclose(rope(x, np.array([0])), x)\n    assert np.allclose(x, [[1.0, 0.0, 1.0, 0.0]]), \"rope must not modify its input\"\n\n\ndef test_matches_reference_and_shapes():\n    rng = np.random.default_rng(0)\n    x = rng.normal(size=(2, 3, 7, 8))  # (B, H, T, d)\n    positions = np.arange(7)\n    y = rope(x, positions)\n    assert y.shape == x.shape\n    assert np.allclose(y, ref_rope(x, positions), atol=1e-12)\n    positions2 = np.array([5, 0, 11, 3, 3, 100, 2])  # arbitrary positions, any order\n    assert np.allclose(rope(x, positions2), ref_rope(x, positions2), atol=1e-12)\n    assert np.allclose(rope(x, positions, base=500.0), ref_rope(x, positions, base=500.0), atol=1e-12)\n\n\ndef test_norms_are_preserved():\n    rng = np.random.default_rng(1)\n    x = rng.normal(size=(4, 10, 16))\n    y = rope(x, np.arange(10) * 7)\n    assert np.allclose(np.linalg.norm(y, axis=-1), np.linalg.norm(x, axis=-1), atol=1e-12)\n    assert not np.allclose(y[:, 1:], x[:, 1:]), \"positions above 0 must change the vectors\"\n\n\ndef test_dot_products_depend_only_on_the_relative_position():\n    rng = np.random.default_rng(2)\n    q, k = rng.normal(size=(1, 8)), rng.normal(size=(1, 8))\n    for m, n in [(0, 0), (3, 1), (10, 4), (7, 7), (2, 9)]:\n        base_score = rope(q, np.array([m]))[0] @ rope(k, np.array([n]))[0]\n        for shift in (1, 5, 40, 1000):\n            shifted = rope(q, np.array([m + shift]))[0] @ rope(k, np.array([n + shift]))[0]\n            assert np.isclose(shifted, base_score, atol=1e-9), (m, n, shift)\n    # and it does depend on the offset\n    s1 = rope(q, np.array([5]))[0] @ rope(k, np.array([4]))[0]\n    s2 = rope(q, np.array([5]))[0] @ rope(k, np.array([2]))[0]\n    assert not np.isclose(s1, s2)\n\n\ndef test_attention_scores_are_shift_invariant_for_a_whole_sequence():\n    rng = np.random.default_rng(3)\n    T, d = 6, 8\n    q, k = rng.normal(size=(T, d)), rng.normal(size=(T, d))\n    scores = rope(q, np.arange(T)) @ rope(k, np.arange(T)).T\n    scores_shifted = rope(q, np.arange(T) + 17) @ rope(k, np.arange(T) + 17).T\n    assert np.allclose(scores, scores_shifted, atol=1e-9)\n    assert not np.allclose(scores, q @ k.T), \"rotation changes the scores (except on the diagonal)\"\n    assert np.allclose(np.diag(scores), np.diag(q @ k.T), atol=1e-9), \"zero offset leaves the dot product unchanged\"\n\n\ndef test_first_pair_rotates_one_radian_per_position_and_last_pair_slowly():\n    d = 8\n    e = np.zeros((1, d))\n    e[0, 0] = 1.0\n    e[0, d - 2] = 1.0\n    for pos in (1, 2, 5):\n        y = rope(e, np.array([pos]))[0]\n        assert np.isclose(y[0], np.cos(pos)) and np.isclose(y[1], np.sin(pos))\n        slow = pos * 10000 ** (-(d - 2) / d)\n        assert np.isclose(y[d - 2], np.cos(slow)) and np.isclose(y[d - 1], np.sin(slow))\n", "solution": "import numpy as np\n\n\ndef rope(x: np.ndarray, positions: np.ndarray, base: float = 10000.0) -> np.ndarray:\n    d = x.shape[-1]\n    inv_freq = base ** (-np.arange(0, d, 2) / d)                 # (d/2,)\n    angles = np.asarray(positions)[:, None] * inv_freq[None, :]  # (T, d/2)\n    cos, sin = np.cos(angles), np.sin(angles)\n    x1, x2 = x[..., 0::2], x[..., 1::2]\n    return np.stack((x1 * cos - x2 * sin, x1 * sin + x2 * cos), axis=-1).reshape(x.shape)\n"}, {"id": "tf-lora", "title": "LoRA on a linear layer", "track": "transformer", "module": "tf-modern", "difficulty": "medium", "minutes": 35, "runtime": "torch", "kind": "code", "tags": ["lora", "fine-tuning", "pytorch", "low-rank"], "hints": ["Freeze the base with p.requires_grad_(False). Create A = nn.Parameter(torch.randn(r, in_features) / sqrt(in_features)) and B = nn.Parameter(torch.zeros(out_features, r)); B = 0 makes the update start at exactly zero.", "forward: base(x) + (x @ A.T @ B.T) * (alpha / r). Two thin matmuls; never form the (out, in) product during training.", "merge: under torch.no_grad(), base.weight += (B @ A) * scaling and set a flag so forward skips the LoRA path; unmerge subtracts the same thing and clears the flag."], "rubric": [], "timeout": 60, "readme": "<h2>LoRA on a linear layer<\/h2>\n<p>Fine-tuning a 7B model by updating every weight needs optimizer state for 7B parameters. LoRA (low-rank adaptation) freezes the pretrained weight <code>W<\/code> and learns a rank-<code>r<\/code> update <code>W + (alpha / r) B A<\/code> with <code>A<\/code> of shape <code>(r, in)<\/code> and <code>B<\/code> of shape <code>(out, r)<\/code>, so the trainable count drops by orders of magnitude, a checkpoint is a few megabytes, and at inference the update can be folded into <code>W<\/code> so there is no extra latency. Implement it as a wrapper around <code>nn.Linear<\/code>.<\/p>\n<pre><code class=\"lang-text\">class LoRALinear(nn.Module):\n    def __init__(self, base: nn.Linear, r: int, alpha: float = 1.0)\n    def forward(self, x) -&gt; base(x) + (x @ A.T @ B.T) * (alpha / r)      when not merged\n    def merge()      # fold the update into base.weight; forward then uses base only\n    def unmerge()    # undo merge exactly<\/code><\/pre>\n<ul><li><code>self.A<\/code> is an <code>nn.Parameter<\/code> of shape <code>(r, in_features)<\/code> with a small random init; <code>self.B<\/code> is an <code>nn.Parameter<\/code> of shape <code>(out_features, r)<\/code> initialized to zero, so at creation the module computes exactly what <code>base<\/code> computes.<\/li><li><code>base<\/code> is kept as <code>self.base<\/code> and frozen: its weight and bias do not require grad. <code>A<\/code> and <code>B<\/code> are the only trainable parameters.<\/li><li><code>self.scaling = alpha / r<\/code>. <code>merge()<\/code> and <code>unmerge()<\/code> must be idempotent (calling <code>merge()<\/code> twice adds the update once).<\/li><\/ul>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">base = nn.Linear(32, 16);  lora = LoRALinear(base, r=4, alpha=8)\nlora(x) == base(x)                                        # B = 0 at init\n[n for n, p in lora.named_parameters() if p.requires_grad] -&gt; [\"A\", \"B\"]     (4*32 + 16*4 = 192 trainable of 720)\nlora.merge();  lora.base.weight == W0 + 2.0 * B @ A;  lora(x) unchanged\nlora.unmerge(); lora.base.weight == W0<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li><code>A<\/code> and <code>B<\/code> must be found by <code>named_parameters()<\/code> under those names, and nothing else may require grad.<\/li><li>Training must stay in the factored form: no <code>(out, in)<\/code> matrix is built in <code>forward<\/code>.<\/li><li>The tests fit a rank-2 target update with Adam in a few hundred steps; it should take a second or two on CPU.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why <code>B = 0<\/code> and not <code>A = 0<\/code>: either gives a zero update at init, but with <code>B = 0<\/code> the gradient to <code>A<\/code> is zero on the first step while <code>B<\/code> gets a signal, so training starts cleanly; with both zero nothing ever moves.<\/li><li>The cost: <code>r (in + out)<\/code> parameters and optimizer states instead of <code>in * out<\/code>; the forward adds two thin matmuls (<code>x A^T<\/code> then <code>. B^T<\/code>) that cost <code>O(r (in + out))<\/code> per token, and merging removes even that.<\/li><li>The failure mode: <code>alpha<\/code> and <code>r<\/code> are coupled, so changing <code>r<\/code> without changing <code>alpha<\/code> changes the effective learning rate of the update (rank-stabilized LoRA uses <code>alpha / sqrt(r)<\/code>); and merging into a quantized base weight is lossy.<\/li><li>Follow-up: which matrices to adapt (query and value were the original choice; all linear layers is now common), and how QLoRA keeps the base in 4-bit while the adapters train in bf16.<\/li><\/ul>", "starter": "\"\"\"LoRA wrapper around a frozen nn.Linear.\"\"\"\nimport math\n\nimport torch\nimport torch.nn as nn\n\n\nclass LoRALinear(nn.Module):\n    \"\"\"y = base(x) + (x @ A.T @ B.T) * (alpha / r), with base frozen, A (r, in) random, B (out, r) zero.\"\"\"\n\n    def __init__(self, base: nn.Linear, r: int, alpha: float = 1.0):\n        super().__init__()\n        raise NotImplementedError\n\n    def forward(self, x: torch.Tensor) -> torch.Tensor:\n        raise NotImplementedError\n\n    def merge(self) -> None:\n        \"\"\"Fold scaling * B @ A into base.weight so forward uses the base layer alone. Idempotent.\"\"\"\n        raise NotImplementedError\n\n    def unmerge(self) -> None:\n        \"\"\"Undo merge() exactly. Idempotent.\"\"\"\n        raise NotImplementedError\n", "tests": "import torch\nimport torch.nn as nn\n\nfrom solution import LoRALinear\n\n\ndef make(seed=0, in_f=32, out_f=16, r=4, alpha=8.0):\n    torch.manual_seed(seed)\n    base = nn.Linear(in_f, out_f)\n    return LoRALinear(base, r=r, alpha=alpha), base\n\n\ndef test_output_equals_base_at_init():\n    lora, base = make()\n    x = torch.randn(5, 32)\n    assert lora.A.shape == (4, 32) and lora.B.shape == (16, 4)\n    assert torch.all(lora.B == 0), \"B must start at zero so the update starts at zero\"\n    assert torch.allclose(lora(x), base(x), atol=1e-6)\n    assert lora(torch.randn(2, 3, 32)).shape == (2, 3, 16), \"leading dims must pass through like nn.Linear\"\n\n\ndef test_only_A_and_B_are_trainable():\n    lora, base = make()\n    names = sorted(n for n, p in lora.named_parameters() if p.requires_grad)\n    assert names == [\"A\", \"B\"], names\n    assert not base.weight.requires_grad and not base.bias.requires_grad\n    n_train = sum(p.numel() for p in lora.parameters() if p.requires_grad)\n    assert n_train == 4 * (32 + 16), n_train\n    assert sum(p.numel() for p in lora.parameters()) == 4 * (32 + 16) + 32 * 16 + 16\n\n\ndef test_factored_forward_matches_the_low_rank_formula():\n    lora, base = make(seed=1)\n    with torch.no_grad():\n        lora.B.copy_(torch.randn(16, 4))\n        lora.A.copy_(torch.randn(4, 32))\n    x = torch.randn(7, 32)\n    expected = base(x) + (x @ (lora.B @ lora.A).t()) * (8.0 / 4)\n    assert torch.allclose(lora(x), expected, atol=1e-5)\n\n\ndef test_merge_and_unmerge():\n    lora, base = make(seed=2)\n    with torch.no_grad():\n        lora.B.copy_(torch.randn(16, 4) * 0.3)\n    W0 = base.weight.detach().clone()\n    x = torch.randn(6, 32)\n    before = lora(x).detach().clone()\n    lora.merge()\n    assert torch.allclose(base.weight, W0 + 2.0 * (lora.B @ lora.A), atol=1e-6), \"merged weight must be W0 + (alpha/r) B A\"\n    assert torch.allclose(lora(x), before, atol=1e-5), \"merging must not change the output\"\n    assert torch.allclose(base(x), before, atol=1e-5), \"after merging, the base layer alone gives the adapted output\"\n    lora.merge()\n    assert torch.allclose(base.weight, W0 + 2.0 * (lora.B @ lora.A), atol=1e-6), \"merge must be idempotent\"\n    lora.unmerge()\n    assert torch.allclose(base.weight, W0, atol=1e-6)\n    assert torch.allclose(lora(x), before, atol=1e-5)\n    lora.unmerge()\n    assert torch.allclose(base.weight, W0, atol=1e-6), \"unmerge must be idempotent\"\n\n\ndef test_gradients_flow_to_A_and_B_but_not_the_base():\n    lora, base = make(seed=3)\n    x, target = torch.randn(8, 32), torch.randn(8, 16)\n    loss = ((lora(x) - target) ** 2).mean()\n    loss.backward()\n    assert base.weight.grad is None and base.bias.grad is None\n    assert lora.B.grad is not None and lora.B.grad.abs().sum() > 0, \"B gets a gradient on the first step\"\n    assert lora.A.grad is not None and torch.all(lora.A.grad == 0), \"with B = 0 the gradient to A is exactly zero at first\"\n    with torch.no_grad():\n        lora.B -= 0.1 * lora.B.grad\n    lora.zero_grad()\n    ((lora(x) - target) ** 2).mean().backward()\n    assert lora.A.grad.abs().sum() > 0, \"once B has moved, A gets a gradient too\"\n\n\ndef test_lora_learns_a_low_rank_update():\n    torch.manual_seed(4)\n    base = nn.Linear(32, 16)\n    lora = LoRALinear(base, r=2, alpha=4.0)\n    U, V = torch.randn(16, 2), torch.randn(2, 32) / 4\n    target_layer = nn.Linear(32, 16)\n    with torch.no_grad():\n        target_layer.weight.copy_(base.weight + U @ V)\n        target_layer.bias.copy_(base.bias)\n    x = torch.randn(256, 32)\n    y = target_layer(x).detach()\n    W0 = base.weight.detach().clone()\n    opt = torch.optim.Adam([p for p in lora.parameters() if p.requires_grad], lr=2e-2)\n    first = ((lora(x) - y) ** 2).mean().item()\n    for _ in range(300):\n        opt.zero_grad()\n        loss = ((lora(x) - y) ** 2).mean()\n        loss.backward()\n        opt.step()\n    last = ((lora(x) - y) ** 2).mean().item()\n    assert last < 0.02 * first, f\"loss only went from {first:.4f} to {last:.4f}\"\n    assert torch.equal(base.weight, W0), \"the base weight must be untouched by training\"\n    assert torch.allclose(base.weight + 2.0 * (lora.B @ lora.A), target_layer.weight, atol=0.15), \"the learned update should approximate U @ V\"\n", "solution": "import math\n\nimport torch\nimport torch.nn as nn\n\n\nclass LoRALinear(nn.Module):\n    def __init__(self, base: nn.Linear, r: int, alpha: float = 1.0):\n        super().__init__()\n        self.base = base\n        for p in self.base.parameters():\n            p.requires_grad_(False)\n        self.r, self.alpha, self.scaling = r, alpha, alpha / r\n        self.A = nn.Parameter(torch.randn(r, base.in_features) / math.sqrt(base.in_features))\n        self.B = nn.Parameter(torch.zeros(base.out_features, r))\n        self.merged = False\n\n    def delta_weight(self) -> torch.Tensor:\n        return (self.B @ self.A) * self.scaling\n\n    def forward(self, x: torch.Tensor) -> torch.Tensor:\n        y = self.base(x)\n        if self.merged:\n            return y\n        return y + (x @ self.A.t() @ self.B.t()) * self.scaling\n\n    @torch.no_grad()\n    def merge(self) -> None:\n        if not self.merged:\n            self.base.weight += self.delta_weight()\n            self.merged = True\n\n    @torch.no_grad()\n    def unmerge(self) -> None:\n        if self.merged:\n            self.base.weight -= self.delta_weight()\n            self.merged = False\n"}, {"id": "tf-blocked-attention-online-softmax", "title": "Blocked attention with online softmax (the FlashAttention idea)", "track": "transformer", "module": "tf-modern", "difficulty": "hard", "minutes": 50, "runtime": "numpy", "kind": "code", "tags": ["flashattention", "online softmax", "memory", "attention"], "hints": ["Keep three running quantities per query row: the max m (start at -inf), the softmax denominator l (start at 0) and the unnormalised output acc (zeros, shape (T_q, d_v)).", "For each key block: s = q @ k_blk.T / sqrt(d); m_new = maximum(m, s.max(1)); corr = exp(m - m_new); p = exp(s - m_new[:, None]); l = l * corr + p.sum(1); acc = acc * corr[:, None] + p @ v_blk; m = m_new.", "After the last block: out = acc / l[:, None] and lse = m + log(l). Slicing k[start:start + block_size] handles a last block that is shorter than block_size."], "rubric": [], "timeout": 30, "readme": "<h2>Blocked attention with online softmax (the FlashAttention idea)<\/h2>\n<p>Standard attention materializes the <code>T x T<\/code> score matrix, which at <code>T = 32k<\/code> is a gigabyte per head in fp32 and, worse, has to go out to GPU memory and back between the softmax and the <code>@ v<\/code>. FlashAttention never builds it: it streams the keys and values in blocks and keeps, per query, a running max and a running sum so that the softmax can be finished incrementally. The output is exactly the same; the memory is <code>O(T d)<\/code> instead of <code>O(T^2)<\/code>, and the whole thing lives in on-chip SRAM. Implement the algorithm in NumPy for one head.<\/p>\n<pre><code class=\"lang-text\">blocked_attention(q, k, v, block_size) -&gt; (out, lse)<\/code><\/pre>\n<ul><li><code>q<\/code> is <code>(T_q, d)<\/code>, <code>k<\/code> is <code>(T_k, d)<\/code>, <code>v<\/code> is <code>(T_k, d_v)<\/code>, no mask. Process the keys in blocks of <code>block_size<\/code> rows (the last block may be shorter) and never form an array with <code>T_q * T_k<\/code> elements.<\/li><li>For each block, compute the block of scores <code>s = q @ k_blk^T / sqrt(d)<\/code> of shape <code>(T_q, block_size)<\/code>, update the running maximum <code>m<\/code>, rescale the running sum <code>l<\/code> and the running output <code>acc<\/code> by <code>exp(m_old - m_new)<\/code>, and add the block's contribution <code>exp(s - m_new)<\/code> to both.<\/li><li>Return <code>out = acc / l<\/code> of shape <code>(T_q, d_v)<\/code> and <code>lse = m + log(l)<\/code> of shape <code>(T_q,)<\/code>, the row-wise log-sum-exp of the scores, which is what FlashAttention stores for the backward pass instead of the weights.<\/li><\/ul>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">q = k = v = I_3 (the 3x3 identity), block_size = 2\n   block 1 (keys 0, 1): scores / sqrt 3, running m = [0.577, 0.577, 0], l = [1.56, 1.56, 2]\n   block 2 (key 2):     m stays for rows 0, 1 and becomes 0.577 for row 2; everything is rescaled and added\nout == attention(q, k, v)[0] to 1e-12, with e^(1/sqrt 3) / (e^(1/sqrt 3) + 2) = 0.4711 on the diagonal\nlse == log(e^(1/sqrt 3) + 2) = [1.3300, 1.3300, 1.3300]<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>Results must match full attention to <code>1e-8<\/code> for any <code>block_size<\/code>, including <code>1<\/code>, sizes that do not divide <code>T_k<\/code>, and sizes larger than <code>T_k<\/code>.<\/li><li>Use <code>np.exp<\/code> for the exponentials: the tests spy on it and fail if an array with <code>T_q * T_k<\/code> elements is ever exponentiated. They also measure peak memory at <code>T = 2048<\/code> with <code>block_size = 64<\/code> and expect it below a quarter of one <code>T x T<\/code> matrix.<\/li><li>Stable for scores in the thousands (the running max handles it).<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why the rescaling is exact: <code>exp(s - m_new) = exp(s - m_old) * exp(m_old - m_new)<\/code>, so a change of the reference max is a single multiplicative correction to the sum and the accumulated output; the result is identical to the two-pass softmax.<\/li><li>The cost: the same FLOPs as standard attention (slightly more, for the rescaling), but memory traffic drops from <code>O(T^2)<\/code> to <code>O(T d)<\/code>, and since attention is memory-bound that is a 2 to 4x wall-clock win; the backward recomputes the block of weights from <code>q<\/code>, <code>k<\/code> and <code>lse<\/code> instead of storing them.<\/li><li>The failure mode: initializing <code>m<\/code> to <code>0<\/code> instead of <code>-inf<\/code> (wrong when all scores are negative), or forgetting to rescale <code>acc<\/code> when the max changes (correct only if the max is found in the first block).<\/li><li>Follow-up: adding the causal mask (skip blocks entirely above the diagonal, which halves the work), blocking over queries too so each block fits in SRAM, and how the KV cache fits into the same loop at decode time.<\/li><\/ul>", "starter": "\"\"\"Blocked attention with an online softmax, in NumPy. A full-matrix reference is provided for your own checks.\"\"\"\nimport numpy as np\n\n\ndef full_attention(q: np.ndarray, k: np.ndarray, v: np.ndarray):\n    \"\"\"Provided reference (materializes the T_q x T_k matrix). Returns (out, lse).\"\"\"\n    s = q @ k.T / np.sqrt(q.shape[-1])\n    m = s.max(axis=1, keepdims=True)\n    p = np.exp(s - m)\n    l = p.sum(axis=1, keepdims=True)\n    return (p / l) @ v, (m + np.log(l))[:, 0]\n\n\ndef blocked_attention(q: np.ndarray, k: np.ndarray, v: np.ndarray, block_size: int):\n    \"\"\"Attention for one head without ever forming a (T_q, T_k) array.\n\n    q: (T_q, d), k: (T_k, d), v: (T_k, d_v). Keys and values are processed in blocks of `block_size` rows\n    with running max, running sum and running output per query. Returns (out (T_q, d_v), lse (T_q,)).\n    \"\"\"\n    raise NotImplementedError\n", "tests": "import tracemalloc\n\nimport numpy as np\n\nfrom solution import blocked_attention\n\n\ndef ref_attention(q, k, v):\n    s = q @ k.T / np.sqrt(q.shape[-1])\n    w = np.exp(s - s.max(1, keepdims=True))\n    w /= w.sum(1, keepdims=True)\n    return w @ v, np.log(np.exp(s).sum(1))\n\n\ndef test_identity_example():\n    I = np.eye(3)\n    out, lse = blocked_attention(I, I, I, 2)\n    assert out.shape == (3, 3) and lse.shape == (3,)\n    e = np.exp(1 / np.sqrt(3))\n    assert np.allclose(np.diag(out), e / (e + 2), atol=1e-12)\n    assert np.allclose(lse, np.log(e + 2), atol=1e-12)\n    assert np.allclose(out, ref_attention(I, I, I)[0], atol=1e-12)\n\n\ndef test_matches_full_attention_for_every_block_size():\n    rng = np.random.default_rng(0)\n    T_q, T_k, d, d_v = 11, 13, 8, 5\n    q, k, v = rng.normal(size=(T_q, d)), rng.normal(size=(T_k, d)), rng.normal(size=(T_k, d_v))\n    ref_out, ref_lse = ref_attention(q, k, v)\n    for b in (1, 2, 3, 5, 8, 13, 16, 100):\n        out, lse = blocked_attention(q, k, v, b)\n        assert out.shape == (T_q, d_v) and lse.shape == (T_q,), b\n        assert np.allclose(out, ref_out, atol=1e-8), f\"block_size={b}\"\n        assert np.allclose(lse, ref_lse, atol=1e-8), f\"block_size={b}\"\n\n\ndef test_result_does_not_depend_on_the_block_size():\n    rng = np.random.default_rng(1)\n    q, k, v = rng.normal(size=(7, 4)), rng.normal(size=(20, 4)), rng.normal(size=(20, 6))\n    a = blocked_attention(q, k, v, 4)\n    b = blocked_attention(q, k, v, 7)\n    assert np.allclose(a[0], b[0], atol=1e-12) and np.allclose(a[1], b[1], atol=1e-12)\n\n\ndef test_stable_for_huge_scores_and_all_negative_scores():\n    rng = np.random.default_rng(2)\n    q, k, v = rng.normal(size=(5, 4)) * 300, rng.normal(size=(9, 4)) * 300, rng.normal(size=(9, 3))\n    out, lse = blocked_attention(q, k, v, 4)\n    assert np.all(np.isfinite(out)) and np.all(np.isfinite(lse))\n    # with scores this large the softmax is one-hot: each output row is one value row\n    s = q @ k.T / 2\n    assert np.allclose(out, v[s.argmax(1)], atol=1e-8)\n    assert np.allclose(lse, s.max(1), atol=1e-8)\n    # all scores negative: a running max initialised to 0 would be wrong here\n    q2 = -np.abs(rng.normal(size=(4, 3))) * 5\n    k2 = np.abs(rng.normal(size=(6, 3))) * 5\n    v2 = rng.normal(size=(6, 2))\n    out2, lse2 = blocked_attention(q2, k2, v2, 4)\n    ref_out2, ref_lse2 = ref_attention(q2, k2, v2)\n    assert np.allclose(out2, ref_out2, atol=1e-8) and np.allclose(lse2, ref_lse2, atol=1e-8)\n\n\ndef test_never_exponentiates_the_full_score_matrix():\n    rng = np.random.default_rng(3)\n    T, d, b = 1024, 16, 64\n    q, k, v = rng.normal(size=(T, d)), rng.normal(size=(T, d)), rng.normal(size=(T, d))\n    sizes = []\n    real_exp = np.exp\n\n    def spy(x, *args, **kwargs):\n        sizes.append(np.size(x))\n        return real_exp(x, *args, **kwargs)\n\n    np.exp = spy\n    try:\n        out, lse = blocked_attention(q, k, v, b)\n    finally:\n        np.exp = real_exp\n    assert sizes, \"use np.exp for the exponentials\"\n    assert max(sizes) <= 2 * T * b, f\"an array of {max(sizes)} elements went through np.exp; the full matrix has {T * T}\"\n    ref_out, ref_lse = ref_attention(q, k, v)\n    assert np.allclose(out, ref_out, atol=1e-8) and np.allclose(lse, ref_lse, atol=1e-8)\n\n\ndef test_peak_memory_is_far_below_one_full_matrix():\n    rng = np.random.default_rng(4)\n    T, d, b = 2048, 16, 64  # one T x T float64 matrix is 33.5 MB; block-sized arrays are 1 MB each\n    q, k, v = rng.normal(size=(T, d)), rng.normal(size=(T, d)), rng.normal(size=(T, d))\n    tracemalloc.start()\n    ref_attention(q, k, v)\n    _, full_peak = tracemalloc.get_traced_memory()\n    tracemalloc.stop()\n    tracemalloc.start()\n    blocked_attention(q, k, v, b)\n    _, blocked_peak = tracemalloc.get_traced_memory()\n    tracemalloc.stop()\n    one_matrix = T * T * 8\n    if full_peak >= one_matrix:  # only judge when the tracer saw the reference allocate its T x T matrix\n        assert blocked_peak < one_matrix / 4, f\"peak {blocked_peak / 1e6:.1f} MB; a T x T float64 matrix is {one_matrix / 1e6:.1f} MB\"\n", "solution": "import numpy as np\n\n\ndef full_attention(q: np.ndarray, k: np.ndarray, v: np.ndarray):\n    s = q @ k.T / np.sqrt(q.shape[-1])\n    m = s.max(axis=1, keepdims=True)\n    p = np.exp(s - m)\n    l = p.sum(axis=1, keepdims=True)\n    return (p / l) @ v, (m + np.log(l))[:, 0]\n\n\ndef blocked_attention(q: np.ndarray, k: np.ndarray, v: np.ndarray, block_size: int):\n    T_q, d = q.shape\n    T_k = k.shape[0]\n    scale = 1.0 / np.sqrt(d)\n    m = np.full(T_q, -np.inf)           # running row max\n    l = np.zeros(T_q)                   # running softmax denominator\n    acc = np.zeros((T_q, v.shape[1]))   # running unnormalised output\n    for start in range(0, T_k, block_size):\n        k_blk, v_blk = k[start:start + block_size], v[start:start + block_size]\n        s = q @ k_blk.T * scale                      # (T_q, b)\n        m_new = np.maximum(m, s.max(axis=1))\n        corr = np.exp(m - m_new)                     # rescale what was accumulated under the old max\n        p = np.exp(s - m_new[:, None])\n        l = l * corr + p.sum(axis=1)\n        acc = acc * corr[:, None] + p @ v_blk\n        m = m_new\n    return acc / l[:, None], m + np.log(l)\n"}, {"id": "ds-llm-router", "title": "Design a cost-aware LLM routing system", "track": "design", "module": "ds-core", "difficulty": "medium", "minutes": 30, "runtime": "python", "kind": "written", "tags": ["system design", "LLM", "evaluation"], "hints": ["Start from the requirement: what accuracy must the cheapest acceptable path hit, and what is the latency and cost budget per request?", "A router needs a signal that predicts 'will the small model get this right?' before you pay for the big one. What features or models give you that signal, and how do you calibrate them?"], "rubric": ["States requirements and constraints up front: accuracy target, cost and latency budgets, traffic volume, and what a wrong answer costs.", "Proposes a concrete routing policy (cascade, learned router, or confidence threshold) and explains how the threshold is set from a validation set.", "Covers evaluation: offline replay on labeled data, the cost/accuracy frontier, and an online A/B with guardrail metrics.", "Discusses calibration and drift: temperature scaling or similar, monitoring label disagreement, and when to retrain the router.", "Names the failure modes (prompt injection, distribution shift, model updates changing behavior) and a mitigation for each."], "timeout": 60, "readme": "<h2>Design a cost-aware LLM routing system<\/h2>\n<p>You run a classification service that labels product listings against a policy, at roughly 200K cases a day. A frontier model gets 96% of cases right but costs 40 times more per call than a small model that gets 88% right. Design a system that keeps overall accuracy at or above 95% while cutting cost as much as possible.<\/p>\n<p>Spend 30 minutes. Write your answer as if you were talking through it with an interviewer, in this order:<\/p>\n<ol><li><strong>Requirements and constraints.<\/strong> Accuracy, cost, latency, volume, and what a mistake costs. Ask what you'd want to clarify.<\/li><li><strong>Routing policy.<\/strong> How a request is assigned to a model. Cascade with a confidence gate, a learned router trained on where the models disagree, or a hybrid. Say how you'd pick the thresholds.<\/li><li><strong>Quality estimation.<\/strong> What signals tell you the small model is likely right (token log-probs, a trained quality estimator, agreement between two cheap samples). How you calibrate those signals so a threshold means what it says.<\/li><li><strong>Evaluation.<\/strong> Offline replay on a labeled set, the cost-versus-accuracy frontier, and an online experiment with guardrails.<\/li><li><strong>Operations.<\/strong> Drift, model version changes, monitoring, and how the human-label loop feeds back.<\/li><\/ol>\n<p>Then score yourself with the rubric, one point per item, or paste your answer into a Claude session and ask for a rubric-based score with specific feedback.<\/p>\n<h3>What the interviewer listens for<\/h3>\n<p>Whether you reason from the requirement to the design rather than reciting components. Whether you know how to set a threshold from data and quantify what you'd lose. Whether you have an answer for \"the frontier model got updated last night; what happens to your router?\"<\/p>", "starter": "", "tests": "", "solution": ""}, {"id": "ds-materials-discovery-loop", "title": "Design an active-learning loop for battery cathode discovery", "track": "design", "module": "ds-core", "difficulty": "hard", "minutes": 30, "runtime": "python", "kind": "written", "tags": ["active learning", "materials", "MLIP", "DFT"], "hints": ["The expensive step is DFT, so judge every design decision by what it does to the number of on-hull hits per DFT relaxation. Write that ratio down for the random baseline first, then say what each component changes it to.", "The surrogate's top-ranked candidates are exactly where its errors are largest (winner's curse). What in the acquisition rule and the batch composition stops you from spending a week's budget on one over-optimistic corner of the space?"], "rubric": ["States the target in numbers (hull-distance threshold, voltage window, capacity, volume change, DFT relaxations per round) and defines the random-screening discovery rate as the baseline to beat.", "Describes the surrogate stack concretely: MLIP relaxation, formation-energy and voltage prediction, an uncertainty estimate (ensemble or committee), and deduplication by structure matching before anything is ranked.", "Gives an acquisition rule that combines predicted stability, uncertainty and diversity, with a batch size and a reserved exploration slice, and explains how the convex hull is rebuilt after each round.", "Covers the feedback loop: DFT settings consistent with the reference hull, fine-tuning the MLIP on each round's results, a held-out check on the newest round for distribution shift, and a stopping rule.", "Names failure modes (the search exploiting holes in the potential, duplicate structures, hull reference mismatch, batch collapse onto one chemistry) with a mitigation for each."], "timeout": 60, "readme": "<h2>Design an active-learning loop for battery cathode discovery<\/h2>\n<p>You have 40 weeks and a fixed DFT allocation of 20,000 structure relaxations (about 500 per week, roughly 5 million core-hours in total) to find new Li-ion cathode materials. The targets: energy above the convex hull at or below 30 meV/atom, average voltage between 3.5 and 4.5 V versus Li/Li+, theoretical capacity above 200 mAh/g, and volume change on delithiation under 8%. The candidate pool is about 2 million structures from prototype substitution plus an evolutionary generator. You have a universal ML interatomic potential (MACE-MP or UMA class) fine-tuned on 50,000 in-domain calculations that relaxes a structure 10,000 times faster than DFT, but its errors grow with novelty. Random screening of this pool lands about 1 in 200 DFT relaxations on or near the hull. Design the loop that spends the DFT budget best.<\/p>\n<p>Spend 30 minutes. Write your answer as if you were talking through it with an interviewer, in this order:<\/p>\n<ol><li><strong>Requirements and objective.<\/strong> Define a stable new cathode in numbers: hull distance, the voltage window from lithiated and delithiated energies, capacity from composition, volume change. State the budget per round, the baseline hit rate, and what success looks like at week 40. Ask what you'd want to clarify.<\/li><li><strong>Candidate generation and surrogate.<\/strong> How candidates are produced, how the MLIP relaxes and ranks them, how you estimate voltage and uncertainty, how you deduplicate, and what one round costs in MLIP compute.<\/li><li><strong>Acquisition and batching.<\/strong> How you choose the 500 structures per week: exploitation on predicted hull distance, exploration on uncertainty, diversity across chemistries and prototypes, and a reserved random or uncertainty-only slice. Say how the hull is rebuilt when new phases arrive.<\/li><li><strong>Validation and retraining.<\/strong> DFT settings consistent with the reference database, how each round's results flow back into the MLIP (fine-tune or retrain, and when), how you detect that the surrogate has drifted off the current search region, and when you stop.<\/li><li><strong>Evaluation and failure modes.<\/strong> Discovery rate versus the baseline at equal budget, uncertainty calibration, what you report at the end, and the handoff to synthesis. Name what goes wrong when an evolutionary search meets an imperfect potential.<\/li><\/ol>\n<p>Then score yourself with the rubric, one point per item, or paste your answer into a Claude session and ask for a rubric-based score with specific feedback.<\/p>\n<h3>What the interviewer listens for<\/h3>\n<p>Whether you treat DFT relaxations as the scarce resource and judge every choice by hits per relaxation. Whether you know that the surrogate's top-ranked candidates are exactly where its errors are largest, and build the acquisition and the batch to survive that. Whether you can say what the hull is, why it moves, and how you would know the loop has stopped paying off.<\/p>", "starter": "", "tests": "", "solution": ""}, {"id": "ds-llm-eval-pipeline", "title": "Design the evaluation pipeline for an LLM classifier replacing human reviewers", "track": "design", "module": "ds-core", "difficulty": "medium", "minutes": 30, "runtime": "python", "kind": "written", "tags": ["evaluation", "LLM", "labeling", "A/B testing"], "hints": ["Human agreement is the ceiling. Compute model-human kappa and human-human kappa on the same items, per category; the gap between them is what the release decision rests on.", "The rarest category sets the sample size. Work out how many labeled positives you need for the recall interval you want, then design the sampling to get them without labeling 100,000 random items."], "rubric": ["Translates the business bar into measurable quantities: per-category precision and recall targets with confidence intervals, a non-inferiority margin against the median reviewer, and a cost model per decision.", "Designs a gold set with stratified and confidence-enriched sampling, multiple annotators plus adjudication, a sample-size argument for the rarest category, and a rule that keeps it out of prompts and training data.", "Reports agreement correctly: Cohen's or Fleiss' kappa for model-human and human-human on the same items, per category, with error attribution from adjudication rather than treating every disagreement as a model error.", "Specifies a release gate: a shadow deployment, a statistical test for non-inferiority, per-category floors, threshold and calibration frozen before the test, and a canary rollout with rollback criteria.", "Covers post-launch audits: a sampling scheme (random plus confidence-weighted plus appeals), drift and version-change triggers for re-gating, and how audited labels feed back into the model."], "timeout": 60, "readme": "<h2>Design the evaluation pipeline for an LLM classifier replacing human reviewers<\/h2>\n<p>A trust-and-safety team reviews about 50,000 content items a day against a 12-category policy with 40 contract reviewers at roughly $0.60 per decision. On a double-labeled sample, human-human agreement is Cohen's kappa 0.71 overall and 0.55 on the three hardest categories; violation prevalence ranges from 6% down to 0.4% per category. You are replacing most of that review with an LLM classifier that auto-decides and escalates the rest to humans. Leadership will approve launch only if decision quality is at least that of a median reviewer in every category and cost per decision falls by 60%. Design the evaluation pipeline: the gold set, how you measure and use label disagreement, how you sample for audits, the release gate, and what runs after launch.<\/p>\n<p>Spend 30 minutes. Write your answer as if you were talking through it with an interviewer, in this order:<\/p>\n<ol><li><strong>Requirements.<\/strong> What \"as good as a median reviewer\" means operationally, the cost of a false positive and a false negative per category, volume and latency, and which decisions stay with humans regardless. Ask what you'd want to clarify.<\/li><li><strong>Gold set.<\/strong> How you sample items (stratified by category and by model confidence, enriched for rare violations), how many annotations per item and who adjudicates, how many items you need for the confidence intervals you want in the 0.4% category, and how you keep the set uncontaminated.<\/li><li><strong>Disagreement analysis.<\/strong> Model-human and human-human agreement on the same items, confusion matrices per category, adjudicated attribution of who was right, and what you do with categories where the policy itself is ambiguous.<\/li><li><strong>Release gate.<\/strong> Shadow mode, the statistical test and margin for non-inferiority, per-category floors, how the decision threshold and calibration are fixed before the test, and the canary rollout and rollback rule.<\/li><li><strong>Operations.<\/strong> The ongoing audit sample and its size, weekly dashboards, drift alarms, what happens when the prompt or model version changes, and how audited labels feed back into training.<\/li><\/ol>\n<p>Then score yourself with the rubric, one point per item, or paste your answer into a Claude session and ask for a rubric-based score with specific feedback.<\/p>\n<h3>What the interviewer listens for<\/h3>\n<p>Whether you know that human agreement is the ceiling and measure the model against it on the same items, per category. Whether your sample sizes come from the rarest category and your gold set cannot leak into prompts or training. Whether the release gate is a test with a stated margin rather than a number that looked good, and whether you have a plan for the week the prompt or the model version changes.<\/p>", "starter": "", "tests": "", "solution": ""}, {"id": "ds-distributed-training-plan", "title": "Plan the training of a 7B decoder on 64 GPUs", "track": "design", "module": "ds-core", "difficulty": "hard", "minutes": 30, "runtime": "python", "kind": "written", "tags": ["distributed training", "systems", "LLM"], "hints": ["Start from bytes per parameter: weights, gradients, fp32 master weights and the two Adam moments in mixed precision. Does the full state fit on one 80 GB GPU? That answer decides the parallelism.", "Write the FLOP count as 6 x N x D and divide by the cluster's achieved, not peak, throughput. Then ask how often a 64-GPU job fails in practice and what each restart costs in lost work."], "rubric": ["Computes the per-device memory: about 16 bytes per parameter for weights, gradients, master weights and Adam state (around 112 GB for 7B), activation memory per token and layer, and concludes that the state must be sharded.", "Chooses and justifies a parallelism layout (for example FSDP or ZeRO-3 across all 64 GPUs, with or without tensor parallelism inside a node), with a micro-batch, a global batch in tokens, and the communication volume per step compared with compute.", "Estimates throughput from 6ND FLOPs and a stated MFU (40 to 50%), giving tokens per second and days to finish, and checks it against the 8-week window with the failure rate included.", "Specifies checkpointing: a frequency derived from the expected failure rate, checkpoint size and write time, asynchronous saving, and resumable data-loader state so a restart neither repeats nor skips data.", "Describes failure handling and monitoring: detection of hung or failed ranks, elastic restart, a loss-spike playbook (lower lr, skip the batch, roll back), and the metrics to watch (MFU, loss, gradient norm, throughput)."], "timeout": 60, "readme": "<h2>Plan the training of a 7B decoder on 64 GPUs<\/h2>\n<p>You get 8 nodes of 8 H100 80 GB GPUs (NVLink inside each node, 400 Gb/s InfiniBand per GPU between nodes) for 8 weeks, and a 7B-parameter decoder-only transformer is due at the end: 32 layers, d_model 4096, 32 attention heads with 8 KV heads, a 128K vocabulary, 4,096-token context, trained with AdamW in bf16 mixed precision on 1 trillion pre-tokenized tokens. The cluster's history shows about one node or network incident every 3 days. Plan the run: memory per device, parallelism, throughput and schedule, checkpointing, and failure handling.<\/p>\n<p>Spend 30 minutes. Write your answer as if you were talking through it with an interviewer, in this order:<\/p>\n<ol><li><strong>Memory per device.<\/strong> Parameters, gradients, master weights and optimizer state in mixed precision; activation memory per token per layer and what sequence length and micro-batch that allows; whether any of it fits on one GPU unsharded. Ask what you'd want to clarify.<\/li><li><strong>Parallelism.<\/strong> Data parallel with FSDP or ZeRO versus tensor parallel inside a node versus pipeline across nodes. Pick a layout and give the micro-batch, the global batch in tokens, gradient accumulation, and the bytes moved per step versus the compute per step.<\/li><li><strong>Throughput and schedule.<\/strong> Total FLOPs from 6ND, the MFU you assume and why, tokens per second, days to finish, and the learning-rate schedule (warmup, peak, decay) with the margin left in the 8 weeks.<\/li><li><strong>Checkpointing and data.<\/strong> Checkpoint frequency from the failure rate, checkpoint size and write time, asynchronous saves, resumable data-loader state, and deterministic sharding so every token is seen once.<\/li><li><strong>Failure handling and monitoring.<\/strong> How a hung or dead rank is detected, elastic restart, the loss-spike playbook, what you watch on the dashboard, and what you do if you are 20% behind at the end of week 3.<\/li><\/ol>\n<p>Then score yourself with the rubric, one point per item, or paste your answer into a Claude session and ask for a rubric-based score with specific feedback.<\/p>\n<h3>What the interviewer listens for<\/h3>\n<p>Whether you reason from bytes per parameter and 6ND FLOPs to a plan with numbers, rather than naming frameworks. Whether the plan fits in 8 weeks with the failure rate included, and what you would cut if it did not. Whether you can explain what happens to a restart that resumes the model from a checkpoint but not the data loader from its position.<\/p>", "starter": "", "tests": "", "solution": ""}, {"id": "ds-rag-scientific-qa", "title": "Design retrieval-augmented QA over 2 million materials papers", "track": "design", "module": "ds-core", "difficulty": "medium", "minutes": 30, "runtime": "python", "kind": "written", "tags": ["RAG", "retrieval", "LLM", "evaluation"], "hints": ["Separate the two failures: the answer was not retrieved, or it was retrieved and the model still got it wrong. Your evaluation has to tell them apart, which means gold passages, not just gold answers.", "Do the index math first: 2 million papers at about 15,000 tokens each is 30 billion tokens. How many chunks is that, how large is the vector index, and what does that imply about approximate search and reranking?"], "rubric": ["States requirements with numbers: query types, p95 latency, freshness, the citation requirement, and an explicit policy for abstaining versus answering.", "Works through the corpus arithmetic (tokens, chunks, index size) and chooses a chunking, embedding and index strategy (hybrid sparse plus dense, approximate nearest-neighbour search, reranking) that fits the stated budget.", "Describes the query path end to end: normalization of chemical formulas, units and synonyms, candidate retrieval, cross-encoder reranking, context assembly with citations, and generation with abstention.", "Designs the evaluation set and metrics: gold passages plus expert answers, retrieval recall@k and MRR, answer faithfulness and correctness, citation precision, and validation of any LLM judge against experts.", "Covers operations: weekly ingestion and index refresh, deduplication of preprints and versions, user feedback and audit loops, monitoring of retrieval-quality drift, and prompt injection through paper text."], "timeout": 60, "readme": "<h2>Design retrieval-augmented QA over 2 million materials papers<\/h2>\n<p>About 300 materials scientists want to ask questions of a corpus of 2 million full-text papers (average 15,000 tokens each, with tables, figures and supplementary files), growing by 2,000 papers a week. Typical questions: which synthesis routes give phase-pure LiNi0.8Mn0.1Co0.1O2 with low cation mixing, what ionic conductivities have been reported for a given garnet composition, or which papers contradict a claimed band gap. Users expect an answer with citations in under 10 seconds, and a confident wrong answer with real-looking citations is the failure that would kill adoption. You have 4 inference GPUs, an embedding budget of one pass over the corpus per quarter, and access to a frontier model API. Design the system and its evaluation.<\/p>\n<p>Spend 30 minutes. Write your answer as if you were talking through it with an interviewer, in this order:<\/p>\n<ol><li><strong>Requirements.<\/strong> The query types (fact lookup, recipe extraction, numeric property lookup, cross-paper comparison), latency, freshness, the citation requirement, and what an acceptable failure looks like (abstain versus wrong). Ask what you'd want to clarify.<\/li><li><strong>Ingestion and indexing.<\/strong> PDF parsing, chunking of sections, tables, equations and captions, metadata, the embedding model and whether to adapt it, the chunk count and index size, hybrid sparse plus dense retrieval, and deduplication of preprints and versions.<\/li><li><strong>Retrieval and generation.<\/strong> Query rewriting and chemistry-aware normalization, candidate retrieval and reranking, how many chunks go into the prompt and how they are cited, abstention when the evidence is weak, and structured extraction for numeric questions.<\/li><li><strong>Evaluation.<\/strong> How you build a test set with expert answers and gold passages, retrieval metrics, answer faithfulness and correctness, citation precision, how an LLM judge is validated against experts, and the latency and cost per query.<\/li><li><strong>Operations.<\/strong> Weekly ingestion and index updates, capturing user feedback and corrections, monitoring retrieval drift, defending against instructions embedded in paper text, and the cost of running it.<\/li><\/ol>\n<p>Then score yourself with the rubric, one point per item, or paste your answer into a Claude session and ask for a rubric-based score with specific feedback.<\/p>\n<h3>What the interviewer listens for<\/h3>\n<p>Whether you do the corpus arithmetic before choosing an index, and whether your retrieval handles chemical formulas, units and synonyms rather than treating papers as generic text. Whether your evaluation separates retrieval failure from generation failure and measures citation faithfulness. Whether you can say when the system should say it does not know.<\/p>", "starter": "", "tests": "", "solution": ""}, {"id": "ds-two-tower-recommender", "title": "Design retrieval and ranking for a short-video feed", "track": "design", "module": "ds-core", "difficulty": "medium", "minutes": 30, "runtime": "python", "kind": "written", "tags": ["recommendation", "retrieval", "ranking", "system design"], "hints": ["Write the latency budget per stage before choosing models. If ranking gets 50 ms for 1,000 candidates on one G
