8 KV heads under GQA, and d_head 128, so that is 2 x 80 x 8 x 128 = 163,840 values, or about 320 KB per token in bf16. At 8K context one request needs 8192 x 320 KB = 2.6 GB, and 32 requests need 84 GB, which already exceeds one 80 GB H100 before counting the 140 GB of bf16 weights, so this configuration needs tensor parallelism across at least 4 GPUs and the cache, not the weights, becomes the limit on batch size. Without GQA (64 KV heads) the per-token cost would be 2.6 MB and the same batch would need 670 GB. Implications: throughput scales with batch size because decoding is bandwidth bound, so cache memory per sequence sets the serving cost; paged attention allocates cache in blocks to avoid fragmentation and lets you fill memory with more sequences; prefix caching shares the cache of common system prompts; KV quantization to int8 or fp8 doubles the batch; and the number to quote in a design round is the per-token cache size, because that times context times concurrency is your memory budget."}, {"id": "q-speculative-decoding", "topic": "Transformers and LLMs", "q": "How does speculative decoding speed up generation without changing the output distribution?", "a": "Decoding one token at a time leaves the GPU memory bound: each step reads all the weights to produce one token. Speculative decoding runs a small draft model to propose k tokens autoregressively, then the large model scores all k+1 positions in one parallel forward pass, which costs about the same as a single decode step because the weights are read once. Each draft token is accepted with probability min(1, p_target(x)/p_draft(x)); at the first rejection the token is resampled from the normalized residual max(0, p_target - p_draft), and the rest of the draft is discarded. That acceptance-rejection scheme makes the sequence of accepted tokens an exact sample from the target distribution, so quality is unchanged (with greedy decoding, outputs are identical). The speedup is the expected number of accepted tokens per large-model pass, typically 2 to 3x when the draft agrees with the target 70 to 90% of the time, and it falls when the draft is poorly matched or the batch is already large enough to be compute bound. Variants: self-speculation with early-exit or extra prediction heads (Medusa, EAGLE) avoid a separate draft model, n-gram or retrieval drafts are free for repetitive text, and tree-shaped drafts verify several candidates at once. The cost is extra memory for the draft and wasted draft compute on rejections, so it pays most at low batch size and long outputs."}, {"id": "q-rag-vs-long-context", "topic": "Transformers and LLMs", "q": "When would you use retrieval-augmented generation instead of just putting everything in a long context window?", "a": "Long context is simpler and avoids retrieval misses: the model sees everything and can reason across documents, and with prefix caching repeated use of the same corpus is cheap. But it costs per token on every call (prefill is quadratic in attention and linear in weights per token), so a 1M-token context per query is far more expensive than retrieving 10 chunks; models still show lost-in-the-middle degradation and weaker recall as the context fills; and the corpus must fit, which 2 million papers never will. RAG embeds and indexes the corpus once, retrieves the top-k chunks per query with dense (and often hybrid BM25) search, and conditions the model on them, which scales to arbitrary corpora, allows updates without retraining, gives citations for verification, and supports access control at the document level. Its failure modes are retrieval misses (the answer is in a chunk that was not retrieved, or spread across chunks), chunking that cuts tables and equations, and the model ignoring or contradicting the context. The practical answer is both: retrieve a generous candidate set with a cheap retriever, rerank with a cross-encoder, and give the model a long enough context to hold the top 20 to 50 chunks, then evaluate retrieval recall and answer faithfulness separately so you know which part failed. Long context alone is right when the working set is small and fixed, like one contract or one codebase session."}, {"id": "q-llm-eval-contamination", "topic": "Transformers and LLMs", "q": "How do you evaluate an LLM credibly, and how do you detect benchmark contamination?", "a": "Use a layered evaluation: held-out perplexity for pretraining progress, a battery of static benchmarks (MMLU, GSM8K, HumanEval, etc.) for capability tracking, and task-specific evaluations built from your own data for the decisions that matter, with human preference or a validated judge for open-ended outputs. Static benchmarks have small effective sizes and sensitivity to prompt format, so report confidence intervals and fix the prompting and decoding settings; a 1-point gain on a 1,000-item benchmark is noise. Contamination means test items or their paraphrases were in the pretraining data, which inflates scores without generalization; detect it by n-gram overlap between training data and test sets (the GPT-4 report used 50-character substrings), by comparing performance on items published before and after the training cutoff, by checking whether the model can complete the canonical test item verbatim (guided completion), and by comparing against a freshly written private test set of the same difficulty. Mitigations: decontaminate the training mix, keep a private held-out set that is never put in any prompt or log, and rotate benchmarks over time. The point to make in an interview: the only evaluation that cannot be contaminated is one built from data the model could not have seen, so for a production classifier the audit sample from live traffic is the ground truth and public benchmarks are a sanity check."}, {"id": "q-hallucination-mitigation", "topic": "Transformers and LLMs", "q": "Why do LLMs hallucinate, and what actually reduces it?", "a": "A language model is trained to produce plausible continuations, not to know what it knows: the pretraining objective rewards a confident guess over an admission of ignorance, SFT on demonstrations that assert facts the base model lacks teaches it to fabricate in the same style, and sampling adds noise. Hallucination also comes from the model lacking the information (long-tail facts, events after the cutoff), from retrieval returning wrong context, and from reward models that prefer confident answers. What helps, roughly in order of effect: grounding with retrieval and asking for citations, so the model's job becomes extraction rather than recall; training the model to abstain, by including I-do-not-know examples for questions it got wrong on probes and by rewarding calibrated refusal in preference data; self-consistency, since answers that vary across samples are more likely wrong, which also gives an uncertainty signal; verification steps where a second pass checks claims against sources or tools (calculators, code execution); and conservative decoding (lower temperature) for factual tasks. Measuring it needs a faithfulness metric against the provided context, a factuality metric against a knowledge source, and a calibration check that the model's expressed confidence tracks correctness. Nothing removes it entirely, so the system design question is how to detect and route uncertain cases to a human or a stronger model rather than how to make the model perfect."}, {"id": "q-llm-as-judge", "topic": "Transformers and LLMs", "q": "What are the pitfalls of using an LLM as a judge for evaluation, and how do you validate a judge?", "a": "Known biases: position bias (the first of two responses wins more often), verbosity bias (longer answers score higher), self-preference (a model rates its own style higher), sensitivity to the rubric wording, and an inability to verify facts it does not know, so a fluent wrong answer can score well. Validate the judge the way you would validate any classifier: collect a few hundred human-labeled comparisons or scores, measure agreement (Cohen's kappa or Spearman correlation against humans, and against the human-human agreement ceiling), check bias by swapping positions and shuffling lengths, and report per-category agreement, since a judge may be fine on format and poor on correctness. Mitigate with both orderings averaged, a reference answer or rubric in the prompt, chain-of-thought before the verdict, pairwise rather than absolute scores, and a stronger or different model family than the one being judged. Treat judge scores as a noisy proxy: use them for fast iteration and relative comparisons, and gate releases on human review of a stratified sample, with the judge's confusion matrix telling you which categories need humans most. The analogy to the LLM-vs-human disagreement analysis in a labeling pipeline is direct: the judge replacing humans needs the same agreement study and the same ongoing audit."}, {"id": "q-prompt-injection", "topic": "Transformers and LLMs", "q": "What is prompt injection, why is it hard to fix, and how would you defend an LLM classifier or agent against it?", "a": "Prompt injection is untrusted content (a product listing, a web page, a retrieved document, a tool result) containing text that the model follows as instructions, for example a listing that says ignore the policy and label this compliant; indirect injection arrives through retrieval or tools rather than from the user. It is hard because the model receives instructions and data in the same token stream with no privilege separation, so no prompt wording can guarantee the distinction, and jailbreaks keep finding phrasings that defeat trained refusals. Defenses are layered: structure prompts so untrusted content is delimited and the system prompt states that it is data; train or fine-tune with instruction-hierarchy examples so the model prioritizes system over user over tool content; limit the blast radius by giving the agent only the tools and permissions the task needs, requiring confirmation for irreversible actions, and never letting retrieved text select tools directly; detect with an input classifier for injection patterns and with output checks (a classifier that outputs a label from a fixed set is harder to hijack than one that produces free text); and monitor for anomalous label distributions on specific sellers or sources. For the policy classifier case specifically, the mitigation that actually closes the loop is sampling flagged and unflagged decisions for human audit and watching for disagreement spikes tied to particular content patterns. Say explicitly that this is a residual risk to manage, not a solved problem."}, {"id": "q-precision-recall-f1", "topic": "Evaluation", "q": "Define precision, recall and F1, and give a case where optimizing F1 is the wrong objective.", "a": "Precision is TP/(TP+FP), the fraction of flagged items that are truly positive; recall is TP/(TP+FN), the fraction of true positives you caught; F1 is their harmonic mean 2PR/(P+R), which punishes imbalance between the two and ignores true negatives entirely, so it is appropriate when the positive class is the one that matters and negatives are plentiful. Raising the decision threshold trades recall for precision and vice versa, so the two numbers are meaningless without the threshold or the full PR curve. F1 is wrong whenever the costs are asymmetric: for a policy-violation classifier where a missed violation costs 50 times a false flag, you want recall at a precision floor, or expected cost directly; for a medical screen you want recall near 1 and accept low precision; F-beta with beta > 1 weights recall more. Other traps: micro versus macro averaging across classes changes which classes dominate, F1 depends on the class prior so it is not comparable across datasets with different positive rates, and a high F1 on a balanced test set can collapse at the 1% positive rate seen in production. The line I would say: pick the operating point from the cost of each error type and the volume, then report precision and recall at that point with confidence intervals."}, {"id": "q-threshold-selection", "topic": "Evaluation", "q": "How do you choose the decision threshold for a classifier that feeds a downstream process, and how do you keep it valid over time?", "a": "Start from the costs and constraints: if a false positive costs c_FP and a false negative c_FN, then for a calibrated model the Bayes-optimal rule flags when p(y=1|x) > c_FP/(c_FP + c_FN), so with symmetric costs the threshold is 0.5 and with misses 9 times worse it is 0.1. When costs are not known but a constraint is, for example reviewers can handle 5% of volume or precision must stay above 90%, sweep the threshold on a validation set drawn like production traffic, compute the metric curves with bootstrap confidence intervals, and pick the point that satisfies the constraint with margin. Calibration matters because the threshold is a probability: an uncalibrated model still ranks correctly but 0.1 does not mean 10%, so temperature-scale first or choose the threshold on the raw score and accept that it is opaque. For a cascade or a router, the threshold also controls cost, so plot the cost-versus-accuracy frontier and pick by the budget. Keep it valid by monitoring the flag rate and the audited precision on a labeled sample every week; a shift in the score distribution or in the base rate moves the operating point even when the model is unchanged, and a model retrain always needs the threshold re-fit, never carried over."}, {"id": "q-offline-vs-online-metrics", "topic": "Evaluation", "q": "Why do offline metric gains often fail to show up online, and how do you bridge the gap?", "a": "Offline evaluation scores a model on logged data under the old policy, so it suffers from several mismatches: the logged labels or clicks are only observed for items the old system showed (selection bias), the metric is a proxy (AUC, NDCG, log-loss) for the business outcome (retention, revenue, reviewer hours), users and the system adapt to the new model (feedback loops), and the offline test set may be stale relative to the live distribution. A model can also improve average metrics while hurting a segment that drives the online outcome. Bridge it by making the offline metric as close to the decision as possible (replay the exact threshold and downstream actions, cost-weighted errors, per-segment breakdowns), by using counterfactual evaluation with importance weighting or doubly robust estimators when the logging policy was stochastic, and by calibrating offline-to-online: track for past launches how much offline gain translated into online gain and use that to set the bar. Then run the online experiment as the ground truth with enough power, and treat offline evaluation as the filter that decides which candidates deserve online traffic. The sentence interviewers want is that offline metrics choose what to test and online metrics decide what to ship."}, {"id": "q-ab-testing-guardrails", "topic": "Evaluation", "q": "Design an A/B test for a new ranking or classification model. How do you size it, what are guardrail metrics, and what are the common mistakes?", "a": "Define one primary metric tied to the goal (for a classifier replacing reviewers, the audited error rate or cost per decision; for ranking, a user outcome like watch time or retention), pick the minimum detectable effect you care about, and compute the sample size from the metric's variance: n per arm is about 2 * (z_alpha + z_beta)^2 * sigma^2 / delta^2, so for a 1% relative lift on a noisy metric that can be millions of units. Randomize at the right unit (user, session, request) so that the unit of randomization matches the unit of analysis and interference is small; cluster by user if the model's output shapes later behavior. Guardrail metrics are the things that must not regress even if the primary metric improves: latency p99, error rate, cost, complaint or appeal rate, fairness across segments, and for classifiers the false-positive rate on a protected category; a launch is blocked if a guardrail moves beyond its threshold regardless of the primary result. Mistakes: peeking and stopping early without sequential correction, running multiple metrics and cherry-picking, novelty effects that fade, imbalance from a bad randomization check (sample ratio mismatch), and not logging enough to debug a surprising result. Variance reduction with CUPED (regress out a pre-experiment covariate) and stratification cuts the needed sample. Where online testing is impossible or slow, interleaving for ranking and a shadow deployment with human audit for classification are the fallbacks."}, {"id": "q-class-imbalance", "topic": "Evaluation", "q": "Positives are 0.5% of your data. What goes wrong, and what do you do about it in training and evaluation?", "a": "Accuracy becomes meaningless (99.5% by predicting all negative), the loss is dominated by easy negatives so the gradient barely sees positives, and ROC AUC looks fine while precision at any usable threshold is terrible. In training the options are reweighting the loss by inverse frequency or by cost, oversampling positives or undersampling negatives (which changes the implied prior and so the calibration, which you fix afterwards by adjusting the logit by log of the sampling ratio), focal loss to down-weight easy examples, and hard-negative mining. Synthetic oversampling like SMOTE rarely helps for deep models and can leak if applied before the split. The most important move is usually not algorithmic: get more positives via active learning on the model's uncertain or high-score region, since labeled positives are the scarce resource. In evaluation use precision-recall curves, precision at the operating recall, and cost-weighted metrics; stratify the split so every fold has positives, and report confidence intervals since the positive count sets the effective sample size (500 positives out of 100K gives a few points of uncertainty on recall). If asked when to rebalance versus reweight: reweighting keeps all data and is equivalent in expectation, resampling changes the batch statistics and is better when positives are so rare that most batches would contain none."}, {"id": "q-cross-validation-leakage", "topic": "Evaluation", "q": "Give examples of data leakage in cross-validation and explain how to split data so the estimate is honest.", "a": "Leakage is any way information from the test fold reaches training: fitting a scaler, feature selector, imputer or target encoder on the full data before splitting; tuning hyperparameters on the same folds used to report the score (needs nested cross-validation or a separate test set); duplicate or near-duplicate records landing on both sides (the same user, the same molecule with a different conformer, the same crystal structure with a different cell setting); and temporal leakage, where training on later data predicts earlier data or features are computed with information that was not available at prediction time. Features that proxy the label, such as a case ID that encodes the outcome or a timestamp set after the decision, are leakage too. Honest splitting puts the whole pipeline inside the fold (Pipeline in scikit-learn), groups by the entity that creates correlation (GroupKFold by user, scaffold or composition), and respects time with a rolling-origin or forward-chaining split for anything deployed on future data. The symptom is a validation score that beats what the deployed model achieves; the test is to ask for every feature when it becomes known and for every pair of rows whether they are independent. Stratified k-fold keeps class proportions per fold, and k = 5 or 10 is the usual bias-variance compromise, with repeated CV when the dataset is small."}, {"id": "q-cohens-kappa", "topic": "Evaluation", "q": "What does Cohen's kappa measure, how do you interpret it, and how would you use it when replacing human reviewers with a model?", "a": "Kappa = (p_o - p_e)/(1 - p_e), where p_o is the observed agreement between two raters and p_e is the agreement expected by chance from their marginal label frequencies; it is 1 for perfect agreement, 0 for chance, negative for worse than chance. Raw agreement overstates reliability on imbalanced labels, since two raters who both say compliant 95% of the time agree 90% of the time by luck, so kappa corrects for that; rough bands are 0.4 to 0.6 moderate, 0.6 to 0.8 substantial, above 0.8 near-perfect, but the number depends on the prevalence and the number of categories, so compare within a task, and use Fleiss' kappa for more than two raters or Krippendorff's alpha for missing or ordinal labels. The use in a model-replaces-humans study: first measure human-human kappa on a double-labeled sample, which is the ceiling any model can be held to, then measure model-human kappa on the same items; if model-human agreement matches human-human agreement, the model is as reliable as another reviewer, and the disagreements are where the policy itself is ambiguous. Break the disagreements down by category and adjudicate a sample with an expert to decide who was right, because sometimes the model is more consistent than the humans; those adjudicated cases become the gold set for release gating. A low kappa with high accuracy on a skewed set is a warning sign that the model only learned the majority label."}, {"id": "q-label-noise", "topic": "Evaluation", "q": "How does label noise affect training and evaluation, and how do you detect and handle it?", "a": "Symmetric noise (labels flipped at random) mostly adds variance and lowers the achievable accuracy ceiling, and deep nets fit clean examples first and memorize noisy ones late, which is why early stopping and small learning rates help; asymmetric or instance-dependent noise (hard or ambiguous cases labeled wrong systematically) biases the decision boundary and cannot be fixed by averaging. Evaluation on a noisy test set caps measured accuracy at 1 minus the noise rate and can rank models wrongly when a model learns the annotators' mistakes, so the test set deserves more labeling effort per item than the training set (multiple annotators, adjudication). Detect noise by measuring inter-annotator agreement, by looking at examples where the model's confident prediction disagrees with the label (confident learning, which estimates the noise transition matrix from out-of-sample predicted probabilities), by tracking per-example loss across training, and by comparing LLM labels with human labels per category to find systematic disagreement. Handle it by relabeling the flagged examples, using robust losses (symmetric cross-entropy, generalized cross-entropy, label smoothing), co-teaching or sample reweighting, learning the noise transition matrix and correcting the loss, and above all by fixing the labeling guidelines where disagreement is highest. The point for an interview: disagreement between labelers is information about the task, not just noise, and the first question is whether the label is actually well defined."}, {"id": "q-bayes-rule-worked", "topic": "Probability and statistics", "q": "A test for a condition with 1% prevalence has 95% sensitivity and 90% specificity. If someone tests positive, what is the probability they have the condition? Walk through it.", "a": "Bayes: P(D|+) = P(+|D) P(D) / P(+), with P(+) = P(+|D) P(D) + P(+|not D) P(not D). Plug in: numerator 0.95 x 0.01 = 0.0095; false positives 0.10 x 0.99 = 0.099; P(+) = 0.1085; so P(D|+) = 0.0095/0.1085 = 0.0876, about 8.8%. The intuition is counting per 10,000 people: 100 have the condition and 95 test positive, 9,900 do not and 990 test positive, so only 95 of 1,085 positives are real; the base rate dominates because false positives come from the large healthy group. Two positive independent tests give posterior odds of 0.01/0.99 x 9.5 x 9.5 = about 0.91, or 48%, which shows how the likelihood ratio (sensitivity over false-positive rate, 9.5 here) compounds. The same arithmetic governs any rare-event classifier: at a 0.5% violation rate a model with 99% specificity still produces two false flags for every true one, and precision only improves by raising specificity further or by applying the classifier to a pre-filtered population with a higher prior. The follow-up to anticipate is what sensitivity and specificity would be needed for 90% precision at that prevalence: a false-positive rate near 0.1%."}, {"id": "q-conditional-independence", "topic": "Probability and statistics", "q": "What does conditional independence mean, and where does the assumption show up in ML models?", "a": "X and Y are conditionally independent given Z when p(x, y | z) = p(x | z) p(y | z), meaning that once Z is known, Y carries no extra information about X; it neither implies nor is implied by marginal independence, which is why two symptoms can be correlated in the population but independent given the disease, and why two independent causes become dependent once you condition on their common effect (explaining away, the collider in a graphical model). Naive Bayes assumes features are conditionally independent given the class, so the likelihood factorizes into a product of per-feature terms; Markov models assume the future is independent of the past given the present, and a hidden Markov model assumes observations are independent given the hidden state; a Bayesian network encodes a whole set of such statements through d-separation, and the factorization p(x) = prod p(x_i | parents(x_i)) is what makes inference tractable. In a transformer with a causal mask the model makes no independence assumption across positions, which is the point of attention, but the token-level factorization of the joint into conditionals is exact by the chain rule. Independence assumptions make estimation cheaper and reduce variance when they are approximately true and bias the model when they are false; the practical test is whether residual correlation remains after conditioning, which for Naive Bayes shows up as overconfident probabilities."}, {"id": "q-mle-gaussian", "topic": "Probability and statistics", "q": "Derive the maximum likelihood estimates of the mean and variance of a Gaussian from n i.i.d. samples, and explain why the variance estimate is biased.", "a": "The log-likelihood is sum_i [-0.5 log(2 pi sigma^2) - (x_i - mu)^2 / (2 sigma^2)]. Setting the derivative in mu to zero gives sum_i (x_i - mu) = 0, so mu_hat is the sample mean; setting the derivative in sigma^2 to zero gives -n/(2 sigma^2) + sum_i (x_i - mu)^2 / (2 sigma^4) = 0, so sigma_hat^2 = (1/n) sum_i (x_i - mu_hat)^2. The variance estimate uses the fitted mean, which is the value that minimizes the sum of squares, so the residuals are smaller than they would be around the true mean; E[sigma_hat^2] = (n-1)/n sigma^2, and dividing by n-1 instead of n (Bessel's correction) makes it unbiased, with one degree of freedom spent on estimating the mean. The MLE is still consistent and has lower mean squared error for Gaussian data than the unbiased version, so bias is not automatically bad. The same calculation generalizes to the multivariate case, where the MLE covariance is the scatter matrix over n and is singular when n is less than the dimension, which is why shrinkage toward a diagonal is needed in high dimensions. Connection to ML: least squares is the MLE under Gaussian noise with fixed variance, and fitting the variance too gives you heteroscedastic regression and the Gaussian NLL used for uncertainty-aware potentials."}, {"id": "q-central-limit-theorem", "topic": "Probability and statistics", "q": "State the central limit theorem, say what it does and does not guarantee, and give two places you rely on it in ML.", "a": "For i.i.d. samples with finite mean mu and variance sigma^2, the standardized sample mean sqrt(n) (x_bar - mu)/sigma converges in distribution to N(0, 1), so for large n the mean is approximately normal with standard error sigma/sqrt(n) regardless of the underlying distribution. It says nothing about any single sample, it needs finite variance (heavy-tailed data such as Cauchy or power-law latencies converge slowly or not at all), it is an asymptotic statement so the approximation is poor for small n with skewed data, and dependent samples need a weaker effective sample size. In ML you rely on it when you put a normal confidence interval on a test accuracy (p plus or minus 1.96 sqrt(p(1-p)/n), which is fine for n in the thousands and bad near p = 0 or 1), when you treat minibatch gradient noise as Gaussian in analyses of SGD, when you justify Gaussian likelihoods for measurement noise that is a sum of many small effects, and when the sum of many independent weights times inputs motivates the Gaussian behavior of wide networks at initialization. When the conditions fail, the bootstrap or exact binomial intervals are the fix, and for metrics like a max or a quantile the relevant limit is extreme-value theory, not the CLT."}, {"id": "q-pvalues-confidence-intervals", "topic": "Probability and statistics", "q": "Explain what a p-value and a 95% confidence interval mean, and the two misreadings you would correct in a model-comparison report.", "a": "A p-value is the probability, under the null hypothesis, of observing a test statistic at least as extreme as the one you got; it is computed assuming the null is true, so it is not the probability that the null is true and 1 - p is not the probability the alternative is true. A 95% confidence interval is a procedure that, over repeated samples, covers the true parameter 95% of the time; a particular interval either contains it or not, and the interval is more useful than the p-value because it shows effect size and precision. Misreading one: a non-significant result read as no difference, when the study was simply underpowered; the interval shows whether a meaningful difference is still plausible. Misreading two: a significant result with a tiny effect read as important, or a 0.3-point accuracy gain on a 2,000-item test set reported without an interval, where the standard error is about 1 point and the gain is noise. For comparing two models on the same test set, use a paired test (McNemar for classification, paired bootstrap for arbitrary metrics), because pairing removes the shared variance of item difficulty and makes the comparison far more sensitive than two independent intervals. Also state the multiple comparisons problem: if you compare ten variants, one will clear p < 0.05 by chance, so pre-register the primary comparison or correct."}, {"id": "q-bootstrap", "topic": "Probability and statistics", "q": "How does the bootstrap work, when would you use it for model evaluation, and when does it fail?", "a": "The bootstrap resamples the observed data with replacement B times (typically 1,000), recomputes the statistic on each resample, and uses the spread of those values as the sampling distribution: the standard deviation is the standard error, and the 2.5 and 97.5 percentiles give a percentile confidence interval (bias-corrected variants adjust for skew). It needs no formula for the variance, so it works for any metric, including AUC, F1, NDCG, energy-above-hull hit rate, or the difference between two models evaluated on the same items, where you resample items and compute the difference on each resample to get a paired interval. For a test set of n items the bootstrap captures the uncertainty from the finite test set, not from training randomness; to include the latter you resample training sets or train with several seeds. It fails or needs modification when samples are not exchangeable (time series need a block bootstrap, grouped data such as multiple structures per composition need a cluster bootstrap by group), for statistics at the edge of the data like the maximum or extreme quantiles, for very small n where the resamples are too similar to the original, and for heavy tails where the mean's distribution is not well estimated. Out-of-bag estimates in random forests and bagging are the same idea used for variance reduction instead of inference."}, {"id": "q-multiple-comparisons", "topic": "Probability and statistics", "q": "You ran 40 hyperparameter configurations and the best one beats the baseline with p = 0.03. What is wrong with that claim, and how do you fix it?", "a": "With 40 comparisons at alpha = 0.05 the expected number of false positives under the null is 2, and the probability that at least one clears the bar is 1 - 0.95^40 = 87%, so a p of 0.03 for the maximum is unremarkable; selecting the best and then testing it on the same data is the winner's curse, and the reported effect is biased upward. Fixes: control the family-wise error rate with Bonferroni (test at 0.05/40) or Holm's step-down, which is less conservative; control the false discovery rate with Benjamini-Hochberg when you are screening many candidates and can tolerate a known fraction of false leads, which is the right frame for materials screening and feature discovery; or, the cleanest, separate selection from confirmation by choosing the configuration on validation data and reporting its performance on a fresh test set. The same logic applies to A/B tests with many metrics (pick one primary metric), to repeated peeking at an experiment (use sequential tests), and to reporting the best of several random seeds instead of the mean and spread. The expected value of the maximum of k noisy estimates grows like sigma sqrt(2 log k), which quantifies how much of the apparent gain is selection."}, {"id": "q-max-of-gaussians", "topic": "Probability and statistics", "q": "Roughly how large is the expected maximum of n independent standard Gaussians, and why does that matter in ML?", "a": "The expected maximum grows like sqrt(2 log n): about 1.5 for n = 10, 2.5 for n = 100, 3.2 for n = 1,000 and 4.4 for a million, with a spread that shrinks as 1/sqrt(2 log n). The reason is that the Gaussian tail decays as exp(-x^2/2), so the point where n times the tail probability is about 1 solves exp(-x^2/2) = 1/n, giving x = sqrt(2 log n); growth is slow because the tail is so thin, whereas for exponential tails the maximum grows like log n and for power-law tails like a power of n. Where it matters: selecting the best of n models, seeds or hyperparameter settings inflates the reported score by about sigma sqrt(2 log n) above the true mean, which is the quantitative form of the multiple-comparisons problem; in a Bayesian-optimization or materials-screening loop the top-ranked candidate out of a million predictions is almost always an overestimate, so you expect regression to the mean on DFT verification and must plan the verification budget around it; max pooling and the maximum attention logit over a long sequence grow with length, which is one reason attention entropy drops in long contexts; and the maximum of many validation-loss evaluations under noise is why early stopping with patience picks a slightly optimistic checkpoint. The order statistics generalization is that the top-k look like the max with n replaced by n/k."}, {"id": "q-kl-cross-entropy", "topic": "Probability and statistics", "q": "Relate cross-entropy, entropy and KL divergence, and explain why minimizing cross-entropy on data is maximum likelihood.", "a": "For a true distribution p and model q, cross-entropy is H(p, q) = -sum p log q, entropy is H(p) = -sum p log p, and KL(p || q) = sum p log(p/q) = H(p, q) - H(p). Entropy does not depend on the model, so minimizing cross-entropy over q is the same as minimizing KL, and KL is zero only when q = p (Gibbs' inequality, proved with Jensen). With p the empirical distribution of the training data, the cross-entropy is -(1/n) sum_i log q(y_i | x_i), which is the negative average log-likelihood, so minimizing it is maximum likelihood estimation; for a classifier that is the softmax cross-entropy loss, and for a language model it is per-token NLL, whose exponential is perplexity. KL is asymmetric: KL(p || q) penalizes q for putting low mass where p has mass (mode covering, what maximum likelihood does), while KL(q || p) penalizes q for putting mass where p has none (mode seeking, what variational inference and RLHF's KL-to-reference do), and the choice decides whether a fitted model spreads over all modes or picks one. The irreducible part of the loss is H(p), which is why the loss of a perfect language model is not zero and why scaling laws fit an additive constant E."}, {"id": "q-jensen-elbo", "topic": "Probability and statistics", "q": "Use Jensen's inequality to derive the evidence lower bound, and explain what the gap is.", "a": "Jensen's inequality says that for a concave function f, f(E[X]) >= E[f(X)]; log is concave. For a latent-variable model p(x, z), log p(x) = log sum_z p(x, z) = log E_{q(z)}[p(x, z)/q(z)] for any distribution q with the right support, so applying Jensen gives log p(x) >= E_q[log p(x, z) - log q(z)], which is the ELBO; it can be rearranged into E_q[log p(x | z)] - KL(q(z) || p(z)), a reconstruction term minus a regularizer. The gap between log p(x) and the ELBO is exactly KL(q(z) || p(z | x)), so maximizing the ELBO over q tightens the bound toward the true posterior and maximizing it over the model parameters pushes up a lower bound on the likelihood; EM is coordinate ascent on this bound with q set to the exact posterior in the E-step, and variational inference restricts q to a tractable family. In a VAE, q is an amortized encoder network and the expectation is estimated with a reparameterized sample; in diffusion models the ELBO becomes a sum of per-step denoising KL terms. The practical consequences are that a looser bound (a worse q family) biases the fitted model toward regions where the approximate posterior is adequate, and that importance-weighted bounds with k samples tighten the gap at the cost of k decoder evaluations. Jensen is also the one-line proof that KL is non-negative, and that the log of an average of likelihoods exceeds the average log-likelihood, which is why ensembles help under NLL."}, {"id": "q-svm-margin-kernels", "topic": "Classic ML", "q": "What does an SVM optimize, what is the role of C, and how does the kernel trick let it learn nonlinear boundaries?", "a": "A linear SVM finds the hyperplane w.x + b = 0 that maximizes the margin 2/||w|| between classes, which is the convex program minimize 0.5 ||w||^2 + C sum_i xi_i subject to y_i (w.x_i + b) >= 1 - xi_i, with slack xi_i for points inside or beyond the margin; that is equivalent to minimizing hinge loss max(0, 1 - y f(x)) with L2 regularization, and C trades margin width (regularization, small C) against training errors (large C). Only the support vectors, the points on or inside the margin, have non-zero dual coefficients, so the solution is sparse in examples. In the dual, the data appear only through inner products x_i . x_j, so you can replace them with a kernel k(x_i, x_j) = phi(x_i) . phi(x_j) that computes the inner product in a high- or infinite-dimensional feature space without constructing it: polynomial kernels give polynomial boundaries, the RBF kernel exp(-gamma ||x - x'||^2) gives smooth local boundaries with gamma setting the length scale, and any positive semidefinite kernel is allowed (Mercer). Costs: training is between O(n^2) and O(n^3) in the number of examples and needs the n x n kernel matrix, so SVMs lose to gradient boosting and neural nets beyond about 10^5 examples; they also output margins rather than probabilities, so Platt scaling or isotonic regression is needed for calibrated scores. Kernel methods matter to the materials world because Gaussian process potentials (GAP) use exactly this machinery with SOAP kernels."}, {"id": "q-gbdt-vs-random-forest", "topic": "Classic ML", "q": "Compare gradient-boosted trees with random forests: how each reduces error, and when you would pick one over the other.", "a": "A random forest averages many deep trees, each trained on a bootstrap sample with a random subset of features considered at every split; the trees are low-bias, high-variance learners and averaging nearly independent errors cuts the variance, so forests are hard to overfit, parallel to train, insensitive to hyperparameters, and give an out-of-bag error estimate for free. Gradient boosting builds shallow trees sequentially, each fit to the negative gradient of the loss at the current predictions (the residuals for squared error) and added with a small learning rate, so it reduces bias step by step and can reach lower error, but it is sensitive to the number of trees, depth, learning rate and regularization, overfits noisy labels if pushed, and trains sequentially. Rule of thumb: boosting (XGBoost, LightGBM, CatBoost) wins on most tabular benchmarks and when you can tune and validate, forests win when you want a robust baseline quickly, with noisy labels, or with little tuning budget, and both handle mixed feature types and missing values and give feature importances (prefer permutation importance over split-count importance, which favors high-cardinality features). Both are poor at extrapolation since predictions are piecewise constant in the training range. For a quality estimator on LLM outputs with a few dozen engineered features and 100K examples, boosting is the natural first choice and the calibration of its scores should be checked separately."}, {"id": "q-xgboost-split-gain", "topic": "Classic ML", "q": "Write down how XGBoost scores a candidate split and how its regularization terms enter.", "a": "XGBoost takes a second-order Taylor expansion of the loss around the current prediction, so each example contributes a gradient g_i and a Hessian h_i, and for a leaf with example set I the optimal leaf weight is w* = -G/(H + lambda) with G = sum g_i and H = sum h_i, giving leaf objective -0.5 G^2/(H + lambda). The gain of splitting a node into left and right is 0.5 [G_L^2/(H_L + lambda) + G_R^2/(H_R + lambda) - (G_L + G_R)^2/(H_L + H_R + lambda)] - gamma, where lambda is the L2 penalty on leaf weights, which shrinks leaves with few or low-Hessian examples, and gamma is the minimum gain needed to add a leaf, which prunes; min_child_weight bounds H per leaf, alpha adds an L1 penalty, and the learning rate eta scales each tree's contribution. For squared error g_i is the residual and h_i is 1, so the gain reduces to the variance reduction; for logistic loss h_i = p(1-p), so confidently classified examples contribute little, which is the Newton-step flavor that makes it converge in fewer trees than plain gradient boosting. Split finding is done over histograms of feature values (exact enumeration is O(n log n) per feature), missing values learn a default direction, and column and row subsampling add randomization. If asked why depth is small: each tree fits residual structure and interactions up to its depth, so depth 4 to 8 captures most tabular interactions while keeping variance low."}, {"id": "q-em-algorithm", "topic": "Classic ML", "q": "Explain the EM algorithm using a Gaussian mixture, and say why it converges and where it gets stuck.", "a": "The incomplete log-likelihood log sum_k pi_k N(x | mu_k, Sigma_k) has no closed-form maximizer because the sum sits inside the log. EM introduces the latent component assignment z: the E-step computes responsibilities r_ik = pi_k N(x_i | mu_k, Sigma_k) / sum_j pi_j N(x_i | mu_j, Sigma_j), the posterior over z given current parameters, and the M-step maximizes the expected complete-data log-likelihood, which has closed forms: pi_k = mean of r_ik, mu_k = weighted mean of x with weights r_ik, Sigma_k = weighted covariance. Each iteration maximizes a lower bound on the log-likelihood (the ELBO with q equal to the exact posterior, where the bound is tight), so the likelihood is non-decreasing and converges to a stationary point. It gets stuck in local optima (initialize with k-means or several restarts), it can collapse a component onto a single point with variance going to zero and likelihood to infinity (add a prior or a variance floor), convergence is slow when components overlap, and k must be chosen with BIC or held-out likelihood. k-means is the limit of EM for spherical Gaussians with hard assignments and vanishing variance. The same structure runs HMMs (Baum-Welch), missing-data imputation, and mixture-of-experts gating, and variational EM replaces the exact E-step with an approximate posterior when it is intractable."}, {"id": "q-pca-vs-tsne-umap", "topic": "Classic ML", "q": "Compare PCA with t-SNE and UMAP. What does each preserve, and what mistakes do people make reading the plots?", "a": "PCA finds the orthogonal directions of maximum variance, the top eigenvectors of the covariance matrix (equivalently the SVD of the centered data), so it is linear, deterministic, fast, invertible for reconstruction, and preserves global structure and distances as well as a linear projection can; the explained-variance ratio tells you how much you kept, and it is the right first step for compression, whitening and denoising. t-SNE converts pairwise distances into neighbor probabilities with a Gaussian kernel in high dimension (bandwidth set by perplexity, roughly the effective number of neighbors) and a heavy-tailed Student-t kernel in 2D, then minimizes the KL divergence between them by gradient descent; it preserves local neighborhoods and separates clusters well but distorts global geometry. UMAP builds a fuzzy nearest-neighbor graph and optimizes a cross-entropy on edge probabilities, which is faster, scales better, and keeps somewhat more global structure, with n_neighbors and min_dist as the knobs. Misreadings: cluster sizes and inter-cluster distances in t-SNE and UMAP mean little, density is not preserved, the picture changes with perplexity and seed, and a plot can show clusters in random noise; so use them for exploration, verify any structure with a quantitative test, and never fit a classifier or compute distances in the embedding. For a materials dataset, PCA on composition or SOAP descriptors shows chemical trends, and UMAP is a reasonable way to check whether train and test structures occupy the same regions."}, {"id": "q-knn-curse-dimensionality", "topic": "Classic ML", "q": "Why does k-nearest neighbors degrade in high dimensions, and what does the curse of dimensionality mean concretely?", "a": "kNN predicts from the labels of the k closest training points, so it assumes that nearby points in input space share labels and that there are nearby points at all. In d dimensions the volume of a neighborhood of fixed radius shrinks relative to the data volume, so to capture a fixed fraction of points the neighborhood's side length in each coordinate approaches the full range: with uniform data in the unit cube, capturing 1% of points in d = 10 needs a cube of side 0.63, which is not local. At the same time distances concentrate: the ratio of the farthest to nearest neighbor distance approaches 1 as d grows, so the nearest neighbor is barely nearer than a random point and the ranking becomes noise-driven, and the required sample size for a given accuracy grows exponentially in d. Concretely, irrelevant or redundant features add distance noise, Euclidean distance on unscaled features is dominated by the largest-scale feature, and the method is memory and compute bound at inference (O(n d) per query without an index). Remedies: standardize and select or learn features, reduce dimension (PCA, learned embeddings, which is what dense retrieval does), use metric learning so the distance reflects the label, and use approximate nearest-neighbor indexes (HNSW, IVF-PQ) for scale. Real data often lies near a low-dimensional manifold, which is why kNN on learned embeddings works far better than the raw-dimension argument predicts."}, {"id": "q-logistic-regression-boundary", "topic": "Classic ML", "q": "Why is the decision boundary of logistic regression linear, how is it trained, and how do you read its coefficients?", "a": "Logistic regression models p(y=1|x) = sigmoid(w.x + b), and the decision rule p > 0.5 is equivalent to w.x + b > 0, a hyperplane; the log-odds log(p/(1-p)) = w.x + b is linear in x, so each coefficient is the change in log-odds per unit of that feature, and exp(w_j) is an odds ratio, interpretable only if features are on comparable scales and not collinear. Training maximizes the Bernoulli likelihood, which gives the cross-entropy loss; its gradient is sum_i (p_i - y_i) x_i, the same form as least squares with the prediction replaced by a probability, and the loss is convex so gradient descent or Newton's method (IRLS) finds the global optimum. Without regularization the weights diverge on linearly separable data, because the likelihood keeps improving as the margin logit grows, so L2 regularization is standard and also handles collinearity. Nonlinear boundaries come from feature engineering (polynomial terms, splines, learned embeddings), or from treating logistic regression as the last layer of a neural network, which is exactly what a softmax classifier head is. Compared with Naive Bayes it is a discriminative model that fits p(y|x) directly, needs more data but makes no independence assumption, and its probabilities are reasonably calibrated when the model is well specified, which is why it is the standard calibration layer (Platt scaling) on top of other scores."}, {"id": "q-naive-bayes", "topic": "Classic ML", "q": "How does Naive Bayes classify text, why does it work despite the independence assumption being false, and what are its failure modes?", "a": "Naive Bayes applies Bayes' rule with the assumption that features are conditionally independent given the class: p(y|x) proportional to p(y) prod_j p(x_j|y), so for text the multinomial version scores a document by log p(y) + sum over words of count_w log p(w|y), with p(w|y) estimated from class word frequencies plus Laplace (add-alpha) smoothing so unseen words do not zero out the product. Training is one pass of counting, it works with tiny datasets, and it is a strong baseline for spam and topic classification. It works despite correlated features because classification only needs the argmax to be right, not the probabilities; correlated features double-count evidence, which makes the posteriors extremely overconfident (near 0 or 1) but often leaves the ranking of classes intact, and the estimation variance is low because each parameter is a simple frequency. Failure modes: the overconfident probabilities are useless for thresholding or routing without calibration, it cannot model interactions (a negation flipping a sentiment word), feature correlations that differ by class can flip decisions, and zero-frequency words without smoothing break it. The textbook comparison is with logistic regression: Naive Bayes is generative and converges faster with less data to a worse asymptote; logistic regression is discriminative and wins with enough data, and the two have the same linear form in log space."}, {"id": "q-gaussian-process", "topic": "Classic ML", "q": "What is a Gaussian process regression model, what does the kernel encode, and why does it fit the Bayesian optimization loop so well?", "a": "A GP places a prior over functions: any finite set of function values is jointly Gaussian with mean m(x) and covariance k(x, x'), so the kernel encodes assumptions about smoothness and length scale (RBF for very smooth functions, Matern for rougher ones, periodic or additive kernels for structure). Conditioning on n noisy observations gives a closed-form posterior: the mean is k_*^T (K + sigma_n^2 I)^{-1} y and the variance is k(x*, x*) - k_*^T (K + sigma_n^2 I)^{-1} k_*, so you get a prediction and a calibrated uncertainty that grows away from the data, which is exactly what an acquisition function like expected improvement or UCB needs to trade exploration against exploitation. Kernel hyperparameters (length scales, noise, signal variance) are fit by maximizing the marginal likelihood, which automatically penalizes complexity. Costs: exact inference is O(n^3) in time and O(n^2) memory from inverting K, so GPs are used for up to a few thousand points, with inducing-point or sparse approximations beyond that; the kernel choice is a strong prior that can be wrong, and plain Euclidean kernels struggle in high dimensions, so for materials you use kernels on descriptors (SOAP in GAP potentials) or put the GP on a learned embedding. Deep ensembles and Bayesian neural nets replace GPs when the data is large or the input is structured, at the cost of less principled uncertainty."}, {"id": "q-mixed-precision", "topic": "Systems and scaling", "q": "Explain mixed-precision training: bf16 versus fp16, why fp16 needs loss scaling, and what still has to stay in fp32.", "a": "Mixed precision stores and multiplies activations and weights in a 16-bit format for 2x memory and bandwidth savings and much higher tensor-core throughput, while keeping a master copy of the weights, the optimizer state, and reductions in fp32. fp16 has a 10-bit mantissa and only 5 exponent bits, so its range is about 6e-5 to 65504 for normal numbers: gradients of small magnitude underflow to zero, which is why loss scaling multiplies the loss by a factor S (dynamic, starting large and halving on overflow) before backward and divides the gradients by S before the optimizer step. bf16 keeps fp32's 8 exponent bits with a 7-bit mantissa, so it has the same range and no scaling is needed, at the cost of lower precision, which training tolerates because the fp32 master weights accumulate the small updates; it is the default on A100 and later and on TPUs. Things that must stay in fp32: the master weights and Adam moments (an update of lr 1e-4 times a gradient is below bf16's resolution relative to a weight of order 1), softmax and layer-norm statistics, loss computation, and the all-reduce accumulation; attention logits in fp16 can overflow, which is one reason bf16 is safer for LLMs. FP8 training on Hopper goes further with per-tensor scaling and a higher-precision accumulate. The memory arithmetic to quote: mixed precision with Adam needs about 16 bytes per parameter (2 weights + 2 grads + 4 master + 8 moments), so 7B parameters is 112 GB before activations."}, {"id": "q-gradient-checkpointing", "topic": "Systems and scaling", "q": "How does gradient (activation) checkpointing trade compute for memory, and when is it worth it?", "a": "Backprop needs the activations of every layer, so activation memory scales as layers x batch x sequence x hidden (for a transformer, roughly 34 bytes per token per layer times hidden size, plus the attention scores without FlashAttention), and for long sequences or big batches it dominates the parameter memory. Checkpointing keeps only the inputs of selected blocks (say every transformer layer) during the forward pass and recomputes the intermediate activations inside a block during the backward pass when they are needed. With sqrt(L) evenly spaced checkpoints the activation memory drops from O(L) to O(sqrt(L)) at the cost of one extra forward pass, about 33% more compute since backward is roughly twice forward; checkpointing every layer gives the biggest saving at the same recomputation cost in the usual implementation. Worth it when memory, not compute, limits the batch size or sequence length you can train, which is almost always for LLM fine-tuning on few GPUs and for long-context training; not worth it when you are compute bound with memory to spare, because it lengthens every step. Selective checkpointing recomputes only the cheap, memory-heavy pieces (attention softmax and dropout, layer norms) and keeps matmul outputs, which recovers most of the memory for a few percent extra compute. Offloading activations to CPU is the alternative when PCIe bandwidth allows, and FlashAttention removes the quadratic term independently."}, {"id": "q-data-loading-bottleneck", "topic": "Systems and scaling", "q": "Your GPUs show 40% utilization during training. How do you find out whether the data pipeline is the bottleneck and fix it?", "a": "First measure rather than guess: time a run where the model trains on a single cached batch repeated, which gives the pure compute step time; if it is much faster than the real step, the input pipeline is the limit. Profile with the framework profiler or nvidia-smi plus iostat to see whether the GPU waits on the host, whether CPU cores are saturated by decoding or augmentation, or whether the disk or network delivers fewer bytes per second than the model consumes. Fixes in order of leverage: move decoding and augmentation off the critical path with multiple DataLoader workers, pinned memory and prefetching so batches are ready before the GPU asks; store data in a format that is cheap to read (pre-tokenized token arrays, sharded TFRecord, WebDataset tar shards, or memory-mapped NumPy, instead of millions of small JSON or image files); do augmentation on the GPU (DALI, torchvision v2 on tensors); shard and cache the dataset on local NVMe rather than streaming from a network file system; and increase sequence packing so each batch carries real tokens rather than padding. Watch for the subtle ones: a Python-side tokenizer in the loop, per-step synchronization from .item() calls and logging, and a sampler that reads shards in an order that defeats the OS page cache. Then re-measure MFU (model FLOPs utilization, achieved FLOPs over the hardware peak); 40% to 50% is decent for large transformers, so set the target from that, not from 100%."}, {"id": "q-ring-allreduce", "topic": "Systems and scaling", "q": "How does ring all-reduce work, what is its communication cost, and why does it make data-parallel training scale?", "a": "All-reduce sums a vector across N workers and leaves the sum on all of them; a naive approach sends everything to one node and back, costing O(N) times the data at that node. Ring all-reduce arranges workers in a ring and splits the vector into N chunks: in the reduce-scatter phase each worker sends one chunk to its neighbor and adds the received chunk to its own for N-1 steps, after which each worker holds the fully reduced value of one chunk, and in the all-gather phase the reduced chunks circulate for another N-1 steps. Each worker sends and receives 2(N-1)/N times the vector size, about 2x the data regardless of N, so the bandwidth cost is independent of the number of workers and only the latency term grows linearly with N; that is what lets gradient synchronization scale to hundreds of GPUs, with tree and hierarchical variants (NCCL picks them automatically) reducing the latency term across nodes. In data-parallel training the gradient all-reduce of P parameters in bf16 costs about 4P bytes per worker per step, overlapped with the backward pass by launching reductions bucket by bucket as gradients become ready; it is hidden when compute per step is large compared with 4P over the interconnect bandwidth, which is why bigger per-GPU batches and faster NVLink or InfiniBand help. ZeRO and FSDP replace the all-reduce with a reduce-scatter plus an all-gather of parameters, the same total traffic (about 3x for FSDP including the forward all-gather) with memory sharded. The number to remember: a 7B model's bf16 gradients are 14 GB, and on 400 Gb/s InfiniBand that reduce takes on the order of 0.5 seconds, so it must overlap with compute."}, {"id": "q-inference-batching-latency", "topic": "Systems and scaling", "q": "Why does batching help LLM inference throughput, how does continuous batching work, and what is the latency trade-off?", "a": "Decoding is memory-bandwidth bound: each step reads every weight (and the KV cache) from HBM to produce one token per sequence, so a batch of 1 uses a tiny fraction of the compute while the batch of 32 reads the weights once and produces 32 tokens in nearly the same time, raising throughput almost linearly until the step becomes compute bound. Static batching waits for a full batch and runs all sequences in lockstep, so short requests wait for long ones and GPU time is wasted on finished sequences. Continuous (iteration-level) batching schedules at the granularity of a decode step: when a sequence finishes, a new request takes its slot immediately, and prefill of a new request is interleaved or chunked with ongoing decodes; paged attention manages the KV cache in blocks so slots can be filled without fragmentation. The trade-off is per-token latency versus throughput: larger batches raise the time per decode step (more cache to read, prefill interference) and time-to-first-token grows with queueing, so a serving system exposes targets such as p50 time-to-first-token under 500 ms and inter-token latency under 50 ms, and picks the maximum batch and chunk size that meets them. The design numbers to know: for a 70B model in bf16 on 8 H100s, reading weights at about 3 TB/s per GPU gives a floor near 6 ms per step, so inter-token latency of 20 to 30 ms at a batch of 32 to 64 is the realistic regime, and separating prefill and decode onto different GPUs (disaggregated serving) is the next step when prefill spikes hurt decode latency."}, {"id": "q-serving-cost-estimate", "topic": "Systems and scaling", "q": "Estimate the cost of serving 200K classification requests per day with a 70B model versus a 7B model, and show how the estimate is built.", "a": "Build it from tokens and hardware throughput. Suppose each request is 1,500 input tokens and 20 output tokens. Prefill costs about 2 x parameters x tokens FLOPs, so a 70B model needs 2 x 70e9 x 1,500 = 2.1e14 FLOPs per request; at 40% MFU on an H100 (about 1e15 bf16 FLOPs per second dense peak, so 4e14 effective) that is about 0.5 GPU-seconds per request, and the 20 decode steps at a batch of 32 add about 20 x 25 ms / 32 = 16 ms, so prefill dominates for classification. 200K requests per day times 0.5 GPU-seconds is 1e5 GPU-seconds, about 28 GPU-hours per day; at $3 per GPU-hour that is roughly $85 per day, under $0.0005 per request. But the 70B model in bf16 needs 140 GB of weights, so the minimum deployment is 2 GPUs with tensor parallelism, realistically 4 for KV-cache headroom and 3x peak traffic, running all day: 4 x 24 x $3 is about $290 per day with the GPUs about 30% utilized, so the bill is the reserved capacity, not the FLOPs. The 7B model is 10x cheaper in FLOPs, fits on one GPU, and needs about 3 GPU-hours of work per day, so one always-on GPU at $72 per day sits mostly idle; a frontier API at about $5 per million input tokens costs $0.0075 per request, about $1,500 per day, roughly 5x the self-hosted 70B number. Conclusions to state: at this volume GPU cost is hundreds of dollars a day either way, so the model choice is driven by accuracy and reviewer cost rather than compute; prompt length dominates, so caching the shared policy prefix and trimming the prompt are the biggest levers; and utilization (batching, autoscaling to the daily curve, sharing GPUs with other workloads) matters more than the model's raw FLOPs."}, {"id": "q-reproducibility", "topic": "Systems and scaling", "q": "Two training runs with the same seed give different results. Where does the nondeterminism come from, and what level of reproducibility is worth paying for?", "a": "Sources: GPU kernels that use atomics or non-deterministic reductions (cuDNN convolution algorithms chosen by autotuning, scatter-add, index_add, some attention kernels), floating-point addition being non-associative so any change in reduction order or in the number of workers changes the low bits, data loader worker ordering and augmentation RNG, dropout RNG streams that depend on the number of devices, nondeterministic all-reduce ordering, and software or hardware differences across environments. Those low-bit differences get amplified by chaotic training dynamics into visibly different final models, typically a few tenths of a point on the metric. For bitwise reproducibility you fix every seed (Python, NumPy, torch, CUDA), set deterministic algorithms (torch.use_deterministic_algorithms, the cuBLAS workspace variable), fix the worker count and device count, pin library versions in a container, and accept a 10 to 30% slowdown; that is worth it for debugging a divergence or for a regulatory audit. For science and model comparison the useful notion is statistical reproducibility: run 3 to 5 seeds, report mean and standard deviation, and treat differences within that spread as noise, which is also what makes the multiple-comparisons problem visible. Always log the exact code commit, config, data snapshot hash, and environment with each checkpoint so a run can be reconstructed, since missing data provenance is the usual reason a result cannot be reproduced months later."}, {"id": "q-training-flops-estimate", "topic": "Systems and scaling", "q": "Estimate the compute and time to pretrain a 7B-parameter model on 1 trillion tokens on 64 H100s.", "a": "Training FLOPs are about 6 x N x D: 2 x N per token for the forward pass (each parameter is used in one multiply-add) and 4 x N for the backward pass, so 6 x 7e9 x 1e12 = 4.2e22 FLOPs; attention adds a term of order 12 x n_layers x d_model x T per token that is a few percent at 4K context and is usually folded into the estimate. An H100 SXM delivers about 1e15 bf16 FLOPs per second dense peak (the 2e15 marketing figure assumes 2:4 sparsity), and a realistic MFU for a 7B model with good parallelism is 40 to 50%, so call it 4.5e14 effective per GPU. 64 GPUs give 2.9e16 per second, so the run takes 4.2e22 / 2.9e16 = 1.5e6 seconds, about 17 days, and at $3 per GPU-hour that is about $80K; at 30% MFU, which is common on a first attempt, it is 25 days. Memory check: 7B parameters with mixed precision and Adam need about 16 bytes per parameter, 112 GB, so pure data parallelism does not fit in 80 GB per GPU and you shard the optimizer state and gradients with FSDP or ZeRO, with activation checkpointing to run several thousand tokens per GPU per micro-batch and a global batch of a few million tokens. The sanity checks an interviewer wants: tokens per parameter (about 140 here, well past Chinchilla's 20, so this is an inference-optimized overtrained recipe), that MFU is measured from the real step time rather than assumed, and that failures over weeks cost extra time, so checkpoint every hour or so and budget 10 to 20% for restarts."}, {"id": "q-dft-vs-mlip-cost", "topic": "ML for science", "q": "Compare DFT and ML interatomic potentials on cost and accuracy, and explain where each belongs in a discovery pipeline.", "a": "DFT solves the Kohn-Sham equations for the electrons, scaling roughly as O(N^3) in the number of electrons with a large prefactor: a single-point energy for a 100-atom cell with plane waves is minutes to hours on a node, a relaxation is tens of those, and the accuracy is set by the functional, typically tens of meV per atom in formation energies with known systematic errors (band gaps, strongly correlated oxides, van der Waals) that corrections like Hubbard U and mixing schemes patch. An MLIP like MACE or UMA is trained on DFT energies and forces and evaluates in milliseconds per structure with linear scaling in atoms, so it is 10^4 to 10^6 times cheaper and handles thousands of atoms and long MD, with errors of a few meV per atom and 50 to 100 meV per angstrom in forces inside its training distribution, but no first-principles guarantee outside it. In a pipeline the MLIP does the volume work: pre-relaxing every generated candidate, screening by predicted formation energy, running MD for stability and transport; DFT does the trusted work: final relaxation and energy of the shortlist, validation of the MLIP on a held-out sample from the new chemical space, and generation of new training data where the MLIP's uncertainty is high. The failure mode to say out loud is that MLIP errors are correlated with novelty, so the structures you care about most (new chemistries, unusual coordination) are where the potential is least reliable, which is why you re-rank the top candidates with DFT and never trust MLIP energies within a few meV of a decision boundary like the convex hull."}, {"id": "q-active-learning-materials", "topic": "ML for science", "q": "Design an active-learning loop for discovering stable materials when DFT calculations are the expensive step. What do you query, and how do you know it is working?", "a": "The loop has a generator (substitution into known prototypes, evolutionary search, or a diffusion model), a surrogate (an MLIP for relaxation plus a formation-energy model with uncertainty from an ensemble), an acquisition rule, and the DFT oracle, with a labeled pool that grows each round. Acquisition should mix exploitation and exploration: expected improvement or a lower confidence bound on energy above hull finds candidates that are likely stable, while high ensemble disagreement selects structures that will most improve the surrogate; in practice you take a batch per round, enforce diversity (cluster by composition and structure fingerprint so a batch is not 50 variants of the same spinel), and reserve a slice of the DFT budget for random or uncertainty-only queries that keep the model honest. Each DFT result is relaxed and added to the training set, the MLIP is fine-tuned or retrained, and the hull is rebuilt because new stable phases change the stability of everything nearby. Measure success by the discovery rate (fraction of DFT queries that land on or within 25 meV per atom of the hull) versus random or heuristic screening at the same budget, by the surrogate's held-out error on structures from the latest round (which exposes distribution shift), and by calibration of its uncertainty. The pitfalls I would name: the surrogate exploits its own errors so top-ranked candidates regress on DFT, batches collapse to one region without a diversity term, and feedback loops bias the training set toward what the model already likes; the stopping rule is when the discovery rate falls to the random baseline or the target space is exhausted."}, {"id": "q-uncertainty-ensembles-mc-dropout", "topic": "ML for science", "q": "Compare deep ensembles with MC dropout for uncertainty estimation, and say how you would check that an uncertainty estimate is trustworthy.", "a": "A deep ensemble trains M models (typically 4 to 8) from different initializations and data orders and uses the spread of their predictions as epistemic uncertainty, with the mean as the prediction; it is simple, parallel, and empirically the most reliable estimate for out-of-distribution inputs because the independently trained members disagree where the data does not constrain them, but it costs M times training and inference. MC dropout keeps dropout on at inference and samples T forward passes, which approximates a variational posterior at one training run's cost; it is cheap but tends to be under-dispersed, especially far from the training data, and its quality depends on the dropout rate, which was tuned for accuracy, not uncertainty. Both capture epistemic uncertainty; aleatoric noise needs a predicted variance head trained with the Gaussian NLL, and the total is the sum. Check trustworthiness with calibration plots of predicted variance versus observed squared error, the fraction of true values inside the predicted intervals at several confidence levels, the Spearman correlation between uncertainty and error (ranking matters most for active learning), and an explicit OOD test where uncertainty should rise on held-out chemistries; a negative log-likelihood on held-out data combines sharpness and calibration. For MLIPs, cheaper substitutes exist: the committee of the last linear layer, distance in feature space to the training set, and the disagreement between a model and its fine-tuned variant, and ensemble disagreement is the standard trigger for querying DFT."}, {"id": "q-e3-equivariant-networks", "topic": "ML for science", "q": "How do E(3)-equivariant networks like NequIP or MACE represent atomic environments, and why are they more data-efficient than invariant models?", "a": "They attach to each atom features that carry an irreducible representation of the rotation group: scalars (l = 0), vectors (l = 1), and higher-order tensors (l = 2, 3), expand each neighbor displacement into a radial basis times spherical harmonics Y_lm(r_hat), and combine features with tensor products governed by Clebsch-Gordan coefficients so that every operation maps irreps to irreps and the whole network is equivariant to rotation, reflection and translation, with permutation equivariance from the message-passing structure. Energies are read out from the scalar channel, so they are invariant, and forces are the negative gradient of the energy, so they are equivariant and conservative by construction. MACE adds many-body messages by taking symmetric tensor powers of the neighbor density, so a single layer captures 4-body or higher correlations that invariant descriptors or two-body message passing would need many layers to approximate. The data efficiency comes from the hypothesis space being restricted to physically consistent functions, so none of the training signal is spent learning that rotated structures have the same energy, and from the higher-order features resolving angular information that distance-only models miss (the counterexamples where distance-based GNNs cannot distinguish two different structures). The costs are compute (tensor products scale with the number of irreps and the maximum l) and implementation complexity, which is why max l is usually 2 or 3 and why scalar-only models like SchNet are still used when data is abundant. If asked about datasets, universal potentials (MACE-MP, UMA) are trained on millions of DFT calculations across the periodic table and fine-tuned per system."}, {"id": "q-csp-search-strategies", "topic": "ML for science", "q": "Compare the search strategies used in crystal structure prediction and explain how an ML potential changes the design of the search.", "a": "Crystal structure prediction looks for the lowest-energy arrangement of a given composition over the space of lattices and atomic positions, which is high-dimensional with an exponential number of local minima. Strategies: random structure search (AIRSS) generates sensible random cells with symmetry and chemical constraints and relaxes each, which is embarrassingly parallel and surprisingly effective for small cells; evolutionary algorithms (USPEX, XtalOpt) keep a population and apply heredity (splicing slabs of two parents), lattice mutation and permutation, then select by fitness, which exploits the fact that low-energy structures share motifs; particle-swarm and basin hopping move through the landscape with perturbations followed by local relaxation; template and substitution approaches start from known prototypes, which is where most real discoveries come from; and generative models now propose candidates directly. Every approach spends almost all of its compute on local relaxations, which is why an MLIP changes everything: relaxations become 10^4 times cheaper, so the search can evaluate millions of candidates instead of thousands, use larger cells, and afford more generations, and the question shifts from search budget to the potential's reliability. The resulting design: generate widely, relax with the MLIP, filter by energy and uncertainty, deduplicate by structure matching (e.g., pymatgen's StructureMatcher), then re-relax the shortlist with DFT; and because an evolutionary search will exploit holes in a potential, you re-validate periodically and fine-tune on the structures the search found. Success metrics are whether the known ground state is recovered at a given cost and how many new on-hull structures survive DFT."}, {"id": "q-diffusion-materials", "topic": "ML for science", "q": "How do diffusion models generate crystal structures, and what makes crystals harder than images or molecules?", "a": "A diffusion model learns to reverse a noising process: forward noise is added to the data over T steps, and a network is trained to predict the noise (or the score, the gradient of the log density) at each step, so that sampling starts from noise and denoises step by step. For crystals the data are a lattice, fractional coordinates and atom types, so each needs its own process: the lattice is a continuous 3 x 3 matrix handled with Gaussian noise in a symmetric parameterization, fractional coordinates live on a torus so the noise is wrapped and the score network must respect periodicity, and atom types are discrete so they use a categorical diffusion or a continuous relaxation; the network is an equivariant GNN so that rotated, translated, or permuted structures have the same likelihood. This is the design of CDVAE, DiffCSP and MatterGen, with conditional generation on properties through classifier-free guidance. Crystals are harder because the periodic boundary and the choice of unit cell make the same structure representable in infinitely many ways (supercells, different settings), the energy landscape is sharp so a slightly wrong bond length is a high-energy structure, and the validity criteria are physical (charge balance, interatomic distances, stability) rather than visual. Evaluation therefore needs structural validity rates, novelty and uniqueness after structure matching against the training set, and most importantly the fraction of generated structures that are stable after DFT relaxation (the SUN metric: stable, unique, novel), which is where MatterGen reported large gains over earlier generators. The caveat I would state is that generation is cheap and verification is expensive, so a generator's value is set by how many of its samples survive the hull test per unit of DFT spent."}, {"id": "q-energy-above-hull", "topic": "ML for science", "q": "What does energy above the convex hull measure, how do you compute it, and why is it the standard stability metric for predicted materials?", "a": "The convex hull is the lower envelope of formation energy versus composition over all known phases in a chemical system; a phase on the hull is thermodynamically stable against decomposition into any combination of other phases, and a phase above it would lower its energy by decomposing into the hull phases it sits between. Energy above hull is the vertical distance from a compound's formation energy to the hull at its composition, computed by building the hull from a reference database such as Materials Project with consistent DFT settings and corrections, then evaluating the decomposition energy with a phase-diagram tool; 0 means stable, and because DFT and finite-temperature effects are imperfect, compounds within about 25 to 50 meV per atom are often synthesizable. It is the standard metric because a low formation energy alone says nothing about competing phases, because it aggregates everything known about the system, and because it maps directly onto whether synthesis is plausible. For evaluating a model, the right numbers are the mean absolute error of predicted hull distance, the precision and recall of predicted-stable versus DFT-stable classifications near the hull, and the hit rate of discovered on-hull structures per DFT calculation; Matbench Discovery reports exactly these for universal potentials. Caveats: the hull depends on the reference set, so new stable phases move it; metastable phases like diamond are above hull but real; DFT energies must be computed with the same functional and corrections as the reference, or the comparison is meaningless; and kinetics, dopants and entropy are not captured, so hull distance is a filter, not a verdict."}, {"id": "q-materials-data-leakage", "topic": "ML for science", "q": "How do
