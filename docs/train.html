e(yv)\n        out = f_value(x, y)\n        assert math.isclose(out.data, f_float(xv, yv), rel_tol=1e-12)\n        out.backward()\n        gx = numeric_grad(f_float, (xv, yv), 0)\n        gy = numeric_grad(f_float, (xv, yv), 1)\n        assert math.isclose(x.grad, gx, rel_tol=1e-5, abs_tol=1e-7), f\"d/dx at {(xv, yv)}: {x.grad} vs {gx}\"\n        assert math.isclose(y.grad, gy, rel_tol=1e-5, abs_tol=1e-7), f\"d/dy at {(xv, yv)}: {y.grad} vs {gy}\"\n\n\ndef test_trains_a_linear_model_with_the_engine():\n    xs = [0.0, 1.0, 2.0, 3.0]\n    ys = [1.0, 3.0, 5.0, 7.0]                     # y = 1 + 2 x\n    w, b = Value(0.0), Value(0.0)\n    loss_val = None\n    for _ in range(200):\n        loss = sum(((w * x + b - y) ** 2 for x, y in zip(xs, ys)), Value(0.0)) / len(xs)\n        w.grad = b.grad = 0.0\n        loss.backward()\n        w.data -= 0.1 * w.grad\n        b.data -= 0.1 * b.grad\n        loss_val = loss.data\n    assert loss_val < 1e-6, f\"final loss {loss_val}\"\n    assert math.isclose(w.data, 2.0, abs_tol=1e-3) and math.isclose(b.data, 1.0, abs_tol=1e-3)\n", "solution": "import math\n\n\nclass Value:\n    def __init__(self, data, _children=(), _op=\"\"):\n        self.data = float(data)\n        self.grad = 0.0\n        self._backward = lambda: None\n        self._prev = set(_children)\n        self._op = _op\n\n    def __repr__(self):\n        return f\"Value(data={self.data:.6g}, grad={self.grad:.6g})\"\n\n    @staticmethod\n    def _wrap(other):\n        return other if isinstance(other, Value) else Value(other)\n\n    # -- arithmetic -------------------------------------------------------\n    def __add__(self, other):\n        other = self._wrap(other)\n        out = Value(self.data + other.data, (self, other), \"+\")\n\n        def _backward():\n            self.grad += out.grad\n            other.grad += out.grad\n        out._backward = _backward\n        return out\n\n    def __mul__(self, other):\n        other = self._wrap(other)\n        out = Value(self.data * other.data, (self, other), \"*\")\n\n        def _backward():\n            self.grad += other.data * out.grad\n            other.grad += self.data * out.grad\n        out._backward = _backward\n        return out\n\n    def __pow__(self, k):\n        assert isinstance(k, (int, float)), \"only number exponents\"\n        out = Value(self.data ** k, (self,), f\"**{k}\")\n\n        def _backward():\n            self.grad += k * self.data ** (k - 1) * out.grad\n        out._backward = _backward\n        return out\n\n    def __neg__(self):\n        return self * -1.0\n\n    def __sub__(self, other):\n        return self + (-self._wrap(other))\n\n    def __truediv__(self, other):\n        return self * self._wrap(other) ** -1.0\n\n    def __radd__(self, other):\n        return self + other\n\n    def __rmul__(self, other):\n        return self * other\n\n    def __rsub__(self, other):\n        return self._wrap(other) - self\n\n    def __rtruediv__(self, other):\n        return self._wrap(other) / self\n\n    # -- elementwise functions ---------------------------------------------\n    def exp(self):\n        out = Value(math.exp(self.data), (self,), \"exp\")\n\n        def _backward():\n            self.grad += out.data * out.grad\n        out._backward = _backward\n        return out\n\n    def log(self):\n        out = Value(math.log(self.data), (self,), \"log\")\n\n        def _backward():\n            self.grad += out.grad / self.data\n        out._backward = _backward\n        return out\n\n    def tanh(self):\n        t = math.tanh(self.data)\n        out = Value(t, (self,), \"tanh\")\n\n        def _backward():\n            self.grad += (1.0 - t * t) * out.grad\n        out._backward = _backward\n        return out\n\n    def relu(self):\n        out = Value(max(self.data, 0.0), (self,), \"relu\")\n\n        def _backward():\n            self.grad += (self.data > 0) * out.grad\n        out._backward = _backward\n        return out\n\n    # -- reverse-mode differentiation ---------------------------------------\n    def backward(self):\n        order, seen = [], set()\n\n        def visit(v):                          # post-order DFS: a node is appended after all its inputs\n            if v not in seen:\n                seen.add(v)\n                for child in v._prev:\n                    visit(child)\n                order.append(v)\n        visit(self)\n        self.grad = 1.0\n        for v in reversed(order):              # consumers before producers\n            v._backward()\n"}, {"id": "ml-batchnorm-dropout", "title": "Batch norm and inverted dropout, train and eval modes", "track": "ml", "module": "ml-nets", "difficulty": "medium", "minutes": 35, "runtime": "numpy", "kind": "code", "tags": ["batch normalization", "dropout", "regularization", "train/eval mode"], "hints": ["Training: mu = x.mean(0), var = x.var(0) (biased, divide by N), x_hat = (x - mu) / sqrt(var + eps), out = gamma * x_hat + beta. Eval: the same formula with running_mean and running_var in place of the batch statistics.", "Running stats are an exponential moving average, PyTorch convention: running = (1 - momentum) * running + momentum * batch_stat, and the batch variance fed into it is the unbiased one (multiply the biased variance by N / (N - 1)). Return new arrays; do not mutate the inputs.", "Inverted dropout: mask = rng.random(x.shape) >= p, out = x * mask / (1 - p) in training so E[out] = x; in eval return x unchanged with a mask of ones."], "rubric": [], "timeout": 30, "readme": "<h2>Batch norm and inverted dropout, train and eval modes<\/h2>\n<p>Two layers whose entire difficulty is the difference between training and inference. Interviewers ask for them because the bugs are famous: forgetting to switch to running statistics at eval time, updating the running variance with the wrong estimator, or scaling dropout at test time instead of training time. Implement the forward passes only; the backward pass of batch norm is a separate (and harder) question.<\/p>\n<ul><li><code>batchnorm_forward(x, gamma, beta, running_mean, running_var, training, momentum=0.1, eps=1e-5) -&gt; (out, running_mean, running_var)<\/code>. <code>x<\/code> has shape <code>(N, D)<\/code>; <code>gamma<\/code>, <code>beta<\/code>, <code>running_mean<\/code>, <code>running_var<\/code> have shape <code>(D,)<\/code>. In training, normalize each feature with the batch mean and the biased batch variance, then return updated running statistics <code>running = (1 - momentum) * running + momentum * batch_stat<\/code>, where the variance fed into the running estimate is the unbiased one (<code>N / (N - 1)<\/code> times the biased one), as PyTorch does. In eval, normalize with the running statistics and return them unchanged. Never modify the input arrays in place.<\/li><li><code>dropout_forward(x, p, training, rng) -&gt; (out, mask)<\/code>. Inverted dropout with drop probability <code>0 &lt;= p &lt; 1<\/code>: in training each element is kept with probability <code>1 - p<\/code> (draw the mask with <code>rng.random(x.shape)<\/code>), and the kept elements are scaled by <code>1 / (1 - p)<\/code>. In eval <code>out<\/code> is <code>x<\/code> and <code>mask<\/code> is all ones. <code>mask<\/code> has the shape of <code>x<\/code>.<\/li><\/ul>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">x = np.array([[1.0, 10.0], [3.0, 30.0]])\nout, rm, rv = batchnorm_forward(x, np.ones(2), np.zeros(2), np.zeros(2), np.ones(2), training=True)\nout  -&gt; [[-1, -1], [1, 1]]        (each column standardized; eps makes it 0.99999...)\nrm   -&gt; [0.2, 2.0]                (0.9 * 0 + 0.1 * mean)\nrv   -&gt; [1.1, 20.9]               (0.9 * 1 + 0.1 * unbiased var: 2 and 200)\n\nout, mask = dropout_forward(np.ones((4, 4)), p=0.5, training=True, rng=np.random.default_rng(0))\nout  -&gt; entries are 0 or 2, roughly half each<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>Vectorized over the batch and the features; no loops.<\/li><li><code>eps<\/code> must sit inside the square root so a constant feature (variance 0) gives a finite output equal to <code>beta<\/code>.<\/li><li>The returned running statistics must be new arrays: a test checks the inputs are untouched.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why batch norm needs two modes at all: at inference there may be no batch (or a batch of one), so the layer must become a fixed affine map using population estimates gathered during training.<\/li><li>Why the running estimate uses the unbiased variance while the forward pass uses the biased one, and why neither choice matters much for large batches but both matter for a batch of 2.<\/li><li>Why dropout scales by <code>1 / (1 - p)<\/code> at training time: it keeps the expected pre-activation the same in both modes, so the eval path is a no-op and the network sees the same scale it trained on.<\/li><li>Follow-up: what breaks with batch norm at batch size 1 or with strongly correlated samples in a batch, and why layer norm replaced it in transformers.<\/li><\/ul>", "starter": "\"\"\"Batch normalization and inverted dropout forward passes with train/eval modes. Vectorized NumPy only.\"\"\"\nimport numpy as np\n\n\ndef batchnorm_forward(x: np.ndarray, gamma: np.ndarray, beta: np.ndarray, running_mean: np.ndarray,\n                      running_var: np.ndarray, training: bool, momentum: float = 0.1, eps: float = 1e-5):\n    \"\"\"Normalize x (N, D) per feature.\n\n    Training: batch mean and biased batch variance; return running stats updated with momentum\n    (unbiased batch variance for the running estimate). Eval: use the running stats, return them unchanged.\n    Returns (out, running_mean, running_var) without modifying the inputs.\n    \"\"\"\n    raise NotImplementedError\n\n\ndef dropout_forward(x: np.ndarray, p: float, training: bool, rng: np.random.Generator):\n    \"\"\"Inverted dropout with drop probability p in [0, 1). Returns (out, mask) with mask shaped like x.\"\"\"\n    raise NotImplementedError\n", "tests": "import numpy as np\n\nfrom solution import batchnorm_forward, dropout_forward\n\n\ndef test_training_output_is_standardized_then_scaled():\n    rng = np.random.default_rng(0)\n    x = rng.normal(loc=5.0, scale=3.0, size=(64, 4))\n    gamma = np.array([1.0, 2.0, 0.5, -1.0])\n    beta = np.array([0.0, 1.0, -2.0, 3.0])\n    out, rm, rv = batchnorm_forward(x, gamma, beta, np.zeros(4), np.ones(4), training=True)\n    assert out.shape == (64, 4)\n    assert np.allclose(out.mean(axis=0), beta, atol=1e-8)\n    assert np.allclose(out.std(axis=0), np.abs(gamma), atol=1e-4), \"eps makes the std slightly below |gamma|\"\n\n\ndef test_running_stats_update_with_momentum_and_unbiased_variance():\n    x = np.array([[1.0, 10.0], [3.0, 30.0]])\n    rm0, rv0 = np.zeros(2), np.ones(2)\n    out, rm, rv = batchnorm_forward(x, np.ones(2), np.zeros(2), rm0, rv0, training=True, momentum=0.1)\n    assert np.allclose(out, [[-1.0, -1.0], [1.0, 1.0]], atol=1e-4)\n    assert np.allclose(rm, [0.2, 2.0]), f\"running mean {rm}\"\n    assert np.allclose(rv, [1.1, 20.9]), f\"running var {rv} (unbiased batch var is 2 and 200)\"\n    assert np.array_equal(rm0, np.zeros(2)) and np.array_equal(rv0, np.ones(2)), \"inputs must not be modified\"\n    out2, rm2, rv2 = batchnorm_forward(x, np.ones(2), np.zeros(2), rm, rv, training=True, momentum=0.5)\n    assert np.allclose(rm2, [1.1, 11.0]) and np.allclose(rv2, [1.55, 110.45])\n\n\ndef test_eval_uses_running_stats_not_the_batch():\n    rng = np.random.default_rng(1)\n    x = rng.normal(loc=100.0, scale=10.0, size=(5, 3))     # wildly different from the running stats\n    gamma, beta = np.array([1.0, 2.0, 3.0]), np.array([0.5, 0.0, -0.5])\n    rm, rv = np.array([1.0, 2.0, 3.0]), np.array([4.0, 9.0, 16.0])\n    out, rm_out, rv_out = batchnorm_forward(x, gamma, beta, rm, rv, training=False, eps=1e-5)\n    ref = gamma * (x - rm) / np.sqrt(rv + 1e-5) + beta\n    assert np.allclose(out, ref, atol=1e-10)\n    assert np.array_equal(rm_out, rm) and np.array_equal(rv_out, rv), \"eval must not touch the running stats\"\n    out1, _, _ = batchnorm_forward(x[:1], gamma, beta, rm, rv, training=False)\n    assert np.allclose(out1, ref[:1]), \"a batch of one works in eval mode\"\n\n\ndef test_running_stats_converge_to_population_values():\n    rng = np.random.default_rng(2)\n    rm, rv = np.zeros(3), np.ones(3)\n    for _ in range(300):\n        x = rng.normal(loc=3.0, scale=2.0, size=(32, 3))\n        _, rm, rv = batchnorm_forward(x, np.ones(3), np.zeros(3), rm, rv, training=True, momentum=0.1)\n    assert np.allclose(rm, 3.0, atol=0.3), f\"running mean {rm} should approach 3\"\n    assert np.allclose(rv, 4.0, atol=0.8), f\"running var {rv} should approach 4\"\n\n\ndef test_constant_feature_is_finite_and_equals_beta():\n    x = np.full((8, 2), 7.0)\n    out, _, _ = batchnorm_forward(x, np.array([3.0, 3.0]), np.array([1.0, -1.0]), np.zeros(2), np.ones(2), training=True)\n    assert np.all(np.isfinite(out))\n    assert np.allclose(out, [[1.0, -1.0]] * 8)\n\n\ndef test_dropout_training_drops_fraction_p_and_rescales():\n    rng = np.random.default_rng(3)\n    x = np.full((500, 200), 2.0)\n    out, mask = dropout_forward(x, 0.3, training=True, rng=rng)\n    assert out.shape == x.shape and mask.shape == x.shape\n    frac_zero = np.mean(out == 0)\n    assert abs(frac_zero - 0.3) < 0.01, f\"fraction dropped {frac_zero:.3f} should be about 0.3\"\n    kept = out[out != 0]\n    assert np.allclose(kept, 2.0 / 0.7), \"kept values are scaled by 1 / (1 - p)\"\n    assert np.allclose(out, x * (mask != 0) / 0.7), \"mask must mark the kept entries\"\n    assert abs(out.mean() - 2.0) < 0.02, \"inverted dropout preserves the expectation\"\n\n\ndef test_dropout_eval_is_identity_and_p_zero_keeps_everything():\n    rng = np.random.default_rng(4)\n    x = rng.normal(size=(6, 5))\n    out, mask = dropout_forward(x, 0.5, training=False, rng=rng)\n    assert np.array_equal(out, x) and np.all(mask == 1)\n    out, mask = dropout_forward(x, 0.0, training=True, rng=rng)\n    assert np.allclose(out, x) and np.all(mask == 1)\n\n\ndef test_dropout_is_deterministic_given_the_rng():\n    x = np.ones((20, 20))\n    a, _ = dropout_forward(x, 0.5, training=True, rng=np.random.default_rng(7))\n    b, _ = dropout_forward(x, 0.5, training=True, rng=np.random.default_rng(7))\n    c, _ = dropout_forward(x, 0.5, training=True, rng=np.random.default_rng(8))\n    assert np.array_equal(a, b)\n    assert not np.array_equal(a, c)\n", "solution": "import numpy as np\n\n\ndef batchnorm_forward(x: np.ndarray, gamma: np.ndarray, beta: np.ndarray, running_mean: np.ndarray,\n                      running_var: np.ndarray, training: bool, momentum: float = 0.1, eps: float = 1e-5):\n    if training:\n        n = x.shape[0]\n        mu = x.mean(axis=0)\n        var = x.var(axis=0)                                   # biased: this is what normalizes the batch\n        x_hat = (x - mu) / np.sqrt(var + eps)\n        unbiased = var * n / max(n - 1, 1)                    # the running estimate tracks the population variance\n        running_mean = (1 - momentum) * running_mean + momentum * mu\n        running_var = (1 - momentum) * running_var + momentum * unbiased\n    else:\n        x_hat = (x - running_mean) / np.sqrt(running_var + eps)\n    return gamma * x_hat + beta, running_mean, running_var\n\n\ndef dropout_forward(x: np.ndarray, p: float, training: bool, rng: np.random.Generator):\n    if not training or p == 0.0:\n        return x.copy(), np.ones_like(x)\n    mask = (rng.random(x.shape) >= p).astype(x.dtype)\n    return x * mask / (1.0 - p), mask\n"}, {"id": "ml-conv2d", "title": "2-D convolution from scratch", "track": "ml", "module": "ml-nets", "difficulty": "medium", "minutes": 45, "runtime": "numpy", "kind": "code", "tags": ["convolution", "CNN", "im2col", "broadcasting"], "hints": ["Pad first: xp = np.pad(x, ((0, 0), (0, 0), (p, p), (p, p))). Output size per axis is (n + 2p - k) // stride + 1.", "Loop over output positions (i, j) only. The patch xp[:, :, i*s:i*s+kH, j*s:j*s+kW] has shape (N, C, kH, kW); contract it with w (F, C, kH, kW) over (C, kH, kW) in one call: np.tensordot(patch, w, axes=([1, 2, 3], [1, 2, 3])) gives (N, F).", "im2col removes the loop entirely: gather every patch into a matrix of shape (N * H_out * W_out, C * kH * kW) and multiply by w reshaped to (C * kH * kW, F). The row index encodes (n, i, j), so reshape and transpose the product back to (N, F, H_out, W_out)."], "rubric": [], "timeout": 30, "readme": "<h2>2-D convolution from scratch<\/h2>\n<p>A convolution layer is asked for because it checks three things: that you can write down the output-size formula, that you know PyTorch's <code>conv2d<\/code> is actually cross-correlation (no kernel flip), and that you can turn a six-deep nested loop into a handful of array operations. The usual trajectory in the room is \"naive loops, now make it fast\", so build it so that only the loop over output positions remains, or go straight to im2col.<\/p>\n<p>Implement:<\/p>\n<ul><li><code>out_size(n, k, stride, padding) -&gt; int<\/code>: the output length of one spatial axis, <code>(n + 2 * padding - k) // stride + 1<\/code>.<\/li><li><code>conv2d(x, w, b=None, stride=1, padding=0) -&gt; out<\/code>: <code>x<\/code> has shape <code>(N, C, H, W)<\/code>, <code>w<\/code> has shape <code>(F, C, kH, kW)<\/code>, <code>b<\/code> is <code>None<\/code> or shape <code>(F,)<\/code>. Zero-pad <code>x<\/code> by <code>padding<\/code> on each spatial side, then <code>out[n, f, i, j] = b[f] + sum over c, u, v of w[f, c, u, v] * x_pad[n, c, i * stride + u, j * stride + v]<\/code>. Output shape <code>(N, F, H_out, W_out)<\/code>.<\/li><\/ul>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">x = np.array([[1, 2], [3, 4]], float).reshape(1, 1, 2, 2)\nw = np.ones((1, 1, 2, 2))\nconv2d(x, w)                     -&gt; [[[[10.]]]]\n\nimpulse = np.zeros((1, 1, 3, 3)); impulse[0, 0, 1, 1] = 1\nk = np.arange(9.).reshape(1, 1, 3, 3)\nconv2d(impulse, k, padding=1)    -&gt; k flipped in both axes (that is cross-correlation)\n\nout_size(32, 3, stride=2, padding=1) -&gt; 16<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>No Python loops over <code>N<\/code>, <code>C<\/code> or <code>F<\/code>. Loops over the <code>H_out x W_out<\/code> output positions are acceptable; im2col with a single matrix product is better.<\/li><li>Must match a brute-force reference exactly (<code>atol=1e-10<\/code>) for several <code>(stride, padding)<\/code> combinations, including non-square kernels.<\/li><li>A larger input (<code>N=16, C=8, F=16, 32x32<\/code>) is in the tests; the fully naive version is too slow for it.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>The output-size formula and where the floor comes from (the last window that still fits), plus how \"same\" padding is <code>(k - 1) / 2<\/code> for odd <code>k<\/code> and stride 1.<\/li><li>Cross-correlation versus convolution: the learned kernel absorbs the flip, so frameworks skip it; the impulse-response test makes the convention visible.<\/li><li>The im2col trade-off: it turns the op into one GEMM (fast, uses BLAS) at the cost of materializing every patch, <code>C * kH * kW<\/code> times the input memory.<\/li><li>Follow-up: the cost in multiply-adds (<code>N * F * C * kH * kW * H_out * W_out<\/code>), how a depthwise-separable convolution cuts it, and what the backward pass looks like (the gradient with respect to the input is a transposed convolution).<\/li><\/ul>", "starter": "\"\"\"2-D convolution (cross-correlation, PyTorch convention) for NCHW inputs. Vectorized NumPy only.\"\"\"\nimport numpy as np\n\n\ndef out_size(n: int, k: int, stride: int = 1, padding: int = 0) -> int:\n    \"\"\"Length of one output axis for input length n and kernel length k.\"\"\"\n    raise NotImplementedError\n\n\ndef conv2d(x: np.ndarray, w: np.ndarray, b: np.ndarray | None = None, stride: int = 1, padding: int = 0) -> np.ndarray:\n    \"\"\"x: (N, C, H, W), w: (F, C, kH, kW), b: (F,) or None. Returns (N, F, H_out, W_out).\"\"\"\n    raise NotImplementedError\n", "tests": "import numpy as np\n\nfrom solution import conv2d, out_size\n\n\ndef conv2d_reference(x, w, b=None, stride=1, padding=0):\n    \"\"\"Deliberately naive: loops over everything.\"\"\"\n    n_, c_, h_, w_ = x.shape\n    f_, _, kh, kw = w.shape\n    xp = np.pad(x, ((0, 0), (0, 0), (padding, padding), (padding, padding)))\n    ho = (h_ + 2 * padding - kh) // stride + 1\n    wo = (w_ + 2 * padding - kw) // stride + 1\n    out = np.zeros((n_, f_, ho, wo))\n    for n in range(n_):\n        for f in range(f_):\n            for i in range(ho):\n                for j in range(wo):\n                    s = 0.0 if b is None else b[f]\n                    for c in range(c_):\n                        for u in range(kh):\n                            for v in range(kw):\n                                s += w[f, c, u, v] * xp[n, c, i * stride + u, j * stride + v]\n                    out[n, f, i, j] = s\n    return out\n\n\ndef test_out_size_formula():\n    assert out_size(5, 3) == 3\n    assert out_size(5, 3, stride=1, padding=1) == 5\n    assert out_size(32, 3, stride=2, padding=1) == 16\n    assert out_size(7, 2, stride=2, padding=0) == 3\n    assert out_size(28, 5, stride=1, padding=2) == 28\n\n\ndef test_box_filter_and_output_shape():\n    x = np.array([[1.0, 2.0], [3.0, 4.0]]).reshape(1, 1, 2, 2)\n    w = np.ones((1, 1, 2, 2))\n    out = conv2d(x, w)\n    assert out.shape == (1, 1, 1, 1)\n    assert np.isclose(out[0, 0, 0, 0], 10.0)\n    x = np.arange(16.0).reshape(1, 1, 4, 4)\n    out = conv2d(x, w)\n    assert out.shape == (1, 1, 3, 3)\n    assert np.allclose(out[0, 0], [[10, 14, 18], [26, 30, 34], [42, 46, 50]])\n\n\ndef test_impulse_response_is_the_flipped_kernel():\n    impulse = np.zeros((1, 1, 3, 3))\n    impulse[0, 0, 1, 1] = 1.0\n    k = np.arange(9.0).reshape(1, 1, 3, 3)\n    out = conv2d(impulse, k, padding=1)\n    assert out.shape == (1, 1, 3, 3)\n    assert np.allclose(out[0, 0], k[0, 0, ::-1, ::-1]), \"cross-correlation of an impulse returns the kernel flipped\"\n\n\ndef test_matches_reference_no_padding_stride_one():\n    rng = np.random.default_rng(0)\n    x = rng.normal(size=(2, 3, 6, 5))\n    w = rng.normal(size=(4, 3, 3, 2))          # non-square kernel\n    b = rng.normal(size=4)\n    out = conv2d(x, w, b)\n    ref = conv2d_reference(x, w, b)\n    assert out.shape == ref.shape == (2, 4, 4, 4)\n    assert np.allclose(out, ref, atol=1e-10)\n\n\ndef test_matches_reference_with_stride_and_padding():\n    rng = np.random.default_rng(1)\n    x = rng.normal(size=(2, 2, 7, 8))\n    w = rng.normal(size=(3, 2, 3, 3))\n    for stride, padding in [(2, 1), (3, 0), (2, 2), (1, 2)]:\n        out = conv2d(x, w, None, stride=stride, padding=padding)\n        ref = conv2d_reference(x, w, None, stride=stride, padding=padding)\n        assert out.shape == ref.shape, f\"stride {stride}, padding {padding}: {out.shape} vs {ref.shape}\"\n        assert np.allclose(out, ref, atol=1e-10), f\"mismatch at stride {stride}, padding {padding}\"\n\n\ndef test_bias_is_added_per_filter():\n    rng = np.random.default_rng(2)\n    x = rng.normal(size=(1, 2, 4, 4))\n    w = rng.normal(size=(3, 2, 2, 2))\n    b = np.array([10.0, -20.0, 30.0])\n    diff = conv2d(x, w, b) - conv2d(x, w)\n    assert np.allclose(diff[0, 0], 10.0) and np.allclose(diff[0, 1], -20.0) and np.allclose(diff[0, 2], 30.0)\n\n\ndef test_identity_kernel_with_same_padding():\n    rng = np.random.default_rng(3)\n    x = rng.normal(size=(2, 1, 5, 5))\n    w = np.zeros((1, 1, 3, 3))\n    w[0, 0, 1, 1] = 1.0\n    assert np.allclose(conv2d(x, w, padding=1), x)\n\n\ndef test_larger_input_is_fast_enough():\n    rng = np.random.default_rng(4)\n    x = rng.normal(size=(16, 8, 32, 32))\n    w = rng.normal(size=(16, 8, 3, 3))\n    b = rng.normal(size=16)\n    out = conv2d(x, w, b, stride=1, padding=1)\n    assert out.shape == (16, 16, 32, 32)\n    # spot-check a few output positions against the naive formula\n    xp = np.pad(x, ((0, 0), (0, 0), (1, 1), (1, 1)))\n    for n, f, i, j in [(0, 0, 0, 0), (5, 7, 13, 2), (15, 15, 31, 31), (3, 9, 16, 30)]:\n        ref = b[f] + np.sum(w[f] * xp[n, :, i:i + 3, j:j + 3])\n        assert np.isclose(out[n, f, i, j], ref, atol=1e-9)\n", "solution": "import numpy as np\n\n\ndef out_size(n: int, k: int, stride: int = 1, padding: int = 0) -> int:\n    return (n + 2 * padding - k) // stride + 1\n\n\ndef conv2d(x: np.ndarray, w: np.ndarray, b: np.ndarray | None = None, stride: int = 1, padding: int = 0) -> np.ndarray:\n    n, c, h, wd = x.shape\n    f, _, kh, kw = w.shape\n    ho, wo = out_size(h, kh, stride, padding), out_size(wd, kw, stride, padding)\n    xp = np.pad(x, ((0, 0), (0, 0), (padding, padding), (padding, padding)))\n\n    # im2col: cols[n, i, j, c, u, v] = xp[n, c, i*s + u, j*s + v], gathered with fancy indexing.\n    ii = (stride * np.arange(ho))[:, None] + np.arange(kh)[None, :]      # (ho, kh)\n    jj = (stride * np.arange(wo))[:, None] + np.arange(kw)[None, :]      # (wo, kw)\n    cols = xp[:, :, ii[:, None, :, None], jj[None, :, None, :]]           # (n, c, ho, wo, kh, kw)\n    cols = cols.transpose(0, 2, 3, 1, 4, 5).reshape(n * ho * wo, c * kh * kw)\n\n    out = cols @ w.reshape(f, -1).T                                       # one GEMM: (n*ho*wo, f)\n    out = out.reshape(n, ho, wo, f).transpose(0, 3, 1, 2)\n    if b is not None:\n        out = out + b[None, :, None, None]\n    return out\n"}, {"id": "ml-kmeans", "title": "k-means with k-means++ initialization", "track": "ml", "module": "ml-classic", "difficulty": "medium", "minutes": 40, "runtime": "numpy", "kind": "code", "tags": ["k-means", "clustering", "k-means++", "Lloyd's algorithm"], "hints": ["Squared distances from every point to every centroid in one shot: ((X[:, None, :] - C[None, :, :]) ** 2).sum(-1) has shape (N, k); labels are its argmin over axis 1.", "k-means++: pick the first centroid uniformly, then repeatedly pick a data point with probability proportional to its squared distance to the nearest centroid chosen so far (rng.choice(N, p=d2 / d2.sum())). Keep d2 as the running minimum.", "Lloyd's loop: assign, record the inertia, move each centroid to the mean of its points (keep the old centroid if a cluster is empty), stop when the centroids move less than tol. Each of the two steps can only lower the objective, which is why the history never goes up."], "rubric": [], "timeout": 30, "readme": "<h2>k-means with k-means++ initialization<\/h2>\n<p>k-means is the clustering question because it has a crisp objective, a two-step algorithm that provably never gets worse, and an initialization story (k-means++) that separates people who have used <code>sklearn<\/code> from people who understand why random init fails. Implement Lloyd's algorithm in NumPy with k-means++ seeding and return the objective per iteration so the monotonicity can be checked.<\/p>\n<ul><li><code>kmeans_pp_init(X, k, rng) -&gt; centroids<\/code> of shape <code>(k, D)<\/code>: the first centroid is a uniformly random row of <code>X<\/code>; each next one is a row drawn with probability proportional to its squared distance to the nearest centroid already chosen. Every centroid is an actual row of <code>X<\/code>.<\/li><li><code>assign(X, centroids) -&gt; labels<\/code> of shape <code>(N,)<\/code>: index of the nearest centroid (squared Euclidean distance).<\/li><li><code>inertia(X, centroids, labels) -&gt; float<\/code>: sum over points of the squared distance to their assigned centroid.<\/li><li><code>kmeans(X, k, rng, n_iter=100, tol=1e-6) -&gt; (centroids, labels, history)<\/code>: k-means++ init, then repeat: assign, append the current inertia to <code>history<\/code>, move each centroid to the mean of its points (a cluster that lost all its points keeps its centroid). Stop early when no centroid moves by more than <code>tol<\/code>. <code>history<\/code> is a list or array with at most <code>n_iter<\/code> entries; the returned <code>labels<\/code> and <code>centroids<\/code> are consistent with <code>history[-1]<\/code>.<\/li><\/ul>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">X = np.array([[0, 0], [0, 1], [10, 10], [10, 11]], float)\nC = np.array([[0, 0], [10, 10]], float)\nassign(X, C)          -&gt; [0, 0, 1, 1]\ninertia(X, C, assign(X, C))   -&gt; 2.0\n\ncentroids, labels, history = kmeans(X, 2, np.random.default_rng(0))\ncentroids   -&gt; [[0, 0.5], [10, 10.5]] in some order\nhistory[-1] -&gt; 1.0<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>No loops over points: distances are one broadcasted expression or the <code>||a||^2 - 2 a.b + ||b||^2<\/code> expansion; the means are one <code>np.add.at<\/code> or a boolean-mask sum per cluster (a loop over <code>k<\/code> is fine).<\/li><li><code>history<\/code> must be non-increasing to within floating-point error.<\/li><li>Each iteration is <code>O(N k D)<\/code>.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why the objective never increases: assignment minimizes it over labels for fixed centroids, the mean minimizes it over centroids for fixed labels (the mean is the minimizer of the sum of squared distances).<\/li><li>Why k-means++: random init can put two seeds in one true cluster and leave another cluster split or empty; <code>D^2<\/code> sampling spreads the seeds and bounds the expected objective within <code>O(log k)<\/code> of optimal.<\/li><li>The failure modes: only finds a local optimum (so restart and keep the lowest inertia), assumes spherical clusters of similar size, and <code>k<\/code> has to come from somewhere (elbow, silhouette, or the application).<\/li><li>Follow-up: how you would adapt this to a 1 M-point dataset (mini-batch k-means) or to a kernel or non-Euclidean distance (k-medoids: the mean is no longer the minimizer).<\/li><\/ul>", "starter": "\"\"\"k-means (Lloyd's algorithm) with k-means++ seeding. Vectorized NumPy only.\"\"\"\nimport numpy as np\n\n\ndef kmeans_pp_init(X: np.ndarray, k: int, rng: np.random.Generator) -> np.ndarray:\n    \"\"\"Return k rows of X chosen by D^2 sampling, shape (k, D).\"\"\"\n    raise NotImplementedError\n\n\ndef assign(X: np.ndarray, centroids: np.ndarray) -> np.ndarray:\n    \"\"\"Index of the nearest centroid for each row of X, shape (N,).\"\"\"\n    raise NotImplementedError\n\n\ndef inertia(X: np.ndarray, centroids: np.ndarray, labels: np.ndarray) -> float:\n    \"\"\"Sum of squared distances from each point to its assigned centroid.\"\"\"\n    raise NotImplementedError\n\n\ndef kmeans(X: np.ndarray, k: int, rng: np.random.Generator, n_iter: int = 100, tol: float = 1e-6):\n    \"\"\"Run Lloyd's algorithm from a k-means++ init.\n\n    Returns (centroids (k, D), labels (N,), history) where history holds the inertia at each iteration.\n    \"\"\"\n    raise NotImplementedError\n", "tests": "import numpy as np\n\nfrom solution import assign, inertia, kmeans, kmeans_pp_init\n\nCENTERS = np.array([[0.0, 0.0], [10.0, 0.0], [0.0, 10.0], [10.0, 10.0]])\n\n\ndef blobs(seed=0, n_per=50, scale=0.5):\n    rng = np.random.default_rng(seed)\n    X = np.vstack([c + scale * rng.normal(size=(n_per, 2)) for c in CENTERS])\n    truth = np.repeat(np.arange(len(CENTERS)), n_per)\n    return X, truth\n\n\ndef true_cluster_of(X, rows, truth):\n    \"\"\"Map each row of `rows` (which must be a row of X) to its true cluster id.\"\"\"\n    out = []\n    for r in rows:\n        matches = np.where(np.all(X == r, axis=1))[0]\n        assert len(matches) == 1, \"every k-means++ centroid must be an actual data point\"\n        out.append(truth[matches[0]])\n    return out\n\n\ndef test_assign_and_inertia_hand_example():\n    X = np.array([[0, 0], [0, 1], [10, 10], [10, 11]], float)\n    C = np.array([[0, 0], [10, 10]], float)\n    labels = assign(X, C)\n    assert labels.shape == (4,)\n    assert labels.tolist() == [0, 0, 1, 1]\n    assert np.isclose(inertia(X, C, labels), 2.0)\n    assert np.isclose(inertia(X, np.array([[0, 0.5], [10, 10.5]]), labels), 1.0)\n\n\ndef test_kmeanspp_seeds_land_in_distinct_clusters():\n    X, truth = blobs()\n    for seed in range(5):\n        C = kmeans_pp_init(X, 4, np.random.default_rng(seed))\n        assert C.shape == (4, 2)\n        owners = true_cluster_of(X, C, truth)\n        assert len(set(owners)) == 4, f\"seed {seed}: seeds fell in clusters {owners}; D^2 sampling should spread them\"\n\n\ndef test_recovers_well_separated_clusters_up_to_permutation():\n    X, truth = blobs(seed=1)\n    centroids, labels, history = kmeans(X, 4, np.random.default_rng(1))\n    assert centroids.shape == (4, 2) and labels.shape == (200,)\n    table = np.zeros((4, 4), int)\n    np.add.at(table, (truth, labels), 1)\n    assert np.all((table > 0).sum(axis=1) == 1), f\"a true cluster was split:\\n{table}\"\n    assert np.all((table > 0).sum(axis=0) == 1), f\"a predicted cluster mixes true clusters:\\n{table}\"\n    for c in CENTERS:\n        assert np.min(np.linalg.norm(centroids - c, axis=1)) < 0.3, f\"no centroid near {c}\"\n\n\ndef test_inertia_history_never_increases_and_matches_final_state():\n    X, _ = blobs(seed=2, scale=2.0)          # overlapping clusters: more iterations before convergence\n    centroids, labels, history = kmeans(X, 4, np.random.default_rng(2), n_iter=100)\n    history = np.asarray(history, dtype=float)\n    assert 1 <= len(history) <= 100\n    assert np.all(np.diff(history) <= 1e-8), f\"inertia went up: {history}\"\n    assert np.isclose(history[-1], inertia(X, centroids, labels), rtol=1e-6)\n    assert np.array_equal(labels, assign(X, centroids)), \"returned labels must be the assignment to the returned centroids\"\n\n\ndef test_centroids_are_the_means_of_their_clusters():\n    X, _ = blobs(seed=3)\n    centroids, labels, _ = kmeans(X, 4, np.random.default_rng(3))\n    for j in range(4):\n        assert np.any(labels == j), \"no cluster should end up empty on this data\"\n        assert np.allclose(centroids[j], X[labels == j].mean(axis=0), atol=1e-6)\n\n\ndef test_converges_early_on_easy_data():\n    X, _ = blobs(seed=4)\n    _, _, history = kmeans(X, 4, np.random.default_rng(4), n_iter=100)\n    assert len(history) < 20, f\"should stop once centroids stop moving, ran {len(history)} iterations\"\n\n\ndef test_k_equals_n_gives_zero_inertia():\n    rng = np.random.default_rng(5)\n    X = rng.normal(size=(6, 3))\n    centroids, labels, history = kmeans(X, 6, rng)\n    assert sorted(labels.tolist()) == list(range(6)), \"each point gets its own cluster\"\n    assert np.isclose(history[-1], 0.0, atol=1e-12)\n", "solution": "import numpy as np\n\n\ndef _sq_dists(X: np.ndarray, C: np.ndarray) -> np.ndarray:\n    return ((X[:, None, :] - C[None, :, :]) ** 2).sum(axis=-1)       # (N, k)\n\n\ndef kmeans_pp_init(X: np.ndarray, k: int, rng: np.random.Generator) -> np.ndarray:\n    n = X.shape[0]\n    idx = [int(rng.integers(n))]\n    d2 = ((X - X[idx[0]]) ** 2).sum(axis=1)\n    for _ in range(1, k):\n        i = int(rng.choice(n, p=d2 / d2.sum()))                    # far points are likely, chosen points impossible\n        idx.append(i)\n        d2 = np.minimum(d2, ((X - X[i]) ** 2).sum(axis=1))\n    return X[idx].copy()\n\n\ndef assign(X: np.ndarray, centroids: np.ndarray) -> np.ndarray:\n    return _sq_dists(X, centroids).argmin(axis=1)\n\n\ndef inertia(X: np.ndarray, centroids: np.ndarray, labels: np.ndarray) -> float:\n    return float(((X - centroids[labels]) ** 2).sum())\n\n\ndef kmeans(X: np.ndarray, k: int, rng: np.random.Generator, n_iter: int = 100, tol: float = 1e-6):\n    centroids = kmeans_pp_init(X, k, rng)\n    history = []\n    labels = assign(X, centroids)\n    for _ in range(n_iter):\n        labels = assign(X, centroids)\n        history.append(inertia(X, centroids, labels))\n        new = centroids.copy()\n        for j in range(k):\n            members = labels == j\n            if members.any():\n                new[j] = X[members].mean(axis=0)\n        shift = np.abs(new - centroids).max()\n        centroids = new\n        if shift <= tol:\n            break\n    labels = assign(X, centroids)\n    return centroids, labels, np.asarray(history)\n"}, {"id": "ml-knn", "title": "k-nearest neighbors, vectorized", "track": "ml", "module": "ml-classic", "difficulty": "easy", "minutes": 30, "runtime": "numpy", "kind": "code", "tags": ["k-NN", "pairwise distances", "broadcasting", "argpartition"], "hints": ["||a - b||^2 = ||a||^2 - 2 a.b + ||b||^2. With A (n, d) and B (m, d): (A**2).sum(1)[:, None] - 2 * A @ B.T + (B**2).sum(1)[None, :] gives the full (n, m) matrix with one matrix product. Clip at 0: rounding can make a true 0 come out as -1e-15.", "The k nearest training rows for every test row at once: np.argpartition(D, k - 1, axis=1)[:, :k] on the (m_test, n_train) distance matrix, or np.argsort if k is small relative to n.", "Vote without loops: map labels to 0..C-1 with np.unique(return_inverse=True), one-hot the neighbor labels to (m_test, k, C), sum over k, then argmax over C. argmax returns the first maximum, so with classes in sorted order the tie goes to the smallest label."], "rubric": [], "timeout": 30, "readme": "<h2>k-nearest neighbors, vectorized<\/h2>\n<p>k-NN has no training step, so the whole question is about computing pairwise distances without a Python loop and voting without one either. It is the warm-up that shows whether you reach for broadcasting and the <code>||a||^2 - 2 a.b + ||b||^2<\/code> expansion, which is also how every retrieval system computes similarities at scale.<\/p>\n<ul><li><code>pairwise_sq_dists(A, B)<\/code>: squared Euclidean distances between every row of <code>A<\/code> (shape <code>(n, d)<\/code>) and every row of <code>B<\/code> (shape <code>(m, d)<\/code>), returned as <code>(n, m)<\/code>. Use the expansion with a single matrix product. Clip at 0 so no entry is negative.<\/li><li><code>knn_predict(X_train, y_train, X_test, k)<\/code>: for each test row, take the <code>k<\/code> nearest training rows and return the majority label, shape <code>(m,)<\/code>. Labels are arbitrary integers (they may be negative or non-contiguous). Ties between labels go to the smallest label.<\/li><\/ul>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">X_train = np.array([[0.0], [1.0], [2.0], [3.0]])\ny_train = np.array([5, 5, 2, 2])\nknn_predict(X_train, y_train, np.array([[0.9], [2.4]]), k=1)   -&gt; [5, 2]\nknn_predict(X_train, y_train, np.array([[1.4]]), k=2)          -&gt; [2]   (neighbors 1.0 and 2.0: labels 5 and 2 tie, smallest wins)\nknn_predict(X_train, y_train, np.array([[1.4]]), k=4)          -&gt; [2]<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>No loops over samples anywhere: distances are one expression, neighbor selection is one <code>argpartition<\/code> or <code>argsort<\/code> call, voting is one-hot sums.<\/li><li><code>pairwise_sq_dists(A, A)<\/code> must have an exactly zero (not slightly negative) diagonal.<\/li><li><code>O(n m d)<\/code> time and <code>O(n m)<\/code> memory for the distance matrix; be ready to say what you would do when that matrix does not fit.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>The expansion and why it is faster than broadcasting <code>(A[:, None] - B[None]) ** 2<\/code> (one BLAS matmul versus materializing an <code>(n, m, d)<\/code> tensor), and its numerical cost (cancellation when <code>||a||^2<\/code> and <code>||b||^2<\/code> are large and close, which is where the clipping comes from).<\/li><li><code>argpartition<\/code> versus <code>argsort<\/code>: <code>O(n)<\/code> versus <code>O(n log n)<\/code> per query when you only need the top <code>k<\/code>.<\/li><li>Why the vote must be deterministic under ties and how distance-weighted voting changes the picture.<\/li><li>Follow-up: the curse of dimensionality (distances concentrate as <code>d<\/code> grows), why you standardize features first, and how an approximate index (LSH, HNSW, FAISS IVF) trades exactness for <code>O(log n)<\/code> queries.<\/li><\/ul>", "starter": "\"\"\"k-nearest neighbors classification without Python loops. Vectorized NumPy only.\"\"\"\nimport numpy as np\n\n\ndef pairwise_sq_dists(A: np.ndarray, B: np.ndarray) -> np.ndarray:\n    \"\"\"Squared Euclidean distances between rows of A (n, d) and rows of B (m, d), shape (n, m), never negative.\"\"\"\n    raise NotImplementedError\n\n\ndef knn_predict(X_train: np.ndarray, y_train: np.ndarray, X_test: np.ndarray, k: int) -> np.ndarray:\n    \"\"\"Majority label among the k nearest training rows for each test row, shape (m,). Ties go to the smallest label.\"\"\"\n    raise NotImplementedError\n", "tests": "import numpy as np\n\nfrom solution import knn_predict, pairwise_sq_dists\n\n\ndef test_pairwise_matches_broadcast_reference_and_is_nonnegative():\n    rng = np.random.default_rng(0)\n    A, B = rng.normal(size=(7, 4)), rng.normal(size=(5, 4))\n    D = pairwise_sq_dists(A, B)\n    ref = ((A[:, None, :] - B[None, :, :]) ** 2).sum(-1)\n    assert D.shape == (7, 5)\n    assert np.allclose(D, ref, atol=1e-10)\n    big = rng.normal(size=(50, 8)) * 1e4 + 1e6           # large norms: cancellation territory\n    DD = pairwise_sq_dists(big, big)\n    assert np.all(DD >= 0), \"clip at zero: the expansion can produce tiny negative values\"\n    assert np.allclose(np.diag(pairwise_sq_dists(A, A)), 0.0, atol=1e-9)\n\n\ndef test_k1_returns_label_of_the_nearest_point():\n    X_train = np.array([[0.0], [1.0], [2.0], [3.0]])\n    y_train = np.array([5, 5, 2, 2])\n    pred = knn_predict(X_train, y_train, np.array([[0.9], [2.4], [-10.0]]), k=1)\n    assert pred.shape == (3,)\n    assert pred.tolist() == [5, 2, 5]\n\n\ndef test_majority_vote_and_smallest_label_tie_break():\n    X_train = np.array([[0.0], [1.0], [2.0], [3.0], [4.0]])\n    y_train = np.array([5, 5, 2, 2, 2])\n    assert knn_predict(X_train, y_train, np.array([[1.4]]), k=2).tolist() == [2], \"5 vs 2 tie -> 2\"\n    assert knn_predict(X_train, y_train, np.array([[1.4]]), k=3).tolist() == [5], \"neighbors 1, 2, 0 -> labels 5, 2, 5\"\n    assert knn_predict(X_train, y_train, np.array([[1.4]]), k=5).tolist() == [2]\n    y_neg = np.array([-1, -1, 7, 7, 7])\n    assert knn_predict(X_train, y_neg, np.array([[1.4]]), k=2).tolist() == [-1], \"labels may be negative\"\n    assert knn_predict(X_train, y_neg, np.array([[1.4]]), k=4).tolist() == [-1], \"neighbors 1, 2, 0, 3: two of each label\"\n    assert knn_predict(X_train, y_neg, np.array([[1.4]]), k=5).tolist() == [7]\n\n\ndef test_predicts_two_blobs_correctly():\n    rng = np.random.default_rng(1)\n    X_train = np.vstack([rng.normal(size=(40, 3)), rng.normal(size=(40, 3)) + 6.0])\n    y_train = np.array([10] * 40 + [20] * 40)\n    X_test = np.vstack([rng.normal(size=(10, 3)), rng.normal(size=(10, 3)) + 6.0])\n    pred = knn_predict(X_train, y_train, X_test, k=5)\n    assert pred.tolist() == [10] * 10 + [20] * 10\n\n\ndef test_matches_bruteforce_on_random_data():\n    rng = np.random.default_rng(2)\n    X_train = rng.normal(size=(60, 5))\n    y_train = rng.integers(0, 3, size=60)\n    X_test = rng.normal(size=(15, 5))\n    k = 7\n    pred = knn_predict(X_train, y_train, X_test, k)\n    for i in range(15):\n        d = ((X_train - X_test[i]) ** 2).sum(axis=1)\n        nn = np.argsort(d)[:k]\n        counts = np.bincount(y_train[nn], minlength=3)\n        best = np.flatnonzero(counts == counts.max()).min()\n        assert pred[i] == best, f\"test row {i}: got {pred[i]}, expected {best}\"\n\n\ndef test_larger_input_runs_vectorized():\n    rng = np.random.default_rng(3)\n    X_train = rng.normal(size=(3000, 16))\n    y_train = rng.integers(0, 4, size=3000)\n    X_test = rng.normal(size=(400, 16))\n    pred = knn_predict(X_train, y_train, X_test, k=9)\n    assert pred.shape == (400,)\n    assert set(np.unique(pred)) <= {0, 1, 2, 3}\n", "solution": "import numpy as np\n\n\ndef pairwise_sq_dists(A: np.ndarray, B: np.ndarray) -> np.ndarray:\n    a2 = (A ** 2).sum(axis=1)[:, None]\n    b2 = (B ** 2).sum(axis=1)[None, :]\n    return np.maximum(a2 - 2.0 * A @ B.T + b2, 0.0)\n\n\ndef knn_predict(X_train: np.ndarray, y_train: np.ndarray, X_test: np.ndarray, k: int) -> np.ndarray:\n    classes, y_idx = np.unique(y_train, return_inverse=True)         # sorted classes -> ties favor the smallest\n    D = pairwise_sq_dists(X_test, X_train)                           # (m, n)\n    nn = np.argpartition(D, k - 1, axis=1)[:, :k]                    # (m, k) unordered nearest neighbors\n    votes = np.zeros((X_test.shape[0], len(classes)), dtype=int)\n    np.add.at(votes, (np.arange(X_test.shape[0])[:, None], y_idx[nn]), 1)\n    return classes[votes.argmax(axis=1)]                             # argmax takes the first max\n"}, {"id": "ml-pca-svd", "title": "PCA via SVD", "track": "ml", "module": "ml-classic", "difficulty": "medium", "minutes": 35, "runtime": "numpy", "kind": "code", "tags": ["PCA", "SVD", "dimensionality reduction", "linear algebra"], "hints": ["Center first: Xc = X - X.mean(0). Then U, S, Vt = np.linalg.svd(Xc, full_matrices=False). The rows of Vt are the principal directions, already sorted by singular value.", "The variance along component i is S[i]**2 / (N - 1), because Xc.T @ Xc / (N - 1) = V diag(S^2 / (N - 1)) V.T. The ratio divides by the total over all D components, not just the ones you keep.", "transform is (X - mean) @ components.T; inverse_transform is Z @ components + mean. With all components kept the round trip is exact because V is orthonormal."], "rubric": [], "timeout": 30, "readme": "<h2>PCA via SVD<\/h2>\n<p>PCA is asked to see whether you connect three views of the same thing: maximum-variance directions, eigenvectors of the covariance, and the singular vectors of the centered data. The SVD route is the one to implement (it never forms the covariance matrix and is numerically the best behaved); the eigendecomposition is what the tests use as an independent reference.<\/p>\n<p>Implement, with <code>X<\/code> of shape <code>(N, D)<\/code>:<\/p>\n<ul><li><code>pca_fit(X, n_components) -&gt; model<\/code>: a dict with <code>\"mean\"<\/code> (shape <code>(D,)<\/code>), <code>\"components\"<\/code> (shape <code>(n_components, D)<\/code>, rows are unit-length principal directions sorted by decreasing variance), <code>\"explained_variance\"<\/code> (shape <code>(n_components,)<\/code>, the variance of the data along each component, with the <code>N - 1<\/code> denominator) and <code>\"explained_variance_ratio\"<\/code> (each component's variance divided by the total variance of <code>X<\/code> across all <code>D<\/code> dimensions).<\/li><li><code>pca_transform(X, model) -&gt; Z<\/code> of shape <code>(N, n_components)<\/code>: center with the stored mean and project.<\/li><li><code>pca_inverse_transform(Z, model) -&gt; X_hat<\/code> of shape <code>(N, D)<\/code>: map scores back to the original space.<\/li><\/ul>\n<p>Component signs are arbitrary (an eigenvector times -1 is still an eigenvector); the tests compare up to sign.<\/p>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">X = np.array([[-2, -1], [-1, -0.5], [1, 0.5], [2, 1]], float)   # exactly on a line of slope 1/2\nm = pca_fit(X, 1)\nm[\"components\"]                -&gt; [[0.894, 0.447]] (or its negative)\nm[\"explained_variance_ratio\"]  -&gt; [1.0]\npca_inverse_transform(pca_transform(X, m), m)  -&gt; X (exact reconstruction)<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>No loops; <code>np.linalg.svd<\/code> with <code>full_matrices=False<\/code> and matrix products only.<\/li><li>Do not form <code>X.T @ X<\/code> for the fit (that squares the condition number); the <code>(N - 1)<\/code> convention must match the covariance exactly.<\/li><li>SVD cost is <code>O(N D min(N, D))<\/code>; know when a randomized or truncated SVD is the right call.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>The link between the three views: <code>X_c = U S V^T<\/code> gives <code>X_c^T X_c / (N - 1) = V (S^2 / (N - 1)) V^T<\/code>, so the right singular vectors are the covariance eigenvectors and the eigenvalues are <code>S^2 / (N - 1)<\/code>.<\/li><li>Why you must center (otherwise the first component points at the mean) and when you should also standardize (features on different scales, otherwise the biggest-variance feature wins by units alone).<\/li><li>Reconstruction error with <code>k<\/code> components equals the sum of the dropped eigenvalues; this is the Eckart-Young statement that PCA is the best rank-<code>k<\/code> approximation in the Frobenius norm.<\/li><li>Follow-up: how you would run PCA on 10 M rows that do not fit in memory (incremental or randomized SVD, or the covariance of streamed mini-batches), and how it relates to the autoencoder with a linear decoder.<\/li><\/ul>", "starter": "\"\"\"Principal component analysis through the SVD of the centered data. Vectorized NumPy only.\"\"\"\nimport numpy as np\n\n\ndef pca_fit(X: np.ndarray, n_components: int) -> dict:\n    \"\"\"Return {\"mean\": (D,), \"components\": (n_components, D), \"explained_variance\": (n_components,),\n    \"explained_variance_ratio\": (n_components,)}. Components are unit rows sorted by decreasing variance.\"\"\"\n    raise NotImplementedError\n\n\ndef pca_transform(X: np.ndarray, model: dict) -> np.ndarray:\n    \"\"\"Project centered X onto the components, shape (N, n_components).\"\"\"\n    raise NotImplementedError\n\n\ndef pca_inverse_transform(Z: np.ndarray, model: dict) -> np.ndarray:\n    \"\"\"Map scores back to the original space, shape (N, D).\"\"\"\n    raise NotImplementedError\n", "tests": "import numpy as np\n\nfrom solution import pca_fit, pca_inverse_transform, pca_transform\n\n\ndef correlated_data(seed=0, n=200, d=5):\n    rng = np.random.default_rng(seed)\n    latent = rng.normal(size=(n, d)) * np.array([5.0, 3.0, 1.5, 0.7, 0.2])[:d]\n    mix = np.linalg.qr(rng.normal(size=(d, d)))[0]\n    return latent @ mix + rng.normal(size=d) * 10          # rotated, with a big offset\n\n\ndef eig_reference(X):\n    Xc = X - X.mean(axis=0)\n    cov = Xc.T @ Xc / (len(X) - 1)\n    vals, vecs = np.linalg.eigh(cov)\n    order = np.argsort(vals)[::-1]\n    return vals[order], vecs[:, order].T\n\n\ndef test_shapes_and_orthonormal_components():\n    X = correlated_data()\n    m = pca_fit(X, 3)\n    assert m[\"mean\"].shape == (5,) and np.allclose(m[\"mean\"], X.mean(axis=0))\n    assert m[\"components\"].shape == (3, 5)\n    assert m[\"explained_variance\"].shape == (3,) and m[\"explained_variance_ratio\"].shape == (3,)\n    assert np.allclose(m[\"components\"] @ m[\"components\"].T, np.eye(3), atol=1e-10)\n    assert pca_transform(X, m).shape == (200, 3)\n    assert pca_inverse_transform(pca_transform(X, m), m).shape == (200, 5)\n\n\ndef test_matches_eigendecomposition_up_to_sign():\n    X = correlated_data(seed=1)\n    vals, vecs = eig_reference(X)\n    m = pca_fit(X, 5)\n    assert np.allclose(m[\"explained_variance\"], vals, rtol=1e-8)\n    assert np.all(np.diff(m[\"explained_variance\"]) <= 1e-12), \"components must be sorted by decreasing variance\"\n    for i in range(5):\n        assert np.isclose(abs(m[\"components\"][i] @ vecs[i]), 1.0, atol=1e-8), f\"component {i} differs from the eigenvector\"\n\n\ndef test_explained_variance_ratio():\n    X = correlated_data(seed=2)\n    total = ((X - X.mean(axis=0)) ** 2).sum() / (len(X) - 1)\n    full = pca_fit(X, 5)\n    assert np.isclose(full[\"explained_variance_ratio\"].sum(), 1.0, atol=1e-10)\n    two = pca_fit(X, 2)\n    assert np.allclose(two[\"explained_variance_ratio\"], two[\"explained_variance\"] / total)\n    assert two[\"explained_variance_ratio\"].sum() < 1.0, \"the ratio is over the total variance, not over the kept components\"\n    assert np.allclose(two[\"explained_variance_ratio\"], full[\"explained_variance_ratio\"][:2])\n\n\ndef test_transform_is_centered_projection_with_uncorrelated_scores():\n    X = correlated_data(seed=3)\n    m = pca_fit(X, 3)\n    Z = pca_transform(X, m)\n    assert np.allclose(Z, (X - m[\"mean\"]) @ m[\"components\"].T, atol=1e-10)\n    assert np.allclose(Z.mean(axis=0), 0.0, atol=1e-8)\n    cov_z = Z.T @ Z / (len(X) - 1)\n    assert np.allclose(cov_z, np.diag(m[\"explained_variance\"]), atol=1e-8), \"scores are uncorrelated with variance = eigenvalue\"\n\n\ndef test_reconstruction_error_decreases_and_vanishes_at_full_rank():\n    X = correlated_data(seed=4)\n    vals, _ = eig_reference(X)\n    errs = []\n    for k in range(1, 6):\n        m = pca_fit(X, k)\n        X_hat = pca_inverse_transform(pca_transform(X, m), m)\n        errs.append(((X - X_hat) ** 2).sum() / (len(X) - 1))\n        assert np.isclose(errs[-1], vals[k:].sum(), rtol=1e-6), f\"error with {k} components should be the dropped variance\"\n    assert all(a > b for a, b in zip(errs, errs[1:]))\n    assert errs[-1] < 1e-8\n\n\ndef test_exactly_low_rank_data():\n    X = np.array([[-2, -1], [-1, -0.5], [1, 0.5], [2, 1]], float)\n    m = pca_fit(X, 1)\n    assert np.isclose(abs(m[\"components\"][0] @ np.array([2, 1]) / np.sqrt(5)), 1.0)\n    assert np.isclose(m[\"explained_variance_ratio\"][0], 1.0)\n    assert np.allclose(pca_inverse_transform(pca_transform(X, m), m), X, atol=1e-10)\n    rng = np.random.default_rng(5)\n    X = rng.normal(size=(50, 2)) @ rng.normal(size=(2, 6))       # rank 2 in 6-D\n    m = pca_fit(X, 2)\n    assert np.isclose(m[\"explained_variance_ratio\"].sum(), 1.0, atol=1e-10)\n    assert np.allclose(pca_inverse_transform(pca_transform(X, m), m), X, atol=1e-8)\n", "solution": "import numpy as np\n\n\ndef pca_fit(X: np.ndarray, n_components: int) -> dict:\n    mean = X.mean(axis=0)\n    Xc = X - mean\n    _, S, Vt = np.linalg.svd(Xc, full_matrices=False)      # rows of Vt: eigenvectors of the covariance, sorted\n    var = S ** 2 / (X.shape[0] - 1)                         # eigenvalues of Xc.T Xc / (N - 1)\n    return {\n        \"mean\": mean,\n        \"components\": Vt[:n_components],\n        \"explained_variance\": var[:n_components],\n        \"explained_variance_ratio\": var[:n_components] / var.sum(),\n    }\n\n\ndef pca_transform(X: np.ndarray, model: dict) -> np.ndarray:\n    return (X - model[\"mean\"]) @ model[\"components\"].T\n\n\ndef pca_inverse_transform(Z: np.ndarray, model: dict) -> np.ndarray:\n    return Z @ model[\"components\"] + model[\"mean\"]\n"}, {"id": "ml-decision-tree", "title": "A CART decision tree classifier", "track": "ml", "module": "ml-classic", "difficulty": "hard", "minutes": 50, "runtime": "numpy", "kind": "code", "tags": ["decision tree", "CART", "Gini impurity", "recursion"], "hints": ["Gini of a label vector: counts = np.unique(y, return_counts=True)[1]; p = counts / counts.sum(); gini = 1 - (p ** 2).sum(). The gain of a split is gini(parent) - (n_left * gini(left) + n_right * gini(right)) / n.", "Per feature: sort the values, one-hot the sorted labels, and take a cumulative sum. Row i of the cumsum holds the class counts of the first i + 1 points, so every candidate split's left and right Gini comes from one vectorized expression. Only positions where the value changes are candidates; the threshold is the midpoint.", "Build recursively: stop and return a leaf {'value': majority} when the node is pure, depth == max_depth, fewer than 2 * min_samples_leaf samples, or no split has positive gain. Otherwise recurse on x[:, f] <= t and x[:, f] > t with depth + 1."], "rubric": [], "timeout": 30, "readme": "<h2>A CART decision tree classifier<\/h2>\n<p>Trees are the \"can you write a recursive algorithm with a clear stopping rule and a vectorized inner loop\" question, and the base learner of the gradient-boosting models you used for quality estimation. Implement a CART classifier with Gini impurity, axis-aligned thresholds at the midpoints between consecutive distinct feature values, a depth limit and a minimum leaf size.<\/p>\n<ul><li><code>gini(y) -&gt; float<\/code>: <code>1 - sum_c p_c^2<\/code> for integer labels <code>y<\/code>.<\/li><li><code>best_split(X, y, min_samples_leaf=1) -&gt; (feature, threshold, gain) or None<\/code>: search every feature and every midpoint between consecutive distinct sorted values; a split sends <code>x[:, feature] &lt;= threshold<\/code> left. Only splits that leave at least <code>min_samples_leaf<\/code> samples on each side count. Return the split with the largest Gini gain, or <code>None<\/code> if there is no valid split with positive gain.<\/li><li><code>class DecisionTree(max_depth=None, min_samples_leaf=1)<\/code> with <code>fit(X, y) -&gt; self<\/code> and <code>predict(X) -&gt; labels<\/code> of shape <code>(N,)<\/code>. After <code>fit<\/code>, <code>self.root<\/code> holds the tree as nested dicts: a leaf is <code>{\"value\": label}<\/code> and an internal node is <code>{\"feature\": f, \"threshold\": t, \"left\": node, \"right\": node}<\/code>. A leaf predicts the majority label (ties to the smallest label). A node becomes a leaf when it is pure, when <code>depth == max_depth<\/code> (the root has depth 0), when it has fewer than <code>2 * min_samples_leaf<\/code> samples, or when <code>best_split<\/code> returns <code>None<\/code>.<\/li><\/ul>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">X = np.array([[1.0], [2.0], [3.0], [10.0], [11.0], [12.0]])\ny = np.array([0, 0, 0, 1, 1, 1])\ngini(y)                      -&gt; 0.5\nbest_split(X, y)             -&gt; (0, 6.5, 0.5)\nbest_split(X, y, min_samples_leaf=4)  -&gt; None\n\ntree = DecisionTree(max_depth=2).fit(X2, y2)     # y2 = (x0 &gt; 0) &amp; (x1 &gt; 0)\ntree.root   -&gt; {\"feature\": 0, \"threshold\": ..., \"left\": {\"value\": 0}, \"right\": {\"feature\": 1, ...}}<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>The split search for one feature must be vectorized over thresholds (sort once, cumulative class counts): <code>O(D N log N)<\/code> per node, not <code>O(D N^2)<\/code>.<\/li><li>Loops over features and the recursion over nodes are fine; no loop over samples inside the split search.<\/li><li>Thresholds must be the midpoints (a test checks the exact value), and the depth limit and leaf size must be respected exactly (tests walk <code>root<\/code>).<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why Gini (or entropy) instead of misclassification error: the impurity must be strictly concave so that a split that does not change the majority can still have positive gain.<\/li><li>Greedy top-down search is not optimal: XOR has zero gain at the root for every split, so a greedy tree needs luck or depth to find it. That motivates ensembles.<\/li><li>The complexity argument for the sorted cumulative-count scan, and why trees need no feature scaling and are invariant to monotone transforms.<\/li><li>Follow-up: how bagging (random forests, feature subsampling) and boosting (fit the next tree to the gradient of the loss, shrink with a learning rate) change the bias-variance trade-off of this learner, and which hyperparameters here matter most for XGBoost.<\/li><\/ul>", "starter": "\"\"\"A CART classifier with Gini impurity. NumPy only; recursion over nodes, vectorized split search.\"\"\"\nimport numpy as np\n\n\ndef gini(y: np.ndarray) -> float:\n    \"\"\"1 - sum_c p_c^2 for integer labels y.\"\"\"\n    raise NotImplementedError\n\n\ndef best_split(X: np.ndarray, y: np.ndarray, min_samples_leaf: int = 1):\n    \"\"\"Best (feature, threshold, gain) over all features and midpoints between consecutive distinct values.\n\n    Left child is x[:, feature] <= threshold. Returns None if no valid split with positive gain exists.\n    \"\"\"\n    raise NotImplementedError\n\n\nclass DecisionTree:\n    def __init__(self, max_depth: int | None = None, min_samples_leaf: int = 1):\n        self.max_depth = max_depth\n        self.min_samples_leaf = min_samples_leaf\n        self.root = None    # leaf: {\"value\": label}; node: {\"feature\", \"threshold\", \"left\", \"right\"}\n\n    def fit(self, X: np.ndarray, y: np.ndarray) -> \"DecisionTree\":\n        raise NotImplementedError\n\n    def predict(self, X: np.ndarray) -> np.ndarray:\n        \"\"\"Labels of shape (N,).\"\"\"\n        raise NotImplementedError\n", "tests": "import numpy as np\n\nfrom solution import DecisionTree, best_split, gini\n\n\ndef depth(node):\n    if \"value\" in node:\n        return 0\n    return 1 + max(depth(node[\"left\"]), depth(node[\"right\"]))\n\n\ndef leaf_sizes(node, X):\n    \"\"\"Number of training rows routed to each leaf.\"\"\"\n    if \"value\" in node:\n        return [len(X)]\n    m = X[:, node[\"feature\"]] <= node[\"threshold\"]\n    return leaf_sizes(node[\"left\"], X[m]) + leaf_sizes(node[\"right\"], X[~m])\n\n\ndef rectangle_data(seed=1, n=300):\n    rng = np.random.default_rng(seed)\n    X = rng.uniform(-1, 1, size=(n, 2))\n    y = ((X[:, 0] > 0) & (X[:, 1] > 0)).astype(int)\n    return X, y\n\n\ndef test_gini_values():\n    assert np.isclose(gini(np.array([1, 1, 1, 1])), 0.0)\n    assert np.isclose(gini(np.array([0, 1, 0, 1])), 0.5)\n    assert np.isclose(gini(np.array([0, 1, 2])), 2.0 / 3.0)\n    assert np.isclose(gini(np.array([7, 7, 7, 3])), 0.375)\n\n\ndef test_best_split_finds_midpoint_and_respects_min_leaf():\n    X = np.array([[1.0], [2.0], [3.0], [10.0], [11.0], [12.0]])\n    y = np.array([0, 0, 0, 1, 1, 1])\n    f, t, gain = best_split(X, y)\n    assert f == 0 and np.isclose(t, 6.5) and np.isclose(gain, 0.5)\n    assert best_split(X, y, min_samples_leaf=4) is None, \"no split can leave 4 samples on both sides\"\n    assert best_split(X, np.zeros(6, int)) is None, \"a pure node has no split with positive gain\"\n    assert best_split(np.ones((6, 1)), y) is None, \"a constant feature has no threshold\"\n\n\ndef test_best_split_ignores_a_noise_feature():\n    rng = np.random.default_rng(0)\n    x0 = rng.uniform(-1, 1, size=200)\n    X = np.column_stack([x0, rng.uniform(-1, 1, size=200)])\n    y = (x0 > 0.3).astype(int)\n    f, t, gain = best_split(X, y)\n    below, above = x0[x0 <= 0.3].max(), x0[x0 > 0.3].min()\n    assert f == 0\n    assert np.isclose(t, (below + above) / 2), f\"threshold {t} should be the midpoint between {below} and {above}\"\n    assert np.isclose(gain, gini(y)), \"a perfect split removes all impurity\"\n\n\ndef test_fits_rectangle_rule_exactly_with_depth_two():\n    X, y = rectangle_data()\n    tree = DecisionTree(max_depth=2).fit(X, y)\n    assert isinstance(tree.root, dict) and \"feature\" in tree.root\n    assert depth(tree.root) == 2\n    pred = tree.predict(X)\n    assert pred.shape == (300,)\n    assert np.mean(pred == y) == 1.0\n    X_test, y_test = rectangle_data(seed=2, n=1000)\n    assert np.mean(tree.predict(X_test) == y_test) >= 0.98\n\n\ndef test_depth_limit_is_respected():\n    X, y = rectangle_data(seed=3)\n    for d in [0, 1, 2, 3]:\n        tree = DecisionTree(max_depth=d).fit(X, y)\n        assert depth(tree.root) <= d, f\"max_depth={d} but tree has depth {depth(tree.root)}\"\n    stump = DecisionTree(max_depth=0).fit(X, y)\n    assert stump.root == {\"value\": 0}, \"depth 0 is a single leaf predicting the majority class\"\n    acc1 = np.mean(DecisionTree(max_depth=1).fit(X, y).predict(X) == y)\n    assert 0.7 < acc1 < 1.0, \"one split cannot express an AND of two features\"\n\n\ndef test_min_samples_leaf_is_respected():\n    X, y = rectangle_data(seed=4)\n    y = y.copy()\n    y[::7] = 1 - y[::7]                       # label noise: an unconstrained tree grows tiny leaves\n    free = DecisionTree().fit(X, y)\n    assert min(leaf_sizes(free.root, X)) < 10\n    assert np.mean(free.predict(X) == y) == 1.0, \"an unconstrained tree fits the training set\"\n    tree = DecisionTree(min_samples_leaf=10).fit(X, y)\n    sizes = leaf_sizes(tree.root, X)\n    assert min(sizes) >= 10, f\"smallest leaf has {min(sizes)} samples\"\n    assert sum(sizes) == 300\n\n\ndef test_three_blobs_multiclass():\n    rng = np.random.default_rng(5)\n    centers = np.array([[0.0, 0.0], [5.0, 5.0], [0.0, 6.0]])\n    X = np.vstack([c + rng.normal(size=(60, 2)) for c in centers])\n    y = np.repeat([3, 1, 2], 60)                  # labels not 0..C-1 on purpose\n    tree = DecisionTree(max_depth=6, min_samples_leaf=2).fit(X, y)\n    assert np.mean(tree.predict(X) == y) >= 0.98\n    X_test = np.vstack([c + rng.normal(size=(200, 2)) for c in centers])\n    y_test = np.repeat([3, 1, 2], 200)\n    assert np.mean(tree.predict(X_test) == y_test) >= 0.95\n    assert set(np.unique(tree.predict(X_test))) <= {1, 2, 3}\n", "solution": "import numpy as np\n\n\ndef gini(y: np.ndarray) -> float:\n    _, counts = np.unique(y, return_counts=True)\n    p = counts / counts.sum()\n    return float(1.0 - (p ** 2).sum())\n\n\ndef best_split(X: np.ndarray, y: np.ndarray, min_samples_leaf: int = 1):\n    n, d = X.shape\n    classes = np.unique(y)\n    if len(classes) < 2 or n < 2 * min_samples_leaf:\n        return None\n    parent = gini(y)\n    best = None\n    for f in range(d):\n        order = np.argsort(X[:, f], kind=\"stable\")\n        xs, ys = X[order, f], y[order]\n        onehot = (ys[:, None] == classes[None, :]).astype(float)\n        left = onehot.cumsum(axis=0)[:-1]                      # class counts of the first i + 1 points\n        right = onehot.sum(axis=0) - left\n        n_left = np.arange(1, n)\n        n_right = n - n_left\n        g_left = 1.0 - ((left / n_left[:, None]) ** 2).sum(axis=1)\n        g_right = 1.0 - ((right / n_right[:, None]) ** 2).sum(axis=1)\n        gain = parent - (n_left * g_left + n_right * g_right) / n\n        valid = (xs[1:] != xs[:-1]) & (n_left >= min_samples_leaf) & (n_right >= min_samples_leaf)\n        if not valid.any():\n            continue\n        gain = np.where(valid, gain, -np.inf)\n        i = int(np.argmax(gain))\n        if gain[i] > 0 and (best is None or gain[i] > best[2]):\n            best = (f, float((xs[i] + xs[i + 1]) / 2), float(gain[i]))\n    return best\n\n\nclass DecisionTree:\n    def __init__(self, max_depth: int | None = None, min_samples_leaf: int = 1):\n        self.max_depth = max_depth\n        self.min_samples_leaf = min_samples_leaf\n        self.root = None\n\n    def _build(self, X, y, depth):\n        values, counts = np.unique(y, return_counts=True)\n        leaf = {\"value\": int(values[np.argmax(counts)])}        # first max -> smallest label on ties\n        if len(values) == 1 or (self.max_depth is not None and depth >= self.max_depth) \\\n                or len(y) < 2 * self.min_samples_leaf:\n            return leaf\n        split = best_split(X, y, self.min_samples_leaf)\n        if split is None:\n            return leaf\n        f, t, _ = split\n        m = X[:, f] <= t\n        return {\"feature\": f, \"threshold\": t,\n                \"left\": self._build(X[m], y[m], depth + 1),\n                \"right\": self._build(X[~m], y[~m], depth + 1)}\n\n    def fit(self, X: np.ndarray, y: np.ndarray) -> \"DecisionTree\":\n        self.root = self._build(np.asarray(X, dtype=float), np.asarray(y), 0)\n        return self\n\n    def _predict_node(self, node, X, out, idx):\n        if \"value\" in node:\n            out[idx] = node[\"value\"]\n            return\n        m = X[idx, node[\"feature\"]] <= node[\"threshold\"]\n        self._predict_node(node[\"left\"], X, out, idx[m])\n        self._predict_node(node[\"right\"], X, out, idx[~m])\n\n    def predict(self, X: np.ndarray) -> np.ndarray:\n        X = np.asarray(X, dtype=float)\n        out = np.empty(X.shape[0], dtype=int)\n        self._predict_node(self.root, X, out, np.arange(X.shape[0]))\n        return out\n"}, {"id": "ml-metrics", "title": "Classification metrics from scratch", "track": "ml", "module": "ml-eval", "difficulty": "medium", "minutes": 40, "runtime": "numpy", "kind": "code", "tags": ["precision", "recall", "F1", "ROC AUC", "log-loss", "confusion matrix"], "hints": ["The confusion matrix in one line: np.add.at(cm, (y_true, y_pred), 1), or np.bincount(y_true * C + y_pred, minlength=C * C).reshape(C, C). Then tp = diag, predicted counts = column sums, true counts = row sums.", "AUC is the probability that a random positive scores above a random negative, with ties counting one half. Rank the scores with average ranks for ties: AUC = (sum of positive ranks - n_pos (n_pos + 1) / 2) / (n_pos n_neg). np.unique(scores, return_inverse=True, return_counts=True) gives each tie group; its average rank is (first + last) / 2.", "Divide safely: np.divide(a, b, out=np.zeros_like(a, dtype=float), where=b > 0) returns 0 where the denominator is 0. For log-loss, clip p to [eps, 1 - eps] before the log."], "rubric": [], "timeout": 30, "readme": "<h2>Classification metrics from scratch<\/h2>\n<p>Every applied-scientist loop has a round where you compute metrics by hand, and the follow-ups are where it gets interesting: which average to use for imbalanced classes, what AUC actually measures, why ties matter, and why log-loss needs clipping. Implement these in NumPy without loops over samples.<\/p>\n<ul><li><code>confusion_matrix(y_true, y_pred, n_classes)<\/code>: shape <code>(C, C)<\/code>, rows are true classes, columns predicted, integer counts. Labels are <code>0..C-1<\/code>.<\/li><li><code>precision_recall_f1(y_true, y_pred, n_classes)<\/code>: a dict with per-class arrays <code>\"precision\"<\/code>, <code>\"recall\"<\/code>, <code>\"f1\"<\/code> (shape <code>(C,)<\/code>), plus floats <code>\"macro_f1\"<\/code> (mean of per-class F1) and <code>\"micro_f1\"<\/code> (F1 computed from the pooled TP, FP, FN). Any <code>0 / 0<\/code> is defined as 0.<\/li><li><code>roc_auc(y_true, scores)<\/code>: binary labels in <code>{0, 1}<\/code> and real-valued scores. The probability that a uniformly random positive outscores a uniformly random negative, counting ties as one half. Rank-based, <code>O(n log n)<\/code>, no pairwise loop.<\/li><li><code>log_loss(y_true, p, eps=1e-15)<\/code>: mean binary cross-entropy of <code>P(y = 1)<\/code> predictions <code>p<\/code>, clipped to <code>[eps, 1 - eps]<\/code> first.<\/li><\/ul>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">y_true = np.array([0, 0, 1, 1, 2, 2])\ny_pred = np.array([0, 1, 1, 1, 2, 0])\nconfusion_matrix(y_true, y_pred, 3)   -&gt; [[1, 1, 0],\n                                          [0, 2, 0],\n                                          [1, 0, 1]]\nprecision_recall_f1(...)[\"precision\"] -&gt; [0.5, 0.667, 1.0]\nprecision_recall_f1(...)[\"recall\"]    -&gt; [0.5, 1.0, 0.5]\nprecision_recall_f1(...)[\"micro_f1\"]  -&gt; 0.667   (= accuracy, 4 of 6)\n\nroc_auc(np.array([0, 0, 1, 1]), np.array([0.1, 0.4, 0.35, 0.8]))  -&gt; 0.75\nlog_loss(np.array([1, 0]), np.array([0.9, 0.1]))                   -&gt; 0.1054<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>No loops over samples: the confusion matrix is one <code>np.add.at<\/code> or <code>bincount<\/code>; AUC uses ranks from <code>argsort<\/code>/<code>unique<\/code>.<\/li><li><code>roc_auc<\/code> must match an all-pairs reference exactly on data with many tied scores.<\/li><li><code>log_loss<\/code> must be finite for <code>p<\/code> exactly 0 or 1.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why micro-F1 equals accuracy for single-label multi-class (every false positive for one class is a false negative for another), so macro-F1 is the one that reflects minority-class performance.<\/li><li>The AUC-as-probability interpretation (Mann-Whitney U), which is why it is rank-based, insensitive to calibration, and why ties get half credit; and the trap of AUC on heavily imbalanced data, where precision-recall curves are more informative.<\/li><li>Why log-loss must clip: a single confident wrong prediction is <code>-log(0) = inf<\/code>, and the clip value sets the maximum penalty a model can incur (<code>-log(1e-15) = 34.5<\/code>).<\/li><li>Follow-up: how you would get confidence intervals for these metrics (bootstrap over samples) and when to threshold at something other than 0.5.<\/li><\/ul>", "starter": "\"\"\"Classification metrics without sklearn. Vectorized NumPy only.\"\"\"\nimport numpy as np\n\n\ndef confusion_matrix(y_true: np.ndarray, y_pred: np.ndarray, n_classes: int) -> np.ndarray:\n    \"\"\"(C, C) integer counts; rows are true labels, columns predicted labels.\"\"\"\n    raise NotImplementedError\n\n\ndef precision_recall_f1(y_true: np.ndarray, y_pred: np.ndarray, n_classes: int) -> dict:\n    \"\"\"{\"precision\": (C,), \"recall\": (C,), \"f1\": (C,), \"macro_f1\": float, \"micro_f1\": float}; 0/0 counts as 0.\"\"\"\n    raise NotImplementedError\n\n\ndef roc_auc(y_true: np.ndarray, scores: np.ndarray) -> float:\n    \"\"\"P(score of a random positive > score of a random negative), ties count 1/2. Rank-based.\"\"\"\n    raise NotImplementedError\n\n\ndef log_loss(y_true: np.ndarray, p: np.ndarray, eps: float = 1e-15) -> float:\n    \"\"\"Mean binary cross-entropy of P(y = 1) predictions p, clipped to [eps, 1 - eps].\"\"\"\n    raise NotImplementedError\n", "tests": "import numpy as np\n\nfrom solution import confusion_matrix, log_loss, precision_recall_f1, roc_auc\n\nY_TRUE = np.array([0, 0, 1, 1, 2, 2])\nY_PRED = np.array([0, 1, 1, 1, 2, 0])\n\n\ndef auc_pairs(y, s):\n    pos, neg = s[y == 1], s[y == 0]\n    gt = (pos[:, None] > neg[None, :]).sum()\n    eq = (pos[:, None] == neg[None, :]).sum()\n    return (gt + 0.5 * eq) / (len(pos) * len(neg))\n\n\ndef test_confusion_matrix_hand_example():\n    cm = confusion_matrix(Y_TRUE, Y_PRED, 3)\n    assert cm.shape == (3, 3)\n    assert cm.tolist() == [[1, 1, 0], [0, 2, 0], [1, 0, 1]]\n    assert cm.sum() == 6\n    assert np.array_equal(cm.sum(axis=1), np.bincount(Y_TRUE, minlength=3)), \"row sums are the true class counts\"\n    empty = confusion_matrix(np.array([0, 0]), np.array([0, 0]), 3)\n    assert empty.tolist() == [[2, 0, 0], [0, 0, 0], [0, 0, 0]], \"classes that never appear still get rows\"\n\n\ndef test_precision_recall_f1_hand_example():\n    m = precision_recall_f1(Y_TRUE, Y_PRED, 3)\n    assert np.allclose(m[\"precision\"], [0.5, 2 / 3, 1.0])\n    assert np.allclose(m[\"recall\"], [0.5, 1.0, 0.5])\n    assert np.allclose(m[\"f1\"], [0.5, 0.8, 2 / 3])\n    assert np.isclose(m[\"macro_f1\"], (0.5 + 0.8 + 2 / 3) / 3)\n    assert np.isclose(m[\"micro_f1\"], 4 / 6)\n\n\ndef test_zero_division_gives_zero():\n    y_true = np.array([0, 0, 1, 2])\n    y_pred = np.array([0, 0, 0, 0])             # classes 1 and 2 never predicted\n    m = precision_recall_f1(y_true, y_pred, 3)\n    assert np.all(np.isfinite(m[\"precision\"])) and np.all(np.isfinite(m[\"f1\"]))\n    assert np.allclose(m[\"precision\"], [0.5, 0.0, 0.0])\n    assert np.allclose(m[\"recall\"], [1.0, 0.0, 0.0])\n    assert np.allclose(m[\"f1\"], [2 / 3, 0.0, 0.0])\n    assert np.isclose(m[\"macro_f1\"], 2 / 9)\n\n\ndef test_micro_f1_is_accuracy_and_macro_is_mean_of_per_class():\n    rng = np.random.default_rng(0)\n    y_true = rng.integers(0, 4, size=500)\n    y_pred = np.where(rng.random(500) < 0.7, y_true, rng.integers(0, 4, size=500))\n    m = precision_recall_f1(y_true, y_pred, 4)\n    assert np.isclose(m[\"micro_f1\"], np.mean(y_true == y_pred))\n    assert np.isclose(m[\"macro_f1\"], m[\"f1\"].mean())\n    cm = confusion_matrix(y_true, y_pred, 4)\n    tp = np.diag(cm)\n    assert np.allclose(m[\"precision\"], tp / cm.sum(axis=0))\n    assert np.allclose(m[\"recall\"], tp / cm.sum(axis=1))\n\n\ndef test_roc_auc_hand_values():\n    assert np.isclose(roc_auc(np.array([0, 0, 1, 1]), np.array([0.1, 0.4, 0.35, 0.8])), 0.75)\n    assert np.isclose(roc_auc(np.array([0, 1, 0, 1]), np.array([0.2, 0.9, 0.3, 0.8])), 1.0)\n    assert np.isclose(roc_auc(np.array([0, 1, 0, 1]), np.array([0.9, 0.2, 0.8, 0.3])), 0.0)\n    assert np.isclose(roc_auc(np.array([0, 1, 0, 1]), np.array([0.5, 0.5, 0.5, 0.5])), 0.5), \"all tied -> 0.5\"\n    assert np.isclose(roc_auc(np.array([1, 0, 0]), np.array([0.5, 0.5, 0.1])), 0.75), \"one tie counts half\"\n\n\ndef test_roc_auc_matches_pairwise_reference_with_ties():\n    rng = np.random.default_rng(1)\n    for trial in range(5):\n        y = (rng.random(80) < 0.35).astype(int)\n        s = np.round(rng.random(80) + 0.4 * y, 1)          # one decimal -> many ties\n        assert np.isclose(roc_auc(y, s), auc_pairs(y, s), atol=1e-12), f\"trial {trial}\"\n    s = rng.normal(size=80)\n    assert np.isclose(roc_auc(y, s), auc_pairs(y, s), atol=1e-12)\n\n\ndef test_log_loss_values_and_clipping():\n    assert np.isclose(log_loss(np.array([1, 0]), np.array([0.9, 0.1])), -np.log(0.9))\n    assert np.isclose(log_loss(np.array([1, 0, 1]), np.array([0.5, 0.5, 0.5])), np.log(2.0))\n    extreme = log_loss(np.array([0, 1]), np.array([1.0, 0.0]))\n    assert np.isfinite(extreme) and 30.0 < extreme < 40.0, \"confident and wrong is capped by the clip, not infinite\"\n    assert np.isclose(log_loss(np.array([0, 1]), np.array([1.0, 0.0]), eps=1e-6), -np.log(1e-6), rtol=1e-6)\n    assert log_loss(np.array([1, 1]), np.array([1.0, 1.0])) < 1e-12\n", "solution": "import numpy as np\n\n\ndef _safe_div(a: np.ndarray, b: np.ndarray) -> np.ndarray:\n    return np.divide(a, b, out=np.zeros(np.shape(a), dtype=float), where=b > 0)\n\n\ndef confusion_matrix(y_true: np.ndarray, y_pred: np.ndarray, n_classes: int) -> np.ndarray:\n    return np.bincount(y_true * n_classes + y_pred, minlength=n_classes * n_classes).reshape(n_classes, n_classes)\n\n\ndef precision_recall_f1(y_true: np.ndarray, y_pred: np.ndarray, n_classes: int) -> dict:\n    cm = confusion_matrix(y_true, y_pred, n_classes)\n    tp = np.diag(cm).astype(float)\n    fp = cm.sum(axis=0) - tp                     # predicted as c but not c\n    fn = cm.sum(axis=1) - tp                     # truly c but predicted otherwise\n    precision = _safe_div(tp, tp + fp)\n    recall = _safe_div(tp, tp + fn)\n    f1 = _safe_div(2 * precision * recall, precision + recall)\n    micro_p = tp.sum() / max(tp.sum() + fp.sum(), 1)\n    micro_r = tp.sum() / max(tp.sum() + fn.sum(), 1)\n    micro_f1 = 0.0 if micro_p + micro_r == 0 else 2 * micro_p * micro_r / (micro_p + micro_r)\n    return {\"precision\": precision, \"recall\": recall, \"f1\": f1,\n            \"macro_f1\": float(f1.mean()), \"micro_f1\": float(micro_f1)}\n\n\ndef roc_auc(y_true: np.ndarray, scores: np.ndarray) -> float:\n    scores = np.asarray(scores, dtype=float)\n    _, inv, counts = np.unique(scores, return_inverse=True, return_counts=True)\n    last = counts.cumsum()                                   # 1-based rank of the last member of each tie group\n    first = last - counts + 1\n    ranks = ((first + last) / 2.0)[inv]                      # average rank within the tie group\n    n_pos = int((y_true == 1).sum())\n    n_neg = len(y_true) - n_pos\n    # Mann-Whitney U: sum of positive ranks minus the ranks they would have if all positives came first.\n    u = ranks[y_true == 1].sum() - n_pos * (n_pos + 1) / 2.0\n    return float(u / (n_pos * n_neg))\n\n\ndef log_loss(y_true: np.ndarray, p: np.ndarray, eps: float = 1e-15) -> float:\n    p = np.clip(np.asarray(p, dtype=float), eps, 1 - eps)\n    y = np.asarray(y_true, dtype=float)\n    return float(-np.mean(y * np.log(p) + (1 - y) * np.log1p(-p)))\n"}, {"id": "ml-temperature-scaling", "title": "Temperature scaling and expected calibration error", "track": "ml", "module": "ml-eval", "difficulty": "medium", "minutes": 40, "runtime": "numpy", "kind": "code", "tags": ["calibration", "temperature scaling", "ECE", "reliability diagram", "1-D optimization"], "hints": ["nll(logits, y, T) is the mean cross-entropy of softmax(logits / T): use the provided log_softmax on logits / T and pick out the label column with np.arange(N), y.", "The NLL is a smooth function of a single scalar, so any bracketing search works. Search over log T between log(lo) and log(hi): evaluate a coarse grid, then refine around the best point with golden-section or ternary search until the bracket is narrower than tol.", "ECE: confidence = probs.max(1), correct = probs.argmax(1) == y. Bin the confidences into n_bins equal-width bins on (0, 1]; for each non-empty bin add (count / N) * |mean(correct) - mean(confidence)|."], "rubric": [
