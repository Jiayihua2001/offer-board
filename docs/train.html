<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interview prep, fall 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky top bar with four views; the assignment view splits problem | editor on wide screens. */
:root{
  --paper:#F2F5F1; --raise:#E7ECE6; --ink:#17202E; --muted:#56616F; --rule:#D2D9D1; --sel:#CFE0FF;
  --t-leetcode:#2a78d6; --t-ml:#eb6834; --t-transformer:#1baf7a; --t-design:#6250d6;
  --ok:#1A7F37; --danger:#B42318; --warn:#9A5B00; --focus:#2446C6; --accent:#2446C6;
  --c-kw:#7C2D8E; --c-str:#0B6B3A; --c-com:#6B7280; --c-num:#B45309; --c-def:#1D4ED8; --c-bi:#0E7490;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E141D; --raise:#162030; --ink:#E4E9F0; --muted:#9AA5B4; --rule:#27323F; --sel:#2B3F66;
    --t-leetcode:#3987e5; --t-ml:#d95926; --t-transformer:#199e70; --t-design:#9085e9;
    --ok:#3FB950; --danger:#FF8A80; --warn:#E3B341; --focus:#8EA7FF; --accent:#8EA7FF;
    --c-kw:#D8A7F0; --c-str:#8CE0B0; --c-com:#8B95A5; --c-num:#F5B86B; --c-def:#93B4FF; --c-bi:#7FD3E6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E141D; --raise:#162030; --ink:#E4E9F0; --muted:#9AA5B4; --rule:#27323F; --sel:#2B3F66;
  --t-leetcode:#3987e5; --t-ml:#d95926; --t-transformer:#199e70; --t-design:#9085e9;
  --ok:#3FB950; --danger:#FF8A80; --warn:#E3B341; --focus:#8EA7FF; --accent:#8EA7FF;
  --c-kw:#D8A7F0; --c-str:#8CE0B0; --c-com:#8B95A5; --c-num:#F5B86B; --c-def:#93B4FF; --c-bi:#7FD3E6;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:4.5rem}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 var(--sans);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.18em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
button{font:inherit;color:inherit}
code,pre,kbd,textarea.code{font-family:var(--mono)}
.wrap{max-width:76rem;margin:0 auto;padding-left:max(clamp(1rem,3vw,2rem),env(safe-area-inset-left,0px));padding-right:max(clamp(1rem,3vw,2rem),env(safe-area-inset-right,0px))}
h1{font:600 clamp(1.8rem,4vw,2.5rem)/1.08 var(--cond);letter-spacing:-.01em;margin:0 0 .5rem;text-wrap:balance}
h2{font:600 1.4rem/1.15 var(--cond);margin:0 0 .5rem}
h3{font:600 1.05rem/1.25 var(--cond);margin:0 0 .35rem}
p{margin:0 0 .75rem}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font:500 .75rem/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 .4rem}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:.6rem 1.25rem;flex-wrap:wrap;padding-block:.55rem}
.brand{font:600 1.05rem/1 var(--cond);text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:2px;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--raise);overflow-x:auto;scrollbar-width:none}
.nav a{font-size:.875rem;text-decoration:none;color:var(--muted);padding:.3rem .8rem;border-radius:999px;white-space:nowrap}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.top .spacer{flex:1}
.top .ext{font-size:.875rem;color:var(--muted)}
.modeline{font-size:.75rem;color:var(--muted);white-space:nowrap}

/* Views */
main{padding-block:1.6rem 4rem}
.view{display:block}
.hero{padding:.4rem 0 1.2rem;border-bottom:1px solid var(--rule);margin-bottom:1.4rem}
.hero .lede{font-size:1.1rem;max-width:40em;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:.3rem 1.6rem;margin:.6rem 0 0;padding:0;list-style:none;color:var(--muted);font-size:.9375rem}
.stats b{font:600 1.35rem/1 var(--cond);color:var(--ink);margin-right:.3rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem}
.card{border:1px solid var(--rule);border-radius:10px;padding:1.1rem 1.2rem;background:var(--paper);min-width:0}
.card.raise{background:var(--raise)}
.card h2{margin-bottom:.25rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.1rem 0 .6rem}
.chip{font:500 .72rem/1 var(--sans);padding:.25rem .5rem;border-radius:999px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.chip.track{border-color:var(--tc);color:var(--tc)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.bad{border-color:var(--danger);color:var(--danger)}
.t-leetcode{--tc:var(--t-leetcode)} .t-ml{--tc:var(--t-ml)} .t-transformer{--tc:var(--t-transformer)} .t-design{--tc:var(--t-design)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .75rem;margin-top:.6rem}
.btn{background:none;border:1px solid var(--rule);border-radius:7px;padding:.42rem .85rem;cursor:pointer;text-decoration:none;font-size:.9375rem;display:inline-flex;align-items:center;gap:.4rem;color:var(--ink);background:var(--paper)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn[disabled]{opacity:.5;cursor:default}
.btn.small{font-size:.8125rem;padding:.3rem .6rem}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:.18em;cursor:pointer;font-size:.875rem}
.msg{font-size:.875rem;color:var(--muted)}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--danger)}

/* Week strip and lists */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.4rem;margin:1.2rem 0 0}
.week .d{border:1px solid var(--rule);border-radius:8px;padding:.5rem .55rem;font-size:.8125rem;min-width:0}
.week .d.today{border-color:var(--ink)}
.week .d .wd{font:600 .75rem/1 var(--cond);color:var(--muted);margin-bottom:.3rem}
.week .d .tr{font-weight:500;color:var(--tc,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week .d .st{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week .d.done .st{color:var(--ok)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;border-top:1px solid var(--rule);min-width:0}
.rows li:first-child{border-top:0}
.rows .glyph{width:1.15rem;height:1.15rem;flex:none;border-radius:50%;border:1.5px solid var(--rule);display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--paper)}
.rows .glyph.done{background:var(--ok);border-color:var(--ok)}
.rows .glyph.in_progress{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.rows .glyph.skipped{border-color:var(--muted);background:var(--muted)}
.rows .title{flex:1;min-width:0;text-decoration:none}
.rows .title:hover{text-decoration:underline}
.rows .meta{font-size:.8125rem;color:var(--muted);white-space:nowrap}
.bar{height:.5rem;border-radius:3px;background:var(--rule);overflow:hidden;margin:.35rem 0 .5rem}
.bar i{display:block;height:100%;background:var(--tc,var(--accent));border-radius:3px}
.track-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.track-head .n{font:600 1rem/1 var(--cond);color:var(--muted)}
.module{margin:.9rem 0 0}
.module h3{color:var(--muted);font-weight:500;font-size:.9375rem}
.tracks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem}

/* Assignment view */
.back{display:inline-block;font-size:.875rem;color:var(--muted);margin-bottom:.6rem}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.5rem;align-items:start}
.problem{min-width:0}
.problem h2{font-size:1.2rem;margin-top:1.1rem}
.problem h3{margin-top:.9rem}
.problem pre{background:var(--raise);border:1px solid var(--rule);border-radius:8px;padding:.7rem .85rem;overflow-x:auto;font-size:.85rem;line-height:1.5}
.problem code{font-size:.9em;background:var(--raise);padding:.05em .3em;border-radius:4px}
.problem pre code{background:none;padding:0}
.problem table{border-collapse:collapse;font-size:.9rem;margin:.5rem 0 1rem;display:block;overflow-x:auto}
.problem th,.problem td{border:1px solid var(--rule);padding:.3rem .6rem;text-align:left}
.problem ul,.problem ol{padding-left:1.3rem}
.problem li{margin:.2rem 0}
.problem blockquote{margin:.6rem 0;padding:.2rem .9rem;border-left:3px solid var(--rule);color:var(--muted)}
.hints{margin:1rem 0}
.hint{border-left:3px solid var(--warn);padding:.3rem .8rem;margin:.4rem 0;background:var(--raise);border-radius:0 6px 6px 0;font-size:.9375rem}
details.sol{margin:1rem 0}
details.sol summary{cursor:pointer;font-weight:500}
.work{min-width:0;position:sticky;top:4.2rem}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:.5rem}
.toolbar .grow{flex:1}
.timer{font:600 1.05rem/1 var(--cond);font-variant-numeric:tabular-nums;color:var(--muted);min-width:4.2rem}
.timer.live{color:var(--ink)} .timer.over{color:var(--danger)}
.editor{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--raise)}
.editor .CodeMirror{height:auto;min-height:22rem;max-height:70vh;font-size:.85rem;line-height:1.5;background:var(--raise);color:var(--ink)}
.editor textarea.code{width:100%;min-height:22rem;border:0;background:var(--raise);color:var(--ink);padding:.7rem .85rem;font-size:.85rem;line-height:1.5;resize:vertical;tab-size:4;display:block}
.CodeMirror-gutters{background:var(--raise);border-right:1px solid var(--rule)}
.CodeMirror-linenumber{color:var(--muted)}
.CodeMirror-cursor{border-left:1.5px solid var(--ink)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected,.CodeMirror-line::selection,.CodeMirror-line>span::selection{background:var(--sel)}
.cm-s-default .cm-keyword{color:var(--c-kw)} .cm-s-default .cm-string,.cm-s-default .cm-string-2{color:var(--c-str)} .cm-s-default .cm-comment{color:var(--c-com)}
.cm-s-default .cm-number{color:var(--c-num)} .cm-s-default .cm-def{color:var(--c-def)} .cm-s-default .cm-builtin{color:var(--c-bi)} .cm-s-default .cm-variable,.cm-s-default .cm-operator,.cm-s-default .cm-property{color:var(--ink)}
.cm-s-default .cm-meta{color:var(--c-bi)} .cm-s-default .cm-atom{color:var(--c-num)}
.out{margin-top:.6rem;border:1px solid var(--rule);border-radius:8px;background:var(--raise);padding:.6rem .85rem;font-family:var(--mono);font-size:.8rem;line-height:1.5;max-height:22rem;overflow:auto;white-space:pre-wrap;word-break:break-word}
.out .pass{color:var(--ok)} .out .fail{color:var(--danger)} .out .dim{color:var(--muted)}
.out .sum{font-family:var(--sans);font-weight:500;margin-top:.4rem}
.note{font-size:.875rem;color:var(--muted);margin:.5rem 0 0}
.record{margin-top:.8rem;border-top:1px solid var(--rule);padding-top:.7rem}
.record code{font-size:.8rem;background:var(--raise);padding:.15em .4em;border-radius:4px;word-break:break-all}
.claude{margin-top:.8rem;border-top:1px solid var(--rule);padding-top:.7rem}
.claude .reply{margin-top:.5rem;font-size:.9375rem}
.claude .reply pre{background:var(--raise);border-radius:6px;padding:.5rem .7rem;overflow-x:auto;font-size:.8rem}
.claude .reply code{font-size:.9em}
.rubric{list-style:none;padding:0;margin:.4rem 0}
.rubric li{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem 0;font-size:.9375rem}
.rubric input{margin-top:.3rem}
textarea.answer{width:100%;min-height:16rem;font:inherit;font-size:.9375rem;color:var(--ink);background:var(--raise);border:1px solid var(--rule);border-radius:8px;padding:.7rem .85rem;resize:vertical}

/* Quiz */
.qcard{border:1px solid var(--rule);border-radius:12px;padding:1.4rem 1.5rem;background:var(--raise);max-width:46rem}
.qcard .q{font-size:1.15rem;line-height:1.45;margin:.2rem 0 1rem}
.qcard .a{border-top:1px solid var(--rule);padding-top:.9rem;margin-top:.3rem;font-size:.9875rem;line-height:1.6}
.grades{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.grades .btn{min-width:5.2rem;justify-content:center}
.grades .btn b{font-size:.7rem;color:var(--muted);font-weight:500}
.dots{display:flex;gap:.3rem;margin:.6rem 0}
.dots i{width:.6rem;height:.6rem;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--ink)} .dots i.good{background:var(--ok)} .dots i.again{background:var(--danger)}
.qlist{list-style:none;padding:0;margin:0}
.qlist li{padding:.45rem 0;border-top:1px solid var(--rule);display:flex;gap:.6rem;align-items:baseline;font-size:.9375rem}
.qlist .box{font:600 .72rem/1 var(--cond);color:var(--muted);min-width:3.4rem}
.qlist .box.b3{color:var(--ok)}

/* Progress */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem;margin:0 0 1.4rem}
.tile{border:1px solid var(--rule);border-radius:10px;padding:.9rem 1rem}
.tile b{display:block;font:600 1.9rem/1.05 var(--cond)}
.tile span{font-size:.8125rem;color:var(--muted)}
.heat{overflow-x:auto}
.heat svg{display:block;max-width:100%;height:auto}
.heat .lbl{font:500 .7rem var(--sans);fill:var(--muted)}
.heat .c0{fill:var(--rule)} .heat .c1{fill:color-mix(in srgb,var(--accent) 35%,var(--paper))} .heat .c2{fill:color-mix(in srgb,var(--accent) 65%,var(--paper))} .heat .c3{fill:var(--accent)}
table.log{width:100%;border-collapse:collapse;font-size:.9rem}
table.log th,table.log td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--rule);vertical-align:top}
table.log th{font-weight:500;color:var(--muted);font-size:.8125rem}
.logwrap{overflow-x:auto}
.form{display:grid;gap:.6rem;max-width:34rem}
.form label{display:grid;gap:.25rem;font-size:.875rem;font-weight:500}
.form input,.form select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:.4rem .5rem}
.rot{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3rem}
.rot label{font-size:.75rem}
.panel{margin-top:2rem;padding-top:1.4rem;border-top:1px solid var(--rule)}
.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 1rem calc(env(safe-area-inset-bottom,0px) + .9rem);pointer-events:none;z-index:40}
.toast span{background:var(--ink);color:var(--paper);font-size:.875rem;padding:.55rem .9rem;border-radius:6px}
.empty{color:var(--muted);padding:1rem 0}

@media (max-width:960px){
  .split{grid-template-columns:minmax(0,1fr)}
  .work{position:static}
  .tracks,.grid2{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .week{grid-template-columns:repeat(4,minmax(0,1fr))}
  .rot{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>window.TRAIN_DATA = {"meta": {"rendered": "2026-10-26", "rendered_at": "2026-10-26T15:21:42-04:00", "runner": "\nimport io, json, sys, time, traceback, types\n\ndef _load_module(name, src, filename):\n    mod = types.ModuleType(name)\n    mod.__file__ = filename\n    sys.modules[name] = mod\n    exec(compile(src, filename, \"exec\"), mod.__dict__)\n    return mod\n\ndef _format_error(exc):\n    frames = [f for f in traceback.extract_tb(exc.__traceback__) if f.filename in (\"solution.py\", \"tests.py\")]\n    lines = []\n    for f in frames[-4:]:\n        lines.append(\"  %s line %d, in %s\" % (f.filename, f.lineno, f.name))\n        if f.line:\n            lines.append(\"    \" + f.line.strip())\n    msg = str(exc).strip()\n    head = type(exc).__name__ + (\": \" + msg if msg else \"\")\n    return \"\\n\".join(lines + [head]) if lines else head\n\ndef run_tests(solution_src, tests_src):\n    out = {\"ok\": False, \"passed\": 0, \"total\": 0, \"results\": [], \"error\": \"\", \"stdout\": \"\"}\n    for name in (\"solution\", \"tests_module\"):\n        sys.modules.pop(name, None)\n    real_stdout = sys.stdout\n    buf = io.StringIO()\n    sys.stdout = buf\n    try:\n        _load_module(\"solution\", solution_src, \"solution.py\")\n        tests = _load_module(\"tests_module\", tests_src, \"tests.py\")\n    except BaseException as exc:\n        sys.stdout = real_stdout\n        out[\"error\"] = \"Could not import your solution or the tests:\\n\" + _format_error(exc)\n        out[\"stdout\"] = buf.getvalue()[-3000:]\n        return out\n    sys.stdout = real_stdout\n    out[\"stdout\"] = buf.getvalue()[-3000:]\n    names = [n for n in dir(tests) if n.startswith(\"test_\") and callable(getattr(tests, n))]\n    names.sort(key=lambda n: getattr(getattr(tests, n), \"__code__\", None) and getattr(tests, n).__code__.co_firstlineno or 0)\n    for n in names:\n        fn = getattr(tests, n)\n        rec = {\"name\": n, \"ok\": False, \"ms\": 0, \"error\": \"\", \"stdout\": \"\"}\n        buf = io.StringIO()\n        sys.stdout = buf\n        t0 = time.perf_counter()\n        try:\n            fn()\n            rec[\"ok\"] = True\n        except BaseException as exc:\n            rec[\"error\"] = _format_error(exc)\n        finally:\n            sys.stdout = real_stdout\n        rec[\"ms\"] = int((time.perf_counter() - t0) * 1000)\n        rec[\"stdout\"] = buf.getvalue()[-2000:]\n        out[\"results\"].append(rec)\n    out[\"total\"] = len(names)\n    out[\"passed\"] = sum(1 for r in out[\"results\"] if r[\"ok\"])\n    out[\"ok\"] = out[\"total\"] > 0 and out[\"passed\"] == out[\"total\"]\n    return out\n", "n_assignments": 76, "n_cards": 107}, "curriculum": {"version": 1, "title": "Interview prep", "blurb": "Daily practice for PhD research scientist and applied scientist loops: coding rounds, ML fundamentals, and building a transformer from scratch.", "tracks": [{"id": "leetcode", "title": "Coding interviews", "short": "Coding", "blurb": "LeetCode-style problems grouped by pattern. Aim for a clean solution with the right complexity in 25 to 35 minutes, talking through it the way you would on a call.", "modules": [{"id": "lc-arrays", "title": "Arrays, hashing, two pointers, sliding window"}, {"id": "lc-search-sort", "title": "Binary search, sorting, heaps"}, {"id": "lc-stack-queue", "title": "Stacks, queues, linked lists, design"}, {"id": "lc-trees-graphs", "title": "Trees and graphs"}, {"id": "lc-dp", "title": "Dynamic programming"}, {"id": "lc-backtracking", "title": "Backtracking, tries, bits, math"}]}, {"id": "ml", "title": "ML fundamentals", "short": "ML", "blurb": "Implement the core algorithms from scratch in NumPy, the way ML coding rounds ask for them, and be able to explain every design choice.", "modules": [{"id": "ml-linear", "title": "Linear models and optimization"}, {"id": "ml-nets", "title": "Neural network building blocks"}, {"id": "ml-classic", "title": "Classic algorithms"}, {"id": "ml-eval", "title": "Evaluation and calibration"}, {"id": "ml-applied", "title": "Applied patterns"}]}, {"id": "transformer", "title": "Build a transformer", "short": "Transformer", "blurb": "From a byte-pair tokenizer to a trained GPT, one piece at a time. NumPy for the mechanics, PyTorch for training.", "modules": [{"id": "tf-tokens", "title": "Tokens and embeddings"}, {"id": "tf-attention", "title": "Attention"}, {"id": "tf-blocks", "title": "Blocks and the full model"}, {"id": "tf-training", "title": "Training and inference"}, {"id": "tf-modern", "title": "Modern variants"}]}, {"id": "design", "title": "ML system and research design", "short": "Design", "blurb": "Open-ended prompts scored against a rubric. Write or talk through the answer in 30 minutes, then grade yourself or have Claude grade it.", "modules": [{"id": "ds-core", "title": "Design prompts"}]}]}, "assignments": [{"id": "lc-two-sum", "title": "Two Sum", "track": "leetcode", "module": "lc-arrays", "difficulty": "easy", "minutes": 15, "runtime": "python", "kind": "code", "tags": ["hash map", "array"], "hints": ["The brute force checks every pair, which is O(n^2). What would let you check 'have I already seen target minus this number?' in O(1)?", "One pass: store each number's index in a dict as you go, and look up the complement before inserting the current number."], "rubric": [], "timeout": 60, "readme": "<h2>Two Sum<\/h2>\n<p>Given a list of integers <code>nums<\/code> and an integer <code>target<\/code>, return the indices of the two numbers that add up to <code>target<\/code>, as a list <code>[i, j]<\/code> with <code>i &lt; j<\/code>. Exactly one answer exists, and you may not use the same element twice.<\/p>\n<h3>Examples<\/h3>\n<pre><code class=\"lang-text\">two_sum([2, 7, 11, 15], 9)  -&gt; [0, 1]\ntwo_sum([3, 2, 4], 6)       -&gt; [1, 2]\ntwo_sum([3, 3], 6)          -&gt; [0, 1]<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li><code>2 &lt;= len(nums) &lt;= 10^5<\/code><\/li><li>Values and the target fit in a 64-bit integer.<\/li><li>Aim for O(n) time.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>You state the brute-force O(n^2) idea in one sentence and then improve it, rather than jumping straight to the trick.<\/li><li>You handle duplicates correctly (<code>[3, 3]<\/code>), which is why the lookup happens before the insert.<\/li><li>You can say what the hash map costs in memory and when sorting plus two pointers would be the better trade (when you need the values, not the indices, or memory is tight).<\/li><\/ul>\n<h3>Follow-up to think about<\/h3>\n<p>How would you return all pairs if several answers could exist, without reporting the same pair twice?<\/p>", "starter": "\"\"\"Two Sum. Keep the function name; the tests import it.\"\"\"\n\n\ndef two_sum(nums: list[int], target: int) -> list[int]:\n    \"\"\"Return [i, j] with i < j and nums[i] + nums[j] == target.\"\"\"\n    raise NotImplementedError\n", "tests": "import random\n\nfrom solution import two_sum\n\n\ndef check(nums, target):\n    i, j = two_sum(nums, target)\n    assert 0 <= i < j < len(nums), f\"bad indices {i}, {j}\"\n    assert nums[i] + nums[j] == target, f\"nums[{i}] + nums[{j}] != {target}\"\n\n\ndef test_examples():\n    assert two_sum([2, 7, 11, 15], 9) == [0, 1]\n    assert two_sum([3, 2, 4], 6) == [1, 2]\n\n\ndef test_duplicates_are_two_different_indices():\n    assert two_sum([3, 3], 6) == [0, 1]\n\n\ndef test_negative_numbers():\n    check([-3, 4, 3, 90], 0)\n\n\ndef test_answer_may_be_at_the_end():\n    check(list(range(1, 50)) + [1000, 2000], 3000)\n\n\ndef test_large_input_is_fast():\n    rng = random.Random(7)\n    nums = [rng.randrange(-10**9, 10**9) for _ in range(200_000)]\n    nums[123_456], nums[199_999] = 5, -5\n    check(nums, 0)\n", "solution": "def two_sum(nums: list[int], target: int) -> list[int]:\n    seen = {}\n    for j, x in enumerate(nums):\n        i = seen.get(target - x)\n        if i is not None:\n            return [i, j]\n        seen[x] = j\n    raise ValueError(\"no answer\")\n"}, {"id": "lc-group-anagrams", "title": "Group Anagrams", "track": "leetcode", "module": "lc-arrays", "difficulty": "easy", "minutes": 20, "runtime": "python", "kind": "code", "tags": ["hash map", "string", "sorting"], "hints": ["Two words are anagrams exactly when they have the same letter counts. Can you compute one value from a word so that anagrams, and only anagrams, produce the same value?", "Comparing every pair of words is O(n^2 k). A canonical key per word turns it into a single pass over the input.", "Use the sorted word (or a tuple of 26 letter counts) as a dict key and append each word to its bucket; return the buckets."], "rubric": [], "timeout": 30, "readme": "<h2>Group Anagrams<\/h2>\n<p>Given a list of strings <code>strs<\/code>, group the anagrams together and return the groups as a list of lists. Two strings are anagrams when one can be rearranged into the other, so every group holds strings with exactly the same letters with the same multiplicities.<\/p>\n<p>Return the groups in any order, and the strings inside a group in any order. Every input string must appear in exactly one group, with duplicates kept (two copies of <code>\"ab\"<\/code> go in the same group as two entries). A string with no anagram partner is a group of one.<\/p>\n<h3>Examples<\/h3>\n<pre><code class=\"lang-text\">group_anagrams([\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"])\n  -&gt; [[\"bat\"], [\"nat\", \"tan\"], [\"ate\", \"eat\", \"tea\"]]   (any order)\n\ngroup_anagrams([\"\"])   -&gt; [[\"\"]]\ngroup_anagrams([\"a\"])  -&gt; [[\"a\"]]<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li><code>0 &lt;= len(strs) &lt;= 10^5<\/code><\/li><li><code>0 &lt;= len(strs[i]) &lt;= 100<\/code>, lowercase English letters only.<\/li><li>Aim for O(n k log k) time with <code>k<\/code> the maximum string length, or O(n k) with a counting key. O(n) extra space for the buckets.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>You name the brute force (compare every pair with a letter count) and its O(n^2 k) cost before improving it.<\/li><li>The key insight, stated plainly: map every string to a canonical form, so grouping becomes a hash-map lookup.<\/li><li>The trade-off between the two keys: sorting costs O(k log k) per string and is simple; a 26-letter count tuple is O(k) but needs a hashable (immutable) key and assumes a fixed alphabet.<\/li><li>You can say why a <code>list<\/code> cannot be a dict key and what you would do for Unicode input.<\/li><\/ul>\n<h3>Follow-up to think about<\/h3>\n<p>How would you stream this over a file far larger than memory, if you only needed the size of the largest group?<\/p>", "starter": "\"\"\"Group Anagrams. Keep the function name; the tests import it.\"\"\"\n\n\ndef group_anagrams(strs: list[str]) -> list[list[str]]:\n    \"\"\"Return the anagram groups of strs. Groups and their members may be in any order.\"\"\"\n    raise NotImplementedError\n", "tests": "import random\n\nfrom solution import group_anagrams\n\n\ndef normalize(groups):\n    return sorted(sorted(list(g)) for g in groups)\n\n\ndef reference(strs):\n    buckets = {}\n    for s in strs:\n        buckets.setdefault(\"\".join(sorted(s)), []).append(s)\n    return list(buckets.values())\n\n\ndef check(strs):\n    got = group_anagrams(strs)\n    flat = [s for g in got for s in g]\n    assert sorted(flat) == sorted(strs), \"every input string must appear exactly once across the groups\"\n    assert normalize(got) == normalize(reference(strs)), f\"wrong grouping for {strs[:10]}...\"\n\n\ndef test_example():\n    got = normalize(group_anagrams([\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"]))\n    assert got == [[\"ate\", \"eat\", \"tea\"], [\"bat\"], [\"nat\", \"tan\"]], got\n\n\ndef test_empty_input_and_empty_string():\n    assert group_anagrams([]) == [], \"no strings means no groups\"\n    assert normalize(group_anagrams([\"\"])) == [[\"\"]]\n    assert normalize(group_anagrams([\"\", \"\"])) == [[\"\", \"\"]]\n\n\ndef test_single_string():\n    assert normalize(group_anagrams([\"a\"])) == [[\"a\"]]\n\n\ndef test_duplicates_stay_in_one_group():\n    got = normalize(group_anagrams([\"ab\", \"ba\", \"ab\", \"abc\"]))\n    assert got == [[\"ab\", \"ab\", \"ba\"], [\"abc\"]], got\n\n\ndef test_same_letters_different_counts_are_different_groups():\n    got = normalize(group_anagrams([\"aab\", \"abb\", \"bba\", \"baa\"]))\n    assert got == [[\"aab\", \"baa\"], [\"abb\", \"bba\"]], got\n\n\ndef test_random_against_reference():\n    rng = random.Random(3)\n    for _ in range(200):\n        n = rng.randrange(0, 12)\n        strs = [\"\".join(rng.choice(\"abc\") for _ in range(rng.randrange(0, 4))) for _ in range(n)]\n        check(strs)\n\n\ndef test_large_input_is_fast():\n    rng = random.Random(11)\n    strs = [\"\".join(rng.choice(\"abcdef\") for _ in range(6)) for _ in range(100_000)]\n    check(strs)\n", "solution": "def group_anagrams(strs: list[str]) -> list[list[str]]:\n    buckets: dict[str, list[str]] = {}\n    for s in strs:\n        buckets.setdefault(\"\".join(sorted(s)), []).append(s)\n    return list(buckets.values())\n"}, {"id": "lc-longest-substring-no-repeat", "title": "Longest Substring Without Repeating Characters", "track": "leetcode", "module": "lc-arrays", "difficulty": "medium", "minutes": 25, "runtime": "python", "kind": "code", "tags": ["sliding window", "hash map", "string"], "hints": ["Brute force: for every start index extend to the right until a character repeats, tracking the best length with a set. That is O(n^2). Which work is repeated between neighbouring starts?", "Keep a window [left, right] that always holds distinct characters. Extending right by one can invalidate the window only through the new character s[right].", "Store the last index where each character was seen. When s[right] was last seen at p >= left, jump left to p + 1. Never move left backwards (try 'abba' by hand)."], "rubric": [], "timeout": 30, "readme": "<h2>Longest Substring Without Repeating Characters<\/h2>\n<p>Given a string <code>s<\/code>, return the length of the longest contiguous substring in which no character appears twice. Only the length is needed, not the substring itself. The empty string has answer <code>0<\/code>.<\/p>\n<p>Characters are compared exactly: <code>\"a\"<\/code> and <code>\"A\"<\/code> are different, and a space is a character like any other.<\/p>\n<h3>Examples<\/h3>\n<pre><code class=\"lang-text\">length_of_longest_substring(\"abcabcbb\")  -&gt; 3    (\"abc\")\nlength_of_longest_substring(\"bbbbb\")     -&gt; 1    (\"b\")\nlength_of_longest_substring(\"pwwkew\")    -&gt; 3    (\"wke\"; \"pwke\" is a subsequence, not a substring)\nlength_of_longest_substring(\"\")          -&gt; 0<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li><code>0 &lt;= len(s) &lt;= 3 * 10^5<\/code><\/li><li><code>s<\/code> may contain any Unicode characters, so do not assume a small alphabet: one test has 150,000 distinct characters in a row.<\/li><li>Aim for O(n) time and O(min(n, alphabet)) extra space. Anything that restarts from every index will time out on that test.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>You start from the O(n^2) \"extend from every start\" idea and point out that a substring with a repeat can never be fixed by extending it further right, which is what justifies the window.<\/li><li>The invariant you maintain: the window <code>s[left:right+1]<\/code> never contains a duplicate, and <code>left<\/code> only ever moves right.<\/li><li>The classic bug: moving <code>left<\/code> to <code>last_seen[c] + 1<\/code> when that index is already behind <code>left<\/code> (<code>\"abba\"<\/code>), and why <code>max(left, ...)<\/code> fixes it.<\/li><li>Complexity: each index enters and leaves the window at most once, so the two-pointer loop is O(n) even though it looks nested.<\/li><\/ul>\n<h3>Follow-up to think about<\/h3>\n<p>How does the solution change if you must return the substring itself, and if at most <code>k<\/code> repeats of each character are allowed?<\/p>", "starter": "\"\"\"Longest Substring Without Repeating Characters. Keep the function name; the tests import it.\"\"\"\n\n\ndef length_of_longest_substring(s: str) -> int:\n    \"\"\"Return the length of the longest substring of s with all distinct characters.\"\"\"\n    raise NotImplementedError\n", "tests": "import random\n\nfrom solution import length_of_longest_substring\n\n\ndef brute_force(s):\n    best = 0\n    for i in range(len(s)):\n        seen = set()\n        for j in range(i, len(s)):\n            if s[j] in seen:\n                break\n            seen.add(s[j])\n            best = max(best, j - i + 1)\n    return best\n\n\ndef test_examples():\n    assert length_of_longest_substring(\"abcabcbb\") == 3\n    assert length_of_longest_substring(\"bbbbb\") == 1\n    assert length_of_longest_substring(\"pwwkew\") == 3\n\n\ndef test_empty_and_single_character():\n    assert length_of_longest_substring(\"\") == 0\n    assert length_of_longest_substring(\"a\") == 1\n    assert length_of_longest_substring(\" \") == 1, \"a space is a character\"\n\n\ndef test_left_pointer_never_moves_backwards():\n    assert length_of_longest_substring(\"abba\") == 2, \"after the second b, the first a must not pull the window back\"\n    assert length_of_longest_substring(\"tmmzuxt\") == 5\n    assert length_of_longest_substring(\"dvdf\") == 3\n\n\ndef test_all_distinct_is_whole_string():\n    s = \"abcdefghijklmnopqrstuvwxyz0123456789\"\n    assert length_of_longest_substring(s) == len(s)\n\n\ndef test_case_sensitive_and_symbols():\n    assert length_of_longest_substring(\"aA\") == 2\n    assert length_of_longest_substring(\"a!b!c\") == 3\n    assert length_of_longest_substring(\"  \") == 1\n\n\ndef test_random_against_brute_force():\n    rng = random.Random(5)\n    for _ in range(300):\n        n = rng.randrange(0, 25)\n        s = \"\".join(rng.choice(\"abcd\") for _ in range(n))\n        assert length_of_longest_substring(s) == brute_force(s), f\"wrong answer for {s!r}\"\n\n\ndef test_large_ascii_input_is_fast():\n    rng = random.Random(17)\n    alphabet = \"abcdefghijklmnopqrstuvwxyz\"\n    s = \"\".join(rng.choice(alphabet) for _ in range(300_000))\n    s = s[:150_000] + alphabet + \"0123456789\" + s[150_000:]\n    assert length_of_longest_substring(s) >= 36\n\n\ndef test_large_alphabet_makes_the_answer_long():\n    # 150k distinct Unicode characters next to a random ASCII tail: the answer is at least 150_000,\n    # so \"extend from every start until a repeat\" does quadratic work here.\n    rng = random.Random(18)\n    distinct = \"\".join(chr(0x10000 + i) for i in range(150_000))\n    tail = \"\".join(rng.choice(\"abcdefghij\") for _ in range(150_000))\n\n    def distinct_run(chars):\n        seen, n = set(), 0\n        for c in chars:\n            if c in seen:\n                break\n            seen.add(c)\n            n += 1\n        return n\n\n    assert length_of_longest_substring(distinct + tail) == 150_000 + distinct_run(tail)\n    assert length_of_longest_substring(tail + distinct) == 150_000 + distinct_run(reversed(tail))\n", "solution": "def length_of_longest_substring(s: str) -> int:\n    last_seen: dict[str, int] = {}\n    best = left = 0\n    for right, c in enumerate(s):\n        if last_seen.get(c, -1) >= left:\n            left = last_seen[c] + 1\n        last_seen[c] = right\n        best = max(best, right - left + 1)\n    return best\n"}, {"id": "lc-3sum", "title": "3Sum", "track": "leetcode", "module": "lc-arrays", "difficulty": "medium", "minutes": 35, "runtime": "python", "kind": "code", "tags": ["two pointers", "sorting", "array"], "hints": ["Fix the first number nums[i]; what remains is Two Sum for target -nums[i] on the rest. With a hash set that is already O(n^2), but removing duplicate triplets gets messy.", "Sort first. For each i, run two pointers lo = i + 1 and hi = n - 1 inward: if the sum is too small move lo, if too large move hi. Sorted order makes each move safe.", "Deduplicate by skipping: if nums[i] == nums[i - 1] continue, and after recording a triplet advance lo while nums[lo] == nums[lo - 1] (and hi likewise)."], "rubric": [], "timeout": 30, "readme": "<h2>3Sum<\/h2>\n<p>Given a list of integers <code>nums<\/code>, return all triplets <code>[a, b, c]<\/code> of values taken from three different positions such that <code>a + b + c == 0<\/code>. The result must not contain duplicate triplets: two triplets are the same if they hold the same three values, regardless of order.<\/p>\n<p>Return the triplets in any order, and the values inside each triplet in any order. Return an empty list when there is no such triplet.<\/p>\n<h3>Examples<\/h3>\n<pre><code class=\"lang-text\">three_sum([-1, 0, 1, 2, -1, -4])  -&gt; [[-1, -1, 2], [-1, 0, 1]]   (any order)\nthree_sum([0, 1, 1])              -&gt; []\nthree_sum([0, 0, 0, 0])           -&gt; [[0, 0, 0]]<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li><code>0 &lt;= len(nums) &lt;= 3000<\/code><\/li><li><code>-10^5 &lt;= nums[i] &lt;= 10^5<\/code><\/li><li>Aim for O(n^2) time with O(1) extra space beyond the output (sorting in place is fine). O(n^3) will time out on the large test.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>You say the O(n^3) brute force in one sentence, then reduce the problem to Two Sum with the first element fixed, and only then pick between a hash set and two pointers.<\/li><li>Why sorting unlocks two pointers: with <code>nums<\/code> sorted, a sum that is too small can only be fixed by moving <code>lo<\/code> right, so each step discards candidates safely.<\/li><li>Deduplication done by skipping equal neighbours rather than by stuffing tuples into a set, and the argument for why that does not miss any triplet.<\/li><li>Complexity: O(n log n) for the sort plus O(n^2) for the scan, and that the output itself can be Theta(n^2) in size.<\/li><\/ul>\n<h3>Follow-up to think about<\/h3>\n<p>How do the two-pointer scan and the deduplication generalise to 4Sum, and what is the complexity then?<\/p>", "starter": "\"\"\"3Sum. Keep the function name; the tests import it.\"\"\"\n\n\ndef three_sum(nums: list[int]) -> list[list[int]]:\n    \"\"\"Return all unique triplets [a, b, c] from nums with a + b + c == 0, in any order.\"\"\"\n    raise NotImplementedError\n", "tests": "import random\nfrom collections import Counter\n\nfrom solution import three_sum\n\n\ndef reference_triplets(nums):\n    \"\"\"O(n^2): sort, and for each pair look up the third value at a later index.\"\"\"\n    a = sorted(nums)\n    last = {v: i for i, v in enumerate(a)}\n    out = set()\n    for i in range(len(a)):\n        for j in range(i + 1, len(a)):\n            k = last.get(-(a[i] + a[j]))\n            if k is not None and k > j:\n                out.add((a[i], a[j], a[k]))\n    return out\n\n\ndef check(nums):\n    got = three_sum(nums)\n    counts = Counter(nums)\n    seen = set()\n    for t in got:\n        assert len(t) == 3, f\"not a triplet: {t}\"\n        assert sum(t) == 0, f\"{t} does not sum to 0\"\n        for v, c in Counter(t).items():\n            assert counts[v] >= c, f\"{t} uses {v} more times than nums contains it\"\n        key = tuple(sorted(t))\n        assert key not in seen, f\"duplicate triplet {t}\"\n        seen.add(key)\n    expected = reference_triplets(nums)\n    assert seen == expected, f\"missing {sorted(expected - seen)[:5]}, extra {sorted(seen - expected)[:5]}\"\n\n\ndef test_example():\n    got = sorted(tuple(sorted(t)) for t in three_sum([-1, 0, 1, 2, -1, -4]))\n    assert got == [(-1, -1, 2), (-1, 0, 1)], got\n\n\ndef test_too_few_elements():\n    assert three_sum([]) == []\n    assert three_sum([0]) == []\n    assert three_sum([1, -1]) == []\n\n\ndef test_no_solution():\n    assert three_sum([0, 1, 1]) == []\n    assert three_sum([1, 2, 3, 4]) == []\n\n\ndef test_all_zeros_gives_one_triplet():\n    assert [sorted(t) for t in three_sum([0, 0, 0, 0, 0])] == [[0, 0, 0]]\n\n\ndef test_duplicates_reported_once():\n    check([-2, 0, 1, 1, 2])\n    check([-1, -1, -1, 2, 2, 2, 0, 0])\n    check([3, -3, 0, 0, 3, -3, 0])\n\n\ndef test_random_against_reference():\n    rng = random.Random(42)\n    for _ in range(300):\n        n = rng.randrange(0, 16)\n        check([rng.randrange(-6, 7) for _ in range(n)])\n\n\ndef test_large_input_is_fast():\n    rng = random.Random(8)\n    nums = [rng.randrange(-20_000, 20_001) for _ in range(3000)]\n    check(nums)\n", "solution": "def three_sum(nums: list[int]) -> list[list[int]]:\n    nums = sorted(nums)\n    n = len(nums)\n    out: list[list[int]] = []\n    for i in range(n - 2):\n        if nums[i] > 0:\n            break                      # all later values are positive too\n        if i > 0 and nums[i] == nums[i - 1]:\n            continue                   # same first value as before: same triplets\n        lo, hi = i + 1, n - 1\n        while lo < hi:\n            s = nums[i] + nums[lo] + nums[hi]\n            if s < 0:\n                lo += 1\n            elif s > 0:\n                hi -= 1\n            else:\n                out.append([nums[i], nums[lo], nums[hi]])\n                lo += 1\n                hi -= 1\n                while lo < hi and nums[lo] == nums[lo - 1]:\n                    lo += 1\n                while lo < hi and nums[hi] == nums[hi + 1]:\n                    hi -= 1\n    return out\n"}, {"id": "lc-product-except-self", "title": "Product of Array Except Self", "track": "leetcode", "module": "lc-arrays", "difficulty": "medium", "minutes": 25, "runtime": "python", "kind": "code", "tags": ["prefix sum", "array"], "hints": ["Division is off the table (and it breaks on zeros anyway). The answer at i is the product of everything to the left of i times the product of everything to the right of i.", "Two passes with a prefix-product array and a suffix-product array give O(n) time and O(n) extra space. Can you drop one of the arrays?", "Write the prefix products straight into the output array left to right, then sweep right to left carrying the running suffix product in one variable and multiplying it in."], "rubric": [], "timeout": 30, "readme": "<h2>Product of Array Except Self<\/h2>\n<p>Given a list of integers <code>nums<\/code>, return a list <code>out<\/code> of the same length where <code>out[i]<\/code> is the product of every element of <code>nums<\/code> except <code>nums[i]<\/code>.<\/p>\n<p>Do it <strong>without using division<\/strong>, in O(n) time, and with O(1) extra space beyond the output list. Zeros are allowed and must be handled by the algorithm itself, not special-cased.<\/p>\n<h3>Examples<\/h3>\n<pre><code class=\"lang-text\">product_except_self([1, 2, 3, 4])        -&gt; [24, 12, 8, 6]\nproduct_except_self([-1, 1, 0, -3, 3])   -&gt; [0, 0, 9, 0, 0]\nproduct_except_self([2, 0, 0, 5])        -&gt; [0, 0, 0, 0]<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li><code>2 &lt;= len(nums) &lt;= 2 * 10^5<\/code><\/li><li><code>-30 &lt;= nums[i] &lt;= 30<\/code>; Python integers do not overflow, but say what you would do in a fixed-width language.<\/li><li>Target: O(n) time, O(1) extra space (the output list does not count).<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>The O(n^2) brute force, then the division shortcut and exactly why it is rejected: a single zero makes <code>total / nums[i]<\/code> undefined, and two zeros make the \"count the zeros\" patch ugly.<\/li><li>The key insight: <code>out[i] = prefix[i - 1] * suffix[i + 1]<\/code>, which is two linear passes.<\/li><li>How you reach O(1) extra space: the output array doubles as the prefix array and the suffix is a running scalar.<\/li><li>Overflow awareness: in C++ or Java the products would need 64-bit or modular arithmetic; in Python the cost shows up as big-int multiplication time instead.<\/li><\/ul>\n<h3>Follow-up to think about<\/h3>\n<p>How would you answer many queries of the form \"product of <code>nums[l:r]<\/code> except <code>nums[i]<\/code>\" quickly, and does division become acceptable under a prime modulus?<\/p>", "starter": "\"\"\"Product of Array Except Self. Keep the function name; the tests import it.\"\"\"\n\n\ndef product_except_self(nums: list[int]) -> list[int]:\n    \"\"\"Return out with out[i] == product of all nums[j] for j != i. No division.\"\"\"\n    raise NotImplementedError\n", "tests": "import random\n\nfrom solution import product_except_self\n\n\ndef brute_force(nums):\n    out = []\n    for i in range(len(nums)):\n        p = 1\n        for j, x in enumerate(nums):\n            if j != i:\n                p *= x\n        out.append(p)\n    return out\n\n\ndef test_examples():\n    assert list(product_except_self([1, 2, 3, 4])) == [24, 12, 8, 6]\n    assert list(product_except_self([-1, 1, 0, -3, 3])) == [0, 0, 9, 0, 0]\n\n\ndef test_two_elements():\n    assert list(product_except_self([3, 5])) == [5, 3]\n    assert list(product_except_self([0, 7])) == [7, 0]\n\n\ndef test_one_zero_zeroes_everything_but_its_own_slot():\n    assert list(product_except_self([4, 0, 2])) == [0, 8, 0]\n\n\ndef test_two_zeros_zero_everything():\n    assert list(product_except_self([2, 0, 0, 5])) == [0, 0, 0, 0]\n    assert list(product_except_self([0, 0])) == [0, 0]\n\n\ndef test_negatives_and_ones():\n    assert list(product_except_self([-2, -3, 1, -1])) == [3, 2, -6, 6]\n    assert list(product_except_self([1, 1, 1, 1])) == [1, 1, 1, 1]\n\n\ndef test_random_against_brute_force():\n    rng = random.Random(21)\n    for _ in range(300):\n        n = rng.randrange(2, 12)\n        nums = [rng.randrange(-4, 5) for _ in range(n)]\n        assert list(product_except_self(nums)) == brute_force(nums), f\"wrong for {nums}\"\n\n\ndef test_large_input_is_fast():\n    rng = random.Random(9)\n    nums = [rng.choice([-1, 1]) for _ in range(200_000)]\n    nums[777] = 2\n    nums[150_000] = 3\n    out = list(product_except_self(nums))\n    total = 1\n    for x in nums:\n        total *= x\n    assert len(out) == len(nums)\n    assert out[777] == total // 2, \"out[i] must be the product of all other elements\"\n    assert out[150_000] == total // 3\n    assert all(abs(v) == 6 for i, v in enumerate(out) if i not in (777, 150_000))\n", "solution": "def product_except_self(nums: list[int]) -> list[int]:\n    n = len(nums)\n    out = [1] * n\n    for i in range(1, n):                 # out[i] = product of nums[:i]\n        out[i] = out[i - 1] * nums[i - 1]\n    suffix = 1                             # product of nums[i + 1:]\n    for i in range(n - 1, -1, -1):\n        out[i] *= suffix\n        suffix *= nums[i]\n    return out\n"}, {"id": "lc-subarray-sum-equals-k", "title": "Subarray Sum Equals K", "track": "leetcode", "module": "lc-arrays", "difficulty": "medium", "minutes": 25, "runtime": "python", "kind": "code", "tags": ["prefix sum", "hash map", "array"], "hints": ["A sliding window needs the sum to grow as the window grows; negatives break that. Write sum(nums[i:j]) as a difference of two prefix sums P[j] - P[i].", "So you need, for each j, the number of earlier i with P[i] == P[j] - k. 'How many times have I seen this value' is a hash map of counts.", "One pass: running sum P, dict count with count[0] = 1 for the empty prefix; add count[P - k] to the answer, then increment count[P]."], "rubric": [], "timeout": 30, "readme": "<h2>Subarray Sum Equals K<\/h2>\n<p>Given a list of integers <code>nums<\/code> and an integer <code>k<\/code>, return the number of contiguous, non-empty subarrays whose elements sum to exactly <code>k<\/code>. Subarrays at different positions count separately even if they hold the same values.<\/p>\n<p>Values can be negative or zero, so a sliding window does not work.<\/p>\n<h3>Examples<\/h3>\n<pre><code class=\"lang-text\">subarray_sum([1, 1, 1], 2)        -&gt; 2      ([1,1] at 0..1 and at 1..2)\nsubarray_sum([1, 2, 3], 3)        -&gt; 2      ([1,2] and [3])\nsubarray_sum([1, -1, 0], 0)       -&gt; 3      ([1,-1], [-1,0], [0])\nsubarray_sum([0, 0, 0, 0], 0)     -&gt; 10<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li><code>0 &lt;= len(nums) &lt;= 2 * 10^5<\/code><\/li><li><code>-1000 &lt;= nums[i] &lt;= 1000<\/code>, <code>-10^7 &lt;= k &lt;= 10^7<\/code><\/li><li>Target: O(n) time and O(n) extra space. O(n^2) over all subarrays will time out on the large test.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>The O(n^2) prefix-sum version first (fix the start, extend the end), and the one-sentence reason a sliding window is wrong here: with negatives the window sum is not monotone in its length.<\/li><li>The key insight, stated as an equation: <code>sum(nums[i:j]) == k<\/code> iff <code>P[j] - P[i] == k<\/code>, so each end index <code>j<\/code> only needs to know how many earlier prefix sums equal <code>P[j] - k<\/code>.<\/li><li>Why <code>count[0] = 1<\/code> is there (the empty prefix) and the order of operations: look up before you insert, or you count the empty subarray when <code>k == 0<\/code>.<\/li><li>The all-zeros case as a sanity check that counts are needed, not just a set of seen prefixes.<\/li><\/ul>\n<h3>Follow-up to think about<\/h3>\n<p>How would you return the number of subarrays whose sum is divisible by <code>k<\/code>, or the longest subarray summing to <code>k<\/code>, with the same idea?<\/p>", "starter": "\"\"\"Subarray Sum Equals K. Keep the function name; the tests import it.\"\"\"\n\n\ndef subarray_sum(nums: list[int], k: int) -> int:\n    \"\"\"Return how many contiguous non-empty subarrays of nums sum to k.\"\"\"\n    raise NotImplementedError\n", "tests": "import random\n\nfrom solution import subarray_sum\n\n\ndef brute_force(nums, k):\n    count = 0\n    for i in range(len(nums)):\n        s = 0\n        for j in range(i, len(nums)):\n            s += nums[j]\n            if s == k:\n                count += 1\n    return count\n\n\ndef test_examples():\n    assert subarray_sum([1, 1, 1], 2) == 2\n    assert subarray_sum([1, 2, 3], 3) == 2\n\n\ndef test_empty_and_single_element():\n    assert subarray_sum([], 0) == 0, \"no non-empty subarray exists\"\n    assert subarray_sum([5], 5) == 1\n    assert subarray_sum([5], 4) == 0\n\n\ndef test_negatives_and_zero_target():\n    assert subarray_sum([1, -1, 0], 0) == 3\n    assert subarray_sum([-1, -1, 1], 0) == 1\n    assert subarray_sum([3, -3, 3, -3], 0) == 4\n\n\ndef test_all_zeros_counts_every_subarray():\n    assert subarray_sum([0, 0, 0, 0], 0) == 10\n\n\ndef test_no_match():\n    assert subarray_sum([1, 2, 3], 7) == 0\n    assert subarray_sum([2, 4, 6], 1) == 0\n\n\ndef test_random_against_brute_force():\n    rng = random.Random(13)\n    for _ in range(400):\n        n = rng.randrange(0, 15)\n        nums = [rng.randrange(-3, 4) for _ in range(n)]\n        k = rng.randrange(-4, 5)\n        assert subarray_sum(nums, k) == brute_force(nums, k), f\"wrong for {nums}, k={k}\"\n\n\ndef test_large_input_is_fast():\n    rng = random.Random(2)\n    nums = [rng.randrange(-5, 6) for _ in range(200_000)]\n    got = subarray_sum(nums, 0)\n    assert got > 0\n    # Independent count from prefix sums, computed differently (sorted runs of equal prefix sums).\n    prefix, s = [0], 0\n    for x in nums:\n        s += x\n        prefix.append(s)\n    prefix.sort()\n    expected, i = 0, 0\n    while i < len(prefix):\n        j = i\n        while j < len(prefix) and prefix[j] == prefix[i]:\n            j += 1\n        run = j - i\n        expected += run * (run - 1) // 2\n        i = j\n    assert got == expected, f\"expected {expected}, got {got}\"\n", "solution": "def subarray_sum(nums: list[int], k: int) -> int:\n    count = {0: 1}          # the empty prefix\n    total = answer = 0\n    for x in nums:\n        total += x\n        answer += count.get(total - k, 0)\n        count[total] = count.get(total, 0) + 1\n    return answer\n"}, {"id": "lc-trapping-rain-water", "title": "Trapping Rain Water", "track": "leetcode", "module": "lc-arrays", "difficulty": "hard", "minutes": 40, "runtime": "python", "kind": "code", "tags": ["two pointers", "prefix max", "array"], "hints": ["Water standing on top of column i rises to min(highest wall to its left, highest wall to its right), minus height[i] if that is positive. Finding both walls per column by scanning is O(n^2).", "Precompute left_max[i] and right_max[i] in two passes: O(n) time, O(n) extra space. That is a fine interview answer; the follow-up is O(1) space.", "Two pointers from both ends with running left_max and right_max. Whichever side is lower is settled: its water level is bounded by its own running max because the other side has a wall at least that high. Move that pointer and add its water."], "rubric": [], "timeout": 30, "readme": "<h2>Trapping Rain Water<\/h2>\n<p>Given a list of non-negative integers <code>height<\/code>, where <code>height[i]<\/code> is the height of a wall of width 1 standing at position <code>i<\/code>, return how much water is trapped between the walls after it rains. Water cannot escape sideways past a wall, but it runs off the two ends of the array.<\/p>\n<h3>Examples<\/h3>\n<pre><code class=\"lang-text\">trap([0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1])  -&gt; 6\ntrap([4, 2, 0, 3, 2, 5])                    -&gt; 9\ntrap([5, 0, 5])                             -&gt; 5\ntrap([3, 2, 1])                             -&gt; 0<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li><code>0 &lt;= len(height) &lt;= 3 * 10^5<\/code><\/li><li><code>0 &lt;= height[i] &lt;= 10^5<\/code><\/li><li>Target: O(n) time. Two passes with O(n) extra space is good; the two-pointer version with O(1) extra space is what a strong answer ends with.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>A per-column formula before any algorithm: <code>water[i] = min(max(height[:i+1]), max(height[i:])) - height[i]<\/code>, and that the total is just the sum of that over <code>i<\/code>.<\/li><li>The O(n^2) version, then the prefix-max and suffix-max arrays that make it O(n), with the memory cost named.<\/li><li>For the two-pointer version, the invariant stated precisely: when <code>height[lo] &lt;= height[hi]<\/code>, the water at <code>lo<\/code> depends only on <code>left_max<\/code>, because some wall on the right (at least <code>height[hi]<\/code>) is at least as high as <code>left_max<\/code>. Interviewers ask you to defend this; have the argument ready.<\/li><li>A quick sanity check on an example where the two-pointer order is not obvious (for instance <code>[4, 2, 0, 3, 2, 5]<\/code>).<\/li><\/ul>\n<h3>Follow-up to think about<\/h3>\n<p>The stack-based solution processes the water in horizontal layers instead of columns. When is that view the right one (think of the 2D version, \"Trapping Rain Water II\")?<\/p>", "starter": "\"\"\"Trapping Rain Water. Keep the function name; the tests import it.\"\"\"\n\n\ndef trap(height: list[int]) -> int:\n    \"\"\"Return the total units of water trapped between the walls in height.\"\"\"\n    raise NotImplementedError\n", "tests": "import random\n\nfrom solution import trap\n\n\ndef brute_force(height):\n    total = 0\n    for i in range(len(height)):\n        left = max(height[: i + 1])\n        right = max(height[i:])\n        total += min(left, right) - height[i]\n    return total\n\n\ndef test_examples():\n    assert trap([0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1]) == 6\n    assert trap([4, 2, 0, 3, 2, 5]) == 9\n\n\ndef test_too_short_to_hold_water():\n    assert trap([]) == 0\n    assert trap([7]) == 0\n    assert trap([2, 5]) == 0\n\n\ndef test_monotonic_and_flat_hold_nothing():\n    assert trap([1, 2, 3, 4, 5]) == 0\n    assert trap([5, 4, 3, 2, 1]) == 0\n    assert trap([3, 3, 3, 3]) == 0\n\n\ndef test_single_valley_and_plateau_inside():\n    assert trap([5, 0, 5]) == 5\n    assert trap([5, 0, 0, 5]) == 10\n    assert trap([5, 2, 2, 5]) == 6\n    assert trap([2, 0, 2, 0, 2]) == 4\n\n\ndef test_unequal_walls_use_the_lower_one():\n    assert trap([9, 0, 3]) == 3\n    assert trap([3, 0, 9]) == 3\n    assert trap([1, 0, 10, 0, 1]) == 2\n\n\ndef test_random_against_brute_force():\n    rng = random.Random(23)\n    for _ in range(400):\n        n = rng.randrange(0, 20)\n        h = [rng.randrange(0, 8) for _ in range(n)]\n        assert trap(h) == brute_force(h), f\"wrong for {h}\"\n\n\ndef test_large_input_is_fast():\n    rng = random.Random(31)\n    h = [rng.randrange(0, 1000) for _ in range(300_000)]\n    got = trap(h)\n    # Independent O(n) check with explicit prefix/suffix max arrays.\n    n = len(h)\n    left = [0] * n\n    right = [0] * n\n    m = 0\n    for i in range(n):\n        m = max(m, h[i])\n        left[i] = m\n    m = 0\n    for i in range(n - 1, -1, -1):\n        m = max(m, h[i])\n        right[i] = m\n    expected = sum(min(left[i], right[i]) - h[i] for i in range(n))\n    assert got == expected, f\"expected {expected}, got {got}\"\n", "solution": "def trap(height: list[int]) -> int:\n    lo, hi = 0, len(height) - 1\n    left_max = right_max = 0\n    water = 0\n    while lo < hi:\n        if height[lo] <= height[hi]:\n            # The right side has a wall >= height[lo] >= anything that could bound lo,\n            # so the level at lo is decided by left_max alone.\n            left_max = max(left_max, height[lo])\n            water += left_max - height[lo]\n            lo += 1\n        else:\n            right_max = max(right_max, height[hi])\n            water += right_max - height[hi]\n            hi -= 1\n    return water\n"}, {"id": "lc-search-rotated-array", "title": "Search in Rotated Sorted Array", "track": "leetcode", "module": "lc-search-sort", "difficulty": "medium", "minutes": 25, "runtime": "python", "kind": "code", "tags": ["binary search", "array"], "hints": ["A linear scan is O(n) per query and the tests run thousands of queries. The array is 'almost sorted': which property of a sorted array does binary search really need?", "Split at mid. At least one of the two halves, nums[lo..mid] or nums[mid..hi], is sorted in the ordinary way. Compare nums[lo] with nums[mid] to tell which.", "If the left half is sorted and nums[lo] <= target < nums[mid], search it; otherwise search the right half. Mirror the logic when the right half is the sorted one."], "rubric": [], "timeout": 30, "readme": "<h2>Search in Rotated Sorted Array<\/h2>\n<p><code>nums<\/code> was sorted in ascending order with <strong>distinct<\/strong> values, then rotated at some unknown pivot: <code>[0, 1, 2, 4, 5, 6, 7]<\/code> may have become <code>[4, 5, 6, 7, 0, 1, 2]<\/code>. The rotation may also be by zero positions, so a plain sorted array is valid input.<\/p>\n<p>Given <code>nums<\/code> and a <code>target<\/code>, return the index of <code>target<\/code> in <code>nums<\/code>, or <code>-1<\/code> if it is not present.<\/p>\n<h3>Examples<\/h3>\n<pre><code class=\"lang-text\">search([4, 5, 6, 7, 0, 1, 2], 0)  -&gt; 4\nsearch([4, 5, 6, 7, 0, 1, 2], 3)  -&gt; -1\nsearch([1], 0)                    -&gt; -1\nsearch([3, 1], 1)                 -&gt; 1<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li><code>1 &lt;= len(nums) &lt;= 2 * 10^5<\/code>, all values distinct.<\/li><li><code>-10^9 &lt;= nums[i], target &lt;= 10^9<\/code><\/li><li>Target: O(log n) time per query, O(1) extra space. The large test asks thousands of queries on one array, so O(n) per query will time out.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>You say the O(n) scan and then immediately ask what binary search needs: a way to decide which side to discard from <code>nums[lo]<\/code>, <code>nums[mid]<\/code> and <code>nums[hi]<\/code>.<\/li><li>The key observation, said clearly: one of the two halves around <code>mid<\/code> is always fully sorted, and you can tell which with one comparison.<\/li><li>The branch logic written without off-by-one errors: a range check <code>nums[lo] &lt;= target &lt; nums[mid]<\/code> against the sorted half, and the else branch handles everything else.<\/li><li>You can explain what breaks with duplicates (<code>[1, 1, 1, 0, 1]<\/code>) and why the worst case degrades to O(n).<\/li><\/ul>\n<h3>Follow-up to think about<\/h3>\n<p>Alternative plan: find the rotation pivot with one binary search, then do an ordinary binary search on the right segment. Same complexity; which one would you rather code under time pressure, and why?<\/p>", "starter": "\"\"\"Search in Rotated Sorted Array. Keep the function name; the tests import it.\"\"\"\n\n\ndef search(nums: list[int], target: int) -> int:\n    \"\"\"Return the index of target in the rotated sorted array nums (distinct values), or -1.\"\"\"\n    raise NotImplementedError\n", "tests": "import random\n\nfrom solution import search\n\n\ndef rotated(values, k):\n    return values[k:] + values[:k]\n\n\ndef test_examples():\n    assert search([4, 5, 6, 7, 0, 1, 2], 0) == 4\n    assert search([4, 5, 6, 7, 0, 1, 2], 3) == -1\n\n\ndef test_single_element():\n    assert search([1], 1) == 0\n    assert search([1], 0) == -1\n\n\ndef test_two_elements_both_rotations():\n    assert search([1, 3], 3) == 1\n    assert search([3, 1], 1) == 1\n    assert search([3, 1], 3) == 0\n    assert search([3, 1], 2) == -1\n\n\ndef test_not_rotated_and_rotated_by_one():\n    nums = list(range(10, 40, 3))\n    for t in nums:\n        assert search(nums, t) == nums.index(t)\n    r = rotated(nums, 1)\n    for t in r:\n        assert search(r, t) == r.index(t)\n    assert search(r, 11) == -1\n\n\ndef test_target_at_every_position_for_every_rotation():\n    base = [-7, -3, 0, 2, 5, 9, 14, 21]\n    for k in range(len(base)):\n        nums = rotated(base, k)\n        for i, v in enumerate(nums):\n            assert search(nums, v) == i, f\"{nums} target {v}\"\n        for miss in (-8, -1, 1, 22):\n            assert search(nums, miss) == -1, f\"{nums} target {miss} should be absent\"\n\n\ndef test_random_against_linear_scan():\n    rng = random.Random(29)\n    for _ in range(500):\n        n = rng.randrange(1, 15)\n        base = sorted(rng.sample(range(-30, 30), n))\n        nums = rotated(base, rng.randrange(n))\n        t = rng.randrange(-32, 32)\n        expected = nums.index(t) if t in nums else -1\n        assert search(nums, t) == expected, f\"{nums} target {t}\"\n\n\ndef test_many_queries_on_large_array_are_fast():\n    rng = random.Random(37)\n    n = 200_000\n    base = sorted(rng.sample(range(-5 * n, 5 * n), n))\n    nums = rotated(base, 61_803)\n    position = {v: i for i, v in enumerate(nums)}\n    for _ in range(30_000):\n        if rng.random() < 0.7:\n            i = rng.randrange(n)\n            assert search(nums, nums[i]) == i\n        else:\n            t = rng.randrange(-5 * n, 5 * n)\n            assert search(nums, t) == position.get(t, -1)\n", "solution": "def search(nums: list[int], target: int) -> int:\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[lo] <= nums[mid]:                       # left half is sorted\n            if nums[lo] <= target < nums[mid]:\n                hi = mid - 1\n            else:\n                lo = mid + 1\n        else:                                           # right half is sorted\n            if nums[mid] < target <= nums[hi]:\n                lo = mid + 1\n            else:\n                hi = mid - 1\n    return -1\n"}, {"id": "lc-koko-eating-bananas", "title": "Koko Eating Bananas", "track": "leetcode", "module": "lc-search-sort", "difficulty": "medium", "minutes": 25, "runtime": "python", "kind": "code", "tags": ["binary search", "binary search on the answer"], "hints": ["Trying every speed k = 1, 2, 3, ... and checking each in O(n) works but is O(n * max(piles)). What property of 'speed k is fast enough' lets you skip most speeds?", "Feasibility is monotone: if speed k finishes within h hours, every speed above k does too. A monotone yes/no predicate over a range of integers is exactly what binary search needs.", "Hours needed at speed k is sum(ceil(p / k)) over the piles, which is (p + k - 1) // k in integers. Binary search k over [1, max(piles)] for the smallest feasible value."], "rubric": [], "timeout": 30, "readme": "<h2>Koko Eating Bananas<\/h2>\n<p>There are <code>len(piles)<\/code> piles of bananas; pile <code>i<\/code> holds <code>piles[i]<\/code> bananas. Koko picks an eating speed <code>k<\/code> (bananas per hour). Each hour she chooses one pile and eats <code>k<\/code> bananas from it; if the pile has fewer than <code>k<\/code> left she finishes it and does not start another pile that hour.<\/p>\n<p>Given <code>piles<\/code> and the number of hours <code>h<\/code> she has (always <code>h &gt;= len(piles)<\/code>), return the <strong>minimum<\/strong> integer speed <code>k<\/code> such that she can eat every banana within <code>h<\/code> hours.<\/p>\n<h3>Examples<\/h3>\n<pre><code class=\"lang-text\">min_eating_speed([3, 6, 7, 11], 8)        -&gt; 4\nmin_eating_speed([30, 11, 23, 4, 20], 5)  -&gt; 30\nmin_eating_speed([30, 11, 23, 4, 20], 6)  -&gt; 23\nmin_eating_speed([1], 1)                  -&gt; 1<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li><code>1 &lt;= len(piles) &lt;= 10^4<\/code><\/li><li><code>1 &lt;= piles[i] &lt;= 10^9<\/code><\/li><li><code>len(piles) &lt;= h &lt;= 10^9<\/code><\/li><li>Target: O(n log(max(piles))) time, O(1) extra space. Scanning speeds one by one will time out when piles hold up to <code>10^9<\/code> bananas.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>You name the search space (integer speeds from 1 to <code>max(piles)<\/code>) and explain why <code>max(piles)<\/code> is a valid upper bound before writing any code.<\/li><li>The monotonicity argument, stated as the reason binary search applies: feasibility at <code>k<\/code> implies feasibility at <code>k + 1<\/code>.<\/li><li>The feasibility check written with integer ceiling division, with the cost of each check named, and the overall complexity as <code>O(n log M)<\/code>.<\/li><li>The binary search converges on the first feasible speed without an off-by-one: say which half you keep when <code>mid<\/code> is feasible and why <code>lo<\/code> ends at the answer.<\/li><\/ul>\n<h3>Follow-up to think about<\/h3>\n<p>This \"binary search on the answer\" pattern shows up constantly (split array largest sum, minimum days to make bouquets, capacity to ship packages). What two properties must a problem have for it to apply?<\/p>", "starter": "\"\"\"Koko Eating Bananas. Keep the function name; the tests import it.\"\"\"\n\n\ndef min_eating_speed(piles: list[int], h: int) -> int:\n    \"\"\"Return the smallest integer speed at which all piles can be eaten within h hours.\"\"\"\n    raise NotImplementedError\n", "tests": "import random\n\nfrom solution import min_eating_speed\n\n\ndef hours_needed(piles, k):\n    return sum((p + k - 1) // k for p in piles)\n\n\ndef brute_force(piles, h):\n    k = 1\n    while hours_needed(piles, k) > h:\n        k += 1\n    return k\n\n\ndef check(piles, h):\n    k = min_eating_speed(piles, h)\n    assert k >= 1, f\"speed must be positive, got {k}\"\n    assert hours_needed(piles, k) <= h, f\"speed {k} needs {hours_needed(piles, k)} hours, more than {h}\"\n    assert k == 1 or hours_needed(piles, k - 1) > h, f\"speed {k - 1} would also work, so {k} is not minimal\"\n\n\ndef test_examples():\n    assert min_eating_speed([3, 6, 7, 11], 8) == 4\n    assert min_eating_speed([30, 11, 23, 4, 20], 5) == 30\n    assert min_eating_speed([30, 11, 23, 4, 20], 6) == 23\n\n\ndef test_single_pile():\n    assert min_eating_speed([1], 1) == 1\n    assert min_eating_speed([10], 1) == 10\n    assert min_eating_speed([10], 3) == 4\n    assert min_eating_speed([10], 100) == 1\n\n\ndef test_hours_equal_to_piles_means_largest_pile():\n    assert min_eating_speed([5, 9, 2, 7], 4) == 9\n\n\ndef test_plenty_of_time_means_speed_one():\n    assert min_eating_speed([5, 9, 2, 7], 10**9) == 1\n\n\ndef test_large_piles_do_not_overflow_or_crawl():\n    assert min_eating_speed([10**9], 2) == 500_000_000\n    assert min_eating_speed([10**9, 10**9], 3) == 10**9\n    assert min_eating_speed([10**9] * 4, 10**9) == 4\n\n\ndef test_random_against_brute_force():\n    rng = random.Random(19)\n    for _ in range(300):\n        n = rng.randrange(1, 8)\n        piles = [rng.randrange(1, 40) for _ in range(n)]\n        h = rng.randrange(n, 3 * n + 20)\n        assert min_eating_speed(piles, h) == brute_force(piles, h), f\"wrong for {piles}, h={h}\"\n\n\ndef test_large_input_is_fast():\n    rng = random.Random(41)\n    piles = [rng.randrange(1, 10**9) for _ in range(10_000)]\n    for h in (10_000, 25_000, 10**6, 10**7):\n        check(piles, h)\n", "solution": "def min_eating_speed(piles: list[int], h: int) -> int:\n    def hours(k: int) -> int:\n        return sum((p + k - 1) // k for p in piles)\n\n    lo, hi = 1, max(piles)                    # hi is always feasible (every pile in one hour)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if hours(mid) <= h:\n            hi = mid                          # mid works; the answer is mid or smaller\n        else:\n            lo = mid + 1                      # mid is too slow\n    return lo\n"}, {"id": "lc-kth-largest-quickselect", "title": "Kth Largest Element in an Array", "track": "leetcode", "module": "lc-search-sort", "difficulty": "medium", "minutes": 30, "runtime": "python", "kind": "code", "tags": ["quickselect", "heap", "partition", "sorting"], "hints": ["sorted(nums)[-k] is O(n log n) and is the right first answer. A min-heap that never grows past k elements gives O(n log k). The interviewer will then ask for average O(n).", "Quickselect: pick a pivot, partition the array into values below, equal to and above it, and recurse only into the one part that contains the k-th largest position. Average O(n) because the expected work halves each round.", "Choose the pivot at random and partition three ways (less, equal, greater): with only two parts, an array full of duplicates degrades to O(n^2)."], "rubric": [], "timeout": 30, "readme": "<h2>Kth Largest Element in an Array<\/h2>\n<p>Given a list of integers <code>nums<\/code> and an integer <code>k<\/code> with <code>1 &lt;= k &lt;= len(nums)<\/code>, return the <code>k<\/code>-th largest element in sorted order, counting duplicates. The 1st largest is the maximum, the <code>len(nums)<\/code>-th largest is the minimum, and in <code>[5, 5, 4]<\/code> the 2nd largest is <code>5<\/code>.<\/p>\n<p>Sorting is the baseline. The interview target is average O(n) with quickselect; the tests also accept a heap, and they include an input full of repeated values, so make sure your partition does not fall into the quadratic case on duplicates.<\/p>\n<h3>Examples<\/h3>\n<pre><code class=\"lang-text\">find_kth_largest([3, 2, 1, 5, 6, 4], 2)            -&gt; 5\nfind_kth_largest([3, 2, 3, 1, 2, 4, 5, 5, 6], 4)   -&gt; 4\nfind_kth_largest([7], 1)                           -&gt; 7<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li><code>1 &lt;= k &lt;= len(nums) &lt;= 3 * 10^5<\/code><\/li><li><code>-10^9 &lt;= nums[i] &lt;= 10^9<\/code><\/li><li>Target: average O(n) time, O(1) extra space beyond the array (you may modify <code>nums<\/code>). O(n log k) with a heap is acceptable; O(n k) is not.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>The ladder of answers with their costs: sort (O(n log n)), heap of size k (O(n log k), useful when k is small or the data streams), quickselect (average O(n), worst O(n^2)).<\/li><li>Why quickselect is linear on average: the recurrence <code>T(n) = T(n/2) + O(n)<\/code> sums to O(n), unlike quicksort which recurses into both sides.<\/li><li>What a random pivot buys you (no adversarial worst case) and what a three-way partition buys you (no quadratic blow-up on equal keys). Mentioning median-of-medians for a guaranteed O(n) is a bonus; implementing it is not expected.<\/li><li>Clean index arithmetic: you want the element at sorted position <code>len(nums) - k<\/code>, and you can state which partition the answer falls into after each round.<\/li><\/ul>\n<h3>Follow-up to think about<\/h3>\n<p>If <code>nums<\/code> arrived as a stream too large for memory, which of the three approaches survives, and what would you keep in memory?<\/p>", "starter": "\"\"\"Kth Largest Element in an Array. Keep the function name; the tests import it.\"\"\"\n\n\ndef find_kth_largest(nums: list[int], k: int) -> int:\n    \"\"\"Return the k-th largest value of nums (1 <= k <= len(nums)), counting duplicates.\"\"\"\n    raise NotImplementedError\n", "tests": "import random\n\nfrom solution import find_kth_largest\n\n\ndef test_examples():\n    assert find_kth_largest([3, 2, 1, 5, 6, 4], 2) == 5\n    assert find_kth_largest([3, 2, 3, 1, 2, 4, 5, 5, 6], 4) == 4\n\n\ndef test_single_element_and_extremes():\n    assert find_kth_largest([7], 1) == 7\n    nums = [9, -2, 4, 4, 0, 11]\n    assert find_kth_largest(list(nums), 1) == 11, \"k = 1 is the maximum\"\n    assert find_kth_largest(list(nums), 6) == -2, \"k = n is the minimum\"\n\n\ndef test_duplicates_count_separately():\n    assert find_kth_largest([5, 5, 4], 2) == 5\n    assert find_kth_largest([5, 5, 4], 3) == 4\n    assert find_kth_largest([2, 2, 2, 2], 3) == 2\n\n\ndef test_sorted_and_reverse_sorted_inputs():\n    asc = list(range(1, 2001))\n    assert find_kth_largest(list(asc), 1) == 2000\n    assert find_kth_largest(list(asc), 2000) == 1\n    assert find_kth_largest(list(reversed(asc)), 500) == 1501\n\n\ndef test_random_against_sorting():\n    rng = random.Random(47)\n    for _ in range(300):\n        n = rng.randrange(1, 30)\n        nums = [rng.randrange(-10, 11) for _ in range(n)]\n        k = rng.randrange(1, n + 1)\n        assert find_kth_largest(list(nums), k) == sorted(nums)[-k], f\"wrong for {nums}, k={k}\"\n\n\ndef test_large_input_with_k_in_the_middle_is_fast():\n    rng = random.Random(53)\n    nums = [rng.randrange(-10**9, 10**9) for _ in range(300_000)]\n    k = 150_000\n    expected = sorted(nums)[-k]\n    assert find_kth_largest(list(nums), k) == expected\n\n\ndef test_many_duplicates_do_not_go_quadratic():\n    rng = random.Random(59)\n    nums = [rng.choice([1, 2, 3]) for _ in range(60_000)]\n    expected = sorted(nums)[-30_000]\n    assert find_kth_largest(list(nums), 30_000) == expected\n    assert find_kth_largest([4] * 100_000, 50_000) == 4\n", "solution": "import random\n\n\ndef find_kth_largest(nums: list[int], k: int) -> int:\n    \"\"\"Quickselect with a random pivot and a three-way partition: average O(n).\"\"\"\n    want = len(nums) - k                       # index in ascending sorted order\n    lo, hi = 0, len(nums) - 1\n    while True:\n        pivot = nums[random.randint(lo, hi)]\n        # Dutch-flag partition of nums[lo..hi]: [lo, lt) < pivot, [lt, gt] == pivot, (gt, hi] > pivot.\n        lt, i, gt = lo, lo, hi\n        while i <= gt:\n            x = nums[i]\n            if x < pivot:\n                nums[lt], nums[i] = x, nums[lt]\n                lt += 1\n                i += 1\n            elif x > pivot:\n                nums[gt], nums[i] = x, nums[gt]\n                gt -= 1\n            else:\n                i += 1\n        if want < lt:\n            hi = lt - 1\n        elif want > gt:\n            lo = gt + 1\n        else:\n            return pivot\n"}, {"id": "lc-top-k-frequent", "title": "Top K Frequent Elements", "track": "leetcode", "module": "lc-search-sort", "difficulty": "medium", "minutes": 25, "runtime": "python", "kind": "code", "tags": ["heap", "bucket sort", "hash map"], "hints": ["Count first: one dict pass gives (value -> frequency). Now the problem is 'k largest frequencies' over the distinct values, and sorting them is O(d log d).", "A min-heap of size k over (frequency, value) pairs is O(d log k): push every distinct value, pop whenever the heap exceeds k. What survives is the top k.", "Frequencies are integers in [1, n], so bucket them: buckets[f] holds the values with frequency f. Walk the buckets from n down to 1 until you have k values. That is O(n) with no comparisons at all."], "rubric": [], "timeout": 30, "readme": "<h2>Top K Frequent Elements<\/h2>\n<p>Given a list of integers <code>nums<\/code> and an integer <code>k<\/code>, return the <code>k<\/code> distinct values that occur most often in <code>nums<\/code>. Return them in any order. <code>k<\/code> is always between 1 and the number of distinct values.<\/p>\n<p>When several values tie at the boundary, any choice among the tied values is accepted: for <code>[1, 1, 2, 2, 3]<\/code> with <code>k = 1<\/code>, both <code>[1]<\/code> and <code>[2]<\/code> are correct. What is never correct is returning a value whose frequency is lower than that of a value you left out.<\/p>\n<h3>Examples<\/h3>\n<pre><code class=\"lang-text\">top_k_frequent([1, 1, 1, 2, 2, 3], 2)  -&gt; [1, 2]      (any order)\ntop_k_frequent([1], 1)                 -&gt; [1]\ntop_k_frequent([4, 4, -1, -1, 0], 2)   -&gt; [4, -1]     (any order)<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li><code>1 &lt;= len(nums) &lt;= 3 * 10^5<\/code><\/li><li><code>-10^9 &lt;= nums[i] &lt;= 10^9<\/code><\/li><li><code>1 &lt;= k &lt;= number of distinct values<\/code><\/li><li>Target: O(n log k) with a heap, or O(n) with bucket sort. O(k * d) over <code>d<\/code> distinct values (repeatedly taking the max) will time out on the large test.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Counting is the obvious first step; the interesting part is what you do with the <code>d<\/code> distinct counts, and you should say the sort-based O(d log d) answer out loud before improving it.<\/li><li>Why a min-heap of size k (not a max-heap of size d) is the right tool when <code>k<\/code> is much smaller than <code>d<\/code>, and what it costs in the worst case <code>k = d<\/code>.<\/li><li>The bucket-sort idea: frequencies live in a bounded integer range <code>[1, n]<\/code>, so you can avoid comparison sorting altogether. This is the same observation that makes counting sort linear.<\/li><li>You handle ties deliberately: either side of the boundary is acceptable, but your code must not drop a value that strictly beats one you kept.<\/li><\/ul>\n<h3>Follow-up to think about<\/h3>\n<p>Top-k by frequency over a stream, with the counts changing as data arrives: what structure keeps the answer current in O(log k) per update, and when is an approximate answer (count-min sketch) good enough?<\/p>", "starter": "\"\"\"Top K Frequent Elements. Keep the function name; the tests import it.\"\"\"\n\n\ndef top_k_frequent(nums: list[int], k: int) -> list[int]:\n    \"\"\"Return the k most frequent distinct values of nums, in any order.\"\"\"\n    raise NotImplementedError\n", "tests": "import random\nfrom collections import Counter\n\nfrom solution import top_k_frequent\n\n\ndef check(nums, k):\n    got = list(top_k_frequent(nums, k))\n    counts = Counter(nums)\n    assert len(got) == k, f\"expected {k} values, got {len(got)}\"\n    assert len(set(got)) == k, f\"values must be distinct: {got}\"\n    for v in got:\n        assert v in counts, f\"{v} does not occur in nums\"\n    top = sorted(counts.values(), reverse=True)[:k]\n    mine = sorted((counts[v] for v in got), reverse=True)\n    assert mine == top, f\"returned frequencies {mine} but the top {k} frequencies are {top}\"\n    return got\n\n\ndef test_example_has_a_unique_answer():\n    assert sorted(top_k_frequent([1, 1, 1, 2, 2, 3], 2)) == [1, 2]\n\n\ndef test_single_value():\n    assert list(top_k_frequent([1], 1)) == [1]\n    assert list(top_k_frequent([9, 9, 9, 9], 1)) == [9]\n\n\ndef test_k_equals_number_of_distinct_values():\n    assert sorted(top_k_frequent([3, 1, 2, 1, 3, 3], 3)) == [1, 2, 3]\n\n\ndef test_ties_accept_any_boundary_choice():\n    got = check([1, 2, 3, 1, 2, 3], 2)\n    assert set(got) <= {1, 2, 3}\n    got = check([5, 5, 6, 6, 7], 1)\n    assert got[0] in (5, 6), f\"7 occurs less often than 5 and 6, got {got}\"\n    che
