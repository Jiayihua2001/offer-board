], "timeout": 30, "readme": "<h2>Temperature scaling and expected calibration error<\/h2>\n<p>Calibration is the follow-up to any question about confidence thresholds, routing, or \"when should the model abstain\", and it is the method you shipped in the LLM router. Interviewers like it because it is one scalar, fitted by a one-dimensional search on held-out data, and it fixes a very visible failure (overconfident softmax outputs) without touching accuracy. Implement the fit and the metric that shows it worked.<\/p>\n<p>The starter provides a stable <code>log_softmax<\/code> and <code>softmax<\/code>. Implement:<\/p>\n<ul><li><code>nll(logits, y, T) -&gt; float<\/code>: mean negative log-likelihood of integer labels <code>y<\/code> under <code>softmax(logits / T)<\/code>. <code>logits<\/code> has shape <code>(N, C)<\/code>.<\/li><li><code>fit_temperature(logits, y, lo=0.05, hi=20.0, tol=1e-4) -&gt; float<\/code>: the <code>T<\/code> in <code>[lo, hi]<\/code> that minimizes <code>nll<\/code>, found with a bracketing search (coarse grid plus golden-section or ternary refinement, or gradient descent on <code>log T<\/code>). Must be accurate to about <code>tol<\/code> in <code>T<\/code>.<\/li><li><code>calibration_bins(probs, y, n_bins) -&gt; (bin_acc, bin_conf, bin_count)<\/code>: with <code>confidence = probs.max(1)<\/code> and <code>correct = probs.argmax(1) == y<\/code>, split <code>(0, 1]<\/code> into <code>n_bins<\/code> equal-width bins and return the mean accuracy, the mean confidence and the count per bin (arrays of shape <code>(n_bins,)<\/code>; empty bins have accuracy and confidence 0).<\/li><li><code>ece(probs, y, n_bins=15) -&gt; float<\/code>: <code>sum over bins of (count / N) * |bin_acc - bin_conf|<\/code>.<\/li><\/ul>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">probs = np.array([[0.9, 0.1], [0.8, 0.2], [0.7, 0.3], [0.6, 0.4]])   # confidences .9 .8 .7 .6\ny     = np.array([0, 1, 0, 0])                                        # correct: yes no yes yes\ncalibration_bins(probs, y, n_bins=4)   -&gt; acc [0, 0, 1.0, 0.5], conf [0, 0, 0.65, 0.85], count [0, 0, 2, 2]\nece(probs, y, n_bins=4)                -&gt; 0.5 * |1.0 - 0.65| + 0.5 * |0.5 - 0.85| = 0.35\n\nlogits = 3 * calibrated_logits         # overconfident by a factor of 3\nfit_temperature(logits, y)             -&gt; about 3.0<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>No loops over samples; a loop over bins or over search iterations is fine.<\/li><li><code>nll<\/code> must be stable for logits of magnitude 1000 (use the provided <code>log_softmax<\/code>).<\/li><li>Tests: <code>T<\/code> is recovered within 0.2 on synthetic data (sharpened and flattened logits), <code>argmax<\/code> is unchanged by scaling, and <code>ece<\/code> and <code>nll<\/code> both drop after fitting.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why a single temperature cannot change accuracy: dividing logits by <code>T &gt; 0<\/code> is monotone, so <code>argmax<\/code> is unchanged; it only moves probability mass toward or away from the top class.<\/li><li>Why fit <code>T<\/code> on a held-out set with NLL (a proper scoring rule) and not on the training set, where the model is already overconfident, and why NLL and not ECE (ECE is piecewise constant in <code>T<\/code>, so it has no useful gradient).<\/li><li>What ECE measures and its weaknesses: binning bias, sensitivity to <code>n_bins<\/code>, only the top-class confidence is checked. Know the reliability-diagram picture.<\/li><li>Follow-up: how you extend this to a router threshold (calibrated probability of \"small model is right\" feeds a cost-aware decision rule), and when you need something more flexible than one scalar (vector or matrix scaling, isotonic regression, Platt scaling for binary scores).<\/li><\/ul>", "starter": "\"\"\"Temperature scaling (fit one scalar on held-out logits) and expected calibration error. Vectorized NumPy only.\"\"\"\nimport numpy as np\n\n\ndef log_softmax(z: np.ndarray) -> np.ndarray:\n    \"\"\"Row-wise, stable. Provided.\"\"\"\n    m = z.max(axis=1, keepdims=True)\n    return z - m - np.log(np.exp(z - m).sum(axis=1, keepdims=True))\n\n\ndef softmax(z: np.ndarray) -> np.ndarray:\n    \"\"\"Row-wise, stable. Provided.\"\"\"\n    return np.exp(log_softmax(z))\n\n\ndef nll(logits: np.ndarray, y: np.ndarray, T: float) -> float:\n    \"\"\"Mean negative log-likelihood of labels y (N,) under softmax(logits / T).\"\"\"\n    raise NotImplementedError\n\n\ndef fit_temperature(logits: np.ndarray, y: np.ndarray, lo: float = 0.05, hi: float = 20.0, tol: float = 1e-4) -> float:\n    \"\"\"The T in [lo, hi] minimizing nll(logits, y, T), to within about tol.\"\"\"\n    raise NotImplementedError\n\n\ndef calibration_bins(probs: np.ndarray, y: np.ndarray, n_bins: int):\n    \"\"\"Per equal-width confidence bin on (0, 1]: (mean accuracy, mean confidence, count), each of shape (n_bins,).\"\"\"\n    raise NotImplementedError\n\n\ndef ece(probs: np.ndarray, y: np.ndarray, n_bins: int = 15) -> float:\n    \"\"\"Expected calibration error: sum_b (count_b / N) * |acc_b - conf_b|.\"\"\"\n    raise NotImplementedError\n", "tests": "import numpy as np\n\nfrom solution import calibration_bins, ece, fit_temperature, nll, softmax\n\n\ndef calibrated_logits(seed=5, n=4000, c=5, scale=2.0):\n    \"\"\"Logits z and labels drawn from softmax(z), so z is perfectly calibrated by construction.\"\"\"\n    rng = np.random.default_rng(seed)\n    z = rng.normal(size=(n, c)) * scale\n    p = np.exp(z - z.max(1, keepdims=True))\n    p /= p.sum(1, keepdims=True)\n    y = (p.cumsum(1) > rng.random((n, 1))).argmax(1)\n    return z, y\n\n\ndef ref_nll(z, y):\n    m = z.max(1, keepdims=True)\n    ls = z - m - np.log(np.exp(z - m).sum(1, keepdims=True))\n    return -ls[np.arange(len(y)), y].mean()\n\n\ndef test_nll_matches_reference_and_is_stable():\n    z, y = calibrated_logits(seed=0, n=50)\n    assert np.isclose(nll(z, y, 1.0), ref_nll(z, y), atol=1e-12)\n    assert np.isclose(nll(z, y, 2.5), ref_nll(z / 2.5, y), atol=1e-12)\n    huge = np.array([[1000.0, 0.0], [-1000.0, 0.0]])\n    v = nll(huge, np.array([1, 1]), 1.0)\n    assert np.isfinite(v) and np.isclose(v, 500.0), \"one row costs 1000, the other 0\"\n\n\ndef test_fit_recovers_the_sharpening_factor():\n    z, y = calibrated_logits()\n    for scale, expected in [(3.0, 3.0), (1.0, 1.0), (1 / 3, 1 / 3)]:\n        T = fit_temperature(z * scale, y)\n        assert abs(T - expected) < 0.2 * expected, f\"scale {scale}: fitted T = {T}, expected about {expected}\"\n\n\ndef test_fitted_T_is_a_minimizer_and_argmax_is_unchanged():\n    z, y = calibrated_logits(seed=6)\n    sharp = 3.0 * z\n    T = fit_temperature(sharp, y)\n    best = nll(sharp, y, T)\n    for other in [T * 0.8, T * 1.2, 1.0, 5.0]:\n        assert best <= nll(sharp, y, other) + 1e-9, f\"nll at T={T} should beat T={other}\"\n    assert nll(sharp, y, T) < nll(sharp, y, 1.0)\n    assert np.array_equal(softmax(sharp / T).argmax(1), sharp.argmax(1)), \"scaling must not change predictions\"\n\n\ndef test_fit_is_precise_on_a_smooth_objective():\n    z, y = calibrated_logits(seed=7, n=500)\n    T = fit_temperature(2.0 * z, y, tol=1e-5)\n    grid = np.linspace(T - 0.01, T + 0.01, 201)\n    vals = np.array([nll(2.0 * z, y, t) for t in grid])\n    assert abs(grid[vals.argmin()] - T) <= 2e-3, \"the returned T should be at the bottom of the valley\"\n\n\ndef test_calibration_bins_hand_example():\n    probs = np.array([[0.9, 0.1], [0.8, 0.2], [0.7, 0.3], [0.6, 0.4]])\n    y = np.array([0, 1, 0, 0])\n    acc, conf, count = calibration_bins(probs, y, n_bins=4)     # bins (0, .25], (.25, .5], (.5, .75], (.75, 1]\n    assert acc.shape == conf.shape == count.shape == (4,)\n    assert count.tolist() == [0, 0, 2, 2]\n    assert np.allclose(acc, [0.0, 0.0, 1.0, 0.5])\n    assert np.allclose(conf, [0.0, 0.0, 0.65, 0.85])\n    assert np.isclose(ece(probs, y, n_bins=4), 0.5 * 0.35 + 0.5 * 0.35)\n    acc, conf, count = calibration_bins(probs, y, n_bins=10)\n    assert count.sum() == 4 and acc[count == 0].sum() == 0 and conf[count == 0].sum() == 0\n\n\ndef test_ece_is_zero_when_confidence_matches_accuracy():\n    probs = np.tile([[0.7, 0.3]], (10, 1))\n    y = np.array([0] * 7 + [1] * 3)             # 70% correct at 70% confidence\n    assert np.isclose(ece(probs, y, n_bins=10), 0.0, atol=1e-12)\n    y_all_right = np.zeros(10, int)\n    assert np.isclose(ece(probs, y_all_right, n_bins=10), 0.3)\n\n\ndef test_temperature_scaling_reduces_ece_and_nll():\n    z, y = calibrated_logits(seed=8)\n    sharp = 3.0 * z\n    T = fit_temperature(sharp, y)\n    before, after = ece(softmax(sharp), y), ece(softmax(sharp / T), y)\n    assert before > 0.15, f\"overconfident logits should have a large ECE, got {before}\"\n    assert after < 0.05, f\"after scaling ECE should be small, got {after}\"\n    assert nll(sharp, y, T) < nll(sharp, y, 1.0)\n    flat = z / 3.0\n    T_flat = fit_temperature(flat, y)\n    assert T_flat < 1.0 and ece(softmax(flat / T_flat), y) < ece(softmax(flat), y)\n", "solution": "import numpy as np\n\n\ndef log_softmax(z: np.ndarray) -> np.ndarray:\n    m = z.max(axis=1, keepdims=True)\n    return z - m - np.log(np.exp(z - m).sum(axis=1, keepdims=True))\n\n\ndef softmax(z: np.ndarray) -> np.ndarray:\n    return np.exp(log_softmax(z))\n\n\ndef nll(logits: np.ndarray, y: np.ndarray, T: float) -> float:\n    ls = log_softmax(logits / T)\n    return float(-ls[np.arange(len(y)), y].mean())\n\n\ndef fit_temperature(logits: np.ndarray, y: np.ndarray, lo: float = 0.05, hi: float = 20.0, tol: float = 1e-4) -> float:\n    def f(log_t):\n        return nll(logits, y, float(np.exp(log_t)))\n\n    # Coarse grid in log T to find the valley, then golden-section search inside the bracket around it.\n    grid = np.linspace(np.log(lo), np.log(hi), 50)\n    vals = np.array([f(g) for g in grid])\n    i = int(vals.argmin())\n    a, b = grid[max(i - 1, 0)], grid[min(i + 1, len(grid) - 1)]\n    gr = (np.sqrt(5.0) - 1.0) / 2.0\n    c, d = b - gr * (b - a), a + gr * (b - a)\n    fc, fd = f(c), f(d)\n    while (b - a) > tol / max(np.exp(b), 1.0) * 0.5:            # bracket width in T is about exp(b) * (b - a)\n        if fc < fd:\n            b, d, fd = d, c, fc\n            c = b - gr * (b - a)\n            fc = f(c)\n        else:\n            a, c, fc = c, d, fd\n            d = a + gr * (b - a)\n            fd = f(d)\n    return float(np.exp((a + b) / 2.0))\n\n\ndef calibration_bins(probs: np.ndarray, y: np.ndarray, n_bins: int):\n    conf = probs.max(axis=1)\n    correct = (probs.argmax(axis=1) == y).astype(float)\n    # Bin b covers (b / n_bins, (b + 1) / n_bins]; a confidence of exactly 1 lands in the last bin.\n    idx = np.clip(np.ceil(conf * n_bins).astype(int) - 1, 0, n_bins - 1)\n    count = np.bincount(idx, minlength=n_bins)\n    acc_sum = np.bincount(idx, weights=correct, minlength=n_bins)\n    conf_sum = np.bincount(idx, weights=conf, minlength=n_bins)\n    safe = np.maximum(count, 1)\n    return acc_sum / safe, conf_sum / safe, count\n\n\ndef ece(probs: np.ndarray, y: np.ndarray, n_bins: int = 15) -> float:\n    acc, conf, count = calibration_bins(probs, y, n_bins)\n    return float(np.sum(count / len(y) * np.abs(acc - conf)))\n"}, {"id": "ml-stratified-kfold", "title": "Stratified and grouped cross-validation splits", "track": "ml", "module": "ml-eval", "difficulty": "easy", "minutes": 30, "runtime": "numpy", "kind": "code", "tags": ["cross-validation", "stratification", "group k-fold", "data leakage"], "hints": ["Stratified: for each class, take its indices, shuffle them with rng.permutation, and deal them round-robin to the k folds (fold_of[idx[i]] = i % k). Every fold then gets n_c // k or n_c // k + 1 members of class c.", "Keep one array fold_of of length N. Fold f's test set is np.flatnonzero(fold_of == f) and its train set is np.flatnonzero(fold_of != f); that makes coverage and disjointness automatic.", "Group k-fold: count the samples per group, visit groups from largest to smallest, and put each one into the fold that currently has the fewest samples. A group lives in exactly one fold, so it can never appear in both train and test."], "rubric": [], "timeout": 30, "readme": "<h2>Stratified and grouped cross-validation splits<\/h2>\n<p>Writing a splitter sounds trivial until the interviewer asks why plain k-fold overestimates a model whose data has 10 samples per molecule or per patient, or why a 2% positive class needs stratification. This is the \"do you think about leakage\" question, and the materials-discovery version of it (same composition or prototype in train and test) is one you have lived through.<\/p>\n<p>Implement two splitters that return a list of <code>k<\/code> <code>(train_idx, test_idx)<\/code> pairs of integer index arrays:<\/p>\n<ul><li><code>stratified_kfold(y, k, rng)<\/code>: <code>y<\/code> is an integer label array of length <code>N<\/code>. Every fold's test set contains either <code>floor(n_c / k)<\/code> or <code>ceil(n_c / k)<\/code> samples of each class <code>c<\/code>. Samples are shuffled with <code>rng<\/code> before being dealt, so the folds are random but reproducible. Raise <code>ValueError<\/code> if any class has fewer than <code>k<\/code> samples.<\/li><li><code>group_kfold(groups, k)<\/code>: <code>groups<\/code> is an array of length <code>N<\/code> with a group id per sample. Every group appears in exactly one test fold, so no group is ever split between train and test. Balance the folds greedily: assign groups from largest to smallest, each to the fold with the fewest samples so far. Raise <code>ValueError<\/code> if there are fewer than <code>k<\/code> distinct groups.<\/li><\/ul>\n<p>In both cases the test sets partition <code>0..N-1<\/code>, and each train set is the complement of its test set.<\/p>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">y = np.array([0, 0, 0, 0, 1, 1])\nfor train_idx, test_idx in stratified_kfold(y, k=2, rng=np.random.default_rng(0)):\n    print(sorted(y[test_idx]))        # [0, 0, 1] twice: each fold has 2 of class 0 and 1 of class 1\n\ngroups = np.array([0, 0, 0, 1, 1, 2, 2, 3])\ngroup_kfold(groups, k=2)    # test folds: groups {0, 3} (4 samples) and {1, 2} (4 samples)<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>No loops over samples; loop over classes, groups or folds only (<code>np.unique<\/code> and boolean masks do the work).<\/li><li>Test sets are disjoint and cover every index exactly once; train sets are exact complements.<\/li><li>For <code>group_kfold<\/code> the greedy balancing guarantees every fold has at most <code>N / k + max_group_size<\/code> samples; a test checks it.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why stratify: with a rare class, a random fold can hold zero positives, which makes per-fold metrics undefined and the variance across folds huge.<\/li><li>Leakage: if samples sharing a group are correlated (same structure, same patient, same prompt template), random splits let the model memorize the group and inflate the validation score. Group splitting estimates performance on new groups, which is usually the question you care about.<\/li><li>The remaining limitations: group k-fold cannot also stratify perfectly; time-series data needs forward-chaining splits instead; and the choice of <code>k<\/code> trades bias (small <code>k<\/code>, small train sets) against variance and compute.<\/li><li>Follow-up: how you would evaluate a materials model on new compositions versus new polymorphs of known compositions, and why those two splits give very different numbers.<\/li><\/ul>", "starter": "\"\"\"Cross-validation splitters that preserve class proportions or keep groups intact. NumPy only.\"\"\"\nimport numpy as np\n\n\ndef stratified_kfold(y: np.ndarray, k: int, rng: np.random.Generator):\n    \"\"\"k (train_idx, test_idx) pairs whose test sets each hold floor(n_c / k) or ceil(n_c / k) samples of every class c.\n\n    Shuffle with rng. Raise ValueError if some class has fewer than k samples.\n    \"\"\"\n    raise NotImplementedError\n\n\ndef group_kfold(groups: np.ndarray, k: int):\n    \"\"\"k (train_idx, test_idx) pairs with every group in exactly one test fold, balanced greedily by size.\n\n    Raise ValueError if there are fewer than k distinct groups.\n    \"\"\"\n    raise NotImplementedError\n", "tests": "import numpy as np\n\nfrom solution import group_kfold, stratified_kfold\n\n\ndef check_partition(folds, n):\n    seen = np.zeros(n, int)\n    for train_idx, test_idx in folds:\n        train_idx, test_idx = np.asarray(train_idx), np.asarray(test_idx)\n        assert len(np.intersect1d(train_idx, test_idx)) == 0, \"train and test overlap\"\n        assert len(train_idx) + len(test_idx) == n, \"train must be the complement of test\"\n        assert len(np.unique(test_idx)) == len(test_idx), \"duplicate test indices\"\n        seen[test_idx] += 1\n    assert np.all(seen == 1), \"every index must be in exactly one test fold\"\n\n\ndef test_stratified_partition_and_class_proportions():\n    rng = np.random.default_rng(0)\n    y = rng.choice([0, 1, 2], size=203, p=[0.6, 0.3, 0.1])\n    k = 5\n    folds = list(stratified_kfold(y, k, np.random.default_rng(1)))\n    assert len(folds) == k\n    check_partition(folds, len(y))\n    counts = np.bincount(y, minlength=3)\n    for _, test_idx in folds:\n        c = np.bincount(y[test_idx], minlength=3)\n        assert np.all((c == counts // k) | (c == counts // k + 1)), f\"fold class counts {c} vs totals {counts}\"\n\n\ndef test_stratified_small_example():\n    y = np.array([0, 0, 0, 0, 1, 1])\n    folds = list(stratified_kfold(y, 2, np.random.default_rng(0)))\n    check_partition(folds, 6)\n    for _, test_idx in folds:\n        assert sorted(y[test_idx].tolist()) == [0, 0, 1]\n\n\ndef test_stratified_is_shuffled_and_reproducible():\n    y = np.repeat([0, 1], 50)                 # class 0 is indices 0..49: unshuffled folds would be contiguous\n    a = list(stratified_kfold(y, 5, np.random.default_rng(3)))\n    b = list(stratified_kfold(y, 5, np.random.default_rng(3)))\n    c = list(stratified_kfold(y, 5, np.random.default_rng(4)))\n    for (_, ta), (_, tb) in zip(a, b):\n        assert np.array_equal(np.sort(ta), np.sort(tb)), \"same seed must give the same folds\"\n    assert any(not np.array_equal(np.sort(ta), np.sort(tc)) for (_, ta), (_, tc) in zip(a, c)), \"different seeds should differ\"\n    contiguous = all(np.ptp(np.sort(t)[:10]) == 9 for _, t in a)\n    assert not contiguous, \"folds should be shuffled, not contiguous blocks\"\n\n\ndef test_stratified_rejects_classes_smaller_than_k():\n    y = np.array([0, 0, 0, 0, 1, 1])\n    try:\n        list(stratified_kfold(y, 3, np.random.default_rng(0)))\n    except ValueError:\n        return\n    raise AssertionError(\"expected ValueError when a class has fewer than k samples\")\n\n\ndef test_group_kfold_never_splits_a_group():\n    rng = np.random.default_rng(5)\n    groups = rng.integers(0, 15, size=200)\n    k = 4\n    folds = list(group_kfold(groups, k))\n    assert len(folds) == k\n    check_partition(folds, len(groups))\n    for train_idx, test_idx in folds:\n        assert len(np.intersect1d(groups[train_idx], groups[test_idx])) == 0, \"a group leaked across the split\"\n    tested = np.concatenate([np.unique(groups[t]) for _, t in folds])\n    assert np.array_equal(np.sort(tested), np.unique(groups)), \"every group is in exactly one test fold\"\n\n\ndef test_group_kfold_is_balanced():\n    rng = np.random.default_rng(6)\n    sizes = rng.integers(1, 20, size=30)\n    groups = np.repeat(np.arange(30), sizes)\n    groups = groups[rng.permutation(len(groups))]\n    k = 5\n    folds = list(group_kfold(groups, k))\n    check_partition(folds, len(groups))\n    bound = len(groups) / k + sizes.max()\n    for _, test_idx in folds:\n        assert len(test_idx) <= bound, f\"fold of size {len(test_idx)} exceeds the greedy bound {bound}\"\n    small = group_kfold(np.array([0, 0, 0, 1, 1, 2, 2, 3]), 2)\n    test_sizes = sorted(len(t) for _, t in small)\n    assert test_sizes == [4, 4]\n\n\ndef test_group_kfold_rejects_too_few_groups():\n    try:\n        list(group_kfold(np.array([0, 0, 1, 1]), 3))\n    except ValueError:\n        return\n    raise AssertionError(\"expected ValueError when there are fewer than k groups\")\n", "solution": "import numpy as np\n\n\ndef _folds_from_assignment(fold_of: np.ndarray, k: int):\n    return [(np.flatnonzero(fold_of != f), np.flatnonzero(fold_of == f)) for f in range(k)]\n\n\ndef stratified_kfold(y: np.ndarray, k: int, rng: np.random.Generator):\n    y = np.asarray(y)\n    fold_of = np.empty(len(y), dtype=int)\n    for c in np.unique(y):\n        idx = np.flatnonzero(y == c)\n        if len(idx) < k:\n            raise ValueError(f\"class {c} has {len(idx)} samples, fewer than k={k}\")\n        idx = rng.permutation(idx)\n        fold_of[idx] = np.arange(len(idx)) % k            # deal round-robin: counts differ by at most one\n    return _folds_from_assignment(fold_of, k)\n\n\ndef group_kfold(groups: np.ndarray, k: int):\n    groups = np.asarray(groups)\n    ids, inverse, counts = np.unique(groups, return_inverse=True, return_counts=True)\n    if len(ids) < k:\n        raise ValueError(f\"{len(ids)} groups, fewer than k={k}\")\n    fold_of_group = np.empty(len(ids), dtype=int)\n    load = np.zeros(k, dtype=int)\n    for g in np.argsort(-counts, kind=\"stable\"):            # largest groups first, into the emptiest fold\n        f = int(np.argmin(load))\n        fold_of_group[g] = f\n        load[f] += counts[g]\n    return _folds_from_assignment(fold_of_group[inverse], k)\n"}, {"id": "ml-train-loop-torch", "title": "A complete PyTorch training loop with early stopping", "track": "ml", "module": "ml-applied", "difficulty": "medium", "minutes": 45, "runtime": "torch", "kind": "code", "tags": ["PyTorch", "training loop", "early stopping", "train/eval mode", "validation"], "hints": ["One epoch: model.train(); perm = torch.randperm(N); for each slice of perm of size batch_size: optimizer.zero_grad(); loss = loss_fn(model(X[idx]), y[idx]); loss.backward(); optimizer.step(). Accumulate loss.item() * len(idx) and divide by N at the end.", "evaluate: model.eval() and with torch.no_grad(): one forward pass over the whole set; return loss.item() and (logits.argmax(1) == y).float().mean().item(). The tests check both the mode flag and that grad is disabled inside the forward.", "Early stopping: keep best_loss, best_epoch and a copy of the best state_dict ({k: v.clone() ...}). After each epoch, if val_loss < best_loss reset the counter, else increment it and stop when it reaches patience. Before returning, model.load_state_dict(best_state)."], "rubric": [], "timeout": 90, "readme": "<h2>A complete PyTorch training loop with early stopping<\/h2>\n<p>Applied rounds often skip the math and ask you to write the loop you have typed a hundred times, then probe the details that bite in practice: <code>zero_grad<\/code> placement, <code>model.eval()<\/code> plus <code>torch.no_grad()<\/code> in evaluation, loss accounting over uneven batches, and early stopping that actually restores the best weights. CPU only, a tiny model, seconds of compute.<\/p>\n<p>The starter provides <code>make_moons(n, noise, seed)<\/code>, which returns a two-class dataset of interleaving half-circles (<code>X<\/code> of shape <code>(n, 2)<\/code>, <code>y<\/code> of shape <code>(n,)<\/code> with labels 0/1). Implement:<\/p>\n<ul><li><code>class MLP(nn.Module)<\/code>, constructed as <code>MLP(d_in=2, hidden=32, d_out=2, dropout=0.1)<\/code>: two hidden layers with ReLU and <code>nn.Dropout(dropout)<\/code> after each, then a linear output. <code>forward(x)<\/code> returns logits of shape <code>(N, d_out)<\/code>.<\/li><li><code>train_epoch(model, X, y, optimizer, loss_fn, batch_size=32) -&gt; float<\/code>: one pass over the data in shuffled mini-batches, in training mode. Returns the mean training loss per sample (weight each batch by its size: the last batch is smaller).<\/li><li><code>evaluate(model, X, y, loss_fn) -&gt; (loss, accuracy)<\/code>: full-batch, in eval mode, with gradients disabled. Both values are Python floats.<\/li><li><code>fit(model, X_train, y_train, X_val, y_val, epochs=100, lr=1e-2, patience=5, batch_size=32) -&gt; history<\/code>: Adam and <code>nn.CrossEntropyLoss<\/code>. After every epoch evaluate on the validation set; stop when the validation loss has not improved (strictly decreased) for <code>patience<\/code> consecutive epochs. Restore the best weights into <code>model<\/code> before returning. <code>history<\/code> is a dict with lists <code>\"train_loss\"<\/code>, <code>\"val_loss\"<\/code>, <code>\"val_acc\"<\/code> (one entry per epoch run) and ints <code>\"best_epoch\"<\/code> and <code>\"stopped_epoch\"<\/code> (0-based indices into those lists).<\/li><\/ul>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">X_tr, y_tr = make_moons(600, noise=0.15, seed=0)\nX_va, y_va = make_moons(200, noise=0.15, seed=1)\ntorch.manual_seed(0)\nmodel = MLP()\nh = fit(model, X_tr, y_tr, X_va, y_va, epochs=60, lr=1e-2, patience=10)\nmax(h[\"val_acc\"])                                  -&gt; about 0.99\nevaluate(model, X_va, y_va, nn.CrossEntropyLoss()) -&gt; (0.03, 0.99)   (the restored best epoch)\n\nh = fit(MLP(), X_tr, y_tr, X_va, y_va, epochs=50, lr=0.0, patience=4)\nlen(h[\"val_loss\"])   -&gt; 5     (no improvement is possible, so it stops after patience + 1 epochs)<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>Mini-batches must be reshuffled every epoch and cover every sample exactly once; a probe module in the tests counts what it sees.<\/li><li><code>evaluate<\/code> must run with <code>model.training == False<\/code> and <code>torch.is_grad_enabled() == False<\/code> inside the forward pass.<\/li><li>Keep it fast: the whole test file should run in a few seconds on CPU.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why <code>model.eval()<\/code> and <code>torch.no_grad()<\/code> are two different things: one changes the semantics of dropout and batch norm, the other skips building the graph (memory and speed). Forgetting the first silently hurts validation metrics; forgetting the second blows up memory.<\/li><li>Why early stopping on validation loss with a copy of the best state, rather than stopping on accuracy (coarse, noisy) or returning the last weights (by construction the last <code>patience<\/code> epochs were worse).<\/li><li>Loss accounting: <code>loss.item()<\/code> is a per-sample mean over the batch, so epoch loss must be weighted by batch size; and <code>.item()<\/code> forces a sync, which is why you do it once per step, not per element.<\/li><li>Follow-up: what changes with a <code>DataLoader<\/code> and a GPU (pinned memory, <code>non_blocking<\/code>, moving the model once and the batches per step), gradient clipping, and a learning-rate scheduler stepped once per epoch versus once per batch.<\/li><\/ul>", "starter": "\"\"\"A PyTorch training loop with validation, early stopping and best-weight restore. CPU only.\"\"\"\nimport math\n\nimport torch\nimport torch.nn as nn\n\n\ndef make_moons(n: int, noise: float = 0.15, seed: int = 0):\n    \"\"\"Two interleaving half-circles. Provided. Returns X (n, 2) float32 and y (n,) int64.\"\"\"\n    g = torch.Generator().manual_seed(seed)\n    t = torch.rand(n, generator=g) * math.pi\n    half = torch.arange(n) % 2\n    x = torch.where(half == 0, torch.cos(t), 1.0 - torch.cos(t))\n    y = torch.where(half == 0, torch.sin(t), 0.5 - torch.sin(t))\n    X = torch.stack([x, y], dim=1) + noise * torch.randn(n, 2, generator=g)\n    return X.float(), half.long()\n\n\nclass MLP(nn.Module):\n    \"\"\"d_in -> hidden -> hidden -> d_out with ReLU and dropout after each hidden layer.\"\"\"\n\n    def __init__(self, d_in: int = 2, hidden: int = 32, d_out: int = 2, dropout: float = 0.1):\n        super().__init__()\n        raise NotImplementedError\n\n    def forward(self, x: torch.Tensor) -> torch.Tensor:\n        raise NotImplementedError\n\n\ndef train_epoch(model: nn.Module, X: torch.Tensor, y: torch.Tensor, optimizer: torch.optim.Optimizer,\n                loss_fn, batch_size: int = 32) -> float:\n    \"\"\"One pass over (X, y) in shuffled mini-batches, training mode. Returns the mean loss per sample.\"\"\"\n    raise NotImplementedError\n\n\ndef evaluate(model: nn.Module, X: torch.Tensor, y: torch.Tensor, loss_fn):\n    \"\"\"(loss, accuracy) over the whole set, in eval mode with gradients disabled. Both Python floats.\"\"\"\n    raise NotImplementedError\n\n\ndef fit(model: nn.Module, X_train, y_train, X_val, y_val, epochs: int = 100, lr: float = 1e-2,\n        patience: int = 5, batch_size: int = 32) -> dict:\n    \"\"\"Adam + cross-entropy with early stopping on validation loss; restores the best weights.\n\n    Returns {\"train_loss\": [...], \"val_loss\": [...], \"val_acc\": [...], \"best_epoch\": int, \"stopped_epoch\": int}.\n    \"\"\"\n    raise NotImplementedError\n", "tests": "import math\n\nimport torch\nimport torch.nn as nn\n\nfrom solution import MLP, evaluate, fit, make_moons, train_epoch\n\ntorch.set_num_threads(1)\n\n\nclass Probe(nn.Module):\n    \"\"\"Records the mode, the grad state and the batch size of every forward call.\"\"\"\n\n    def __init__(self):\n        super().__init__()\n        self.w = nn.Parameter(torch.zeros(2, 2))\n        self.calls = []\n\n    def forward(self, x):\n        self.calls.append((self.training, torch.is_grad_enabled(), x.shape[0]))\n        return x @ self.w\n\n\ndef data():\n    X_tr, y_tr = make_moons(600, noise=0.15, seed=0)\n    X_va, y_va = make_moons(200, noise=0.15, seed=1)\n    return X_tr, y_tr, X_va, y_va\n\n\ndef test_mlp_shapes_dropout_and_modes():\n    torch.manual_seed(0)\n    model = MLP(d_in=2, hidden=16, d_out=3, dropout=0.5)\n    x = torch.randn(7, 2)\n    assert model(x).shape == (7, 3)\n    assert any(isinstance(m, nn.Dropout) for m in model.modules()), \"use nn.Dropout\"\n    assert sum(p.numel() for p in model.parameters()) == 2 * 16 + 16 + 16 * 16 + 16 + 16 * 3 + 3\n    model.train()\n    assert not torch.allclose(model(x), model(x)), \"dropout should make training-mode outputs stochastic\"\n    model.eval()\n    assert torch.allclose(model(x), model(x)), \"eval-mode outputs must be deterministic\"\n\n\ndef test_train_epoch_visits_every_sample_once_in_training_mode():\n    torch.manual_seed(0)\n    probe = Probe()\n    X, y = make_moons(100, seed=2)\n    frozen = torch.optim.SGD(probe.parameters(), lr=0.0)\n    loss = train_epoch(probe, X, y, frozen, nn.CrossEntropyLoss(), batch_size=32)\n    assert isinstance(loss, float)\n    assert math.isclose(loss, math.log(2.0), rel_tol=1e-5), \"with zero weights every batch costs exactly log 2\"\n    sizes = [c[2] for c in probe.calls]\n    assert sum(sizes) == 100, f\"batches covered {sum(sizes)} samples, expected 100\"\n    assert max(sizes) <= 32 and len(sizes) == 4\n    assert all(c[0] for c in probe.calls), \"train_epoch must run the model in training mode\"\n    assert all(c[1] for c in probe.calls), \"gradients must be enabled during training\"\n    opt = torch.optim.SGD(probe.parameters(), lr=0.1)\n    loss2 = train_epoch(probe, X, y, opt, nn.CrossEntropyLoss(), batch_size=32)\n    assert loss2 < math.log(2.0), \"later batches should already benefit from the earlier steps\"\n    assert not torch.allclose(probe.w, torch.zeros(2, 2)), \"parameters should change after an epoch\"\n\n\ndef test_evaluate_uses_eval_mode_and_no_grad():\n    probe = Probe()\n    X, y = make_moons(50, seed=3)\n    loss, acc = evaluate(probe, X, y, nn.CrossEntropyLoss())\n    assert isinstance(loss, float) and isinstance(acc, float)\n    assert math.isclose(loss, math.log(2.0), rel_tol=1e-5)\n    assert math.isclose(acc, (y == 0).float().mean().item()), \"zero logits predict class 0 everywhere\"\n    assert len(probe.calls) >= 1\n    assert all(not c[0] for c in probe.calls), \"evaluate must call model.eval()\"\n    assert all(not c[1] for c in probe.calls), \"evaluate must run under torch.no_grad()\"\n\n\ndef test_reaches_95_percent_validation_accuracy():\n    torch.manual_seed(0)\n    X_tr, y_tr, X_va, y_va = data()\n    model = MLP()\n    h = fit(model, X_tr, y_tr, X_va, y_va, epochs=60, lr=1e-2, patience=10)\n    assert max(h[\"val_acc\"]) >= 0.95, f\"best validation accuracy {max(h['val_acc']):.3f}\"\n    _, acc = evaluate(model, X_va, y_va, nn.CrossEntropyLoss())\n    assert acc >= 0.95, f\"restored model has accuracy {acc:.3f}\"\n    assert h[\"train_loss\"][-1] < h[\"train_loss\"][0]\n\n\ndef test_early_stopping_triggers_on_a_flat_run():\n    torch.manual_seed(1)\n    X_tr, y_tr, X_va, y_va = data()\n    h = fit(MLP(), X_tr, y_tr, X_va, y_va, epochs=50, lr=0.0, patience=4)\n    assert len(h[\"val_loss\"]) == 5, f\"lr = 0 cannot improve, so it should stop after patience + 1 = 5 epochs, ran {len(h['val_loss'])}\"\n    assert h[\"best_epoch\"] == 0 and h[\"stopped_epoch\"] == 4\n    assert len(h[\"train_loss\"]) == len(h[\"val_acc\"]) == 5\n\n\ndef test_best_weights_are_restored_after_early_stopping():\n    torch.manual_seed(2)\n    X_tr, y_tr, X_va, y_va = data()\n    model = MLP()\n    h = fit(model, X_tr, y_tr, X_va, y_va, epochs=300, lr=1e-2, patience=3)\n    n = len(h[\"val_loss\"])\n    assert n < 300, \"the run should stop early once the validation loss plateaus\"\n    assert h[\"stopped_epoch\"] == n - 1\n    assert h[\"best_epoch\"] == min(range(n), key=lambda i: h[\"val_loss\"][i])\n    assert h[\"best_epoch\"] < h[\"stopped_epoch\"], \"by construction the last epochs were not improvements\"\n    loss, _ = evaluate(model, X_va, y_va, nn.CrossEntropyLoss())\n    assert math.isclose(loss, h[\"val_loss\"][h[\"best_epoch\"]], rel_tol=1e-5), \\\n        f\"restored loss {loss:.5f} != best recorded {h['val_loss'][h['best_epoch']]:.5f}\"\n", "solution": "import math\n\nimport torch\nimport torch.nn as nn\n\n\ndef make_moons(n: int, noise: float = 0.15, seed: int = 0):\n    g = torch.Generator().manual_seed(seed)\n    t = torch.rand(n, generator=g) * math.pi\n    half = torch.arange(n) % 2\n    x = torch.where(half == 0, torch.cos(t), 1.0 - torch.cos(t))\n    y = torch.where(half == 0, torch.sin(t), 0.5 - torch.sin(t))\n    X = torch.stack([x, y], dim=1) + noise * torch.randn(n, 2, generator=g)\n    return X.float(), half.long()\n\n\nclass MLP(nn.Module):\n    def __init__(self, d_in: int = 2, hidden: int = 32, d_out: int = 2, dropout: float = 0.1):\n        super().__init__()\n        self.net = nn.Sequential(\n            nn.Linear(d_in, hidden), nn.ReLU(), nn.Dropout(dropout),\n            nn.Linear(hidden, hidden), nn.ReLU(), nn.Dropout(dropout),\n            nn.Linear(hidden, d_out),\n        )\n\n    def forward(self, x: torch.Tensor) -> torch.Tensor:\n        return self.net(x)\n\n\ndef train_epoch(model: nn.Module, X: torch.Tensor, y: torch.Tensor, optimizer: torch.optim.Optimizer,\n                loss_fn, batch_size: int = 32) -> float:\n    model.train()\n    perm = torch.randperm(X.shape[0])\n    total = 0.0\n    for start in range(0, X.shape[0], batch_size):\n        idx = perm[start:start + batch_size]\n        optimizer.zero_grad()\n        loss = loss_fn(model(X[idx]), y[idx])\n        loss.backward()\n        optimizer.step()\n        total += loss.item() * len(idx)              # loss is a batch mean: weight by batch size\n    return total / X.shape[0]\n\n\ndef evaluate(model: nn.Module, X: torch.Tensor, y: torch.Tensor, loss_fn):\n    model.eval()\n    with torch.no_grad():\n        logits = model(X)\n        loss = loss_fn(logits, y).item()\n        acc = (logits.argmax(dim=1) == y).float().mean().item()\n    return loss, acc\n\n\ndef fit(model: nn.Module, X_train, y_train, X_val, y_val, epochs: int = 100, lr: float = 1e-2,\n        patience: int = 5, batch_size: int = 32) -> dict:\n    optimizer = torch.optim.Adam(model.parameters(), lr=lr)\n    loss_fn = nn.CrossEntropyLoss()\n    history = {\"train_loss\": [], \"val_loss\": [], \"val_acc\": [], \"best_epoch\": 0, \"stopped_epoch\": 0}\n    best_loss, best_state, bad_epochs = float(\"inf\"), None, 0\n    for epoch in range(epochs):\n        train_loss = train_epoch(model, X_train, y_train, optimizer, loss_fn, batch_size)\n        val_loss, val_acc = evaluate(model, X_val, y_val, loss_fn)\n        history[\"train_loss\"].append(train_loss)\n        history[\"val_loss\"].append(val_loss)\n        history[\"val_acc\"].append(val_acc)\n        history[\"stopped_epoch\"] = epoch\n        if val_loss < best_loss:\n            best_loss, bad_epochs = val_loss, 0\n            history[\"best_epoch\"] = epoch\n            best_state = {k: v.detach().clone() for k, v in model.state_dict().items()}\n        else:\n            bad_epochs += 1\n            if bad_epochs >= patience:\n                break\n    model.load_state_dict(best_state)\n    return history\n"}, {"id": "ml-gnn-message-passing", "title": "A graph convolution layer and message passing", "track": "ml", "module": "ml-applied", "difficulty": "medium", "minutes": 40, "runtime": "numpy", "kind": "code", "tags": ["GNN", "GCN", "message passing", "permutation equivariance", "graph pooling"], "hints": ["Add self-loops first: A_tilde = A + I. Degrees d = A_tilde.sum(1). Then A_hat = A_tilde * d[:, None] ** -0.5 * d[None, :] ** -0.5, which is D^-1/2 A_tilde D^-1/2 without building a diagonal matrix.", "A GCN layer is two matrix products: A_hat @ (X @ W) + b, then the activation. Row i of A_hat @ (X W) is the degree-normalized sum of the messages X_j W from i's neighbors and itself.", "Permutation equivariance comes for free if every operation is either per-node (X @ W, activation) or aggregation through A_hat: relabeling nodes permutes both A_hat's rows and columns and X's rows, so the output rows are permuted the same way. Mean pooling over rows then makes the readout invariant."], "rubric": [], "timeout": 30, "readme": "<h2>A graph convolution layer and message passing<\/h2>\n<p>For a candidate who has trained interatomic potentials and crystal-structure models, the GNN question is less \"can you do it\" and more \"can you explain it precisely\": what the normalized adjacency does, why the layer is permutation-equivariant, why pooling makes the graph readout invariant, and what two layers can and cannot see. Implement the Kipf and Welling GCN in NumPy with dense adjacency matrices.<\/p>\n<ul><li><code>normalize_adjacency(A)<\/code>: <code>A<\/code> is a symmetric <code>(N, N)<\/code> 0/1 matrix with zero diagonal. Return <code>D^-1/2 (A + I) D^-1/2<\/code>, where <code>D<\/code> is the diagonal degree matrix of <code>A + I<\/code>.<\/li><li><code>gcn_layer(X, A_hat, W, b, activation=True)<\/code>: <code>relu(A_hat @ X @ W + b)<\/code> for <code>X (N, d_in)<\/code>, <code>W (d_in, d_out)<\/code>, <code>b (d_out,)<\/code>; skip the ReLU when <code>activation=False<\/code>.<\/li><li><code>gcn_forward(X, A, params)<\/code>: two GCN layers with ReLU after each, using <code>params[\"W1\"], params[\"b1\"], params[\"W2\"], params[\"b2\"]<\/code>. Returns node embeddings <code>H<\/code> of shape <code>(N, d2)<\/code>.<\/li><li><code>graph_readout(H, params)<\/code>: mean-pool the node embeddings over nodes, then apply a linear head <code>params[\"W_out\"] (d2, d_out)<\/code> and <code>params[\"b_out\"] (d_out,)<\/code>. Returns a vector of shape <code>(d_out,)<\/code>.<\/li><\/ul>\n<p><code>relu<\/code> is provided in the starter.<\/p>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">A = np.array([[0, 1, 0], [1, 0, 1], [0, 1, 0]], float)   # path 0 - 1 - 2\nnormalize_adjacency(A)\n  -&gt; [[0.5,    0.408, 0.0  ],      # 1/2 on the diagonal of the end nodes (degree 2 with the self-loop)\n      [0.408,  0.333, 0.408],      # 1/sqrt(2 * 3) between an end node and the middle\n      [0.0,    0.408, 0.5  ]]\n\nP = permutation matrix\ngcn_forward(P @ X, P @ A @ P.T, params) == P @ gcn_forward(X, A, params)        # equivariant\ngraph_readout(gcn_forward(P @ X, P @ A @ P.T, params), params) == graph_readout(gcn_forward(X, A, params), params)   # invariant<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>No loops over nodes or edges: the layer is matrix products and broadcasting.<\/li><li>The normalization must handle isolated nodes (degree 0 before the self-loop) without division by zero.<\/li><li>Dense <code>O(N^2 d)<\/code> per layer is fine here; be ready to say how a sparse or edge-list implementation changes it.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why the symmetric normalization: without it, <code>A @ X<\/code> scales features by the degree, so high-degree nodes dominate and depth makes activations explode; <code>D^-1/2 (A + I) D^-1/2<\/code> has eigenvalues in <code>[-1, 1]<\/code>, and the self-loop keeps a node's own features in the sum.<\/li><li>Equivariance as a proof, not a slogan: <code>P A P^T<\/code> and <code>P X<\/code> give <code>P (A X W)<\/code> because <code>P^T P = I<\/code>; every per-node operation commutes with <code>P<\/code>; summing or averaging over rows removes the <code>P<\/code>.<\/li><li>The receptive field: after <code>L<\/code> layers a node has seen its <code>L<\/code>-hop neighborhood and nothing further (a test perturbs a far node), and over-smoothing as <code>L<\/code> grows.<\/li><li>Follow-up: what message passing with edge features looks like (distances or bond types in an interatomic potential), why sum pooling can distinguish graphs that mean pooling cannot, and the limits of this family (the 1-WL test).<\/li><\/ul>", "starter": "\"\"\"A two-layer graph convolutional network (Kipf and Welling) with mean-pool readout. Vectorized NumPy only.\"\"\"\nimport numpy as np\n\n\ndef relu(x: np.ndarray) -> np.ndarray:\n    \"\"\"Provided.\"\"\"\n    return np.maximum(x, 0.0)\n\n\ndef normalize_adjacency(A: np.ndarray) -> np.ndarray:\n    \"\"\"D^-1/2 (A + I) D^-1/2 for a symmetric 0/1 adjacency A (N, N) with zero diagonal.\"\"\"\n    raise NotImplementedError\n\n\ndef gcn_layer(X: np.ndarray, A_hat: np.ndarray, W: np.ndarray, b: np.ndarray, activation: bool = True) -> np.ndarray:\n    \"\"\"relu(A_hat @ X @ W + b), or without the relu when activation is False. Shape (N, d_out).\"\"\"\n    raise NotImplementedError\n\n\ndef gcn_forward(X: np.ndarray, A: np.ndarray, params: dict) -> np.ndarray:\n    \"\"\"Two GCN layers (ReLU after each) using params W1, b1, W2, b2. Returns node embeddings (N, d2).\"\"\"\n    raise NotImplementedError\n\n\ndef graph_readout(H: np.ndarray, params: dict) -> np.ndarray:\n    \"\"\"Mean over nodes, then H_mean @ W_out + b_out. Shape (d_out,).\"\"\"\n    raise NotImplementedError\n", "tests": "import numpy as np\n\nfrom solution import gcn_forward, gcn_layer, graph_readout, normalize_adjacency\n\n\ndef make_params(d_in, d_hidden, d2, d_out, seed=0):\n    rng = np.random.default_rng(seed)\n    return {\n        \"W1\": rng.normal(size=(d_in, d_hidden)) / np.sqrt(d_in), \"b1\": rng.normal(size=d_hidden) * 0.1,\n        \"W2\": rng.normal(size=(d_hidden, d2)) / np.sqrt(d_hidden), \"b2\": rng.normal(size=d2) * 0.1,\n        \"W_out\": rng.normal(size=(d2, d_out)) / np.sqrt(d2), \"b_out\": rng.normal(size=d_out) * 0.1,\n    }\n\n\ndef random_graph(n, p, seed):\n    rng = np.random.default_rng(seed)\n    A = (rng.random((n, n)) < p).astype(float)\n    A = np.triu(A, 1)\n    return A + A.T\n\n\ndef path_graph(n):\n    A = np.zeros((n, n))\n    for i in range(n - 1):\n        A[i, i + 1] = A[i + 1, i] = 1.0\n    return A\n\n\ndef test_normalized_adjacency_values():\n    A_hat = normalize_adjacency(path_graph(3))\n    s = 1 / np.sqrt(6.0)\n    assert np.allclose(A_hat, [[0.5, s, 0.0], [s, 1 / 3, s], [0.0, s, 0.5]])\n    assert np.allclose(A_hat, A_hat.T)\n    cycle = np.roll(np.eye(4), 1, axis=1) + np.roll(np.eye(4), -1, axis=1)     # 2-regular -> (A + I) / 3\n    assert np.allclose(normalize_adjacency(cycle), (cycle + np.eye(4)) / 3)\n\n\ndef test_isolated_nodes_and_spectrum():\n    A = path_graph(3)\n    A = np.pad(A, ((0, 1), (0, 1)))                   # node 3 is isolated\n    A_hat = normalize_adjacency(A)\n    assert np.all(np.isfinite(A_hat))\n    assert np.isclose(A_hat[3, 3], 1.0) and np.allclose(A_hat[3, :3], 0.0)\n    eig = np.linalg.eigvalsh(normalize_adjacency(random_graph(30, 0.2, 1)))\n    assert eig.max() <= 1 + 1e-9 and eig.min() >= -1 - 1e-9, \"normalized adjacency has spectrum in [-1, 1]\"\n\n\ndef test_gcn_layer_matches_message_passing_loop():\n    rng = np.random.default_rng(2)\n    n, d_in, d_out = 8, 5, 4\n    A = random_graph(n, 0.4, 2)\n    A_hat = normalize_adjacency(A)\n    X = rng.normal(size=(n, d_in))\n    W, b = rng.normal(size=(d_in, d_out)), rng.normal(size=d_out)\n    out = gcn_layer(X, A_hat, W, b)\n    assert out.shape == (n, d_out)\n    ref = np.zeros((n, d_out))\n    for i in range(n):\n        msg = sum(A_hat[i, j] * (X[j] @ W) for j in range(n))      # aggregate messages from i's neighborhood\n        ref[i] = np.maximum(msg + b, 0.0)\n    assert np.allclose(out, ref, atol=1e-10)\n    lin = gcn_layer(X, A_hat, W, b, activation=False)\n    assert np.allclose(lin, A_hat @ X @ W + b, atol=1e-10)\n    assert (lin < 0).any() and not (out < 0).any()\n\n\ndef test_node_embeddings_are_permutation_equivariant():\n    rng = np.random.default_rng(3)\n    n = 10\n    A = random_graph(n, 0.3, 3)\n    X = rng.normal(size=(n, 6))\n    params = make_params(6, 8, 5, 3)\n    H = gcn_forward(X, A, params)\n    assert H.shape == (n, 5)\n    perm = rng.permutation(n)\n    P = np.eye(n)[perm]\n    H_perm = gcn_forward(P @ X, P @ A @ P.T, params)\n    assert np.allclose(H_perm, P @ H, atol=1e-10), \"relabeling the nodes must relabel the embeddings\"\n\n\ndef test_readout_is_permutation_invariant():\n    rng = np.random.default_rng(4)\n    n = 12\n    A = random_graph(n, 0.3, 4)\n    X = rng.normal(size=(n, 4))\n    params = make_params(4, 8, 6, 2)\n    g = graph_readout(gcn_forward(X, A, params), params)\n    assert g.shape == (2,)\n    for seed in range(3):\n        perm = np.random.default_rng(seed).permutation(n)\n        P = np.eye(n)[perm]\n        g_perm = graph_readout(gcn_forward(P @ X, P @ A @ P.T, params), params)\n        assert np.allclose(g_perm, g, atol=1e-10)\n\n\ndef test_two_layers_see_exactly_two_hops():\n    rng = np.random.default_rng(5)\n    n = 6\n    A = path_graph(n)                                 # 0 - 1 - 2 - 3 - 4 - 5\n    X = rng.normal(size=(n, 3))\n    params = make_params(3, 8, 4, 2)\n    H = gcn_forward(X, A, params)\n    X2 = X.copy()\n    X2[5] += 10.0                                     # perturb the far end\n    H2 = gcn_forward(X2, A, params)\n    assert np.allclose(H2[:3], H[:3], atol=1e-12), \"nodes 0, 1, 2 are more than two hops from node 5\"\n    assert not np.allclose(H2[3:], H[3:]), \"nodes within two hops must change\"\n\n\ndef test_no_edges_reduces_to_a_per_node_mlp():\n    rng = np.random.default_rng(6)\n    n = 5\n    X = rng.normal(size=(n, 3))\n    params = make_params(3, 7, 4, 2)\n    H = gcn_forward(X, np.zeros((n, n)), params)\n    h1 = np.maximum(X @ params[\"W1\"] + params[\"b1\"], 0.0)\n    ref = np.maximum(h1 @ params[\"W2\"] + params[\"b2\"], 0.0)\n    assert np.allclose(H, ref, atol=1e-10)\n    g = graph_readout(H, params)\n    assert np.allclose(g, ref.mean(axis=0) @ params[\"W_out\"] + params[\"b_out\"], atol=1e-10)\n", "solution": "import numpy as np\n\n\ndef relu(x: np.ndarray) -> np.ndarray:\n    return np.maximum(x, 0.0)\n\n\ndef normalize_adjacency(A: np.ndarray) -> np.ndarray:\n    A_tilde = A + np.eye(A.shape[0])                      # self-loops keep each node's own features in the sum\n    d_inv_sqrt = 1.0 / np.sqrt(A_tilde.sum(axis=1))       # degree >= 1 thanks to the self-loop\n    return A_tilde * d_inv_sqrt[:, None] * d_inv_sqrt[None, :]\n\n\ndef gcn_layer(X: np.ndarray, A_hat: np.ndarray, W: np.ndarray, b: np.ndarray, activation: bool = True) -> np.ndarray:\n    out = A_hat @ (X @ W) + b                             # transform, then aggregate over the neighborhood\n    return relu(out) if activation else out\n\n\ndef gcn_forward(X: np.ndarray, A: np.ndarray, params: dict) -> np.ndarray:\n    A_hat = normalize_adjacency(A)\n    H = gcn_layer(X, A_hat, params[\"W1\"], params[\"b1\"])\n    return gcn_layer(H, A_hat, params[\"W2\"], params[\"b2\"])\n\n\ndef graph_readout(H: np.ndarray, params: dict) -> np.ndarray:\n    return H.mean(axis=0) @ params[\"W_out\"] + params[\"b_out\"]\n"}, {"id": "ml-retrieval-topk", "title": "Embedding retrieval: cosine top-k and MMR re-ranking", "track": "ml", "module": "ml-applied", "difficulty": "medium", "minutes": 35, "runtime": "numpy", "kind": "code", "tags": ["retrieval", "cosine similarity", "argpartition", "MMR", "RAG"], "hints": ["Cosine similarity of unit vectors is a dot product: normalize the documents once, normalize the query, then sims = docs_n @ q_n is the whole score vector. Guard the norm with np.maximum(norm, eps) so a zero row stays zero instead of becoming nan.", "np.argpartition(-sims, k - 1)[:k] finds the k largest in O(n) but in no particular order; sort just those k by score to return them ranked.", "MMR is greedy: start with the most relevant document, then repeatedly add the unselected document maximizing lam * sim(q, d) - (1 - lam) * max_{s in selected} sim(d, s). Keep a running vector of each document's maximum similarity to the selected set and update it with np.maximum after every pick, so each step is O(n d)."], "rubric": [], "timeout": 30, "readme": "<h2>Embedding retrieval: cosine top-k and MMR re-ranking<\/h2>\n<p>The retrieval half of every RAG or recommendation system is three small NumPy functions, and the interview question is usually \"write the top-k, now make the results less redundant\". It tests whether you normalize once instead of per query, whether you know <code>argpartition<\/code>, and whether you can state maximal marginal relevance as a greedy objective rather than a vibe.<\/p>\n<ul><li><code>normalize(X, eps=1e-12)<\/code>: rows of <code>X<\/code> (shape <code>(n, d)<\/code>) scaled to unit length; an all-zero row stays zero.<\/li><li><code>cosine_topk(query, docs, k) -&gt; (indices, scores)<\/code>: <code>query<\/code> has shape <code>(d,)<\/code>, <code>docs<\/code> has shape <code>(n, d)<\/code>. Return the <code>k<\/code> indices with the largest cosine similarity, sorted from most to least similar, and their scores. Use <code>argpartition<\/code> to find the candidates in <code>O(n)<\/code>, then sort only the <code>k<\/code>.<\/li><li><code>mmr(query, docs, k, lam=0.5) -&gt; list of k indices<\/code>: maximal marginal relevance. Start with the most similar document; then repeatedly add the unselected document <code>i<\/code> that maximizes <code>lam * cos(query, d_i) - (1 - lam) * max over selected s of cos(d_i, d_s)<\/code>. Return the indices in the order they were selected. <code>lam = 1<\/code> reduces to the top-k ranking; smaller <code>lam<\/code> trades relevance for diversity.<\/li><\/ul>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">q    = np.array([1.0, 0.0])\ndocs = np.array([[1.0, 0.2], [1.0, 0.2], [1.0, -0.4], [0.0, 1.0]])   # docs 0 and 1 are duplicates\ncosine_topk(q, docs, 2)   -&gt; indices {0, 1} (either order: identical scores 0.981), scores [0.981, 0.981]\nmmr(q, docs, 2, lam=0.5)  -&gt; [0, 2]   (doc 1 is redundant with doc 0; doc 2 is nearly as relevant and different)\nmmr(q, docs, 2, lam=1.0)  -&gt; [0, 1]<\/code><\/pre>\n<h3>Constraints<\/h3>\n<ul><li>No loops over documents: similarities are one matrix-vector product; the only loop in <code>mmr<\/code> is over the <code>k<\/code> picks, each <code>O(n d)<\/code> with a running maximum.<\/li><li><code>cosine_topk<\/code> must agree exactly with a full <code>argsort<\/code> on random data, and must be invariant to scaling any document by a positive factor.<\/li><li><code>mmr<\/code> must return <code>k<\/code> distinct indices, the first being the top-1 document.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why cosine instead of dot product or Euclidean distance (length-invariance; for normalized vectors all three rank identically) and why you pre-normalize the corpus once (the dominant cost is <code>O(n d)<\/code> per query, so never redo the norms).<\/li><li><code>argpartition<\/code> versus <code>argsort<\/code>: <code>O(n)<\/code> versus <code>O(n log n)<\/code>, and when you would move to an ANN index (HNSW, IVF-PQ) because even <code>O(n d)<\/code> is too slow at 100 M documents.<\/li><li>MMR as a greedy approximation to a relevance-minus-redundancy objective: <code>lam<\/code> is the knob, the greedy choice is <code>O(k n)<\/code> similarity lookups, and duplicates get suppressed because their redundancy term is 1.<\/li><li>Follow-up: how you would evaluate retrieval (recall@k, MRR, nDCG against labeled relevance), and where a cross-encoder re-ranker fits relative to MMR in a RAG pipeline.<\/li><\/ul>", "starter": "\"\"\"Cosine top-k retrieval and maximal marginal relevance re-ranking over dense embeddings. Vectorized NumPy only.\"\"\"\nimport numpy as np\n\n\ndef normalize(X: np.ndarray, eps: float = 1e-12) -> np.ndarray:\n    \"\"\"Unit-length rows; an all-zero row stays zero.\"\"\"\n    raise NotImplementedError\n\n\ndef cosine_topk(query: np.ndarray, docs: np.ndarray, k: int):\n    \"\"\"(indices, scores) of the k most cosine-similar rows of docs (n, d) to query (d,), most similar first.\"\"\"\n    raise NotImplementedError\n\n\ndef mmr(query: np.ndarray, docs: np.ndarray, k: int, lam: float = 0.5) -> list:\n    \"\"\"Greedy maximal marginal relevance: k document indices in selection order.\"\"\"\n    raise NotImplementedError\n", "tests": "import numpy as np\n\nfrom solution import cosine_topk, mmr, normalize\n\n\ndef cosine(a, b):\n    return a @ b / (np.linalg.norm(a) * np.linalg.norm(b))\n\n\ndef mmr_reference(query, docs, k, lam):\n    \"\"\"Deliberately naive greedy MMR with explicit loops.\"\"\"\n    n = len(docs)\n    rel = np.array([cosine(query, docs[i]) for i in range(n)])\n    selected = [int(np.argmax(rel))]\n    while len(selected) < k:\n        best, best_score = None, -np.inf\n        for i in range(n):\n            if i in selected:\n                continue\n            redundancy = max(cosine(docs[i], docs[s]) for s in selected)\n            score = lam * rel[i] - (1 - lam) * redundancy\n            if score > best_score:\n                best, best_score = i, score\n        selected.append(best)\n    return selected\n\n\ndef test_normalize_rows():\n    rng = np.random.default_rng(0)\n    X = rng.normal(size=(5, 3)) * 10\n    X[2] = 0.0\n    Xn = normalize(X)\n    assert Xn.shape == X.shape\n    assert np.allclose(np.linalg.norm(Xn[[0, 1, 3, 4]], axis=1), 1.0)\n    assert np.all(Xn[2] == 0.0) and np.all(np.isfinite(Xn)), \"a zero row must stay zero, not become nan\"\n    assert np.allclose(Xn[0], X[0] / np.linalg.norm(X[0]))\n\n\ndef test_topk_matches_full_sort():\n    rng = np.random.default_rng(1)\n    docs = rng.normal(size=(2000, 32))\n    q = rng.normal(size=32)\n    k = 10\n    idx, scores = cosine_topk(q, docs, k)\n    idx, scores = np.asarray(idx), np.asarray(scores)\n    sims = (docs / np.linalg.norm(docs, axis=1, keepdims=True)) @ (q / np.linalg.norm(q))\n    ref = np.argsort(-sims)[:k]\n    assert idx.shape == (k,) and scores.shape == (k,)\n    assert np.array_equal(idx, ref), f\"got {idx}, expected {ref}\"\n    assert np.allclose(scores, sims[ref], atol=1e-12)\n    assert np.all(np.diff(scores) <= 0), \"scores must be sorted from most to least similar\"\n\n\ndef test_topk_is_invariant_to_document_scale():\n    rng = np.random.default_rng(2)\n    docs = rng.normal(size=(300, 8))\n    q = rng.normal(size=8)\n    idx, scores = cosine_topk(q, docs, 5)\n    scaled = docs * rng.uniform(0.01, 100.0, size=(300, 1))\n    idx2, scores2 = cosine_topk(q, scaled, 5)\n    assert np.array_equal(np.asarray(idx), np.asarray(idx2))\n    assert np.allclose(scores, scores2, atol=1e-10)\n    idx3, _ = cosine_topk(q * 1000.0, docs, 5)\n    assert np.array_equal(np.asarray(idx), np.asarray(idx3))\n\n\ndef test_topk_edge_sizes():\n    rng = np.random.default_rng(3)\n    docs = rng.normal(size=(7, 4))\n    q = rng.normal(size=4)\n    sims = (docs / np.linalg.norm(docs, axis=1, keepdims=True)) @ (q / np.linalg.norm(q))\n    idx1, s1 = cosine_topk(q, docs, 1)\n    assert np.asarray(idx1).tolist() == [int(np.argmax(sims))] and np.isclose(s1[0], sims.max())\n    idx_all, s_all = cosine_topk(q, docs, 7)\n    assert np.array_equal(np.asarray(idx_all), np.argsort(-sims))\n    assert np.allclose(s_all, np.sort(sims)[::-1])\n\n\ndef test_mmr_with_lambda_one_is_topk():\n    rng = np.random.default_rng(4)\n    docs = rng.normal(size=(100, 16))\n    q = rng.normal(size=16)\n    idx, _ = cosine_topk(q, docs, 6)\n    assert list(mmr(q, docs, 6, lam=1.0)) == np.asarray(idx).tolist()\n\n\ndef test_mmr_suppresses_duplicates():\n    q = np.array([1.0, 0.0])\n    docs = np.array([[1.0, 0.2], [1.0, 0.2], [1.0, -0.4], [0.0, 1.0]])\n    idx, _ = cosine_topk(q, docs, 2)\n    assert set(np.asarray(idx).tolist()) == {0, 1}, \"plain top-k returns both duplicates\"\n    assert list(mmr(q, docs, 2, lam=0.5)) == [0, 2]\n    assert list(mmr(q, docs, 2, lam=1.0)) == [0, 1]\n    assert list(mmr(q, docs, 3, lam=0.5)) == [0, 2, 1], \"with nothing relevant left, the duplicate beats an irrelevant doc\"\n    assert list(mmr(q, docs, 3, lam=0.2)) == [0, 3, 2], \"a small lambda prefers the orthogonal doc over a near-duplicate\"\n\n\ndef test_mmr_matches_greedy_reference_and_is_well_formed():\n    rng = np.random.default_rng(5)\n    docs = rng.normal(size=(300, 12))\n    q = rng.normal(size=12)\n    for lam in [0.3, 0.6, 0.9]:\n        out = list(mmr(q, docs, 8, lam=lam))\n        assert len(out) == 8 and len(set(out)) == 8, \"k distinct indices\"\n        assert out[0] == int(cosine_topk(q, docs, 1)[0][0]), \"the first pick is the most relevant document\"\n        assert out == mmr_reference(q, docs, 8, lam), f\"lam={lam}: {out} vs reference\"\n", "solution": "import numpy as np\n\n\ndef normalize(X: np.ndarray, eps: float = 1e-12) -> np.ndarray:\n    X = np.asarray(X, dtype=float)\n    norms = np.linalg.norm(X, axis=-1, keepdims=True)\n    return X / np.maximum(norms, eps)\n\n\ndef cosine_topk(query: np.ndarray, docs: np.ndarray, k: int):\n    sims = normalize(docs) @ normalize(query)                 # (n,)\n    cand = np.argpartition(-sims, k - 1)[:k]                  # O(n): the top k, unordered\n    order = cand[np.argsort(-sims[cand], kind=\"stable\")]      # O(k log k): rank just those\n    return order, sims[order]\n\n\ndef mmr(query: np.ndarray, docs: np.ndarray, k: int, lam: float = 0.5) -> list:\n    docs_n = normalize(docs)\n    rel = docs_n @ normalize(query)                           # relevance of every document\n    selected = [int(np.argmax(rel))]\n    redundancy = docs_n @ docs_n[selected[0]]                 # max similarity to the selected set, so far one doc\n    for _ in range(1, k):\n        score = lam * rel - (1.0 - lam) * redundancy\n        score[selected] = -np.inf\n        i = int(np.argmax(score))\n        selected.append(i)\n        redundancy = np.maximum(redundancy, docs_n @ docs_n[i])\n    return selected\n"}, {"id": "tf-bpe-tokenizer", "title": "Byte-pair encoding from scratch", "track": "transformer", "module": "tf-tokens", "difficulty": "medium", "minutes": 45, "runtime": "python", "kind": "code", "tags": ["tokenization", "bpe", "bytes"], "hints": ["Work on list(text.encode('utf-8')). Count adjacent pairs with zip(ids, ids[1:]) and a Counter; every overlapping occurrence counts.", "min(counts, key=lambda p: (-counts[p], p)) picks the most frequent pair with the lexicographic tie-break in one line.", "Merging is one left-to-right pass with an index that jumps by 2 on a match and by 1 otherwise. encode is that same pass applied once per merge, in training order, and the decoding vocab is vocab[256 + i] = vocab[a] + vocab[b]."], "rubric": [], "timeout": 30, "readme": "<h2>Byte-pair encoding from scratch<\/h2>\n<p>Everything a language model sees starts here. A BPE tokenizer turns text into integer ids by starting from raw bytes and repeatedly merging the most frequent adjacent pair into a new symbol. GPT-2, Llama and most modern models use exactly this idea (plus a regex pre-split). You will write the trainer, the encoder and the decoder: byte level, with no pre-tokenization.<\/p>\n<p>Symbols are integers: the 256 byte values first, then one new id per merge (<code>256 + i<\/code> for merge number <code>i<\/code>).<\/p>\n<ul><li><code>pair_counts(ids) -&gt; dict[(int, int), int]<\/code>: counts of every adjacent pair <code>(ids[i], ids[i+1])<\/code>. <code>[97, 97, 97, 98]<\/code> gives <code>{(97, 97): 2, (97, 98): 1}<\/code>; overlapping occurrences all count.<\/li><li><code>merge_pair(ids, pair, new_id) -&gt; list[int]<\/code>: replace every occurrence of <code>pair<\/code> by <code>new_id<\/code>, scanning left to right without overlap. <code>[97, 97, 97, 98]<\/code> with pair <code>(97, 97)<\/code> becomes <code>[256, 97, 98]<\/code>.<\/li><li><code>train_bpe(text, num_merges) -&gt; list[(int, int)]<\/code>: start from <code>list(text.encode(\"utf-8\"))<\/code>, then <code>num_merges<\/code> times: count pairs, pick the most frequent pair (ties go to the lexicographically smallest pair), record it, merge it everywhere. Stop early when no pair is left. Return the merges in order.<\/li><li><code>build_vocab(merges) -&gt; dict[int, bytes]<\/code>: id to bytes for the 256 byte values plus one entry per merge.<\/li><li><code>encode(text, merges) -&gt; list[int]<\/code>: apply the merges, in training order, to the bytes of <code>text<\/code>.<\/li><li><code>decode(ids, vocab) -&gt; str<\/code>: concatenate the bytes and decode as UTF-8 with <code>errors=\"replace\"<\/code>, since a token boundary can split a multi-byte character.<\/li><\/ul>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">merges = train_bpe(\"aaabdaaabac\", 3)    -&gt; [(97, 97), (97, 98), (256, 257)]\n    aaabdaaabac -&gt; ZabdZabac (Z = 256) -&gt; ZYdZYac (Y = 257) -&gt; XdXac (X = 258)\nencode(\"aaabdaaabac\", merges)           -&gt; [258, 100, 258, 97, 99]\nbuild_vocab(merges)[258]                -&gt; b\"aaab\"\ndecode([258, 100], build_vocab(merges)) -&gt; \"aaabd\"<\/code><\/pre>\n<p>In the second step <code>(256, 97)<\/code> and <code>(97, 98)<\/code> both occur twice; the lexicographically smaller <code>(97, 98)<\/code> wins.<\/p>\n<h3>Constraints<\/h3>\n<ul><li>Byte level: any string, in any script or emoji, must round-trip exactly, even if it never appeared in training.<\/li><li>Deterministic: the same text and <code>num_merges<\/code> always give the same merges.<\/li><li>No pre-tokenization in this version, so merges may cross spaces. Training on a few kilobytes with 40 merges must take well under a second.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why bytes and not characters: a 256-symbol base means there is never an unknown token, at the price of up to 4 tokens for one rare character.<\/li><li>The cost: training as written is <code>O(num_merges * len(text))<\/code> and encoding is <code>O(len(merges) * len(text))<\/code>; the production version ranks the merges and repeatedly merges the lowest-ranked pair present, with a priority queue or a linked list, so encoding is near linear.<\/li><li>The failure mode: merging across whitespace and punctuation produces tokens like <code>dog.<\/code>, which is why GPT-2 pre-splits with a regex so merges never cross word boundaries, and why digits get chunked oddly.<\/li><li>Follow-up: how vocabulary size trades sequence length against embedding-table size and rare-token under-training, and what changes in SentencePiece's unigram model.<\/li><\/ul>", "starter": "\"\"\"Byte-level byte-pair encoding: trainer, encoder, decoder. Standard library only.\"\"\"\n\n\ndef pair_counts(ids: list[int]) -> dict[tuple[int, int], int]:\n    \"\"\"Counts of every adjacent pair (ids[i], ids[i + 1]). Overlapping occurrences all count.\"\"\"\n    raise NotImplementedError\n\n\ndef merge_pair(ids: list[int], pair: tuple[int, int], new_id: int) -> list[int]:\n    \"\"\"Replace every occurrence of `pair` by `new_id`, scanning left to right without overlap.\"\"\"\n    raise NotImplementedError\n\n\ndef train_bpe(text: str, num_merges: int) -> list[tuple[int, int]]:\n    \"\"\"Learn up to `num_merges` merges over the UTF-8 bytes of `text`.\n\n    Each step merges the most frequent pair (ties: the lexicographically smallest pair) into the\n    id 256 + step. Stop early when no pair is left. Returns the merges in order.\n    \"\"\"\n    raise NotImplementedError\n\n\ndef build_vocab(merges: list[tuple[int, int]]) -> dict[int, bytes]:\n    \"\"\"id -> bytes for the 256 byte values plus one entry per merge.\"\"\"\n    raise NotImplementedError\n\n\ndef encode(text: str, merges: list[tuple[int, int]]) -> list[int]:\n    \"\"\"Token ids for `text`: its UTF-8 bytes with the merges applied in training order.\"\"\"\n    raise NotImplementedError\n\n\ndef decode(ids: list[int], vocab: dict[int, bytes]) -> str:\n    \"\"\"Concatenate the bytes of each id and decode as UTF-8 (errors=\"replace\").\"\"\"\n    raise NotImplementedError\n", "tests": "from solution import build_vocab, decode, encode, merge_pair, pair_counts, train_bpe\n\nCORPUS = (\n    \"the quick brown fox jumps over the lazy dog. the dog sleeps while the fox runs. \"\n    \"low lower lowest; new newer newest; wide wider widest. \"\n    \"materials science studies how the structure of a material controls its properties. \"\n) * 6\n\n\ndef test_pair_counts_and_merge_pair():\n    ids = [97, 97, 97, 98]\n    counts = pair_counts(ids)\n    assert counts[(97, 97)] == 2 and counts[(97, 98)] == 1, counts\n    assert merge_pair(ids, (97, 97), 256) == [256, 97, 98]  # left to right, no overlap\n    assert merge_pair([1, 2, 1, 2, 1], (1, 2), 9) == [9, 9, 1]\n    assert merge_pair([1, 1, 1, 1, 1], (1, 1), 9) == [9, 9, 1]\n    assert merge_pair([5], (5, 5), 9) == [5]\n    assert merge_pair([], (5, 5), 9) == []\n\n\ndef test_classic_example_merges_and_ids():\n    merges = train_bpe(\"aaabdaaabac\", 3)\n    assert merges == [(97, 97), (97, 98), (256, 257)], merges\n    assert encode(\"aaabdaaabac\", merges) == [258, 100, 258, 97, 99]\n    vocab = build_vocab(merges)\n    assert len(vocab) == 259\n    assert vocab[97] == b\"a\" and vocab[256] == b\"aa\" and vocab[257] == b\"ab\" and vocab[258] == b\"aaab\"\n    assert decode([258, 100], vocab) == \"aaabd\"\n\n\ndef test_ties_go_to_the_lexicographically_smallest_pair():\n    assert train_bpe(\"xyxyabab\", 2) == [(97, 98), (120, 121)]\n    # \"the the the cat\": (t,h), (h,e) and (e,' ') all occur 3 times; (e,' ') = (101, 32) is the smallest\n    merges = train_bpe(\"the the the cat\", 3)\n    assert merges == [(101, 32), (104, 256), (116, 257)], merges\n    assert encode(\"the \", merges) == [258]\n\n\ndef test_training_stops_when_nothing_is_left():\n    assert train_bpe(\"ab\", 10) == [(97, 98)]\n    assert train_bpe(\"a\", 3) == []\n    assert train_bpe(\"\", 3) == []\n\n\ndef test_merges_apply_in_training_order():\n    merges = [(97, 98), (256, 99)]  # ab -> 256, then (256, c) -> 257\n    assert encode(\"abc\", merges) == [257]\n    assert encode(\"abcabc\", merges) == [257, 257]\n    assert encode(\"bc\", merges) == [98, 99]  # (98, 99) was never a merge\n    assert encode(\"\", merges) == []\n\n\ndef test_round_trip_including_unseen_characters():\n    merges = train_bpe(CORPUS, 40)\n    assert len(merges) == 40\n    vocab = build_vocab(merges)\n    for s in [\"the cat sat on the mat\", \"héllo wörld 🙂\", \"\", \"completely new words zzz\", \"日本語のテキスト\"]:\n        ids = encode(s, merges)\n        assert all(0 <= i < 256 + 40 for i in ids)\n        assert decode(ids, vocab) == s, s\n    # bytes above 127 never appeared in training, so an emoji stays four single-byte tokens\n    assert encode(\"🙂\", merges) == list(\"🙂\".encode(\"utf-8\"))\n\n\ndef test_compresses_the_training_text():\n    merges = train_bpe(CORPUS, 40)\n    n_bytes = len(CORPUS.encode(\"utf-8\"))\n    n_tokens = len(encode(CORPUS, merges))\n    assert n_tokens < 0.6 * n_bytes, f\"{n_tokens} tokens for {n_bytes} bytes\"\n    vocab = build_vocab(merges)\n    for i, (a, b) in enumerate(merges):\n        assert vocab[256 + i] == vocab[a] + vocab[b]\n", "solution": "from collections import Counter\n\n\ndef pair_counts(ids: list[int]) -> dict[tuple[int, int], int]:\n    return dict(Counter(zip(ids, ids[1:])))\n\n\ndef merge_pair(ids: list[int], pair: tuple[int, int], new_id: int) -> list[int]:\n    a, b = pair\n    out, i = [], 0\n    while i < len(ids):\n        if i + 1 < len(ids) and ids[i] == a and ids[i + 1] == b:\n            out.append(new_id)\n            i += 2\n        else:\n            out.append(ids[i])\n            i += 1\n    return out\n\n\ndef train_bpe(text: str, num_merges: int) -> list[tuple[int, int]]:\n    ids = list(text.encode(\"utf-8\"))\n    merges = []\n    for step in range(num_merges):\n        counts = pair_counts(ids)\n        if not counts:\n            break\n        best = min(counts, key=lambda p: (-counts[p], p))  # most frequent, then lexicographically smallest\n        merges.append(best)\n        ids = merge_pair(ids, best, 256 + step)\n    return merges\n\n\ndef build_vocab(merges: list[tuple[int, int]]) -> dict[int, bytes]:\n    vocab = {i: bytes([i]) for i in range(256)}\n    for i, (a, b) in enumerate(merges):\n        vocab[256 + i] = vocab[a] + vocab[b]\n    return vocab\n\n\ndef encode(text: str, merges: list[tuple[int, int]]) -> list[int]:\n    ids = list(text.encode(\"utf-8\"))\n    for i, pair in enumerate(merges):\n        if len(ids) < 2:\n            break\n        ids = merge_pair(ids, pair, 256 + i)\n    return ids\n\n\ndef decode(ids: list[int], vocab: dict[int, bytes]) -> str:\n    return b\"\".join(vocab[i] for i in ids).decode(\"utf-8\", errors=\"replace\")\n"}, {"id": "tf-embeddings-positional", "title": "Token embeddings and sinusoidal positional encoding", "track": "transformer", "module": "tf-tokens", "difficulty": "easy", "minutes": 30, "runtime": "numpy", "kind": "code", "tags": ["embeddings", "positional encoding", "broadcasting"], "hints": ["An embedding lookup is fancy indexing: E[tokens] works for any shape of tokens and returns tokens.shape + (d,).", "Build the angle table by broadcasting a (T, 1) column of positions against a (1, d/2) row of inverse frequencies 10000 ** (-np.arange(0, d, 2) / d).", "Fill the even columns with np.sin(angles) and the odd columns with np.cos(angles) through the slices pe[:, 0::2] and pe[:, 1::2]. Adding positions is E[tokens] + P[:T], which broadcasts over the batch."], "rubric": [], "timeout": 30, "readme": "<h2>Token embeddings and sinusoidal positional encoding<\/h2>\n<p>The input side of the transformer. Token ids become vectors through a lookup table, and because attention is permutation-equivariant, a position signal has to be added before the first block or the model cannot tell \"dog bites man\" from \"man bites dog\". Implement the lookup, the fixed sinusoidal encoding from the original paper, and the combination with a positional table (learned, as in GPT-2, or sinusoidal).<\/p>\n<ul><li><code>embed(tokens, E) -&gt; np.ndarray<\/code>: <code>tokens<\/code> is an integer array of any shape, <code>E<\/code> is <code>(vocab, d)<\/code>. Return <code>tokens.shape + (d,)<\/code>, the rows of <code>E<\/code> picked by the ids.<\/li><li><code>sinusoidal_pe(T, d) -&gt; np.ndarray<\/code> of shape <code>(T, d)<\/code> with <code>d<\/code> even, the Vaswani et al. formula: <code>PE[pos, 2i] = sin(pos / 10000^(2i/d))<\/code> and <code>PE[pos, 2i+1] = cos(pos / 10000^(2i/d))<\/code>.<\/li><li><code>embed_with_positions(tokens, E, P) -&gt; np.ndarray<\/code>: <code>tokens<\/code> is <code>(B, T)<\/code>, <code>P<\/code> is a positional table <code>(T_max, d)<\/code> with <code>T_max &gt;= T<\/code>. Return <code>E[tokens] + P[:T]<\/code>, shape <code>(B, T, d)<\/code>.<\/li><\/ul>\n<h3>Example<\/h3>\n<pre><code class=\"lang-text\">sinusoidal_pe(3, 4) -&gt;\n  [[0.        1.        0.        1.       ]\n   [0.841471  0.540302  0.01      0.99995  ]\n   [0.909297 -0.416147  0.019999  0.9998   ]]<\/code><\/pre>\n<p>Column pair 0 rotates by 1 radian per position; column pair 1 rotates by <code>1/100<\/code> radian per position (<code>10000^(-2/4)<\/code>).<\/p>\n<h3>Constraints<\/h3>\n<ul><li>No Python loops over positions or dimensions; build the angle table with broadcasting.<\/li><li><code>embed<\/code> must work for 1-D and 2-D <code>tokens<\/code>.<\/li><li><code>d<\/code> is even; you may assume it.<\/li><\/ul>\n<h3>What the interviewer listens for<\/h3>\n<ul><li>Why positions have to be injected at all: attention and the feed-forward block treat the sequence as a set.<\/li><li>Why sinusoids: every frequency pair is a 2-D rotation, so <code>PE(pos + k)<\/code> is a fixed linear function of <code>PE(pos)<\/code> for each <code>k<\/code>, which gives the model a handle on relative offsets. This is the idea RoPE later applies to the queries and keys instead of the input.<\/li><li>The cost of the alternatives: a learned table is simple but fixed to <code>T_max<\/code>; sinusoids extrapolate in principle but models still degrade past the trained length.<\/li><li>Follow-up: why the original paper scales the embedding by <code>sqrt(d)<\/code> before adding <code>PE<\/code>, and why GPT-2 does not need to (its learned table and embedding are on the same scale).<\/li><\/ul>", "starter": "\"\"\"Token embeddings and positional encodings in NumPy.\"\"\"\nimport numpy as np\n\n\ndef embed(tokens: np.ndarray, E: np.ndarray) -> np.ndarray:\n    \"\"\"Rows of E (vocab, d) picked by the integer array `tokens`; output shape tokens.shape + (d,).\"\"\"\n    raise NotImplementedError\n\n\ndef sinusoidal_pe(T: int, d: int) -> np.ndarray:\n    \"\"\"(T, d) table: PE[pos, 2i] = sin(pos / 10000^(2i/d)), PE[pos, 2i+1] = cos(pos / 10000^(2i/d)). d is even.\"\"\"\n    raise NotImplementedError\n\n\ndef embed_with_positions(tokens: np.ndarray, E: np.ndarray, P: np.ndarray) -> np.ndarray:\n    \"\"\"E[tokens] + P[:T] for tokens of shape (B, T) and a positional table P of shape (T_max, d).\"\"\"\n    raise NotImplementedError\n", "tests": "import numpy as np\n\nfrom solution import embed, embed_with_positions, sinusoidal_pe\n\n\ndef ref_pe(T, d):\n    pe = np.zeros((T, d))\n    for pos in range(T):\n        for j in range(d):\n            angle = pos / (10000 ** (2 * (j // 2) / d))\n            pe[pos, j] = np.sin(angle) if j % 2 == 0 else np.cos(angle)\n    return pe\n\n\ndef test_embed_is_a_lookup():\n    rng = np.random.default_rng(0)\n    E = rng.normal(size=(10, 4))\n    tokens = np.array([[3, 1, 3], [0, 9, 2]])\n    x = embed(tokens, E)\n    assert x.shape == (2, 3, 4)\n    assert np.allclose(x[0, 0], E[3]) and np.allclose(x[0, 2], E[3]) and np.allclose(x[1, 1], E[9])\n    assert embed(np.array([7, 7]), E).shape == (2, 4)\n    assert np.allclose(embed(np.array([7, 7]), E)[0], E[7])\n\n\ndef test_pe_reference_values():\n    pe = sinusoidal_pe(6, 8)\n    assert pe.shape == (6, 8)\n    assert np.allclose(pe[0], [0, 1, 0, 1, 0, 1, 0, 1])\n    assert np.isclose(pe[1, 0], np.sin(1.0)) and np.isclose(pe[1, 1], np.cos(1.0))\n    assert np.isclose(pe[3, 2], np.sin(3 / 10000 ** (2 / 8)))\n    assert np.isclose(pe[5, 7], np.cos(5 / 10000 ** (6 / 8)))\n    assert np.allclose(pe, ref_pe(6, 8), atol=1e-12)\n    assert np.allclose(sinusoidal_pe(50, 16), ref_pe(50, 16), atol=1e-12)\n\n\ndef test_pe_is_bounded_and_rows_are_distinct():\n    pe = sinusoidal_pe(100, 32)\n    assert np.all(np.abs(pe) <= 1 + 1e-12)\n    dist = np.linalg.norm(pe[:, None, :] - pe[None, :, :], axis=-1)\n    dist[np.arange(100), np.arange(100)] = np.inf\n    assert dist.min() > 1e-3, \"two positions got (nearly) the same encoding\"\n\n\ndef test_shift_is_a_fixed_linear_map_per_frequency():\n    T, d, k, i = 40, 16, 7, 2  # frequency pair i lives in columns 2i and 2i+1\n    pe = sinusoidal_pe(T, d)\n    w = 1 / 10000 ** (2 * i / d)\n    M = np.array([[np.cos(k * w), np.sin(k * w)], [-np.sin(k * w), np.cos(k * w)]])\n    before = pe[: T - k, 2 * i: 2 * i + 2]\n    after = pe[k:, 2 * i: 2 * i + 2]\n    assert np.allclose(after, before @ M.T, atol=1e-10)\n    # the same matrix does not describe a different shift\n    assert not np.allclose(pe[k + 1:, 2 * i: 2 * i + 2], pe[: T - k - 1, 2 * i: 2 * i + 2] @ M.T)\n\n\ndef test_wavelengths_grow_geometrically():\n    pe = sinusoidal_pe(8, 4)\n    assert np.isclose(pe[1, 0], np.sin(1.0))  # first pair: 1 radian per position\n    assert np.isclose(pe[1, 2], np.sin(0.01))  # last pair of d=4: 10000^(-2/4) = 1/100 radian per position\n    assert np.isclose(pe[2, 1], np.cos(2.0))\n\n\ndef test_embed_with_positions():\n    rng = np.random.default_rng(1)\n    E = rng.normal(size=(12, 8))\n    P = sinusoidal_pe(20, 8)\n    tokens = np.array([[4, 4, 4], [1, 2, 3]])\n    x = embed_with_positions(tokens, E, P)\n    assert x.shape == (2, 3, 8)\n    assert np.allclose(x[0, 1], E[4] + P[1])\n    assert np.allclose(x[1, 2], E[3] + P[2])\n    assert not np.allclose(x[0, 0], x[0, 2]), \"the same token at two positions must differ\"\n    P2 = rng.normal(size=(20, 8))  # a learned table works the same way\n    assert np.allclose(embed_with_positions(tokens, E, P2), E[tokens] + P2[:3])\n", "solution": "import numpy as np\n\n\ndef embed(tokens: np.ndarray, E: np.ndarray) -> np.ndarray:\n    return E[tokens]\n\n\ndef sinusoidal_pe(T: int, d: int) -> np.ndarray:\n    positions = np.arange(T)[:, None]\n    inv_freq = 10000.0 ** (-np.arange(0, d, 2) / d)\n    angles = positions * inv_freq[None, :]\n    pe = np.zeros((T, d))\n    pe[:, 0::2] = np.sin(angles)\n    pe[:, 1::2] = np.cos(angles)\n    return pe\n\n\ndef embed_with_positions(tokens: np.ndarray, E: np.ndarray, P: np.ndarray) -> np.ndarray:\n    T = tokens.shape[-1]\n    return E[tokens] + P[:T]\n"}, {"id": "tf-scaled-dot-product-attention", "title": "Scaled dot-product attention with a causal mask", "track": "transformer", "module": "tf-attention", "difficulty": "medium", "minutes": 35, "runtime": "numpy", "kind": "code", "tags": ["attention", "softmax", "masking"], "hints": ["Scores are Q @ K^T / sqrt(d_k). Shapes: (T_q, d) @ (d, T_k) -> (T_q, T_k). Use np.matmul or @ so leading batch dimensions broadcast.", "Apply the mask by setting masked scores to a very negative number (like -1e9) before the softmax, so they become exactly 0 after exp.", "A causal mask lets position i attend to positions j <= i: np.tril(np.ones((T, T), dtype=bool))."], "rubric": [], "timeout": 30, "readme": "<h2>Scaled dot-product attention with a causal mask<\/h2>\n<p>The operation at the heart of every transformer. Implement it in NumPy so that it works for a single head and for batched, multi-head inputs through broadcasting.<\/p>\n<pre><code class=\"lang-text\">attention(q, k, v, mask=None) -&gt; (output, weights)<\/code><\/pre>\n<ul><li><code>q<\/code> has shape <code>(..., T_q, d_k)<\/code>, <code>k<\/code> has shape <code>(..., T_k, d_k)<\/code>, <code>v<\/code> has shape <code>(..., T_k, d_v)<\/code>. The leading dimensions (batch, heads) must broadcast.<\/li><li>Scores are <code>q @ k^T / sqrt(d_k)<\/code>.<\/li><li><code>mask<\/code>, if given, is a boolean array broadcastable to <code>(..., T_q, T_k)<\/code>; <code>True<\/code> means \"may attend\". Masked positions get weight exactly 0.<\/li><li>Return the output <code>(..., T_q, d_v)<\/code> and the attention weights <code>(..., T_q, T_k)<\/code>.<\/li><\/ul>\n<p>Also implement <code>causal_mask(T)<\/code>, returning a boolean <code>(T, T)<\/code> lower-triangular array, so that position <code>i<\/code> can only look at positions <code>0..i<\/code
