es data leakage happen in materials datasets, and how do you split a materials dataset so the reported error reflects discovery performance?", "a": "Leakage comes from near-duplicate structures: the same crystal appears under different cell settings, as supercells, with slightly different lattice parameters from different relaxations, as a polymorph with tiny distortions, or as a cation-swapped sibling of a prototype that is in the training set; databases are also full of entries derived from each other, and relaxation trajectories put dozens of correlated frames of one structure into a dataset. A random split then measures interpolation between near-copies, so errors of a few meV per atom are reported that balloon when the model meets a new prototype or chemistry. Fixes: deduplicate with a structure matcher (pymatgen's StructureMatcher with tolerance, or a fingerprint distance) before splitting, group by composition or by prototype so the whole group lands on one side, keep all frames of a trajectory together, and evaluate with splits that mimic the deployment question: leave-one-chemistry-out or leave-one-prototype-out for discovery, time-based splits (train on entries before a database release, test on later discoveries, which is how Matbench Discovery is built) for the question of whether the model would have found the next generation of materials. Also watch for target leakage through features computed from the relaxed structure when the model will be applied to unrelaxed candidates, which is the main reason formation-energy models look better on benchmarks than in screening. Report the error per split type, and expect the discovery-style error to be several times the random-split error; the interviewer wants to hear that the gap between them is the honest number."}, {"id": "q-bayesian-optimization-experiments", "topic": "ML for science", "q": "How would you use Bayesian optimization to plan experiments such as synthesis conditions, and when is it the wrong tool?", "a": "Bayesian optimization models the objective (yield, conductivity, phase purity) with a probabilistic surrogate, usually a Gaussian process with a kernel over the controllable variables (temperature, time, precursor ratios, encoded categorical choices), and chooses the next experiment by maximizing an acquisition function that balances the surrogate's mean and uncertainty: expected improvement, upper confidence bound, or entropy search; after each measurement the posterior is updated and the loop repeats. It wins when each experiment is expensive, the input space is low-dimensional (under about 20 variables), evaluations are noisy, and you can afford sequential rounds; batch acquisition (q-EI, local penalization, Thompson sampling) handles parallel experiments, constraints handle regions that are infeasible or unsafe, and multi-fidelity variants mix cheap simulations with real experiments. Practical details that matter: scale and transform inputs and outputs (log for rates), encode prior knowledge in the kernel or as a mean function, include a noise term, and keep a few random experiments to check the model. It is the wrong tool when the space is huge and discrete like a composition space of millions of candidates (use a screening model and active learning with a batch-wise acquisition instead), when experiments are cheap enough that a grid or random search is simpler, when the objective is multi-modal in ways a stationary kernel cannot capture, or when there is a mechanism known well enough that a physics model beats a black box. The evaluation is simple regret or best-so-far versus experiment count against a baseline such as random or one-factor-at-a-time, and the number to quote is how many experiments it saved."}], "progress": {"settings": {"goal": "Ready for research scientist and applied scientist interview loops", "start_date": "2026-10-26", "target_date": "2027-01-31", "rotation": ["leetcode", "ml", "transformer", "leetcode", "ml", "transformer", "review"], "quiz_per_day": 6, "mock_minutes": 45}, "events": []}};</script>

  function miniMarkdown(text) {

    var esc = function (s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
    var out = [], lines = text.split("\n"), i = 0;
    while (i < lines.length) {

      if (/^```/.test(ln)) { var j = i + 1, code = []; while (j < lines.length && !/^```/.test(lines[j])) { code.push(lines[j]); j++; } out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); i = j + 1; continue; }
      if (!ln.trim()) { i++; continue; }
      var inline = function (s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); };
      if (/^\s*([-*]|\d+\.)\s+/.test(ln)) {

      var s = { goal: goal.value.trim().slice(0, 200), target_date: target.value || STATE.settings.target_date, quiz_per_day: Math.max(1, Math.min(30, Number(qpd.value) || 6)), mock_minutes: Math.max(10, Math.min(120, Number(mockm.value) || 45)), rotation: rotSel.map(function (x) { return x.value; }) };
      record({ type: "settings", settings: s });
      toast("Settings saved" + (store.mode === "local" ? " in this browser. Sync to carry them into the repo." : "."));
      renderProgress();
    });
    set.appendChild(form);
    v.appendChild(set);
  }
  function heatmapSvg(today) {
    var NS = "http://www.w3.org/2000/svg", weeks = 16, cell = 13, gap = 3, left = 28, top = 16;
    var svg = document.createElementNS(NS, "svg");
    var w = left + weeks * (cell + gap), h = top + 7 * (cell + gap);
    svg.setAttribute("viewBox", "0 0 " + w + " " + h); svg.setAttribute("width", w); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Daily activity for the last " + weeks + " weeks");
    var start = addDays(today, -(weeks * 7 - 1) - weekday(today));
    ["Mon", "Wed", "Fri"].forEach(function (lbl, i) { var t = document.createElementNS(NS, "text"); t.setAttribute("x", 0); t.setAttribute("y", top + (i * 2) * (cell + gap) + cell - 2); t.setAttribute("class", "lbl"); t.textContent = lbl; svg.appendChild(t); });
    var lastMonth = "";
    for (var wk = 0; wk < weeks; wk++) for (var d = 0; d < 7; d++) {
      var date = addDays(start, wk * 7 + d);
      if (date > today) continue;
      var v = STATE.byDate[date] || { done: 0, quiz: 0 }, n = (v.done || 0) * 2 + (v.quiz ? 1 : 0);
      var r = document.createElementNS(NS, "rect");
      r.setAttribute("x", left + wk * (cell + gap)); r.setAttribute("y", top + d * (cell + gap)); r.setAttribute("width", cell); r.setAttribute("height", cell); r.setAttribute("rx", 2);
      r.setAttribute("class", n === 0 ? "c0" : n <= 1 ? "c1" : n <= 3 ? "c2" : "c3");
      var tt = document.createElementNS(NS, "title"); tt.textContent = fmtDate(date, { weekday: "short", month: "short", day: "numeric" }) + ": " + plural(v.done || 0, "assignment") + ", " + plural(v.quiz || 0, "card"); r.appendChild(tt);
      svg.appendChild(r);
      var m = fmtDate(date, { month: "short" });
      if (d === 0 && m !== lastMonth) { lastMonth = m; var t2 = document.createElementNS(NS, "text"); t2.setAttribute("x", left + wk * (cell + gap)); t2.setAttribute("y", 10); t2.setAttribute("class", "lbl"); t2.textContent = m; svg.appendChild(t2); }
    }
    return svg;
  }

  /* ---------- viewer runtime (claude.ai) ---------- */
  function connect() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") return;
    c.use("db").then(function (db) {
      if (!db) return;
      var col;
      try { col = db.collection("events"); } catch (e) { return; }
      var first = true;
      col.onSnapshot(function (snap) {
        var next = [];
        snap.docs.forEach(function (d) { var e = d.data() || {}; if (e.id && e.type) next.push(e); });
        if (first) { first = false; dbCol = col; store.mode = "db"; updateModeline(); }
        remoteEvents = next;
        STATE = derive();
        rerender();
      }, function (err) {
        console.warn("db subscription ended", err);
        if (dbCol) { dbCol = null; initLocal(); STATE = derive(); updateModeline(); rerender(); toast("Lost the connection to your saved progress. Changes now save in this browser."); }
      });
    }).catch(function (e) { console.warn("db unavailable", e); });
    c.use("sample").then(function (s) {
      if (!s || typeof s !== "function") return;
      sampleFn = s;
      document.querySelectorAll("[data-claude-panel]").forEach(function (p) { p.hidden = false; });
    }).catch(function () { /* stays hidden */ });
  }
  function updateModeline() {
    $("#modeline").textContent = store.mode === "db" ? "Progress saves to your Claude account" : store.mode === "local" ? "Progress saves in this browser · built " + (META.rendered || "") : "Not saving in this browser";
    if (IN_VIEWER) { $("#boardLink").hidden = true; }
  }

  /* ---------- boot ---------- */
  initLocal();
  STATE = derive();
  updateModeline();
  window.addEventListener("hashchange", route);
  window.addEventListener("beforeunload", flushDraft);
  route();
  connect();
})();
</script>
